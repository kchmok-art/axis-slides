알아?\nB: 둘 다 프록시라며? 왜 두 개야?\nA: 맡은 자리가 달라. 정문(80·443)은 Traefik 하나만 써\n   nginx는 그 뒤에서 특정 앱 파일 내주는 역할이야\nB: Traefik이 nginx보다 뭐가 좋아?\nA: 컨테이너에 이름표만 붙이면 길을 알아서 만들어\n   HTTPS 인증서도 Let's Encrypt에서 자동으로 받아 오고\nB: nginx는?\nA: 설정 파일을 직접 써야 하고 인증서도 따로 챙겨야 해\n   대신 파일 빨리 내주는 건 잘해", "added": "2026-10-22"}, {"id": "term_140", "term": "흐름: HTTPS 인증서 자동 발급", "term_en": "Flow: Automatic HTTPS Certificate Issuance (Traefik + Let's Encrypt)", "category": "Infra", "definition": "DNS 연결 → Traefik 라벨 → ACME 요청 → HTTP-01 확인 → 90일 인증서 발급 → 자동 갱신.", "one_line": "DNS → 라벨 → 요청 → 숙제 확인 → 발급 → 자동 갱신", "detail": "[우리 서버 실제 사례 · 2026-10-22 직접 확인] sign.axmaster.cloud는 2026-10-19 이 흐름으로 인증서를 받았다.\n동아리 홈페이지(axis.axmaster.cloud)가 아직 HTTPS가 안 되는 이유는 ①번 DNS A 레코드가 없어서 Let's Encrypt가 서버를 찾아올 수 없기 때문.\n\n주의: DNS 없이 발급을 시도하면 실패 기록이 쌓여 Let's Encrypt 발급 제한에 걸릴 수 있다. DNS부터 확인한 뒤 시도한다.", "related": ["Let's Encrypt", "ACME (자동 인증서 발급 규약)", "Traefik (트래픽)", "DNS"], "flow": ["① DNS A 레코드 추가: axis → 168.231.118.60 (호스팅어 DNS 화면)", "② 컨테이너를 Traefik 라벨과 함께 실행", "③ Traefik이 Let's Encrypt에 인증서 요청 (ACME)", "④ Let's Encrypt가 http://axis.axmaster.cloud/.well-known/acme-challenge/… 로 접속해 확인 (HTTP-01)", "⑤ 통과 → 90일 인증서 발급 → Traefik 저장", "⑥ https:// 접속 시 🔒", "⑦ 만료 약 30일 전 Traefik이 자동 갱신"], "confusion": {"헷갈리는점": "인증서만 받으면 DNS는 나중에 해도 된다고 생각함", "차이": "순서가 반대. Let's Encrypt가 도메인으로 서버를 찾아와야 하므로 DNS가 먼저다", "기억법": "집 주소(DNS)가 있어야 등기우편(인증서 확인)이 도착한다"}, "kakao_chat": "A: 우리 서버가 인증서 받는 순서 알려줄까?\nB: 응\nA: 먼저 DNS에 주소를 등록해. axis를 우리 VPS IP로\n   그다음 컨테이너에 Traefik 이름표 붙여서 실행\nB: 그럼 인증서는?\nA: Traefik이 Let's Encrypt한테 자동으로 요청해\n   Let's Encrypt가 그 주소로 직접 와서 숙제 확인하고 90일짜리 줘\nB: 동아리 홈페이지는 왜 아직 안 돼?\nA: 첫 단계인 DNS가 아직 없어서 Let's Encrypt가 찾아올 수가 없어\n   집 주소가 있어야 등기우편이 오잖아", "added": "2026-10-22"}, {"id": "term_141", "term": "흐름: TLS 핸드셰이크", "term_en": "Flow: TLS Handshake (TLS 1.3)", "category": "Infra", "definition": "HTTPS 연결 직전에 브라우저와 서버가 인사하며 암호 방식을 정하고, 인증서를 확인하고, 비밀 열쇠를 만드는 과정.", "one_line": "인사(Hello) → 인증서 제시 → 검증 → 세션 키 생성 → 암호화 통신", "detail": "TLS 1.3은 이 과정을 왕복 1번으로 줄여서 TLS 1.2보다 빠르다.\n핵심: 공개키 방식은 '서로 처음 만나 열쇠를 안전하게 나누는 데'만 쓰고, 실제 대화는 빠른 대칭키(세션 키)로 암호화한다.\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] 우리 서버 연결 결과: Protocol TLSv1.3, Cipher TLS_AES_128_GCM_SHA256 → AES 128bit로 내용을 암호화하고 SHA-256으로 무결성을 확인한다는 뜻.", "related": ["SSL/TLS", "인증서 체인 (Chain of Trust)", "HTTPS"], "flow": ["① Client Hello — 브라우저: 'TLS 1.3 쓸 수 있고, 이런 암호 방식이 가능해' + 열쇠 재료", "② Server Hello — 서버: '이 방식으로 하자' + 열쇠 재료", "③ 서버가 인증서(+중간 인증서) 제시 + 인증서의 진짜 주인이라는 서명", "④ 브라우저가 인증서 체인·주소·유효기간 검증", "⑤ 양쪽이 같은 세션 키를 각자 계산 (열쇠 자체는 오가지 않음)", "⑥ Finished — 이후 모든 HTTP 내용이 세션 키로 암호화"], "confusion": {"헷갈리는점": "인증서 안의 공개키로 모든 내용을 암호화한다고 생각함", "차이": "공개키는 신원 확인·열쇠 합의 단계에만 쓴다. 본문은 연결마다 새로 만든 세션 키(대칭키)로 암호화한다 — 빠르고, 나중에 서버 키가 털려도 지난 대화는 안전(전방 보안)", "기억법": "처음 만나 신분증 확인하고 암호표 정하는 데 1분, 그 뒤 대화는 암호표로"}, "kakao_chat": "A: HTTPS 접속할 때 0.1초 사이에 뭐가 일어나는지 알아?\nB: 그냥 연결되는 거 아니야?\nA: 핸드셰이크라는 인사 과정이 있어\n   브라우저가 '나 이런 암호 쓸 수 있어' 하면 서버가 '이걸로 하자' 해\nB: 그다음엔?\nA: 서버가 인증서 보여주고, 브라우저가 진짜인지 확인해\n   그리고 둘이 각자 같은 비밀 열쇠를 계산해. 열쇠는 안 주고받아\nB: 인증서 공개키로 다 암호화하는 거 아니었어?\nA: 그건 처음 인사할 때만이야. 실제 대화는 그 비밀 열쇠로 암호화해\n   우리 서버는 TLS 1.3에 AES 128비트 쓰고 있어", "added": "2026-10-22"}, {"id": "term_142", "term": "최소 권한 원칙 (Least Privilege)", "term_en": "Principle of Least Privilege", "category": "Infra", "definition": "프로그램·사람·AI에게 일을 끝내는 데 꼭 필요한 만큼의 권한만 주는 보안 원칙.", "detail": "권한이 클수록 실수·해킹·AI 오작동 때 피해도 커진다. 그래서 '되는지'가 아니라 '이것만 되면 충분한지'를 기준으로 권한을 정한다.\nOpenAI Codex 문서도 권한 프로필을 '최소 권한 경계(least-privilege boundaries)'를 위한 기능으로 소개하고, '작업을 끝낼 수 있는 가장 좁은 프로필'을 고르라고 안내한다.\n\n[lecture_016 사례] AI 에이전트에게 D:\\AX만 쓰기 허용 + 나머지 읽기 거부 + 명령 네트워크 차단.", "related": ["권한 프로필 (Codex Permission Profile)", "샌드박스 (Sandbox)", "흐름: AI 에이전트 폴더 잠금"], "flow": ["① 할 일 정의 (예: AX 폴더 문서 정리)", "② 필요한 권한만 목록화 (AX 읽기·쓰기)", "③ 나머지는 기본 거부 (:root deny)", "④ 꼭 필요한 예외만 추가 (:minimal 읽기)", "⑤ 테스트로 '밖은 막히고 안은 되는지' 확인"], "confusion": {"헷갈리는점": "권한을 넉넉히 줘야 AI가 일을 잘한다고 생각함", "차이": "권한이 넓어도 결과물 품질은 안 오른다. 사고 났을 때 피해 범위만 커진다", "기억법": "호텔 카드키 — 내 방만 열리면 충분하다. 마스터키는 필요 없다"}, "kakao_chat": "A: 최소 권한 원칙 알아?\nB: 권한을 최소로 준다는 거?\nA: 응, 일 끝내는 데 꼭 필요한 만큼만 주는 거야\nB: 넉넉히 주면 AI가 더 잘하지 않아?\nA: 일 품질은 그대로고, 사고 나면 피해만 커져\n   호텔 카드키처럼 내 방만 열리면 충분해\nB: 우리 가이드에선?\nA: D:\\AX만 쓰게 하고 나머지는 읽기도 막았어", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_143", "term": "권한 프로필 (Codex Permission Profile)", "term_en": "Permission Profile (OpenAI Codex)", "category": "Agent", "definition": "Codex CLI가 실행하는 명령이 어떤 폴더를 읽고 쓰고, 어디로 접속할 수 있는지를 이름 붙여 정해 두는 설정 묶음(베타).", "detail": "~/.codex/config.toml의 [permissions.<이름>]에 정의하고 default_permissions로 고른다.\n• 기본 제공: :read-only, :workspace(작업폴더+임시폴더 쓰기), :danger-full-access\n• 값: read / write / deny — 같은 경로면 deny > write > read, 더 구체적인 경로가 우선\n• 특수 경로: :root(전체), :minimal(실행 필수 최소), :workspace_roots, :tmpdir, :slash_tmp\n• extends로 기본 프로필 상속 (:workspace 상속 시 작업폴더의 .git·.codex·.agents·.aws는 읽기 전용 보호)\n주의: sandbox_mode나 --sandbox가 있으면 권한 프로필은 무시됨. MCP·커넥터·웹검색·브라우저는 프로필 밖.\n\n[lecture_016 사례] workspace-only = extends ':workspace' + ':root'=deny + ':minimal'=read + tmp deny + network.enabled=false", "related": ["최소 권한 원칙 (Least Privilege)", "샌드박스 (Sandbox)", "흐름: AI 에이전트 폴더 잠금"], "flow": ["① config.toml에 [permissions.workspace-only] 작성", "② default_permissions = \"workspace-only\"", "③ sandbox_mode 줄 삭제 확인", "④ D:\\AX에서 codex 실행", "⑤ /status·/debug-config로 적용 확인", "⑥ 차단 테스트"], "confusion": {"헷갈리는점": "권한 프로필과 옛 sandbox_mode를 같이 쓰면 더 안전하다고 생각함", "차이": "둘은 섞이지 않는다. sandbox_mode가 하나라도 있으면 권한 프로필이 통째로 무시된다", "기억법": "규칙집은 한 권만 — 두 권 놓으면 옛날 책을 펼친다"}, "kakao_chat": "A: Codex 권한 프로필 써봤어?\nB: 그게 뭔데?\nA: Codex가 실행하는 명령이 어디를 읽고 쓸지 정하는 설정 묶음이야\nB: 어떻게 써?\nA: config.toml에 이름 붙여 만들고 default_permissions로 골라\n   우린 workspace-only로 AX만 쓰고 나머진 다 거부했어\nB: sandbox_mode도 같이 넣으면 더 안전하지?\nA: 그게 함정! 같이 있으면 권한 프로필이 무시돼. 하나만 써야 해", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_144", "term": "WSL2", "term_en": "Windows Subsystem for Linux 2", "category": "Infra", "definition": "Windows 안에서 진짜 리눅스(Ubuntu 등)를 가벼운 가상 머신으로 돌리는 Microsoft 기능.", "detail": "PowerShell에서 wsl --install -d Ubuntu로 설치, wsl -l -v로 버전 확인(VERSION 2여야 함). Windows 드라이브는 /mnt/c, /mnt/d로 보인다(D:\\AX = /mnt/d/AX).\n\n[lecture_016] Claude Code의 명령 샌드박스(bubblewrap)는 macOS·Linux·WSL2에서만 동작하고 네이티브 Windows에서는 없다. 그래서 Claude Code는 WSL2 안에 설치해 실행한다. WSL1은 샌드박스 불가.\n주의: WSL2는 Windows와 연결돼 있어(interop, /mnt 드라이브) 완전 격리 수단이 아니다. /mnt 아래 작업은 속도가 느릴 수 있다.", "related": ["WSL interop", "샌드박스 (Sandbox)", "가상 머신 (VM)"], "flow": ["① PowerShell: wsl --install -d Ubuntu", "② 재부팅 + 사용자 이름·비밀번호 설정", "③ wsl -l -v로 VERSION 2 확인", "④ wsl -d Ubuntu로 진입", "⑤ cd /mnt/d/AX 로 Windows 폴더 접근"], "confusion": {"헷갈리는점": "WSL2 안에서 돌리면 Windows와 완전히 분리된다고 생각함", "차이": "WSL2는 Windows 드라이브(/mnt)와 Windows 프로그램 실행(interop)이 연결된 '이웃집'이다. 완전 분리는 VM", "기억법": "WSL2 = 같은 건물 다른 호수, VM = 다른 건물"}, "kakao_chat": "A: WSL2 알아?\nB: 윈도우에서 리눅스 쓰는 거?\nA: 맞아. 윈도우 안에 진짜 리눅스를 가볍게 띄우는 거야\nB: Claude Code는 왜 거기서 돌려?\nA: Claude 샌드박스가 리눅스 기술이라 네이티브 윈도우에선 안 켜져\nB: 그럼 WSL2 안이면 윈도우랑 완전 분리야?\nA: 아니. D 드라이브가 /mnt/d로 보이고 윈도우 프로그램도 실행돼\n   같은 건물 다른 호수 정도야", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_145", "term": "WSL interop", "term_en": "WSL Interoperability", "category": "Infra", "definition": "WSL 리눅스 안에서 powershell.exe, cmd.exe 같은 Windows 프로그램을 바로 실행할 수 있게 해 주는 연결 기능. 기본으로 켜져 있다.", "detail": "편리하지만 보안상 우회로가 된다. WSL에서 띄운 Windows 프로그램은 Windows 쪽에서 내 계정 권한으로 실행되므로 리눅스 샌드박스 밖이다. Claude Code 공식 문서도 '선택 seccomp 필터가 설치돼야 이 경로를 막을 수 있다'고 적는다.\n끄는 법(Microsoft 공식 키): /etc/wsl.conf에\n[interop]\nenabled=false\nappendWindowsPath=false\n추가 → PowerShell에서 wsl --shutdown 후 재시작(약 8초 규칙).\n부작용: code ., explorer.exe, 로그인 시 Windows 브라우저 자동 열기 안 됨.", "related": ["WSL2", "샌드박스 (Sandbox)", "흐름: AI 에이전트 폴더 잠금"], "flow": ["① 샌드박스 안 명령이 powershell.exe 실행 요청", "② WSL이 Unix 소켓으로 Windows 호스트에 넘김", "③ Windows가 내 권한으로 실행 → 샌드박스 밖", "④ 막으려면 wsl.conf [interop] enabled=false", "⑤ wsl --shutdown 재시작 후 테스트(T5)로 확인"], "confusion": {"헷갈리는점": "리눅스 샌드박스를 켜면 Windows 프로그램 실행도 같이 막힌다고 생각함", "차이": "Windows 프로그램은 Windows 쪽에서 실행되므로 리눅스 샌드박스 규칙이 닿지 않는다. interop을 꺼야 확실히 막힌다", "기억법": "잠긴 방 안에 있는 '바깥 연결 인터폰' — 인터폰 선을 뽑아야 한다"}, "kakao_chat": "A: WSL interop이 뭔지 알아?\nB: 처음 들어\nA: WSL 리눅스에서 powershell.exe 같은 윈도우 프로그램을 바로 실행하게 해주는 기능이야\nB: 편하네?\nA: 편한데 보안 구멍이 돼. 그렇게 띄운 프로그램은 윈도우에서 내 권한으로 돌아\n   리눅스 샌드박스 밖이라는 뜻이야\nB: 어떻게 막아?\nA: /etc/wsl.conf에 interop enabled=false 넣고 wsl --shutdown으로 재시작\n   잠긴 방의 인터폰 선을 뽑는 거야", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_146", "term": "가상 머신 (VM)", "term_en": "Virtual Machine", "category": "Infra", "definition": "내 컴퓨터 안에 소프트웨어로 만든 '또 하나의 컴퓨터'. 자기만의 운영체제와 저장공간을 가져서 원래 컴퓨터와 분리된다.", "detail": "VirtualBox, Hyper-V, VMware, 클라우드 서버(예: 우리 Hostinger VPS도 VM) 등. 컨테이너(Docker)는 운영체제 커널을 공유하지만 VM은 자체 커널을 가져 분리가 더 강하다.\n\n[lecture_016] 민감정보(학교 개인정보 등)가 있는 PC에서 AI 에이전트를 쓸 때 가장 강한 방법: VM 안에 에이전트를 설치하고 필요한 자료만 복사. 호스트 D: 공유·마운트 금지, 클립보드·네트워크·API 키 최소화. Claude Code 공식 문서도 VM을 '가장 강한 분리'로 소개. 단, VM도 설정 실수·취약점이 있을 수 있어 절대 보장은 아님.", "related": ["샌드박스 (Sandbox)", "Docker", "WSL2"], "flow": ["① VM 프로그램으로 새 가상 컴퓨터 생성", "② 운영체제 설치", "③ 에이전트(Codex·Claude) 설치", "④ 필요한 자료만 복사 (호스트 드라이브 공유 끔)", "⑤ 작업 후 결과물만 꺼내기"], "confusion": {"헷갈리는점": "VM 안에서 호스트 폴더를 공유(마운트)해도 안전하다고 생각함", "차이": "공유 폴더를 연결하는 순간 그 폴더는 VM 안에서 보인다. 분리 효과가 사라진다", "기억법": "다른 건물로 이사 갔는데 연결 통로를 뚫으면 같은 건물이 된다"}, "kakao_chat": "A: 가상 머신이 뭔지 알아?\nB: 컴퓨터 안의 컴퓨터?\nA: 맞아. 자기 운영체제를 가진 가짜 컴퓨터야\nB: AI 보안이랑 무슨 상관이야?\nA: 개인정보 있는 PC에서 AI 쓸 때 VM 안에서 돌리면 원래 파일이 아예 안 보여\nB: 그럼 D 드라이브를 VM에 연결해서 쓰면 되겠네\nA: 그러면 다시 다 보여! 필요한 파일만 복사해서 넣어야 해", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_147", "term": "MCP (Model Context Protocol)", "term_en": "Model Context Protocol", "category": "Agent", "definition": "AI 앱이 외부 도구·데이터(파일, DB, 슬랙, 깃허브 등)에 연결할 때 쓰는 공통 규격. Anthropic이 2024년 공개한 오픈 프로토콜.", "detail": "AI 쪽(클라이언트)과 도구 쪽(MCP 서버)이 같은 규격으로 대화하므로, 한 번 만든 MCP 서버를 여러 AI 앱에서 재사용할 수 있다. Claude Code, Codex 모두 MCP를 지원한다.\n\n[lecture_016 보안 포인트] MCP 서버는 에이전트의 샌드박스 밖에서 '내 권한 그대로' 실행된다(Claude·Codex 공식 문서 공통). 그래서 폴더를 잠가도 파일 접근 MCP를 연결해 두면 그 경로로 밖을 볼 수 있다. 연결된 MCP 목록을 따로 점검해야 한다.", "related": ["훅 (Hook, Claude Code)", "샌드박스 (Sandbox)", "하네스 (Harness)"], "flow": ["① AI 앱 설정에 MCP 서버 등록", "② AI가 도구 목록을 받아 옴", "③ 필요할 때 MCP 서버에 도구 실행 요청", "④ MCP 서버가 실제 작업(파일·API) 수행", "⑤ 결과를 AI에게 반환"], "confusion": {"헷갈리는점": "샌드박스를 켜면 MCP 도구도 같이 갇힌다고 생각함", "차이": "MCP 서버는 별도 프로세스라 샌드박스 밖에서 내 권한으로 돈다. 권한 규칙·서버 목록으로 따로 관리해야 한다", "기억법": "MCP = AI용 USB 포트. 꽂은 장치는 방 잠금과 상관없이 동작한다"}, "kakao_chat": "A: MCP 알아?\nB: 요즘 자주 들리던데\nA: AI가 외부 도구에 연결하는 공통 규격이야. AI용 USB 포트 같은 거\nB: 편하겠다\nA: 근데 보안상 주의할 게 있어\n   MCP 서버는 샌드박스 밖에서 내 권한으로 돌아\nB: 폴더 잠가도 소용없다는 거야?\nA: 파일 읽는 MCP를 꽂아 두면 그걸로 밖을 볼 수 있어\n   연결된 MCP 목록도 꼭 점검해야 해", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_148", "term": "훅 (Hook, Claude Code)", "term_en": "Hooks (Claude Code)", "category": "Agent", "definition": "Claude Code에서 도구 실행 전후 같은 특정 순간에 자동으로 실행되도록 등록해 두는 내 셸 명령.", "detail": "예: PreToolUse 훅으로 위험한 명령을 실행 전에 검사해 거부, 파일 수정 후 자동 포맷. 권한 규칙을 보완하는 '내가 짠 검문소' 역할.\n\n[lecture_016 보안 포인트] 훅 명령은 샌드박스 밖에서 내 권한 그대로 실행된다(공식). 프로젝트 폴더의 .claude/settings.json에 훅이 들어 있을 수 있으니 남이 만든 프로젝트를 열 때 확인한다. 단, PreToolUse 훅이 'allow'를 반환해도 deny 규칙은 무시하지 못한다(deny 우선).", "related": ["MCP (Model Context Protocol)", "하네스 (Harness)", "샌드박스 (Sandbox)"], "flow": ["① settings.json에 훅 이벤트(PreToolUse 등)+명령 등록", "② Claude가 도구 사용 시도", "③ 훅 명령이 먼저 실행돼 검사", "④ 허용/거부/질문 결정 반환", "⑤ deny 규칙은 훅과 상관없이 항상 적용"], "confusion": {"헷갈리는점": "훅도 샌드박스 안에서 안전하게 돈다고 생각함", "차이": "훅은 Claude가 아니라 내가 등록한 명령이라 샌드박스 밖에서 내 권한으로 실행된다", "기억법": "훅 = 내가 고용한 경비원. 경비원은 잠긴 방 밖에 서 있다"}, "kakao_chat": "A: Claude Code 훅 써봤어?\nB: 그게 뭐야?\nA: 도구 쓰기 전후에 자동으로 도는 내 명령이야\n   위험한 명령을 실행 전에 검사하는 데 많이 써\nB: 오 보안에 좋겠다\nA: 좋은데 주의할 점이 있어. 훅은 샌드박스 밖에서 내 권한으로 돌아\nB: 남의 프로젝트 열 때 조심해야겠네\nA: 맞아. .claude/settings.json에 훅이 있는지 확인해", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_149", "term": "흐름: AI 에이전트 폴더 잠금", "term_en": "Flow: Locking an AI agent to one folder", "category": "Agent", "definition": "지침이 아닌 설정으로 AI 에이전트를 작업 폴더(D:\\AX)에 가두고, 우회 경로까지 테스트로 확인하는 순서.", "one_line": "지침 ≠ 권한 → 권한 설정 → 샌드박스 → 우회로 차단 → 테스트 8종 → (민감하면) VM", "detail": "[lecture_016 기준]\nCodex(Windows): 권한 프로필 workspace-only(:root deny, :workspace 쓰기, network off) + MXC/elevated 샌드박스 + approval_policy never.\nClaude Code(WSL2): blockReadsOutsideWorkingDirectories + sandbox(enabled, failIfUnavailable, allowUnsandboxedCommands false) + dontAsk + Edit(//mnt/d/AX/**) 허용 + WSL interop 끄기.\n공통 점검: MCP·훅·커넥터는 별도. 테스트는 AI의 말이 아니라 실제 오류·탐색기로 판정.", "related": ["권한 프로필 (Codex Permission Profile)", "WSL interop", "샌드박스 (Sandbox)", "최소 권한 원칙 (Least Privilege)", "가상 머신 (VM)"], "flow": ["① 지침만으론 안 된다는 것 인식", "② 도구별 권한 설정 (Codex 프로필 / Claude blockReads)", "③ 샌드박스 켜기 + 못 켜면 시작 거부", "④ 우회로 차단 (interop 끄기, 샌드박스 밖 재시도 금지, MCP·훅 점검)", "⑤ 테스트 8종: 밖 읽기·C드라이브·스크립트·쓰기·powershell.exe·touch ~·외부접속 차단 + AX 안 정상", "⑥ 민감자료면 VM으로 분리"], "confusion": {"헷갈리는점": "설정 파일을 저장하면 끝났다고 생각함", "차이": "버전·OS·대체 샌드박스에 따라 설정이 조용히 무시될 수 있다. 막히는 걸 직접 봐야 완료", "기억법": "'설정했다'가 아니라 '막히는 걸 봤다'가 완료"}, "kakao_chat": "A: AI를 AX 폴더에만 가두는 순서 알려줄까?\nB: 그냥 'AX만 봐'라고 하면 안 돼?\nA: 그건 부탁이지 잠금이 아니야. 설정으로 막아야 해\nB: 설정만 하면 끝?\nA: 샌드박스 켜고, 우회로도 막아야 해. WSL이면 윈도우 프로그램 실행 기능도 꺼\nB: 그다음엔?\nA: 테스트 8개. 밖은 다 막히고 AX 안만 되는지 직접 확인\n   개인정보 있으면 아예 VM에서 돌리고", "added": "2026-10-23", "source": "lecture_016"}, {"id": "term_150", "term": "로지스틱 회귀 (Logistic Regression)", "term_en": "Logistic Regression", "category": "ML", "definition": "입력의 가중합(로그오즈)을 시그모이드로 0~1 확률로 바꿔 이진 분류하는 통계 모형", "one_line": "로그오즈는 직선, 확률은 S자 곡선 — 이름은 회귀지만 분류에 쓰는 확률모형", "detail": "Y|X ~ Bernoulli(p(X)), log(p/(1−p)) = β₀+β₁x₁+β₂x₂. 계수는 최대우도추정(MLE)으로 구하며, 이것은 교차 엔트로피를 최소화하는 것과 같다. 결정 경계(p=0.5)는 선형결합이 0이 되는 직선(초평면)이다. 계수의 부호·크기와 오즈비(e^β: x가 1 늘 때 오즈가 몇 배가 되는지)로 해석할 수 있어 설명이 필요한 문제(대출 심사 등)에 많이 쓴다. 은닉층이 0개이고 시그모이드 출력을 쓰는 신경망과 같은 모형이다. [lecture_017]", "examples": ["대출 연체 여부: 소득·부채비율로 연체 확률을 계산하고 0.5(또는 정한 임계값)를 넘으면 '위험'", "오즈비 해석: 부채비율 계수 β=0.7 → 부채비율이 1 늘면 연체 오즈가 e^0.7≈2배", "lecture_017 데모: 데이터 A(정규형 두 집단)에 경사하강법으로 적합한 직선 경계"], "related": ["분류 (Classification)", "우도·최대우도추정 (Likelihood·MLE)", "교차 엔트로피 (Cross-Entropy)", "활성화 함수 (Activation Function)", "선형판별분석 (LDA)", "Threshold (임계값)"], "flow": ["① 입력 변수의 가중합 z = β₀+β₁x₁+… 계산", "② 시그모이드로 확률 p = 1/(1+e^−z) 변환", "③ 우도 최대화(=교차 엔트로피 최소화)로 β 추정", "④ 임계값(보통 0.5)으로 분류 → 계수·오즈비로 해석"], "confusion": {"헷갈리는점": "이름에 '회귀'가 있어서 연속값을 예측하는 모델로 오해", "차이": "확률(0~1)을 회귀식으로 모델링한 뒤 임계값으로 범주를 정하는 분류 모형. 연속값 예측은 선형 회귀", "기억법": "속은 회귀(로그오즈 직선), 겉은 분류(확률 → 예/아니오)"}, "kakao_chat": "A: 로지스틱 회귀 알아?\nB: 회귀면 숫자 예측하는 거 아냐?\nA: 이름만 회귀야. 실제론 '연체할까 말까' 같은 분류에 써\nB: 어떻게 분류해?\nA: 변수들 가중합을 시그모이드에 넣어서 0~1 확률로 바꿔. 0.5 넘으면 '예'\nB: 딥러닝보다 좋은 점은?\nA: 계수로 설명이 돼. '부채비율 1 늘면 연체 오즈가 2배' 이렇게\nB: 신경망이랑은 아예 달라?\nA: 은닉층 없는 신경망이 바로 로지스틱 회귀야. 같은 식이야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_151", "term": "선형판별분석 (LDA)", "term_en": "Linear Discriminant Analysis", "category": "ML", "definition": "각 집단의 평균과 공통 공분산을 이용해, 집단 간 퍼짐은 크고 집단 내부 퍼짐은 작게 보이는 방향으로 선형 경계를 정하는 통계적 분류 방법", "one_line": "집단별 분포를 가정하고 비교해 직선 경계를 긋는 분류법 — '공분산이 같다'는 가정이 핵심", "detail": "클래스마다 정규분포를 따르고 공분산은 같다고 가정하면 경계가 직선이 된다. 클래스마다 공분산이 다르다고 두면 QDA(이차판별분석)가 되어 곡선 경계가 나온다. 로지스틱 회귀는 P(Y|X)만 모델링하지만, LDA는 X가 각 집단에서 어떻게 분포하는지까지 모델링한다. 그래서 가정이 맞으면 적은 데이터로도 효율적이지만, 가정이 틀리면(이상치·비정규) 흔들린다. 차원 축소에도 쓴다. [lecture_017]", "examples": ["두 품종 꽃의 꽃잎 길이·폭으로 품종 판별 (피셔의 붓꽃 데이터가 원조)", "lecture_017 데모: 데이터 A에서 평균 2개 + 공통 공분산을 실제로 계산해 그린 직선 경계", "공분산을 집단마다 따로 두면 QDA → 곡선 경계"], "related": ["로지스틱 회귀 (Logistic Regression)", "결정 경계 (Decision Boundary)", "분류 (Classification)"], "flow": ["① 집단별 평균 계산", "② 집단 내부 공분산(공통) 계산", "③ 집단 간 퍼짐 ÷ 집단 내부 퍼짐이 가장 커지는 방향 찾기", "④ 그 방향 위의 선형 경계로 새 데이터 판별"], "confusion": {"헷갈리는점": "LDA라는 약자가 토픽 모델링의 LDA(Latent Dirichlet Allocation)와 같음", "차이": "분류의 LDA = 선형판별분석(지도학습) / 토픽의 LDA = 문서 주제 찾기(비지도학습). 로지스틱 회귀와는 'X의 분포를 가정하느냐'가 다름", "기억법": "판별 LDA는 '집단 비교', 토픽 LDA는 '주제 뽑기'"}, "kakao_chat": "A: LDA라고 들어봤어?\nB: 그거 문서 주제 뽑는 거 아냐?\nA: 그건 이름만 같은 다른 LDA야. 여기선 선형판별분석\nB: 뭘 판별해?\nA: 두 집단 평균이랑 퍼진 정도를 비교해서 그 사이에 직선을 그어\nB: 로지스틱 회귀랑 뭐가 달라?\nA: LDA는 '각 집단이 정규분포고 퍼짐이 같다'고 가정해. 맞으면 효율적이고, 틀리면 흔들려\nB: 퍼짐이 다르면?\nA: 그럼 QDA. 경계가 곡선이 돼", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_152", "term": "퍼셉트론 (Perceptron)", "term_en": "Perceptron", "category": "ML", "definition": "입력의 가중합에 계단 함수를 적용해 둘 중 하나로 분류하고, 틀린 샘플을 볼 때만 가중치를 고치는 가장 단순한 인공신경망", "one_line": "틀리면 고치는 직선 하나 — 신경망의 출발점이자 XOR을 못 푸는 한계의 상징", "detail": "ŷ = step(w·x + b). 틀린 샘플에서만 w ← w + η(y−ŷ)x로 가중치를 옮긴다. 1958년 로젠블랫이 제안했다. 데이터가 직선으로 나뉘면 언젠가 모두 맞히는 경계를 찾지만(수렴 정리), XOR이나 두 반달처럼 직선 하나로 나뉘지 않으면 풀 수 없다. 1969년 민스키·패퍼트가 이 한계를 지적했고, 은닉층과 비선형 활성화를 쌓은 다층 퍼셉트론(MLP)과 역전파가 해법이 됐다. 단일 퍼셉트론은 역전파가 아니라 퍼셉트론 규칙으로 학습한다. [lecture_017]", "examples": ["AND·OR은 직선 하나로 나뉘어 퍼셉트론으로 풀림", "XOR(둘 중 하나만 참)은 직선 하나로 못 나눔 → 은닉층 필요", "lecture_017 데모: 두 반달 데이터에 퍼셉트론 → 직선이라 반달을 감싸지 못함(학습 정확도 92.5%)"], "related": ["인공신경망 (Artificial Neural Network)", "은닉층 (Hidden Layer)", "활성화 함수 (Activation Function)", "역전파 (Backpropagation)", "결정 경계 (Decision Boundary)"], "flow": ["① 가중합 w·x+b 계산", "② 계단 함수로 0/1(또는 −1/+1) 판정", "③ 틀렸으면 정답 쪽으로 가중치 이동, 맞으면 그대로", "④ 데이터를 여러 번 돌며 반복 → 직선 경계 확정"], "confusion": {"헷갈리는점": "퍼셉트론과 로지스틱 회귀가 같은 것으로 보임(둘 다 선형결합)", "차이": "퍼셉트론 = 계단 함수로 맞다/틀리다만 보고 틀린 것만 수정 / 로지스틱 회귀 = 시그모이드로 확률을 내고 우도(교차 엔트로피)로 학습", "기억법": "퍼셉트론은 OX 채점, 로지스틱은 확률 점수"}, "kakao_chat": "A: 퍼셉트론이 신경망의 할아버지야\nB: 뭐 하는 건데?\nA: 입력에 가중치 곱해서 더하고, 기준 넘으면 1 아니면 0\nB: 학습은 어떻게 해?\nA: 틀린 것만 보고 가중치를 정답 쪽으로 조금 옮겨\nB: 그걸로 다 풀려?\nA: 직선 하나로 나뉘는 문제만. XOR은 못 풀어\nB: 그럼 어떻게 해?\nA: 층을 쌓고 비선형 활성화를 넣어. 그게 다층 퍼셉트론, 딥러닝의 시작이야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_153", "term": "역전파 (Backpropagation)", "term_en": "Backpropagation", "category": "ML", "definition": "출력의 오차가 각 가중치에 얼마나 영향을 줬는지(기울기)를 연쇄법칙으로 출력층에서 입력층 쪽으로 거꾸로 계산하는 방법", "one_line": "오차를 뒤에서 앞으로 나눠 주는 계산법 — 가중치를 실제로 고치는 건 경사하강법", "detail": "순전파로 예측을 내고 손실(예: 교차 엔트로피)을 계산한 뒤, 미분의 연쇄법칙으로 각 층 가중치의 기울기를 뒤에서부터 차례로 구한다. 이렇게 구한 기울기로 경사하강법이 가중치를 업데이트한다. 은닉층이 있는 신경망 학습을 현실적으로 만든 핵심 기법이다. [lecture_017]", "examples": ["시험 오답 원인을 '마지막 계산 실수 → 공식 적용 → 개념 이해' 순으로 거꾸로 추적하는 것과 비슷", "lecture_017 데모: ReLU 은닉층 + 시그모이드 출력 신경망이 두 반달 경계를 역전파로 학습(학습 정확도 96.3%)"], "related": ["경사하강법 (Gradient Descent)", "교차 엔트로피 (Cross-Entropy)", "은닉층 (Hidden Layer)", "인공신경망 (Artificial Neural Network)", "흐름: 딥러닝 학습"], "flow": ["① 순전파: 입력 → 은닉층 → 출력으로 예측", "② 손실 계산: 예측과 정답의 차이", "③ 역전파: 출력층부터 거꾸로 각 가중치의 기울기 계산(연쇄법칙)", "④ 경사하강법으로 가중치 업데이트 → 반복"], "confusion": {"헷갈리는점": "역전파 = 학습 그 자체라고 생각", "차이": "역전파 = 기울기 '계산' / 경사하강법(옵티마이저) = 그 기울기로 가중치 '이동'", "기억법": "역전파는 내비가 방향 계산, 경사하강은 실제로 운전"}, "kakao_chat": "A: 역전파가 뭔지 알아?\nB: 뭔가 거꾸로 전달하는 거?\nA: 맞아. 틀린 정도(오차)를 출력층에서 앞쪽 층으로 거꾸로 나눠 줘\nB: 왜 거꾸로 해?\nA: 각 가중치가 오차에 얼마나 책임 있는지 계산하려고. 미분 연쇄법칙을 써\nB: 그게 학습이야?\nA: 반만. 역전파는 방향 계산이고, 실제로 가중치를 옮기는 건 경사하강법이야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_154", "term": "결정 경계 (Decision Boundary)", "term_en": "Decision Boundary", "category": "ML", "definition": "모델이 한 범주에서 다른 범주로 판단을 바꾸는 지점들을 이은 선(2차원) 또는 면(고차원)", "one_line": "모델이 그은 '국경선' — 모델마다 모양이 다르다", "detail": "로지스틱 회귀·LDA·선형 SVM·퍼셉트론은 직선(초평면) 경계를, RBF 커널 SVM·은닉층 신경망은 곡선 경계를, 결정 트리·랜덤포레스트는 축에 평행한 계단 모양 경계를 만든다. 경계가 복잡할수록 학습 데이터는 더 잘 맞히지만 새 데이터에서는 오히려 틀릴 수 있어(과적합) 검증이 필요하다. [lecture_017]", "examples": ["스팸 필터: '무료' 단어 수와 링크 수 평면에 그은 스팸/정상 경계선", "lecture_017: 같은 두 반달 데이터 — 퍼셉트론은 직선, 신경망은 휘어진 선, 랜덤포레스트는 계단"], "related": ["분류 (Classification)", "SVM (Support Vector Machine)", "과적합과 일반화 (Overfitting·Generalization)", "Threshold (임계값)"], "flow": ["① 모델이 공간의 모든 점에 점수(또는 확률) 계산", "② 점수가 기준값(0 또는 0.5)인 지점을 이음", "③ 선의 양쪽이 각 범주 영역", "④ 새 데이터는 어느 쪽에 떨어지는지로 판정"], "confusion": {"헷갈리는점": "경계가 구불구불할수록 좋은 모델이라고 생각", "차이": "복잡한 경계 = 학습 데이터에 잘 맞음 ≠ 새 데이터에 잘 맞음. 검증 성능으로 판단", "기억법": "국경선을 집집마다 꺾으면 새로 이사 온 사람(새 데이터)은 엉뚱한 나라로 간다"}, "kakao_chat": "A: 결정 경계는 모델이 그은 국경선이야\nB: 무슨 국경?\nA: 이쪽은 스팸, 저쪽은 정상. 그 사이의 선\nB: 모델마다 선이 달라?\nA: 응. 로지스틱 회귀는 직선, 신경망은 곡선, 트리는 계단 모양\nB: 구불구불하면 더 정확한 거지?\nA: 학습 데이터에선 그렇지. 근데 새 데이터에선 틀릴 수 있어. 그래서 검증이 필요해", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_155", "term": "우도·최대우도추정 (Likelihood·MLE)", "term_en": "Likelihood · Maximum Likelihood Estimation", "category": "ML", "definition": "우도는 '지금 파라미터라면 관측한 데이터가 나올 법한 정도'이고, MLE는 그 우도를 가장 크게 만드는 파라미터를 고르는 추정 방법", "one_line": "데이터를 가장 그럴듯하게 설명하는 파라미터 고르기", "detail": "확률은 파라미터를 고정하고 데이터가 나올 가능성을 보는 것이고, 우도 L(θ)=P(데이터|θ)는 데이터를 고정하고 파라미터 θ를 바꿔 가며 보는 것이다. 곱셈이 많아 보통 로그우도를 최대화한다. 로지스틱 회귀에서 로그우도 최대화는 교차 엔트로피 최소화와 같은 문제다. 통계학은 우도를 바탕으로 우도비검정·AIC/BIC 같은 모형 비교도 한다. [lecture_017]", "examples": ["동전 10번 중 앞면 7번 → 앞면 확률 0.7일 때 우도가 가장 큼 → MLE = 0.7", "로지스틱 회귀 계수 추정 = 로그우도 최대화 = 교차 엔트로피 최소화"], "related": ["로지스틱 회귀 (Logistic Regression)", "교차 엔트로피 (Cross-Entropy)", "분류 (Classification)"], "flow": ["① 데이터 분포 가정(예: 베르누이)", "② 파라미터 θ에 대한 우도(로그우도) 식 세우기", "③ 우도가 최대가 되는 θ 찾기(미분·경사법)", "④ 추정값으로 예측·검정·해석"], "confusion": {"헷갈리는점": "우도 = 그 파라미터가 맞을 확률이라고 오해", "차이": "우도는 파라미터의 확률이 아님. '이 파라미터면 이 데이터가 나올 법한 정도'. 파라미터 자체의 확률은 베이즈 사후확률", "기억법": "확률은 '공정한 주사위로 6이 나올까?', 우도는 '6이 이렇게 많이 나왔으니 어떤 주사위가 그럴듯할까?'"}, "kakao_chat": "A: 우도가 뭔지 헷갈리지?\nB: 확률이랑 같은 거 아냐?\nA: 방향이 반대야. 확률은 동전이 정해져 있을 때 결과를 봐\nB: 우도는?\nA: 결과가 정해져 있을 때 '어떤 동전이 그럴듯한가'를 봐\nB: 그럼 MLE는?\nA: 그럴듯함이 가장 큰 값을 고르는 거야. 10번 중 7번 앞면이면 0.7\nB: 머신러닝이랑도 관련 있어?\nA: 로지스틱 회귀에서 우도 최대화가 교차 엔트로피 최소화랑 똑같아", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_156", "term": "지니 불순도 (Gini Impurity)", "term_en": "Gini Impurity", "category": "ML", "definition": "트리의 한 노드에 여러 범주가 얼마나 섞여 있는지 재는 값 — 0이면 한 범주만 있는 순수한 상태", "one_line": "섞임 정도 점수: 0 = 깔끔, 이진 분류 최대 0.5 = 반반", "detail": "G = 1 − Σ pₖ² (이진이면 2p(1−p)). 결정 트리는 분할 후 두 자식 노드의 지니 불순도 가중평균이 가장 작아지는 기준으로 데이터를 나눈다. 랜덤포레스트의 변수 중요도(MDI)는 각 변수가 줄인 지니 불순도를 모든 트리에서 합한 비율이다. 엔트로피(정보 이득)도 같은 역할을 하며 결과는 대체로 비슷하다. [lecture_017]", "examples": ["노드에 스팸 5·정상 5 → 1−(0.5²+0.5²) = 0.5 (가장 섞임)", "스팸 9·정상 1 → 1−(0.81+0.01) = 0.18", "스팸만 10 → 0 (순수)"], "related": ["Decision Tree (결정 트리)", "Random Forest", "분류 (Classification)"], "flow": ["① 후보 분할 기준(변수·임계값) 만들기", "② 분할 후 양쪽 노드의 지니 불순도 계산", "③ 가중평균이 가장 작은 분할 선택", "④ 더 나눌 필요가 없을 때까지 반복"], "confusion": {"헷갈리는점": "경제학의 지니 계수(소득 불평등)와 같은 것으로 착각", "차이": "지니 불순도 = 노드 안 범주 섞임 / 지니 계수 = 소득 분배 불평등. 같은 학자(지니)의 이름을 땄을 뿐 계산·의미가 다름", "기억법": "불순도는 '바구니 속 과일이 몇 종류 섞였나'"}, "kakao_chat": "A: 결정 트리가 어디서 자를지 어떻게 정하는지 알아?\nB: 아무 데나 자르는 거 아냐?\nA: 지니 불순도가 제일 많이 줄어드는 곳을 골라\nB: 지니 불순도가 뭔데?\nA: 한 바구니에 범주가 얼마나 섞였나 점수야. 반반이면 0.5, 한 종류면 0\nB: 소득 불평등 지니 계수랑 같은 거야?\nA: 이름만 같아. 계산도 의미도 달라", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_157", "term": "교차 엔트로피 (Cross-Entropy)", "term_en": "Cross-Entropy Loss", "category": "ML", "definition": "모델이 낸 확률이 정답과 얼마나 어긋나는지 재는 손실 — 확신하고 틀릴수록 벌점이 크게 커진다", "one_line": "분류 모델의 대표 손실 함수 = 음의 로그우도", "detail": "이진 분류: loss = −[y log p + (1−y) log(1−p)]. 정답이 1인데 p=0.99면 손실 약 0.01, p=0.01이면 약 4.6으로 급격히 커진다. 베르누이 모형의 음의 로그우도와 같아서, 교차 엔트로피를 최소화하는 것 = 우도를 최대화(MLE)하는 것이다. 로지스틱 회귀와 시그모이드 출력 신경망이 같은 손실을 쓰는 이유다. Accuracy는 미분이 안 돼 학습에 직접 쓰지 못하므로, 학습은 교차 엔트로피로 하고 평가는 Accuracy·F1·ROC-AUC 등으로 한다. [lecture_017]", "examples": ["정답 1, 예측 0.9 → 손실 0.105 / 예측 0.5 → 0.693 / 예측 0.1 → 2.303", "다중 분류는 Softmax 출력 + 범주형 교차 엔트로피"], "related": ["우도·최대우도추정 (Likelihood·MLE)", "로지스틱 회귀 (Logistic Regression)", "역전파 (Backpropagation)", "경사하강법 (Gradient Descent)"], "flow": ["① 모델이 정답 범주의 확률 p 출력", "② −log(정답 확률)로 벌점 계산", "③ 전체 데이터 평균 = 손실", "④ 역전파·경사하강으로 손실 최소화"], "confusion": {"헷갈리는점": "학습 손실(교차 엔트로피)과 평가 지표(Accuracy)를 같은 것으로 봄", "차이": "교차 엔트로피 = 확률의 질까지 보는 학습용 손실 / Accuracy = 맞힌 비율만 보는 평가용 지표", "기억법": "교차 엔트로피는 '얼마나 자신 있게 맞혔나'까지 채점"}, "kakao_chat": "A: 교차 엔트로피는 분류 모델 채점표야\nB: 맞으면 0점, 틀리면 1점 아냐?\nA: 더 세밀해. 정답에 준 확률이 낮을수록 벌점이 확 커져\nB: 예를 들면?\nA: 정답에 0.9 주면 0.1점, 0.1 주면 2.3점\nB: Accuracy 쓰면 안 돼?\nA: Accuracy는 미분이 안 돼서 학습엔 못 써. 학습은 교차 엔트로피, 평가는 Accuracy·F1\nB: 우도랑도 관련 있다며?\nA: 교차 엔트로피 줄이기 = 우도 키우기. 같은 문제야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_158", "term": "하이퍼파라미터 (Hyperparameter)", "term_en": "Hyperparameter", "category": "ML", "definition": "학습 전에 사람이 정해 주는 모델 설정값 — 데이터로 학습되는 파라미터(계수·가중치)와 구분된다", "one_line": "모델이 스스로 배우지 않는 '설정 다이얼' — 검증 데이터로 고른다", "detail": "예: SVM의 C(오분류 허용 정도 — 클수록 덜 허용해 학습 데이터에 딱 맞는 경계, 과적합 위험)와 gamma(RBF에서 점 하나의 영향 범위 — 클수록 좁아져 경계가 구불구불), 랜덤포레스트의 n_estimators·max_depth·min_samples_split·min_samples_leaf·max_features, 신경망의 층 수·뉴런 수·학습률·배치 크기. Grid Search(격자 전부)·Random Search(무작위 일부)·Bayesian Optimization(이전 결과로 다음 후보 선택)으로 찾되, 반드시 검증 데이터(교차검증)로 비교하고 테스트 데이터는 마지막에 한 번만 쓴다. [lecture_017]", "examples": ["SVM: C=0.1(넓은 마진, 오분류 허용) vs C=100(좁은 마진, 학습 데이터에 딱 맞춤)", "랜덤포레스트: max_depth를 키우면 경계가 더 잘게 쪼개짐", "신경망: 학습률이 너무 크면 손실이 튀고, 너무 작으면 느림"], "related": ["교차검증 (Cross-Validation)", "SVM (Support Vector Machine)", "Random Forest", "과적합과 일반화 (Overfitting·Generalization)"], "flow": ["① 후보 값 범위 정하기", "② 탐색 방법 선택(Grid·Random·Bayesian)", "③ 후보마다 k-fold 교차검증 성능 측정", "④ 최선 조합으로 전체 학습 → 테스트로 최종 확인 한 번"], "confusion": {"헷갈리는점": "파라미터와 하이퍼파라미터를 혼동", "차이": "파라미터 = 학습이 정하는 값(회귀 계수, 신경망 가중치) / 하이퍼파라미터 = 사람이 학습 전에 정하는 값(C, 트리 깊이, 학습률)", "기억법": "파라미터는 요리의 맛(결과), 하이퍼파라미터는 불 세기·시간(설정)"}, "kakao_chat": "A: 하이퍼파라미터 들어봤어?\nB: 파라미터랑 뭐가 달라?\nA: 파라미터는 모델이 학습하면서 정하는 값이야. 가중치 같은 거\nB: 하이퍼는?\nA: 학습 전에 사람이 정하는 설정. SVM의 C, 트리 깊이, 학습률 같은 거\nB: 어떻게 정해?\nA: 여러 값을 넣어 보고 검증 성능이 제일 좋은 걸 골라. Grid Search 같은 걸로\nB: 테스트 데이터로 고르면 안 돼?\nA: 안 돼. 시험 문제 보고 공부한 셈이라 실력이 부풀려져", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_159", "term": "교차검증 (Cross-Validation)", "term_en": "k-fold Cross-Validation", "category": "ML", "definition": "데이터를 k개 조각으로 나눠, 조각 하나씩 돌아가며 검증용으로 쓰고 나머지로 학습해 성능의 평균과 흔들림을 보는 평가 방법", "one_line": "한 번의 운이 아니라 k번 평균으로 모델을 비교", "detail": "k-fold 교차검증: 데이터를 k개(보통 5·10)로 나눠 k번 학습·검증하고 평균과 표준편차를 본다. 데이터를 한 번만 나누면 운에 따라 성능이 달라지기 때문이다. 모델 비교(SVM vs 랜덤포레스트)나 하이퍼파라미터 튜닝은 같은 폴드에서 해야 공정하다. 불균형 데이터는 층화(stratified) k-fold, 시계열은 시간 순서를 지키는 분할을 쓴다. 테스트 데이터는 교차검증과 별도로 맨 마지막에 한 번만 쓴다. [lecture_017]", "examples": ["5-fold: 1~4조각으로 학습 → 5조각으로 검증, 이걸 5번 돌려 평균 정확도 0.91 ± 0.02", "SVM과 RF의 ROC-AUC를 같은 5개 폴드에서 비교"], "related": ["하이퍼파라미터 (Hyperparameter)", "과적합과 일반화 (Overfitting·Generalization)", "혼동행렬·정밀도·재현율·F1", "ROC-AUC"], "flow": ["① 데이터를 k개 폴드로 분할(필요하면 층화)", "② 폴드 하나로 검증, 나머지로 학습 → k번 반복", "③ 성능 평균·표준편차 계산", "④ 같은 폴드 기준으로 모델·설정 비교 → 테스트로 최종 확인"], "confusion": {"헷갈리는점": "검증(validation) 데이터와 테스트(test) 데이터를 같은 것으로 봄", "차이": "검증 = 모델·설정을 고를 때 반복 사용 / 테스트 = 다 고른 뒤 마지막에 한 번만 보는 실력 확인", "기억법": "검증은 모의고사(여러 번), 테스트는 수능(한 번)"}, "kakao_chat": "A: 모델 성능을 한 번만 재면 위험한 거 알아?\nB: 왜?\nA: 데이터를 어떻게 나눴냐에 따라 운이 섞이거든\nB: 그럼 어떻게 해?\nA: 5조각으로 나눠서 돌아가며 한 조각씩 시험 봐. 5번 평균 내는 게 교차검증이야\nB: 테스트 데이터랑은 달라?\nA: 교차검증은 모의고사, 테스트는 수능. 수능은 마지막에 한 번만", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_160", "term": "혼동행렬·정밀도·재현율·F1", "term_en": "Confusion Matrix · Precision · Recall · F1", "category": "ML", "definition": "분류 결과를 TP·FP·FN·TN 네 칸으로 정리한 표(혼동행렬)와, 거기서 계산하는 정밀도·재현율·F1 지표", "one_line": "Accuracy 하나에 숨는 실수를 네 칸으로 드러내는 평가 도구", "detail": "정밀도 = TP/(TP+FP): '양성이라고 한 것 중 진짜 양성' 비율. 재현율 = TP/(TP+FN): '진짜 양성 중 찾아낸' 비율. F1 = 2·정밀도·재현율/(정밀도+재현율), 둘의 조화평균. 양성이 1%뿐이면 전부 음성이라고 해도 Accuracy 99%가 나오므로 불균형 데이터에선 혼동행렬과 정밀도·재현율을 함께 본다. 임계값을 높이면 정밀도↑·재현율↓, 낮추면 반대다. 무엇을 우선할지는 거짓양성·거짓음성의 비용으로 정한다. [lecture_017]", "examples": ["암 검진: 놓치면 치명적 → 재현율 우선", "스팸 필터: 정상 메일을 스팸함에 넣으면 곤란 → 정밀도 우선", "양성 10명 중 8명 찾고(TP 8, FN 2) 양성이라 한 것 중 4명은 오진(FP 4) → 재현율 0.8, 정밀도 0.67, F1 0.73"], "related": ["Threshold (임계값)", "ROC-AUC", "교차검증 (Cross-Validation)", "분류 (Classification)"], "flow": ["① 예측과 정답으로 TP·FP·FN·TN 세기", "② 정밀도·재현율·F1 계산", "③ 거짓양성·거짓음성 비용 비교", "④ 임계값 조정 또는 모델 변경"], "confusion": {"헷갈리는점": "정밀도와 재현율이 헷갈림", "차이": "정밀도 = 내가 '양성'이라고 한 것의 정확도 / 재현율 = 실제 양성을 놓치지 않은 정도", "기억법": "정밀도는 '헛방 줄이기', 재현율은 '빠짐없이 잡기'"}, "kakao_chat": "A: 정확도 99%면 좋은 모델일까?\nB: 당연하지!\nA: 환자가 1%뿐이면 전부 '정상'이라 해도 99%야\nB: 헐 그럼 뭘 봐?\nA: 혼동행렬. 맞힌 양성, 헛방, 놓친 양성, 맞힌 음성 네 칸으로 봐\nB: 정밀도랑 재현율은?\nA: 정밀도는 '양성이라 한 것 중 진짜', 재현율은 '진짜 중 찾아낸 것'\nB: 뭘 더 중요하게 봐?\nA: 틀렸을 때 비용으로 정해. 암 검진은 재현율, 스팸 필터는 정밀도. 둘 다 보려면 F1", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_161", "term": "ROC-AUC", "term_en": "Receiver Operating Characteristic · Area Under the Curve", "category": "ML", "definition": "임계값을 바꿔 가며 재현율(TPR)과 거짓양성률(FPR)을 그린 곡선(ROC)의 아래 넓이(AUC) — 모델이 양성을 음성보다 높게 점수 매기는 능력", "one_line": "0.5 = 동전 던지기, 1 = 완벽 — 임계값과 무관한 순위 능력 점수", "detail": "AUC는 '양성 하나와 음성 하나를 무작위로 뽑았을 때 모델이 양성에 더 높은 점수를 줄 확률'로 해석할 수 있다. 확률이나 점수가 필요하다(SVM은 결정함수 점수로 계산 가능). 모델 비교는 같은 검증 분할(같은 교차검증 폴드)에서 한다. 양성이 아주 적으면 ROC-AUC가 낙관적으로 보일 수 있어 PR-AUC(정밀도-재현율 곡선)도 함께 본다. AUC가 높아도 실제 운영 임계값은 비용을 보고 따로 정해야 한다. [lecture_017]", "examples": ["AUC 0.92 → 양성·음성 한 쌍을 뽑으면 92%는 양성 점수가 더 높음", "같은 5-fold에서 SVM AUC 0.90 vs RF AUC 0.93 비교"], "related": ["혼동행렬·정밀도·재현율·F1", "Threshold (임계값)", "교차검증 (Cross-Validation)"], "flow": ["① 검증 데이터에 점수(확률) 예측", "② 임계값을 높은 값→낮은 값으로 바꾸며 TPR·FPR 계산", "③ 점들을 이어 ROC 곡선", "④ 곡선 아래 넓이 = AUC로 모델 비교"], "confusion": {"헷갈리는점": "AUC가 높으면 바로 현장에 써도 된다고 생각", "차이": "AUC = 줄 세우는 능력(임계값 무관) / 실제 판정은 임계값에 따라 정밀도·재현율이 달라짐", "기억법": "AUC는 줄 세우기 실력, 임계값은 어디서 끊을지"}, "kakao_chat": "A: ROC-AUC 0.5면 어떤 모델이야?\nB: 반은 맞히는 거?\nA: 동전 던지기 수준이란 뜻이야. 1이면 완벽\nB: 정확도랑 뭐가 달라?\nA: 정확도는 기준선 하나에서 재지만, AUC는 기준선을 다 바꿔 보며 재\nB: 그럼 AUC만 높으면 끝?\nA: 아니. 실제로 쓸 땐 어디서 끊을지 임계값을 비용 보고 따로 정해야 해", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_162", "term": "과적합과 일반화 (Overfitting·Generalization)", "term_en": "Overfitting · Generalization", "category": "ML", "definition": "일반화는 학습에 없던 새 데이터에서도 잘 작동하는 성질이고, 과적합은 학습 데이터에만 지나치게 맞춰져 일반화에 실패한 상태", "one_line": "기출만 외운 학생(과적합) vs 처음 보는 문제도 푸는 학생(일반화)", "detail": "학습 성능은 높은데 검증·테스트 성능이 낮으면 과적합, 둘 다 낮으면 과소적합이다. 모델이 복잡할수록(깊은 트리, 큰 C·gamma, 큰 신경망) 과적합 위험이 커진다. 교차검증으로 확인하고, 규제(L1·L2, Dropout, Early Stopping)·데이터 추가·모델 단순화로 줄인다. 보편 근사 정리는 신경망이 어떤 경계든 '표현할 수 있다'는 뜻이지 유한한 데이터에서 일반화된다는 보장이 아니다. [lecture_017]", "examples": ["결정 트리를 끝까지 키우면 학습 정확도 100%, 새 데이터 정확도는 뚝 떨어짐", "학습곡선: 학습 손실은 계속 주는데 검증 손실이 다시 오르면 과적합 시작 → Early Stopping"], "related": ["교차검증 (Cross-Validation)", "규제 (Regularization)", "하이퍼파라미터 (Hyperparameter)", "결정 경계 (Decision Boundary)", "에포크 (Epoch)"], "flow": ["① 학습·검증 성능을 함께 기록", "② 학습↑ 검증↓ 이면 과적합 신호", "③ 규제·데이터 추가·모델 단순화", "④ 교차검증으로 다시 확인"], "confusion": {"헷갈리는점": "학습 정확도가 높으면 좋은 모델이라고 생각", "차이": "학습 정확도 = 외운 정도 / 검증·테스트 정확도 = 실력(일반화)", "기억법": "기출 100점보다 모의고사 점수"}, "kakao_chat": "A: 과적합이 뭔지 알아?\nB: 너무 잘 맞는 거? 좋은 거 아냐?\nA: 학습 데이터만 너무 잘 맞는 거야. 기출만 외운 학생 같은 거\nB: 아 새 문제는 못 풀겠네\nA: 맞아. 새 데이터도 잘 맞히는 게 일반화야\nB: 어떻게 알아채?\nA: 학습 점수는 높은데 검증 점수가 낮으면 과적합 신호야\nB: 막는 법은?\nA: 모델을 단순하게 하거나, 데이터를 늘리거나, 규제를 걸어", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_163", "term": "규제 (Regularization)", "term_en": "Regularization", "category": "ML", "definition": "모델이 학습 데이터에 과하게 맞춰지지 않도록 복잡도에 벌점이나 제약을 거는 방법 — 과적합을 줄이는 도구", "one_line": "모델에 거는 '과속 방지턱' — 한국어 '정규화'(Normalization)와 다르다", "detail": "대표 방법: L2(가중치 제곱합 벌점, Ridge), L1(절댓값 벌점, Lasso — 일부 계수를 0으로 만들어 변수 선택 효과), Dropout(학습 중 뉴런 일부를 무작위로 끔), Early Stopping(검증 손실이 다시 오르면 학습 중단), 데이터 증강. SVM의 C는 규제 세기와 반대로 움직인다(C가 작을수록 규제가 강해 마진이 넓다). Batch Normalization은 원래 층 입력의 분포를 맞춰 학습을 안정시키는 정규화(Normalization)이고 규제 효과는 부수적이다. (lecture_017 검토: 덱 용어집 '정규화' 항목에 두 개념이 섞여 있음) [lecture_017]", "examples": ["Ridge 회귀: 계수가 커지면 벌점 → 계수가 작고 부드러운 모델", "Dropout 0.5: 학습 때마다 뉴런 절반을 꺼서 특정 뉴런 의존을 줄임", "Early Stopping: 검증 손실이 5에포크 연속 안 줄면 중단"], "related": ["과적합과 일반화 (Overfitting·Generalization)", "하이퍼파라미터 (Hyperparameter)", "SVM (Support Vector Machine)", "에포크 (Epoch)"], "flow": ["① 학습·검증 성능 차이로 과적합 확인", "② 규제 방법 선택(L1·L2·Dropout·Early Stopping)", "③ 규제 세기를 하이퍼파라미터로 튜닝", "④ 교차검증으로 일반화 개선 확인"], "confusion": {"헷갈리는점": "Regularization(규제)과 Normalization(정규화)이 한국어로 둘 다 '정규화'라 불려 섞임", "차이": "규제 = 과적합 억제(벌점·제약) / 정규화(Normalization) = 입력·층 값의 범위·분포 맞추기(Min-Max, 표준화, Batch Normalization)", "기억법": "규제는 브레이크, 정규화는 단위 맞추기"}, "kakao_chat": "A: 규제(Regularization) 알아?\nB: 정규화랑 같은 거 아냐?\nA: 한국어로 둘 다 정규화라고 부르는데 사실 달라\nB: 뭐가 달라?\nA: 규제는 모델이 너무 외우지 않게 벌점 주는 거. Dropout, Early Stopping 같은 거\n   Normalization은 숫자 범위를 맞추는 거야\nB: Batch Normalization은 어느 쪽이야?\nA: 원래는 Normalization. 학습을 안정시키려고 만든 거고 규제 효과는 덤이야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_164", "term": "활성화 함수 (Activation Function)", "term_en": "Activation Function", "category": "ML", "definition": "신경망의 각 뉴런이 가중합을 다음 층으로 넘기기 전에 통과시키는 함수 — 비선형을 넣어 곡선 경계를 가능하게 한다", "one_line": "비선형 스위치 — 없으면 층을 아무리 쌓아도 직선 하나", "detail": "대표: 계단 함수(퍼셉트론, 0/1), 시그모이드 1/(1+e^−z)(0~1 확률, 이진 분류 출력층), ReLU max(0,z)(은닉층 기본값, 계산이 싸고 기울기 소실이 적음), Softmax(다중 분류 출력층, 확률 합 1), tanh. 선형 함수만 겹치면 결국 선형 함수 하나와 같아서, 은닉층이 있어도 비선형 활성화가 없으면 퍼셉트론과 같은 직선 경계밖에 못 만든다. [lecture_017]", "examples": ["ReLU: 음수는 0, 양수는 그대로 → 여러 조각을 이어 꺾인 경계 생성", "시그모이드: 점수 2.0 → 확률 0.88", "lecture_017 데모: ReLU 뉴런 8개로 두 반달 사이 곡선 경계"], "related": ["퍼셉트론 (Perceptron)", "은닉층 (Hidden Layer)", "로지스틱 회귀 (Logistic Regression)", "인공신경망 (Artificial Neural Network)"], "flow": ["① 뉴런이 가중합 z 계산", "② 활성화 함수 통과(은닉층은 ReLU 등)", "③ 다음 층으로 전달", "④ 출력층은 문제에 맞는 함수(이진=시그모이드, 다중=Softmax)"], "confusion": {"헷갈리는점": "층만 많이 쌓으면 복잡한 패턴을 배운다고 생각", "차이": "비선형 활성화가 없으면 100층도 직선 1개와 같음. 층 수와 비선형이 함께 있어야 함", "기억법": "직선 자를 백 개 이어도 직선, 꺾이는 관절(활성화)이 있어야 곡선"}, "kakao_chat": "A: 신경망에 활성화 함수가 왜 필요한지 알아?\nB: 뉴런을 켜고 끄는 거?\nA: 비슷해. 핵심은 '꺾임'을 넣는 거야\nB: 꺾임이 왜 중요해?\nA: 꺾임이 없으면 층을 100개 쌓아도 직선 하나랑 같아\nB: 대표적인 건?\nA: 은닉층엔 ReLU, 이진 분류 출력엔 시그모이드, 여러 범주면 Softmax", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_165", "term": "경사하강법 (Gradient Descent)", "term_en": "Gradient Descent", "category": "ML", "definition": "손실 함수의 기울기 반대 방향으로 파라미터를 조금씩 옮겨 손실이 가장 작은 지점을 찾아가는 최적화 방법", "one_line": "안개 낀 산에서 발밑 경사만 보고 내려가기", "detail": "θ ← θ − η·∇손실. η(학습률)가 너무 크면 손실이 튀거나 발산하고, 너무 작으면 느리다. 전체 데이터로 한 번에 하면 배치 경사하강, 한 샘플씩이면 SGD(확률적 경사하강), 묶음씩이면 미니배치. Adam 같은 옵티마이저는 이를 개선한 것이다. 신경망에서는 기울기를 역전파로 계산한다. 로지스틱 회귀도 경사하강으로 적합할 수 있다. [lecture_017]", "examples": ["학습률 0.01로 1,000번 반복해 손실이 0.69 → 0.15로 감소", "lecture_017 데모: 로지스틱 회귀(420에포크)와 작은 신경망(520에포크)을 브라우저에서 경사하강으로 학습"], "related": ["역전파 (Backpropagation)", "교차 엔트로피 (Cross-Entropy)", "하이퍼파라미터 (Hyperparameter)", "에포크 (Epoch)", "흐름: 딥러닝 학습"], "flow": ["① 현재 파라미터로 손실 계산", "② 손실의 기울기 계산(신경망은 역전파)", "③ 기울기 반대 방향으로 학습률만큼 이동", "④ 손실이 더 줄지 않을 때까지 반복"], "confusion": {"헷갈리는점": "경사하강법과 역전파를 같은 것으로 봄", "차이": "역전파 = 기울기 계산 방법 / 경사하강법 = 그 기울기로 파라미터를 옮기는 방법", "기억법": "역전파는 경사 측정기, 경사하강은 걸음"}, "kakao_chat": "A: 경사하강법은 안개 낀 산에서 내려가는 방법이야\nB: 앞이 안 보이는데 어떻게 내려가?\nA: 발밑 경사만 보고 낮은 쪽으로 한 걸음씩\nB: 한 걸음 크기는?\nA: 그게 학습률이야. 너무 크면 골짜기를 넘어가고, 너무 작으면 하루 종일 걸려\nB: 역전파랑 같은 거야?\nA: 역전파가 경사를 재고, 경사하강법이 걸어. 둘이 짝이야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_166", "term": "전이학습 (Transfer Learning)", "term_en": "Transfer Learning", "category": "ML", "definition": "큰 데이터로 미리 학습한 모델(사전학습 모델)의 지식을 가져와 새 과제에 맞게 조금 더 학습시키는 방법 — 파인튜닝을 포함한다", "one_line": "남이 키운 실력을 빌려 와 내 문제에 맞추기", "detail": "대규모 이미지 데이터로 학습한 이미지 모델이나 대형 언어모델(LLM)처럼 일반적인 특징을 이미 배운 모델을 출발점으로 삼는다. 새 데이터가 적어도 성능을 내기 쉽다. 방법: 앞쪽 층은 고정하고 마지막 층만 새로 학습(특징 추출), 또는 전체를 작은 학습률로 다시 학습(파인튜닝). LLM에서는 LoRA처럼 일부 파라미터만 학습하는 방법도 쓴다. [lecture_017]", "examples": ["사전학습 이미지 모델 + 공장 불량품 사진 500장 → 불량 판별 모델", "범용 LLM을 학교 행정 문서로 파인튜닝"], "related": ["딥러닝 (Deep Learning)", "인공신경망 (Artificial Neural Network)", "과적합과 일반화 (Overfitting·Generalization)"], "flow": ["① 사전학습 모델 고르기", "② 새 과제에 맞게 출력층 교체", "③ 일부 층 고정 또는 전체를 작은 학습률로 학습", "④ 검증 데이터로 성능 확인"], "confusion": {"헷갈리는점": "전이학습과 파인튜닝을 완전히 다른 것으로 봄", "차이": "전이학습 = 사전학습 지식을 옮겨 쓰는 큰 개념 / 파인튜닝 = 그 안의 한 방법(가중치를 추가 학습)", "기억법": "전이학습은 '경력자 채용', 파인튜닝은 '우리 회사 OJT'"}, "kakao_chat": "A: 전이학습 알아?\nB: 뭘 전이해?\nA: 다른 데서 배운 실력을 옮겨 오는 거야\nB: 예를 들면?\nA: 사진 수백만 장으로 배운 모델에 우리 불량품 사진 500장만 더 가르치는 거\nB: 파인튜닝이랑 같은 거야?\nA: 파인튜닝은 전이학습의 한 방법이야. 경력자 뽑아서 우리 회사 OJT 시키는 느낌", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_167", "term": "흐름: 분류 모델 학습 (세 렌즈 공통)", "term_en": "Flow: Training a classifier — common skeleton", "category": "ML", "definition": "통계·머신러닝·신경망이 공통으로 따르는 분류 모델 학습 순서 — '차이를 재는 자'와 '고치는 대상'만 다르다", "one_line": "데이터 → 예측 → 실제값과 비교 → 규칙 조정 → 새 데이터 판단", "detail": "비교 기준: 로지스틱 회귀 = 우도 최대화(=교차 엔트로피 최소화), SVM = 마진 최대화(힌지 손실 + 규제), 결정 트리·랜덤포레스트 = 지니 불순도 감소, 신경망 = 손실(교차 엔트로피) 최소화. 조정 대상: 계수(β), 결정함수(w·b), 분할 기준, 층별 가중치. 마지막 단계(새 데이터 판단)는 모두 교차검증·테스트로 확인해야 한다. 은닉층 0개 신경망 = 로지스틱 회귀. [lecture_017]", "examples": ["lecture_017 4장: 세 접근을 같은 뼈대 위에 올려 비교"], "related": ["로지스틱 회귀 (Logistic Regression)", "SVM (Support Vector Machine)", "Random Forest", "인공신경망 (Artificial Neural Network)", "흐름: 분류 모델 고르기"], "flow": ["① 데이터 준비(같은 데이터로 비교해야 모델 차이가 보임)", "② 현재 규칙으로 예측", "③ 실제값과 비교: 우도 / 마진 / 불순도 / 손실", "④ 규칙 조정: 계수 / 결정함수 / 분할 / 가중치", "⑤ 새 데이터로 판단·검증(교차검증·테스트)"], "confusion": {"헷갈리는점": "세 접근이 완전히 다른 원리라고 생각", "차이": "뼈대는 같고 '차이를 재는 자'와 '고치는 대상'만 다름", "기억법": "같은 요리 순서, 다른 레시피"}, "kakao_chat": "A: 통계, 머신러닝, 딥러닝 분류가 다 다르게 생겼지?\nB: 응 완전 다른 세계 같아\nA: 순서는 똑같아. 예측하고, 정답이랑 비교하고, 고치고, 새 데이터로 확인\nB: 그럼 뭐가 달라?\nA: 비교하는 자가 달라. 우도, 마진, 불순도, 손실\nB: 같은 요리 순서에 레시피만 다른 거네\nA: 그거야. 은닉층 없는 신경망은 아예 로지스틱 회귀랑 같아", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_168", "term": "흐름: 분류 모델 고르기", "term_en": "Flow: Choosing a classifier", "category": "ML", "definition": "모델 이름보다 먼저 답해야 하는 네 가지 질문으로 후보를 좁히고, 같은 검증 설계에서 비교해 고르는 순서", "one_line": "설명 필요? → 데이터 양·형태? → 새 데이터 평가 가능? → 틀렸을 때 비용? → 같은 폴드에서 비교", "detail": "설명이 꼭 필요하면(대출·의료·행정) 계수·규칙을 바로 읽을 수 있는 로지스틱 회귀·LDA·얕은 트리가 유리하다. 데이터가 적은 표 형태면 통계 모형·SVM·랜덤포레스트, 이미지·텍스트처럼 크고 복잡하면 신경망을 먼저 검토한다(일반적 경향일 뿐 데이터마다 검증으로 확인). 새 데이터로 평가할 수 없으면 복잡한 모델을 믿을 근거가 없다. 거짓양성·거짓음성 비용이 다르면 그에 맞는 지표(재현율·정밀도·F1·ROC-AUC)를 먼저 정한다. 마지막으로 같은 교차검증 폴드에서 후보를 비교한다. [lecture_017]", "examples": ["lecture_017 17장: 네 질문이 '통계·머신러닝·신경망 중 무엇을 고를지'보다 먼저"], "related": ["흐름: 분류 모델 학습 (세 렌즈 공통)", "교차검증 (Cross-Validation)", "혼동행렬·정밀도·재현율·F1", "분류 (Classification)"], "flow": ["① 설명이 필요한가 (계수·규칙을 읽어야 하나)", "② 데이터 양과 형태는 어떤가 (표·이미지·텍스트, 몇 건)", "③ 새 데이터 평가가 가능한가 (검증·테스트 데이터 확보)", "④ 틀렸을 때 얼마나 문제인가 (거짓양성·거짓음성 비용 → 평가 지표 결정)", "⑤ 후보 모델을 같은 교차검증 폴드에서 비교 → 선택"], "confusion": {"헷갈리는점": "'요즘은 딥러닝이 최고'라며 모델부터 고름", "차이": "모델 선택은 문제 조건(설명·데이터·평가·비용)의 결과. 같은 데이터라도 목적이 다르면 답이 다름", "기억법": "모델 이름보다 채점 기준 먼저"}, "kakao_chat": "A: 분류 문제 받으면 모델부터 고르지?\nB: 응, 딥러닝 쓰면 되는 거 아냐?\nA: 먼저 네 가지를 물어봐. 설명이 필요한지, 데이터가 얼마나 있는지\nB: 나머지 둘은?\nA: 새 데이터로 평가할 수 있는지, 틀리면 얼마나 큰일인지\nB: 그다음에 고르는 거구나\nA: 응. 후보 몇 개를 같은 교차검증에서 비교해서 골라. 모델 이름보다 채점 기준이 먼저야", "added": "2026-10-25", "source": "lecture_017"}, {"id": "term_169", "term": "도커 이미지 (Docker Image)", "term_en": "Docker Image", "category": "Infra", "definition": "프로그램 실행에 필요한 것(실행 엔진·부품·코드·설정)을 빌드한 순간 그대로 얼려 둔 복사본. 빌드의 결과물이다.", "one_line": "사진(jpg·png)이 아니다 — 빌드로 포장한 '밀키트 상자'", "detail": "도커 이미지는 사진 파일(jpg·png)과 이름만 같고 전혀 다른 뜻이다. 컴퓨터 용어에서 '이미지'는 '어떤 순간의 상태를 통째로 떠 놓은 복사본'이라는 뜻도 있다. 윈도우 설치용 ISO 파일을 'CD 이미지', 디스크 전체 복사본을 '디스크 이미지'라고 부르는 것과 같은 쓰임이다. 사진이 그 순간의 장면을 찍어 두듯, 도커 이미지는 그 순간의 프로그램 상태를 찍어 둔다.\n\n밀키트 비유: 코드 = 레시피, 빌드 = 레시피대로 재료를 손질해 상자에 담는 일, 이미지 = 포장된 밀키트 상자, 컨테이너 = 상자를 뜯어 지금 조리 중인 요리, 배포 = 손님 식탁(서버)에 내놓는 일.\n\n이미지 자체는 아무 일도 하지 않는다. 켜야(docker run) 컨테이너가 되어 실제로 돌아간다. 이미지는 한 번 만들면 바뀌지 않는다(읽기 전용). 그래서 포장한 날의 Node·부품이 그대로 굳어 있고, 나중에 보안 수정이 나오거나 코드를 고쳐도 기존 이미지에는 반영되지 않는다 → 새로 빌드해야 한다.\n\n같이 나오는 말: 베이스 이미지 = Dockerfile 첫 줄(FROM)로 가져오는 기본 상자, 태그 = 이미지 이름 뒤 ':' 다음의 버전 이름표(node:22-alpine 의 22-alpine), 레지스트리 = 이미지를 보관·내려받는 창고(Docker Hub 등).", "examples": ["node:22-alpine = Node 22가 든 공식 기본(베이스) 이미지. ':' 뒤 '22-alpine'은 태그(버전 이름표)", "docker build → 이미지 생성 / docker images → 서버에 있는 이미지 목록 보기", "[우리 서버 실제 사례] 명부 서명 사이트(axis-sign 컨테이너): 2026-10-25에 확인해 보니 공개 화면이 10/19 첫 버전 코드와 똑같았다. 그 뒤에 고친 보안 강화판(10/19 시도 횟수 제한, 10/23 보안 패치)은 코드(레시피)만 준비돼 있고, 새 이미지로 빌드·배포되지 않은 상태 → 재빌드·재배포가 필요.", "[우리 서버 실제 사례] Hermes도 도커 이미지로 켠 컨테이너(hermes-work-hermes-agent-1)에서 돌아감 → Hermes 업데이트 = 새 버전 이미지로 바꿔 끼우기"], "related": ["Docker", "컨테이너 (Container)", "Dockerfile", "Build (빌드 단계)", "Deploy (배포 단계)", "흐름: 도커 앱 업데이트 (코드 수정 → 재빌드 → 재배포)"], "flow": ["① Dockerfile = 레시피(설계도)", "② docker build = 레시피대로 포장", "③ 도커 이미지 = 포장된 밀키트 상자 (여기서 멈춰 있음)", "④ docker run = 상자를 뜯어 조리 시작", "⑤ 컨테이너 = 조리 중인 요리 (실제로 돌아가는 프로그램)"], "confusion": {"헷갈리는점": "도커 이미지 vs 사진 이미지(jpg·png)", "차이": "사진 이미지 = 화면·장면을 담은 그림 파일 / 도커 이미지 = 프로그램 실행 환경을 통째로 떠 둔 복사본(빌드 결과물)", "기억법": "둘 다 '그 순간을 찍어 둔 것' — 사진은 장면을, 도커 이미지는 프로그램 상태를 찍는다 (ISO 파일 = CD 이미지와 같은 뜻)"}, "kakao_chat": "A: 도커 이미지가 사진 파일 같은 거야?\nB: 이름이 이미지니까 그림 아니야?\nA: 아니야! 이름만 같고 완전히 다른 뜻이야\n   프로그램 실행에 필요한 걸 빌드한 순간 그대로 얼려 둔 복사본이야\nB: 근데 왜 하필 '이미지'라고 불러?\nA: 컴퓨터에선 '그 순간 상태를 통째로 떠 둔 복사본'도 이미지라고 해\n   윈도우 ISO 파일을 'CD 이미지'라고 부르잖아. 사진이 장면을 찍듯 이건 프로그램 상태를 찍은 거야\nB: 그럼 이미지만 있으면 사이트가 돌아가?\nA: 아니, 이미지는 포장된 밀키트 상자야. 뜯어서 켜야(docker run) 컨테이너가 되고 그게 돌아가는 거야\nB: 코드 고치면 이미지도 바뀌어?\nA: 안 바뀌어! 포장한 날 그대로 굳어 있어서 새로 빌드해야 해", "added": "2026-10-26", "source": "대화 2026-10-26 — '빌드가 뭐야 / 도커 이미지는 사진이랑 다른 거야?' 질문"}, {"id": "term_170", "term": "컨테이너 (Container)", "term_en": "Container", "category": "Infra", "definition": "도커 이미지를 실제로 켜서 지금 돌아가고 있는 프로그램.", "one_line": "이미지가 밀키트 상자라면, 컨테이너는 상자를 뜯어 조리 중인 요리", "detail": "서버에서 실제로 사용자의 요청을 받는 것은 이미지가 아니라 컨테이너다. 상자 하나로 요리를 여러 번 할 수 있듯, 이미지 하나로 컨테이너를 여러 개 켤 수 있다.\n\n컨테이너는 켜질 때 쓴 이미지를 그대로 따른다. 그래서 새 이미지를 빌드해도 이미 켜져 있는 컨테이너는 저절로 바뀌지 않는다 — 옛 컨테이너를 끄고 새 이미지로 다시 켜야 한다(재배포). 같은 이미지로 끄고 켜기만 하는 '재시작'은 내용이 바뀌지 않는다.\n\n컨테이너를 지우면 그 안에서 바뀐 내용도 같이 사라진다. 그래서 남겨야 할 데이터(명부·서명 등)는 컨테이너 밖의 저장 공간인 '볼륨'에 둔다. 컨테이너는 가상머신(VM)처럼 컴퓨터 전체를 흉내 내지 않고 서버의 운영체제를 함께 쓰면서 앱만 따로 격리하기 때문에 가볍다(자세한 비교는 Docker 항목).", "examples": ["[우리 서버 실제 사례] axis-sign = 명부 서명 사이트 컨테이너 / hermes-work-hermes-agent-1 = 지금 대답하는 Hermes 컨테이너", "docker ps = 지금 켜져 있는 컨테이너 목록 / docker ps -a = 꺼진 것까지 전부", "docker logs --tail 50 axis-sign = 그 컨테이너가 남긴 기록 마지막 50줄 보기", "명부 서명 사이트는 데이터를 /data 볼륨에 저장하도록 설계(DATA_DIR=/data) → 컨테이너를 새로 만들어도 명부·서명은 남음"], "related": ["도커 이미지 (Docker Image)", "Docker", "가상 머신 (VM)", "Deploy (배포 단계)", "흐름: 도커 앱 업데이트 (코드 수정 → 재빌드 → 재배포)"], "confusion": {"헷갈리는점": "이미지 vs 컨테이너", "차이": "이미지 = 멈춰 있는 포장 결과물(실행 안 됨) / 컨테이너 = 그 이미지로 켠, 지금 돌아가는 프로그램", "기억법": "이미지 = 밀키트 상자, 컨테이너 = 조리 중인 요리. 상자 하나로 요리 여러 번 가능"}, "kakao_chat": "A: 이미지랑 컨테이너가 뭐가 달라?\nB: 둘 다 도커 아니야?\nA: 이미지는 포장된 밀키트 상자고, 컨테이너는 그걸 뜯어서 조리 중인 요리야\n   서버에서 실제로 손님 받는 건 컨테이너야\nB: 새 이미지 만들면 컨테이너도 알아서 바뀌어?\nA: 아니! 이미 조리 중인 요리는 그대로야. 옛 컨테이너 끄고 새 이미지로 다시 켜야 해\nB: 컨테이너 끄면 명부 데이터 날아가는 거 아니야?\nA: 그래서 데이터는 '볼륨'이라는 바깥 창고에 둬. 컨테이너를 새로 만들어도 남아 있어", "added": "2026-10-26", "source": "대화 2026-10-26 — '빌드가 뭐야 / 도커 이미지는 사진이랑 다른 거야?' 질문", "flow": ["① 도커 이미지(상자) 준비", "② docker run — 이미지로 컨테이너 켜기(조리 시작)", "③ 실행 중 — 사용자 요청을 받음 (docker ps로 확인)", "④ docker stop — 끄기 (다시 켜면 같은 내용 그대로)", "⑤ docker rm — 지우기: 안에서 바뀐 내용은 사라지고, 볼륨의 데이터는 남음"]}, {"id": "term_171", "term": "Dockerfile (도커파일)", "term_en": "Dockerfile", "category": "Infra", "definition": "도커 이미지를 어떻게 만들지 순서대로 적어 둔 설계도(레시피) 파일.", "one_line": "docker build가 위에서부터 한 줄씩 읽어 이미지를 포장하는 레시피", "detail": "Dockerfile 한 줄이 포장 작업 한 단계다. 자주 나오는 명령: FROM = 기본 상자(베이스 이미지) 가져오기, WORKDIR = 작업할 폴더 정하기, COPY = 파일 담기, RUN = 포장하면서 명령 실행(부품 설치 등), ENV = 설정값 적기, EXPOSE = 쓰는 문 번호(포트) 표시, CMD = 컨테이너가 켜질 때 실행할 명령.\n\nDockerfile을 고쳐도(예: FROM 버전 변경) 이미 만든 이미지와 켜져 있는 컨테이너는 그대로다. 다시 빌드하고 다시 배포해야 반영된다.", "flow": ["① FROM node:22-alpine — Node(실행 엔진)가 든 기본 상자 가져오기", "② COPY package.json + RUN npm install — 부품 목록을 넣고 부품(Express 등) 설치", "③ COPY server.js / public — 우리가 쓴 코드와 화면 파일 담기", "④ ENV / EXPOSE 3001 — 설정값과 문 번호 적기", "⑤ CMD node server.js — 켜질 때 실행할 명령 지정", "⑥ docker build → 위 단계를 차례로 실행해 이미지 완성"], "examples": ["[우리 서버 실제 사례] 위 흐름은 명부 서명 사이트 첫 버전(10/19) Dockerfile 그대로다", "[우리 서버 실제 사례] 10/23 보강판에서 FROM을 node:24-alpine으로 바꿈(보안 수정된 Node) → 이 한 줄도 재빌드·재배포해야 서버에 반영됨"], "related": ["도커 이미지 (Docker Image)", "Docker", "Build (빌드 단계)", "컨테이너 (Container)"], "confusion": {"헷갈리는점": "Dockerfile vs docker-compose.yml", "차이": "Dockerfile = 상자 하나를 어떻게 포장할지(이미지 만드는 법) / docker-compose.yml = 상자 여러 개를 어떻게 함께 켤지(포트·볼륨·재시작 규칙) 적은 운영표", "기억법": "Dockerfile = 레시피, compose = 식탁 차림표"}, "kakao_chat": "A: Dockerfile이 뭐야?\nB: 도커 설정 파일?\nA: 맞아, 이미지를 어떻게 포장할지 적은 레시피야\n   'Node 상자 가져와 → 부품 설치해 → 코드 담아 → 켜질 때 이거 실행해' 이런 순서로 적혀 있어\nB: 이 파일 고치면 바로 서버에 반영돼?\nA: 아니! 레시피를 고친 것뿐이야. 다시 포장(빌드)하고 식탁에 다시 올려야(배포) 반영돼", "added": "2026-10-26", "source": "대화 2026-10-26 — '빌드가 뭐야 / 도커 이미지는 사진이랑 다른 거야?' 질문"}, {"id": "term_172", "term": "흐름: 도커 앱 업데이트 (코드 수정 → 재빌드 → 재배포)", "term_en": "Flow:   document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.k; render(); });
}
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll(".chip").forEach(b => {
    const on = b.dataset.k===cur; b.classList.toggle("on",on);
    b.style.background = on ? (cur==='ALL'?'var(--accent)':col(cur)) : "#fff";
  });
  const list = terms.filter(t => (cur==="ALL"||t._cat===cur) && (!q || t._search.includes(q)))
    .sort((a,b)=>a.term.localeCompare(b.term,"ko"));
  document.getElementById("count").textContent = `${list.length}개 표시 중`;
  document.getElementById("grid").innerHTML = list.length ? list.map(t => `
    <div class="card" style="--c:${col(t._cat)}" data-id="${t.id}">
      <div class="cat">${CATS[t._cat]}</div>
      <h3>${esc(t.term)}</h3>
      ${t._en && !t.term.includes(t._en) ? `<div class="en">${esc(t._en)}</div>` : ""}
      <div class="def">${esc(t._def)}</div>
    </div>`).join("") : `<div class="empty">검색 결과가 없어요 🔍</div>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => openT(c.dataset.id));
}
function val(v){
  if (v==null) return "";
  if (typeof v === "string") return `<div class="txt">${esc(v)}</div>`;
  if (Array.isArray(v)) return `<ul class="li">${v.map(x=>`<li>${typeof x==="object"?esc(Object.values(x).join(" — ")):esc(x)}</li>`).join("")}</ul>`;
  if (typeof v === "object") return `<div class="kv">${Object.entries(v).map(([k,x])=>
    `<div><b>${esc(k)}</b> : ${typeof x==="object"?(Array.isArray(x)?esc(x.join(", ")):Object.entries(x).map(([a,b])=>`${esc(a)}: ${esc(typeof b==='object'?JSON.stringify(b):b)}`).join(" · ")):esc(x)}</div>`).join("")}</div>`;
  return `<div class="txt">${esc(v)}</div>`;
}
function chat(s){
  return `<div class="chat">${s.split("\n").reduce((acc,line)=>{
    const m = line.match(/^\s*([AB])\s*[:：]\s*(.*)$/);
    if (m) acc.push({w:m[1],t:m[2]}); else if (acc.length) acc[acc.length-1].t += "\n"+line.trim();
    return acc;},[]).map(b=>`<div class="who ${b.w}">${b.w==="A"?"설명자":"초보자"}</div><div class="bub ${b.w}">${esc(b.t)}</div>`).join("")}</div>`;
}
function openT(id){
  const t = terms.find(x=>x.id===id); if(!t) return;
  let h = `<button class="x" onclick="closeM()">✕</button>
    <div class="cat">${CATS[t._cat]}</div><h2>${esc(t.term)}</h2>
    ${t._en && !t.term.includes(t._en) ? `<div class="en">${esc(t._en)}</div>`:""}
    ${t._def?`<div class="oneline">${esc(t._def)}</div>`:""}`;
  const order = ["detail","description","easy_description","analogy","why","why_important","structure","step_by_step","phases","five_pillars","types","examples","real_world_examples","example_scenario","tools","vs_devops","llm_specific_challenges","difficulty","difficulty_map","key_insight","config_example","note"];
  const keys = [...order.filter(k=>k in t), ...Object.keys(t).filter(k=>!SKIP.has(k)&&!k.startsWith("_")&&!order.includes(k))];
  keys.forEach(k => { if (t[k]!=null && t[k]!=="") h += `<div class="sec"><h4>${LABEL[k]||k}</h4>${val(t[k])}</div>`; });
  if (t.flow && t.flow.length) {
    const f = Array.isArray(t.flow)?t.flow:String(t.flow).split(/→|\n/).map(s=>s.trim()).filter(Boolean);
    h += `<div class="sec"><h4>🔁 흐름</h4><div class="flow">${f.map(s=>`<span>${esc(s)}</span>`).join("<i>→</i>")}</div></div>`;
  }
  if (t.confusion) {
    h += `<div class="sec"><h4>⚠️ 헷갈리는 포인트</h4><div class="conf">${typeof t.confusion==="object"
      ? Object.entries(t.confusion).map(([k,v])=>`<div><b>${esc(k)}</b> · ${esc(v)}</div>`).join("") : esc(t.confusion)}</div></div>`;
  }
  if (t.related && t.related.length) {
    h += `<div class="sec"><h4>🔗 관련 용어</h4><div class="rel">${t.related.map(r=>{
      const hit = nameIdx[String(r).toLowerCase()] || nameIdx[String(r).replace(/\s*\(.*\)\s*/,"").toLowerCase()];
      return hit && hit.id!==t.id ? `<a onclick="openT('${hit.id}')">${esc(r)}</a>` : `<a class="off">${esc(r)}</a>`;
    }).join("")}</div></div>`;
  }
  if (t.kakao_chat) h += `<div class="sec"><h4>💬 대화로 이해하기</h4>${chat(t.kakao_chat)}</div>`;
  const d = t.added || t.saved_date; if (d) h += `<div class="foot">추가일 ${esc(d)}</div>`;
  const md = document.getElementById("md"); md.innerHTML = h; md.style.setProperty("--c", col(t._cat));
  const ov = document.getElementById("ov"); ov.classList.add("show"); ov.scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeM(){ document.getElementById("ov").classList.remove("show"); document.body.style.overflow = ""; }
document.getElementById("ov").onclick = e => { if (e.target.id==="ov") closeM(); };
document.addEventListener("keydown", e => { if (e.key==="Escape") closeM(); });
document.getElementById("q").oninput = render;
renderStats(); render();
</script>
</body>
</html>
