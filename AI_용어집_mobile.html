는 사람이 판단하는 게 라이프루프야\nB: 아 AI가 알아서 개선하다가 기준 충족하면 멈추는 거구나\nA: 맞아! 루프 엔지니어링의 실전 버전이야"}, {"id": "term_099", "term": "흐름: Google OAuth 인증", "english": "Flow: Google OAuth", "category": "Dev", "one_line": "로그인 버튼 → Google 인증 → 토큰 발급 → 권한 확인 → 서비스 접근", "flow": ["① 사용자 → '구글로 로그인' 버튼 클릭", "② 서버 → Google OAuth URL로 리다이렉트", "③ Google 로그인 페이지 → 사용자 구글 계정 인증", "④ Google → 서버에 인증 코드 전달 (callback)", "⑤ 서버 → Google에 코드로 액세스 토큰 교환", "⑥ 서버 → 이메일·프로필 정보 수신", "⑦ 서버 → 화이트리스트 확인 (동아리원 여부)", "⑧ 통과 → 세션 발급 → 발표자료 접근 허용", "⑨ 실패 → 접근 거부 페이지로 리다이렉트"], "example_scenario": "동아리 홈페이지: 구글 로그인 → 이메일 확인 → 동아리원이면 발표자료 열람 허용", "related": ["백엔드 인증", "리다이렉트", "세션", "API", "백엔드 처리"], "saved_date": "2026-10-09", "kakao_chat": "A: Google OAuth 인증 흐름이 어떻게 돼?\nB: 구글로 로그인 버튼 누르면 되는 거 아니야?\nA: 버튼 뒤에 단계가 많아!\n   버튼 클릭 → Google 로그인 페이지로 리다이렉트 → 구글 계정 인증 → 서버에 코드 전달이야\nB: 코드가 뭐야?\nA: Google이 인증 성공했다는 증거로 서버에 코드 보내줘\n   서버가 그 코드로 Google에게 액세스 토큰 교환 요청해\nB: 그다음이 로그인 완료야?\nA: 아직! 토큰으로 이메일·프로필 받아서, 화이트리스트 확인하고, 통과하면 세션 발급해\n   그래야 로그인 완료야\nB: 아 구글이 인증하지만 우리 서버가 최종 권한 결정하는 거구나\nA: 맞아! 구글 인증은 신원 확인, 화이트리스트 확인은 우리 서버가 하는 거야"}, {"id": "term_100", "term": "Credentials (크리덴셜)", "english": "Credentials", "category": "Dev", "one_line": "시스템·서비스에 접근할 수 있는 인증 정보 — 아이디·비밀번호·토큰·키 등", "description": "Credentials는 '내가 이 서비스를 사용할 권한이 있다'는 것을 증명하는 모든 인증 정보를 말한다. 사람의 신분증과 같은 역할이며, 유출되면 보안 사고로 이어지기 때문에 절대 코드에 직접 넣지 않고 환경변수(.env)나 비밀 저장소(Secret Manager)에 보관한다.", "examples": ["Google OAuth Client ID + Client Secret = Credentials", "GitHub Personal Access Token = Credentials", "DB 접속 정보 (host, port, username, password) = Credentials", "API Key (OpenAI, Notion 등) = Credentials", "n8n에서 서비스 연결 시 입력하는 인증 정보 = Credentials"], "confusion": {"헷갈리는점": "Credentials를 단순히 '비밀번호'로만 이해하는 경우", "정확한의미": "비밀번호뿐 아니라 토큰·API 키·인증서·OAuth 정보 등 접근 권한을 증명하는 모든 것", "주의사항": "코드에 직접 쓰면 GitHub에 올릴 때 유출 위험 → .env 파일에 보관 + .gitignore 처리 필수", "기억법": "신분증(ID) + 열쇠(Key) 묶음 — 이게 있어야 문이 열린다"}, "flow": ["① 서비스 가입 → Credentials 발급 (API Key, Client ID/Secret)", "② .env 파일에 저장 (코드에 직접 X)", "③ .gitignore에 .env 추가 → GitHub 업로드 차단", "④ 서버에서 환경변수로 읽어 사용", "⑤ 유출 시 → 즉시 재발급·폐기"], "related": ["백엔드 인증", "Google OAuth", "API", "환경변수", "보안"], "saved_date": "2026-10-09", "kakao_chat": "A: Credentials(크리덴셜)이 그냥 비밀번호야?\nB: 영어로 자격증명 아니야?\nA: 더 넓은 개념이야. 비밀번호뿐 아니라 API Key, OAuth 토큰, 인증서까지\n   접근 권한을 증명하는 모든 것이 Credentials이야\nB: 왜 이걸 따로 관리해?\nA: 코드에 직접 쓰면 GitHub에 올렸을 때 유출될 수 있어\n   .env 파일에 보관하고 .gitignore에 추가해서 Git에 올라가지 않게 해야 해\nB: 유출되면 어떡해?\nA: 즉시 재발급·폐기해야 해! 누군가 내 API Key 갖고 있으면 대신 요청 할 수 있어\n   신분증+열쇠 묶음 — 이게 있으면 문 열린다고 기억해"}, {"id": "term_101", "term": "URI (Uniform Resource Identifier)", "english": "Uniform Resource Identifier", "category": "Dev", "one_line": "인터넷에서 자원(페이지·파일·API)을 식별하는 고유한 주소 형식", "description": "URI는 인터넷상의 모든 자원에 고유한 이름을 붙이는 체계다. URL이 URI의 일종이다. URI는 '이 자원이 무엇인가'를 식별하고, URL은 '이 자원이 어디 있는가'까지 포함한다. 실무에서는 URL과 URI를 거의 같은 의미로 사용한다.", "examples": ["https://axis-is.kr/slides — URI이자 URL", "http://168.231.118.60:3000/auth/google/callback — Google OAuth 리디렉션 URI", "mailto:kchmok@sungkyul.ac.kr — URI지만 URL은 아님 (위치가 아닌 식별자)", "API endpoint: /api/users/123 — URI로 특정 사용자 자원 식별"], "confusion": {"헷갈리는점": "URI와 URL을 다른 것으로 구분하려다 혼란", "차이": "URL ⊂ URI — URL은 URI의 하위 개념. 실무에서는 거의 같은 의미로 사용", "기억법": "URI = 이름표 / URL = 이름표 + 주소까지 포함"}, "related": ["URL", "리디렉션", "API", "프로토콜"], "saved_date": "2026-10-09", "flow": ["① 리소스 식별 필요", "② URI 구조 설계(scheme://host/path?query)", "③ 클라이언트가 URI로 요청", "④ 서버가 URI 파싱 → 해당 리소스 반환"], "kakao_chat": "A: URI랑 URL이 다른 거야?\nB: 그냥 같은 거 아니야?\nA: URL이 URI 안에 포함돼! URI = 리소스 식별자 전체 개념, URL = 주소 포함한 식별자\nB: 그럼 URL이 더 좁은 개념이야?\nA: 맞아. URL ⊂ URI야\n   'https://example.com/page' 이게 URL이고 URN(이름만 있는 것) 같은 것도 URI에 포함돼\nB: 실무에서 구분해서 써야 해?\nA: 실무에서는 거의 같은 의미로 써. 큰 차이 없어\n   URI = 이름표 / URL = 이름표 + 주소까지 포함이라고 기억해\n   scheme://host/path?query 이 구조가 URI/URL 기본 형태야"}, {"id": "term_102", "term": "리디렉션 (Redirection)", "english": "Redirection", "category": "Dev", "one_line": "사용자를 A 주소에서 B 주소로 자동으로 이동시키는 것", "description": "리디렉션은 특정 U le 인증 URL로 이동 (redirect_uri 파라미터 포함)", "④ Google → 인증 완료 → 등록된 Redirect URI로 코드 전달", "⑤ 서버 → 코드 수신 → 토큰 교환 → 로그인 완료"], "related": ["URI", "리디렉션", "Google OAuth", "Credentials", "백엔드 인증"], "saved_date": "2026-10-09", "kakao_chat": "A: Redirect URI가 뭔지 알아? OAuth에서 나오는 거\nB: 리디렉션 주소?\nA: 맞아! Google OAuth 인증 후 코드를 받을 서버 주소야\n   Google 콘솔에 사전 등록해둔 주소로만 콜백이 와\nB: 왜 미리 등록해야 해?\nA: 보안 때문이야. 악의적인 사이트가 우리 Client ID 훔쳐서\n   자기 주소를 Redirect URI로 쓰면 인증 코드를 탈취할 수 있어\n   등록된 주소로만 보내게 해서 막는 거야\nB: IP 주소로 등록하면 안 돼?\nA: Google OAuth는 공개 도메인만 허용해. localhost는 개발용으로 예외야\n   초대장에 적힌 주소 = Redirect URI — 주소 다르면 입장 불가"}, {"id": "term_104", "term": "프록시 (Proxy)", "english": "Proxy", "category": "Infra", "one_line": "클라이언트와 서버 사이에서 요청·응답을 대신 전달하는 중간 서버", "description": "프록시는 클라이언트(브라우저)와 실제 서버 사이에 위치해 요청을 대신 처리하는 중간자다. 보안·캐싱·로드밸런싱·SSL 처리 등을 담당한다. nginx가 대표적인 리버스 프록시로, 외부 요청을 받아 내부 AP 서버로 전달한다.", "examples": ["nginx → Node.js 서버로 요청 전달 = 리버스 프록시", "회사 방화벽 → 직원 인터넷 요청 대신 처리 = 포워드 프록시", "axis.axmaster.cloud:80 → 내부 3000포트로 전달 = 프록시 라우팅", "CDN = 전 세계에 분산된 프록시 서버 네트워크"], "confusion": {"헷갈리는점": "포워드 프록시 vs 리버스 프록시 혼동", "차이": "포워드 = 클라이언트 앞에서 외부 요청 대리 / 리버스 = 서버 앞에서 외부 요청 수신", "기억법": "리버스 프록시 = 서버 쪽 대문지기 — 밖에서 오는 손님(요청)을 안쪽 방(서버)으로 안내"}, "related": ["프록시 라우팅", "nginx", "서버 3단 구조", "캐싱"], "saved_date": "2026-10-09", "flow": ["① 클라이언트가 프록시에 요청 전송", "② 프록시가 실제 서버에 대신 요청", "③ 서버 응답 → 프록시 수신", "④ 프록시가 클라이언트에 응답 전달"], "kakao_chat": "A: 프록시가 뭔지 알아?\nB: VPN 같은 거?\nA: 비슷한 개념! 클라이언트와 서버 사이에서 중간 대리인 역할하는 거야\nB: 왜 직접 연결 안 해?\nA: 여러 이유가 있어. 보안(IP 숨기기), 캐싱(자주 쓰는 데이터 캐시), 접근 제어 같은 거야\nB: 포워드 프록시랑 리버스 프록시 차이가 뭐야?\nA: 포워드 = 클라이언트 앞에서 외부 요청 대리 (내 IP 숨기기)\n   리버스 = 서버 앞에 서서 외부 요청 수신 (서버 숨기기, nginx 같은 것)\nB: 아 nginx가 리버스 프록시구나\nA: 맞아! 리버스 프록시 = 서버 쪽 대문지기야"}, {"id": "term_105", "term": "프록시 라우팅 (Proxy Routing)", "english": "Proxy Routing", "category": "Infra", "one_line": "도메인·경로에 따라 요청을 알맞은 내부 서버로 전달하는 nginx 설정", "description": "프록시 라우팅은 하나의 도메인으로 들어오는 요청을 경로나 서브도메인에 따라 다른 내부 서버(포트)로 보내는 설정이다. axmaster.cloud(녹음기)와 axis.axmaster.cloud(동아리 홈페이지)를 같은 VPS에서 분리 운영할 수 있는 원리다.", "examples": ["axis.axmaster.cloud → 내부 localhost:3000 (동아리 홈페이지)", "axmaster.cloud → 내부 localhost:8000 (녹음기 서비스)", "axmaster.cloud/api → 내부 localhost:4000 (API 서버)", "nginx 설정: proxy_pass http://localhost:3000"], "flow": ["① 브라우저 → axis.axmaster.cloud 접속", "② DNS → VPS IP(168.231.118.60) 반환", "③ nginx(80/443포트) 수신", "④ server_name axis.axmaster.cloud 블록 매칭", "⑤ proxy_pass → localhost:3000으로 전달", "⑥ Node.js 서버 처리 → 응답 반환", "⑦ nginx → 브라우저에 응답 전달"], "related": ["프록시", "nginx", "라우팅", "서버 3단 구조", "도메인"], "saved_date": "2026-10-09", "confusion": {"헷갈리는점": "프록시 라우팅을 DNS와 혼동", "차이": "DNS = 도메인→IP 변환 / 프록시 라우팅 = IP에 도달한 후 어느 서버(포트)로 전달할지 결정", "기억법": "DNS = 주소 찾기 / 프록시 라우팅 = 주소 찾은 후 어느 방으로 안내할지"}, "kakao_chat": "A: 프록시 라우팅이 DNS랑 어떻게 달라?\nB: 둘 다 어디로 보낼지 결정하는 거 아니야?\nA: 달라! DNS는 도메인→IP 변환이야 — 주소 찾기\n   프록시 라우팅은 IP에 도달한 후 어느 서버(포트)로 보낼지 결정이야\nB: 예를 들어줘\nA: axis.axmaster.cloud 접속하면\n   DNS가 IP(168.231.118.60) 알려주고\n   그 IP에서 nginx가 어느 포트로 전달할지 결정해 — 이게 프록시 라우팅이야\nB: 아 주소 찾기는 DNS, 집 안에서 방 찾기는 프록시 라우팅이네\nA: 딱 맞아! DNS = 주소 찾기 / 프록시 라우팅 = 어느 방으로 안내할지야"}, {"id": "term_106", "term": "쿠키 (Cookie)", "english": "Cookie", "category": "Dev", "one_line": "서버가 브라우저에 저장시키는 작은 데이터 — 로그인 상태·설정 등을 기억하는 데 사용", "description": "쿠키는 서버가 브라우저에 '이것 기억해줘'라고 저장시키는 작은 텍스트 데이터다. 브라우저는 같은 서버에 요청할 때마다 쿠키를 자동으로 함께 보낸다. 로그인 세션 유지, 장바구니 기억, 사용자 설정 저장 등에 사용된다.", "examples": ["로그인 후 브라우저 닫았다 열어도 로그인 유지 = 쿠키에 세션 ID 저장", "쇼핑몰 장바구니 — 로그인 안 해도 담긴 것 기억 = 쿠키", "Google Analytics — 방문자 추적에 쿠키 사용", "AX:IS 홈페이지: 로그인 → 서버가 세션 ID를 쿠키로 발급 → 이후 요청마다 자동 전송"], "confusion": {"헷갈리는점": "쿠키(Cookie)와 세션(Session)을 같은 것으로 혼동", "차이": "쿠키 = 브라우저에 저장 (클라이언트) / 세션 = 서버에 저장. 쿠키에 세션ID를 담아 연결", "보안": "HttpOnly 쿠키 = JS로 접근 불가(XSS 방어) / Secure 쿠키 = HTTPS에서만 전송", "기억법": "쿠키 = 도서관 대출증 — 내가 들고 다니며 매번 제시 / 세션 = 도서관 대출 기록 — 서버가 보관"}, "related": ["세션", "백엔드 인증", "Google OAuth", "리다이렉트"], "saved_date": "2026-10-09", "flow": ["① 사용자 로그인 → 서버가 세션 생성", "② 서버가 Set-Cookie 헤더로 세션ID 전달", "③ 브라우저가 쿠키 저장", "④ 이후 요청마다 Cookie 헤더에 자동 포함", "⑤ 서버가 쿠키의 세션ID로 사용자 확인"], "kakao_chat": "A: 쿠키랑 세션이 헷갈려\nB: 그냥 로그인 유지하는 거 아니야?\nA: 둘 다 로그인 상태 유지에 쓰이지만 저장 위치가 달라\n   쿠키 = 브라우저에 저장 / 세션 = 서버에 저장\nB: 어떻게 연결돼?\nA: 로그인하면 서버가 세션 만들고, 세션ID를 쿠키에 담아서 브라우저에 보내\n   이후 요청마다 쿠키에 담긴 세션ID 자동으로 서버에 전달해서 신원 확인해\nB: 쿠키가 위험하지 않아?\nA: HttpOnly 쿠키는 JS로 접근 못 해서 XSS 공격 방어하고\n   Secure 쿠키는 HTTPS에서만 전송돼\n   쿠키 = 대출증 (내가 들고 다님) / 세션 = 대출 기록 (도서관이 보관)"}, {"id": "term_107", "term": "nginx", "english": "nginx (Engine-X)", "category": "Infra", "one_line": "고성능 웹서버이자 리버스 프록시 — 외부 요청을 받아 내부 서버로 전달하는 대문지기", "description": "nginx(엔진엑스)는 웹서버·리버스 프록시·로드밸런서 역할을 하는 오픈소스 소프트웨어다. Apache보다 가볍고 빠르며 동시 접속 처리 성능이 뛰어나다. 현재 전 세계 웹서버 점유율 1위. VPS에서 80/443 포트로 외부 요청을 받아 내부 Node.js·Python 서버로 전달하는 역할을 한다.", "examples": ["axis.axmaster.cloud:80 → nginx 수신 → localhost:3000(Node.js)으로 전달", "HTTPS 인증서(SSL) 처리 — nginx가 담당하고 내부 서버는 HTTP만 써도 됨", "여러 도메인을 하나의 VPS에서 운영 — nginx가 도메인별로 분리 처리", "정적 파일(이미지·CSS·JS) 직접 서빙 — AP서버 부하 감소"], "confusion": {"헷갈리는점": "nginx를 단순 웹서버로만 이해하는 경우", "정확한의미": "웹서버 + 리버스 프록시 + 로드밸런서 + SSL 처리까지 담당하는 만능 대문지기", "vs_apache": "Apache = 요청당 프로세스 생성(무거움) / nginx = 이벤트 기반(가볍고 빠름)", "기억법": "nginx = VPS의 대문지기 — 모든 외부 요청이 nginx를 먼저 통과"}, "config_example": {"설명": "axis.axmaster.cloud를 localhost:3000으로 프록시 라우팅하는 nginx 설정", "code": "\nserver {\n    listen 80;\n    server_name axis.axmaster.cloud;\n\n    location / {\n        proxy_pass http://localhost:3000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n}\n"}, "flow": ["① 브라우저 → axis.axmaster.cloud:80 요청", "② nginx → server_name 매칭", "③ proxy_pass → localhost:3000으로 전달", "④ Node.js 처리 → 응답 반환", "⑤ nginx → 브라우저에 응답 전달"], "related": ["프록시", "프록시 라우팅", "서버 3단 구조", "AP 서버", "DevOps"], "saved_date": "2026-10-09", "easy_description": {"한줄요약": "아파트 경비원 — 모든 방문객(요청)이 경비실(nginx)을 먼저 거치고, 경비원이 '몇 호(포트)로 가세요'라고 안내", "왜필요한가": "서버 포트는 숫자(3000, 8000 등)인데 사람들은 'axis.axmaster.cloud'같은 주소를 씀. nginx가 이 주소를 보고 알맞은 포트로 연결해줌", "없으면어떻게되나": "axis.axmaster.cloud:3000처럼 포트번호를 직접 입력해야 함 → 불편하고 비전문적", "비유_3가지": {"경비원": "아파트 경비실 — 방문객이 오면 '몇 호 가세요?' 안내", "전화교환원": "회사 대표번호로 전화하면 교환원이 담당 부서로 연결", "호텔프런트": "호텔 입구 프런트 — 손님 맞이 후 알맞은 객실(서버)로 안내"}}, "step_by_step": {"1_외부에서_보이는것": "axis.axmaster.cloud (포트 없음, 깔끔)", "2_실제_작동": "nginx가 80번 포트에서 대기 중 → 요청 수신", "3_nginx가_하는일": "이 주소는 동아리 홈페이지네 → 3000번 포트로 보내줌", "4_내부서버": "Node.js(3000번)가 실제 처리", "5_결과반환": "nginx가 받아서 브라우저에 전달"}, "real_world_examples": ["카카오톡 서버 — 수억 명 요청을 nginx가 먼저 받아 분산", "네이버 — 뉴스/쇼핑/블로그 등 서비스별로 다른 서버에 nginx가 라우팅", "우리 VPS — axmaster.cloud(녹음기)와 axis.axmaster.cloud(동아리)를 nginx가 분리"], "kakao_chat": "A: nginx가 뭐야? 웹서버?\nB: 아파치랑 비슷한 거?\nA: 맞아! 웹서버인데 리버스 프록시, 로드밸런서, SSL 처리까지 다 해\n   VPS의 대문지기야 — 모든 외부 요청이 nginx 먼저 통과해\nB: 아파치랑 뭐가 달라?\nA: Apache = 요청당 프로세스 생성해서 무거워\n   nginx = 이벤트 기반 처리라 가볍고 빠르고 동시 접속 잘 해\nB: nginx 설정은 어떻게 해?\nA: /etc/nginx/sites-available/ 에 설정 파일 만들어서\n   어떤 도메인이 오면 어느 포트로 전달할지 설정해\n   axis.axmaster.cloud 요청 → localhost:3000으로 전달 이런 식이야"}, {"id": "term_108", "term": "화면 목업 (Mockup)", "english": "Mockup / UI Mockup", "category": "Dev", "one_line": "실제 개발 전에 화면이 어떻게 보일지 시각적으로 미리 그려보는 설계 도구", "description": "목업은 실제 기능은 없지만 화면의 레이아웃·버튼·텍스트·색상 등을 실제처럼 표현한 시각적 설계물이다. 개발 전에 어떻게 만들지 합의하고, 수정 비용을 줄이기 위해 사용한다. 와이어프레임(뼈대) → 목업(디자인) → 프로토타입(인터랙션) 순서로 발전한다.", "examples": ["경매사이트 목업 — 상품 목록·입찰 버튼·가격 표시 위치를 HTML로 미리 그려봄", "피그마(Figma)로 로그인 화면 목업 제작 → 개발자에게 전달", "동아리 홈페이지 — 발표자료 카드 레이아웃을 목업으로 먼저 확인 후 개발", "종이에 손으로 그린 것도 목업 — 도구보다 '미리 그려보는 행위'가 핵심"], "confusion": {"헷갈리는점": "와이어프레임·목업·프로토타입을 혼동하는 경우", "차이": {"와이어프레임": "뼈대만 있는 스케치 — 레이아웃 위치만 표시, 색상/디자인 없음", "목업": "실제처럼 보이는 정적 화면 — 색상·폰트·이미지 포함, 클릭은 안 됨", "프로토타입": "클릭하면 반응하는 인터랙티브 목업 — 실제와 가장 유사"}, "기억법": "와이어프레임=집 설계도 / 목업=모델하우스 외관 / 프로토타입=실제 들어가볼 수 있는 모델하우스"}, "flow": ["① 기획 — 어떤 화면이 필요한지 목록 작성", "② 와이어프레임 — 레이아웃 위치만 스케치", "③ 목업 — 실제 디자인 적용한 정적 화면", "④ 프로토타입 — 클릭 가능한 인터랙티브 버전", "⑤ 개발 — 목업 기반으로 실제 구현", "⑥ QA — 목업과 실제 화면 비교 검수"], "tools": {"전문 도구": "Figma, Adobe XD, Sketch", "간단 도구": "PowerPoint, Canva, Notion", "코드 목업": "HTML/CSS로 직접 제작 (지금 하는 방식)"}, "related": ["프론트엔드", "UI/UX", "스펙", "기획"], "saved_date": "2026-10-10", "kakao_chat": "A: 화면 목업이 뭔지 알아?\nB: 디자인 시안 같은 거?\nA: 맞아! 실제처럼 보이는 정적 화면이야. 색상·폰트·이미지 다 있는데 클릭은 안 돼\nB: 와이어프레임이랑 다른 거야?\nA: 와이어프레임은 뼈대만 있어. 위치·구조만 박스와 선으로 표현하고 디자인 없어\n   목업은 실제처럼 보이는 정적 디자인이야\nB: 그럼 프로토타입은?\nA: 클릭하면 반응하는 인터랙티브 버전이야\n   와이어프레임=집 설계도 / 목업=모델하우스 외관 / 프로토타입=들어가볼 수 있는 모델하우스\nB: 순서가 있어?\nA: 와이어프레임 → 목업 → 프로토타입 → 개발 순서야"}, {"id": "term_109", "term": "와이어프레임 (Wireframe)", "english": "Wireframe", "category": "Dev", "one_line": "색상·디자인 없이 레이아웃과 구조만 표시한 화면 설계 뼈대", "description": "와이어프레임은 화면의 레이아웃·요소 위치·정보 구조만 표시한 스케치다. 색상·폰트·이미지 없이 박스와 선으로만 구성된다. 개발 전 가장 먼저 작성하며 '어디에 무엇을 배치할 것인가'를 결정한다.", "examples": ["경매사이트: 상단 검색바 위치, 상품 목록 그리드, 사이드바 필터 위치를 박스로 표시", "로그인 페이지: 이메일 입력칸·비번칸·버튼 위치만 선으로 스케치", "종이에 네모박스와 선으로 그린 것도 와이어프레임", "Figma 로우파이(Low-fi) 모드, Balsamiq — 대표 와이어프레임 도구"], "confusion": {"헷갈리는점": "와이어프레임을 목업과 혼동", "차이": "와이어프레임 = 뼈대(위치만) / 목업 = 실제처럼 보이는 디자인", "기억법": "집 설계도 — 방 위치만 있고 벽지·가구는 없음"}, "related": ["화면 목업", "프로토타입", "UI/UX", "스펙"], "saved_date": "2026-10-10", "flow": ["① 필요한 화면 목록 작성", "② 각 화면의 구성 요소 나열(헤더·버튼·목록 등)", "③ 위치와 크기만 박스·선으로 표현", "④ 팀과 공유·피드백", "⑤ 확정 후 목업으로 발전"], "kakao_chat": "A: 와이어프레임이 뭔지 알아?\nB: 와이어라서 선 그어놓은 거?\nA: 맞아! 뼈대만 있는 스케치야. 색상·디자인 없이 위치와 레이아웃만 표현해\nB: 언제 만들어?\nA: 개발 시작 전, 어떤 화면이 필요한지 구조만 잡을 때 만들어\n   빠르게 그릴 수 있어서 피드백도 빨리 받을 수 있어\nB: 목업이랑 뭐가 달라?\nA: 와이어프레임 = 집 설계도 (방 위치만, 벽지 없음)\n   목업 = 실제처럼 보이는 디자인 (색상·폰트 다 있음)\nB: 와이어프레임부터 시작하는 게 맞는 순서야?\nA: 맞아! 와이어프레임 → 목업 → 프로토타입 → 개발이야\n   처음부터 디자인하면 레이아웃 바꿀 때 다 다시 해야 해"}, {"id": "term_110", "term": "프로토타입 (Prototype)", "english": "Prototype", "category": "Dev", "one_line": "클릭하면 실제처럼 반응하는 인터랙티브 목업 — 개발 전 UX를 검증하는 단계", "description": "프로토타입은 실제 코드 없이 버튼 클릭·화면 전환·입력 등 사용자 흐름을 시뮬레이션할 수 있는 인터랙티브 설계물이다. 개발 전 UX 문제를 발견하고 수정하기 위해 사용한다. Figma의 링크 연결 기능이 대표적이다.", "examples": ["Figma에서 '로그인 버튼' 클릭 → '메인 화면'으로 이동하도록 연결 = 프로토타입", "경매사이트: 입찰 버튼 클릭 → 확인 팝업 → 완료 화면 흐름 시뮬레이션", "사용자 테스트 — 실제 사용자에게 프       <div class="def">${esc(t._def)}</div>
    </div>`).join("") : `<div class="empty">검색 결과가 없어요 🔍</div>`;
  document.querySelectorAll(".card").forEach(c => c.onclick = () => openT(c.dataset.id));
}
function val(v){
  if (v==null) return "";
  if (typeof v === "string") return `<div class="txt">${esc(v)}</div>`;
  if (Array.isArray(v)) return `<ul class="li">${v.map(x=>`<li>${typeof x==="object"?esc(Object.values(x).join(" — ")):esc(x)}</li>`).join("")}</ul>`;
  if (typeof v === "object") return `<div class="kv">${Object.entries(v).map(([k,x])=>
    `<div><b>${esc(k)}</b> : ${typeof x==="object"?(Array.isArray(x)?esc(x.join(", ")):Object.entries(x).map(([a,b])=>`${esc(a)}: ${esc(typeof b==='object'?JSON.stringify(b):b)}`).join(" · ")):esc(x)}</div>`).join("")}</div>`;
  return `<div class="txt">${esc(v)}</div>`;
}
function chat(s){
  return `<div class="chat">${s.split("\n").reduce((acc,line)=>{
    const m = line.match(/^\s*([AB])\s*[:：]\s*(.*)$/);
    if (m) acc.push({w:m[1],t:m[2]}); else if (acc.length) acc[acc.length-1].t += "\n"+line.trim();
    return acc;},[]).map(b=>`<div class="who ${b.w}">${b.w==="A"?"설명자":"초보자"}</div><div class="bub ${b.w}">${esc(b.t)}</div>`).join("")}</div>`;
}
function openT(id){
  const t = terms.find(x=>x.id===id); if(!t) return;
  let h = `<button class="x" onclick="closeM()">✕</button>
    <div class="cat">${CATS[t._cat]}</div><h2>${esc(t.term)}</h2>
    ${t._en && !t.term.includes(t._en) ? `<div class="en">${esc(t._en)}</div>`:""}
    ${t._def?`<div class="oneline">${esc(t._def)}</div>`:""}`;
  const order = ["detail","description","easy_description","analogy","why","why_important","structure","step_by_step","phases","five_pillars","types","examples","real_world_examples","example_scenario","tools","vs_devops","llm_specific_challenges","difficulty","difficulty_map","key_insight","config_example","note"];
  const keys = [...order.filter(k=>k in t), ...Object.keys(t).filter(k=>!SKIP.has(k)&&!k.startsWith("_")&&!order.includes(k))];
  keys.forEach(k => { if (t[k]!=null && t[k]!=="") h += `<div class="sec"><h4>${LABEL[k]||k}</h4>${val(t[k])}</div>`; });
  if (t.flow && t.flow.length) {
    const f = Array.isArray(t.flow)?t.flow:String(t.flow).split(/→|\n/).map(s=>s.trim()).filter(Boolean);
    h += `<div class="sec"><h4>🔁 흐름</h4><div class="flow">${f.map(s=>`<span>${esc(s)}</span>`).join("<i>→</i>")}</div></div>`;
  }
  if (t.confusion) {
    h += `<div class="sec"><h4>⚠️ 헷갈리는 포인트</h4><div class="conf">${typeof t.confusion==="object"
      ? Object.entries(t.confusion).map(([k,v])=>`<div><b>${esc(k)}</b> · ${esc(v)}</div>`).join("") : esc(t.confusion)}</div></div>`;
  }
  if (t.related && t.related.length) {
    h += `<div class="sec"><h4>🔗 관련 용어</h4><div class="rel">${t.related.map(r=>{
      const hit = nameIdx[String(r).toLowerCase()] || nameIdx[String(r).replace(/\s*\(.*\)\s*/,"").toLowerCase()];
      return hit && hit.id!==t.id ? `<a onclick="openT('${hit.id}')">${esc(r)}</a>` : `<a class="off">${esc(r)}</a>`;
    }).join("")}</div></div>`;
  }
  if (t.kakao_chat) h += `<div class="sec"><h4>💬 대화로 이해하기</h4>${chat(t.kakao_chat)}</div>`;
  const d = t.added || t.saved_date; if (d) h += `<div class="foot">추가일 ${esc(d)}</div>`;
  const md = document.getElementById("md"); md.innerHTML = h; md.style.setProperty("--c", col(t._cat));
  const ov = document.getElementById("ov"); ov.classList.add("show"); ov.scrollTop = 0;
  document.body.style.overflow = "hidden";
}
function closeM(){ document.getElementById("ov").classList.remove("show"); document.body.style.overflow = ""; }
document.getElementById("ov").onclick = e => { if (e.target.id==="ov") closeM(); };
document.addEventListener("keydown", e => { if (e.key==="Escape") closeM(); });
document.getElementById("q").oninput = render;
renderStats(); render();
</script>
