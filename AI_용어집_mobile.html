ss = 에이전트가 뭘 할 수 있는지 범위 정하고 통제하는 구조야\nB: 예를 들어?\nA: 에이전트에게 '웹 검색은 되는데 파일 삭제는 안 됨' 이런 권한 설정하는 게 하네스야\n   말 마구(馬具) — 말이 뛰어나도 마구 없으면 방향 못 잡듯이\n   AI도 하네스 없으면 통제 불능이야"}, {"id": "term_065", "term": "핑 (Ping)", "english": "Ping", "category": "Infra", "one_line": "특정 서버가 살아있는지, 응답 시간이 얼마나 걸리는지 확인하는 네트워크 명령어", "description": "Ping은 내 컴퓨터에서 특정 서버에 작은 신호를 보내고 돌아오는 시간을 측정한다. 서버가 응답하면 살아있는 것이고, 응답이 없으면 서버가 죽었거나 네트워크 문제가 있는 것이다. 단위는 ms(밀리초)이며 낮을수록 빠른 연결이다.", "examples": ["ping google.com → 응답시간 12ms = 구글 서버까지 12ms", "게임에서 '핑 높다' = 서버와의 응답시간이 느려 지연 발생", "ping 168.231.118.60 → VPS 서버 살아있는지 확인", "Request timeout = 서버가 응답 없음 (죽었거나 방화벽 차단)"], "confusion": {"헷갈리는점": "핑(Ping)을 단순 속도로만 이해하는 경우", "정확한의미": "Ping = 왕복 응답 시간(RTT, Round Trip Time) — 보내고 받기까지의 시간", "기억법": "잠수함 소나(음파 탐지) — 소리 보내고 메아리 돌아오는 시간 측정과 동일"}, "related": ["서버", "ISP", "IX", "네트워크"], "saved_date": "2026-10-09", "flow": ["① ping 명령 실행(ping google.com)", "② ICMP Echo Request 패킷 전송", "③ 대상 서버가 ICMP Echo Reply 반환", "④ 왕복 시간(RTT) 측정·출력", "⑤ 패킷 손실률 계산"], "kakao_chat": "A: 핑(Ping)이 뭔지 알아?\nB: 서버 응답 확인하는 거?\nA: 맞아! 특정 서버에 신호 보내고 돌아오는 시간 측정하는 거야\n   ping google.com 이런 식으로 써\nB: 그럼 ping이 낮을수록 좋은 거야?\nA: 응! ping이 낮다 = 응답이 빠르다 = 레이턴시 낮다는 뜻이야\n   게임에서 ping 낮아야 딜레이 없이 플레이 가능하잖아\nB: 정확히 뭘 측정하는 거야?\nA: RTT(Round Trip Time) = 패킷 보내고 받기까지 왕복 시간이야\n   잠수함 소나 비유 좋아 — 음파 보내고 메아리 돌아오는 시간 측정하는 것처럼"}, {"id": "term_066", "term": "캐싱 (Caching)", "english": "Caching", "category": "Infra", "one_line": "자주 쓰는 데이터를 빠른 저장소에 미리 저장해 두고 빠르게 꺼내 쓰는 기법", "description": "캐싱은 매번 DB나 서버에서 데이터를 가져오는 대신, 자주 쓰는 데이터를 메모리(RAM) 같은 빠른 저장소에 임시 저장해 두는 방식이다. 응답 속도를 크게 높이고 서버 부하를 줄인다. Redis가 대표적인 캐시 서버다.", "examples": ["네이버 메인 뉴스 — 매번 DB 조회하지 않고 1분마다 캐시 갱신", "브라우저 캐시 — 같은 이미지를 매번 다운받지 않고 로컬에 저장", "CDN — 전 세계 서버에 콘텐츠를 캐싱해 가까운 서버에서 빠르게 전달", "LLM 응답 캐싱 — 같은 질문이 반복되면 저장된 답변을 즉시 반환"], "confusion": {"헷갈리는점": "캐싱(Caching)과 스토리지(Storage)를 혼동하기 쉬움", "차이": "스토리지=영구 저장 / 캐시=임시 저장(빠른 접근용, 만료 시 삭제)", "기억법": "캐시 = 책상 위 메모지(빠르게 꺼냄, 임시) / 스토리지 = 서류 캐비넷(영구 보관)"}, "related": ["스토리지", "DB 서버", "CDN", "서버 3단 구조"], "saved_date": "2026-10-09", "flow": ["① 첫 요청: DB·서버에서 데이터 조회(느림)", "② 조회 결과를 캐시에 저장", "③ 두 번째 요청: 캐시에서 바로 반환(빠름)", "④ 캐시 만료 시 다시 원본에서 조회 후 캐시 갱신"], "kakao_chat": "A: 캐싱이 왜 중요해?\nB: 그냥 저장하는 거 아니야?\nA: 캐싱은 자주 쓰는 데이터를 빠른 곳에 미리 저장해두는 거야\n   DB까지 매번 갔다오면 느린데, 캐시에 있으면 바로 돌려줄 수 있어\nB: 영구 저장이랑 다른 거야?\nA: 달라! 캐시는 임시 저장이야. 만료되면 삭제돼\n   스토리지 = 서류 캐비넷(영구 보관) / 캐시 = 책상 위 메모지(빠르게 꺼냄, 임시)\nB: 그럼 언제 지워지는 거야?\nA: TTL(Time To Live) 설정해서 일정 시간 지나면 삭제해\n   그리고 데이터가 바뀌면 캐시도 지워야 해 — 이게 캐시 무효화 문제야\n   캐싱 전략 잘못하면 오래된 데이터 계속 보여주는 버그 생겨"}, {"id": "term_067", "term": "Git", "english": "Git", "category": "Dev", "one_line": "코드의 변경 이력을 추적하고 여러 사람이 협업할 수 있게 해주는 버전 관리 시스템", "description": "Git은 파일의 변경 이력을 저장하고, 이전 버전으로 돌아가거나 여러 사람이 동시에 작업할 수 있게 해주는 도구다. 내 컴퓨터(로컬)에서 작동한다. 코드뿐 아니라 모든 텍스트 파일의 버전 관리에 사용된다.", "examples": ["어제 작동하던 코드로 되돌리기 → git checkout", "기능 A와 기능 B를 동시에 개발 → 브랜치(branch) 분리", "'저장'이 아닌 '기록' — 언제 누가 무엇을 바꿨는지 모두 남음", "구글 Docs의 '수정 이력 보기'와 비슷한 개념"], "confusion": {"헷갈리는점": "Git과 GitHub을 같은 것으로 혼동하는 경우가 많음", "차이": "Git = 내 컴퓨터에서 돌아가는 버전 관리 도구 / GitHub = Git 저장소를 온라인에 올리는 서비스", "비유": "Git = 내 일기장 / GitHub = 일기장을 올려두는 클라우드"}, "related": ["GitHub", "워크트리", "브랜치", "버전 관리"], "saved_date": "2026-10-09", "flow": ["① git init — 레포지토리 생성", "② git add — 변경 파일 스테이징", "③ git commit — 스냅샷 저장", "④ git push — 원격 저장소 업로드", "⑤ git pull — 원격 변경사항 다운로드"], "kakao_chat": "A: Git이 뭔지 설명해봐\nB: GitHub 아니야?\nA: 달라! Git은 내 컴퓨터에서 돌아가는 버전 관리 도구야\n   GitHub는 Git 저장소를 온라인에 올리는 서비스고\nB: 버전 관리가 왜 필요해?\nA: 코드 수정하다가 잘못되면 이전 버전으로 돌아갈 수 있어\n   그리고 여러 명이 협업할 때 충돌 관리도 해줘\nB: 어떻게 쓰는 거야?\nA: git init으로 시작 → git add로 스테이징 → git commit으로 저장\n   git push하면 GitHub에 올리고, git pull로 받아와\n   Git = 내 일기장 / GitHub = 일기장 올리는 클라우드로 기억해"}, {"id": "term_068", "term": "GitHub", "english": "GitHub", "category": "Dev", "one_line": "Git 저장소를 온라인에 올려 협업·공유·배포할 수 있게 해주는 플랫폼", "description": "GitHub는 Git으로 관리하는 코드를 인터넷에 올려두고 여러 사람이 함께 작업할 수 있는 서비스다. 코드 공유·오픈소스·CI/CD 배포·GitHub Pages까지 지원한다. Microsoft가 2018년에 인수했다.", "examples": ["동아리 발표자료 올리기 → github.com/kchmok-art/axis-slides", "오픈소스 프로젝트 — React, Python, Linux 모두 GitHub에서 관리", "GitHub Pages — 코드를 올리면 자동으로 웹사이트로 서빙", "Pull Request — 내가 고친 코드를 메인 코드에 합쳐달라는 요청"], "confusion": {"헷갈리는점": "GitHub = Git이라고 오해 / GitLab·Bitbucket과 동일하게 봄", "차이": "Git(도구) ≠ GitHub(서비스) / GitHub·GitLab·Bitbucket은 모두 Git 기반 플랫폼이지만 별개 서비스", "기억법": "Git = 엔진 / GitHub = 엔진을 얹은 자동차(서비스)"}, "related": ["Git", "워크트리", "GitHub Pages", "CI/CD"], "saved_date": "2026-10-09", "flow": ["① 로컬에서 git push", "② GitHub 원격 레포에 코드 업로드", "③ PR(Pull Request) 생성", "④ 코드 리뷰·승인", "⑤ main 브랜치에 merge"], "kakao_chat": "A: GitHub이 Git이랑 어떻게 달라?\nB: 그냥 같은 거 아니야?\nA: 완전 달라! Git = 버전 관리 도구(내 컴퓨터에 설치) / GitHub = Git 저장소 호스팅 서비스(온라인)\n   Git이 엔진이면 GitHub는 엔진을 얹은 자동차야\nB: GitHub 없이 Git만 써도 돼?\nA: 응! 혼자 할 때는 로컬에서 git만 써도 충분해\n   GitHub는 여러 명 협업, 코드 공개, PR 리뷰 같은 게 편해서 쓰는 거야\nB: GitLab이나 Bitbucket도 같은 거야?\nA: Git 기반 플랫폼이라는 점은 같은데, 별개 서비스야\n   GitHub = 개인 개발자·오픈소스 강세 / GitLab = 기업 내부 CI/CD 강세야"}, {"id": "term_069", "term": "워크트리 (Worktree)", "english": "Git Worktree", "category": "Dev", "one_line": "하나의 Git 저장소에서 여러 브랜치를 동시에 다른 폴더에서 작업하는 Git 기능", "description": "Git Worktree는 하나의 저장소(.git)를 공유하면서 여러 브랜치를 각각 다른 폴더에 체크아웃해 동시에 작업할 수 있는 기능이다. 브랜치를 왔다갔다 전환할 필요 없이 여러 작업을 병렬로 진행할 수 있다. 멀티 AI 에이전트가 각자 독립된 작업 공간에서 동시에 개발할 때 활용된다.", "examples": ["기능 A 개발 중에 긴급 버그 수정 필요 → 워크트리로 별도 폴더에서 동시 작업", "AI 에이전트 3개가 각자 다른 기능을 병렬 개발 → 워크트리로 충돌 없이 분리", "git worktree add ../feature-b feature-b → feature-b 브랜치를 별도 폴더에 체크아웃", "멀티 에이전트 코딩의 핵심 인프라 — 에이전트마다 독립 작업 공간 제공"], "confusion": {"헷갈리는점": "브랜치(Branch)와 워크트리(Worktree)를 같은 개념으로 혼동", "차이": "브랜치 = 코드의 분기점(논리적 개념) / 워크트리 = 브랜치를 물리적으로 다른 폴더에 펼쳐놓은 것", "기억법": "브랜치 = 나무의 가지 / 워크트리 = 가지마다 별도 작업 책상을 놓은 것"}, "related": ["Git", "GitHub", "브랜치", "멀티 에이전트"], "saved_date": "2026-10-09", "flow": ["① git worktree add ../branch-folder branch명", "② 새 폴더에 브랜치 체크아웃", "③ 두 폴더 동시 작업", "④ git worktree remove로 제거"], "kakao_chat": "A: 워크트리 명령어 써봤어? git worktree\nB: 그게 뭐야? 처음 봐\nA: Git 저장소 하나에서 여러 브랜치를 동시에 다른 폴더에 펼쳐두는 거야\n   AI 에이전트로 병렬 작업할 때 특히 유용해\nB: 브랜치 여러 개 만들면 되는 거 아니야?\nA: 브랜치는 논리적 분기점이고, 워크트리는 그걸 물리적 폴더로 분리하는 거야\n   브랜치 전환 없이 두 폴더 동시에 열어서 작업할 수 있어\nB: 어떻게 써?\nA: git worktree add ../other-branch branch명 하면\n   ../other-branch 폴더에 그 브랜치 체크아웃 돼\n   브랜치=나무의 가지, 워크트리=가지마다 별도 책상 놓은 것"}, {"id": "term_070", "term": "DevOps", "english": "Development + Operations", "category": "Infra", "one_line": "개발(Dev)과 운영(Ops)을 합쳐 빠르게 배포하고 안정적으로 운영하는 문화·방법론", "description": "DevOps는 Dev(개발)+Ops(운영)의 합성어지만, 단순한 합성어를 넘어 훨씬 광범위한 개념이다.\n\nDevOps는 다음 5가지를 모두 포괄하는 방법론이자 기술이다:\n1. 문화 — 개발팀과 운영팀이 협력하는 조직 문화\n2. 자동화 — 반복 작업을 자동화해 속도와 품질을 높임\n3. 셰어링 — 잘된 점과 잘못된 점을 팀 전체가 공유\n4. 축적 — 공유된 경험과 지식을 쌓아 자산으로 만듦\n5. 측정 — 문제와 성과를 데이터로 측정해 판단의 근거로 삼음\n\n즉, 어떤 문제나 요구사항이 발생했을 때 — 문제를 잘 분석하고, 측정하고, 자동화하고, 잘못된 점과 잘된 점을 셰어링해서 축적하고 발전시키는 것이 DevOps의 본질이다.", "examples": ["코드 push → 자동 테스트 → 자동 빌드 → 자동 배포 (CI/CD 파이프라인)", "Docker — '내 컴퓨터에서는 됐는데' 문제 해결 → 어디서나 동일한 환경", "Netflix — DevOps로 하루 수백 번 배포, 수억 명 사용자 서비스 안정 유지", "쿠팡 배송 추적 — 실시간 업데이트를 무중단으로 배포하는 것도 DevOps", "GitHub Actions — 코드 올리면 자동으로 테스트·배포 실행", "Kubernetes — 수백 개 서버 컨테이너를 자동으로 관리·확장"], "confusion": {"헷갈리는점": "DevOps를 직군(역할)으로만 이해하는 경우", "정확한의미": "DevOps는 직군이기도 하지만 본질은 개발+운영을 통합하는 문화·철학", "기억법": "Dev(개발) + Ops(Operations=운영) = 경계를 없애는 것"}, "related": ["서버", "CI/CD", "Docker", "관제"], "saved_date": "2026-10-09", "phases": {"Plan": "기능 계획·이슈 관리 (Jira, Notion)", "Code": "개발 (Git, GitHub)", "Build": "코드 → 실행 가능한 패키지로 변환", "Test": "자동화 테스트 (Jest, pytest)", "Release": "배포 준비·승인", "Deploy": "서버에 자동 배포 (CI/CD)", "Operate": "서버 운영·스케일링 (Kubernetes, Docker)", "Monitor": "실시간 관제·알림 (Grafana, Datadog)"}, "tools": {"CI/CD": "GitHub Actions, Jenkins, GitLab CI", "컨테이너": "Docker, Kubernetes", "클라우드": "AWS, GCP, Azure, Hostinger VPS", "관제": "Grafana, Prometheus, Datadog", "코드관리": "Git, GitHub, GitLab"}, "why_important": "AI 서비스는 모델 업데이트·데이터 변경이 잦아 DevOps 없이는 운영 불가. AI 에이전트 배포·관제도 DevOps의 영역", "flow": ["① Plan — 기능 기획·이슈 등록(Jira)", "② Code — 개발·PR(GitHub)", "③ Build — 빌드 자동화(Webpack)", "④ Test — 자동 테스트(Jest·pytest)", "⑤ Release — 릴리즈 준비", "⑥ Deploy — 자동 배포(Docker·K8s)", "⑦ Operate — 운영(nginx·서버)", "⑧ Monitor — 관제(Grafana·Datadog)"], "five_pillars": {"1_문화": "개발팀과 운영팀이 사일로(벽) 없이 협력하는 조직 문화. '내 일 네 일' 구분 없이 함께 책임짐", "2_자동화": "빌드·테스트·배포·모니터링 등 반복 작업을 자동화. CI/CD, Docker, GitHub Actions 등 활용", "3_셰어링": "잘된 것·잘못된 것·배운 것을 팀 전체와 공유. 회고(Retrospective), 문서화, 지식 공유", "4_축적": "셰어링된 경험이 조직의 자산으로 쌓임. 위키, 런북(Runbook), 지식베이스 형태로 저장", "5_측정": "감이 아닌 데이터로 판단. 배포 빈도, 장애 복구 시간, 오류율 등을 수치로 측정"}, "last_updated": "2026-10-13", "kakao_chat": "A: DevOps가 개발팀이야 운영팀이야?\nB: Dev랑 Ops 합쳤으니 둘 다?\nA: 직군이기도 하지만 본질은 개발+운영을 통합하는 문화·철학이야\n   개발자와 운영자 사이 벽을 허물고 협업하는 방식이지\nB: 왜 분리되어 있었어?\nA: 개발자는 빠르게 새 기능 만들고 싶고, 운영자는 안정성 원하잖아\n   이 충돌을 해결하려고 DevOps가 나온 거야 — 자동화로 빠르게 + 안정적으로\nB: CI/CD가 DevOps 도구야?\nA: 맞아! Plan→Code→Build→Test→Release→Deploy→Operate→Monitor 8단계 사이클이야\n   자동화로 이 사이클을 빠르게 돌리는 게 DevOps 목표야"}, {"id": "term_071", "term": "관제 (Monitoring & Control)", "english": "Monitoring & Control", "category": "Infra", "one_line": "시스템·서버·네트워크 상태를 실시간으로 감시하고 이상 발생 시 대응하는 활동", "description": "관제는 서버·네트워크·애플리케이션이 정상 작동하는지 24시간 모니터링하고, 장애·이상 징후 발생 시 알림을 받아 대응하는 활동이다. CPU·메모리·트래픽·에러율 등을 지표로 추적한다. AI 에이전트의 Observability(관측 가능성)와 동일한 개념이다.", "examples": ["서버 CPU 90% 초과 → 알림 발송 → 담당자 조치", "VPS 서버가 다운됐을 때 자동 감지 → 재시작", "라이프루프의 Observability = 관제와 동일 — AI가 잘 돌고 있는지 감시", "Grafana·Prometheus·Datadog — 대표적인 관제 도구"], "confusion": {"헷갈리는점": "관제(Monitoring)와 로깅(Logging)을 혼동", "차이": "로깅 = 일어난 일을 기록 / 관제 = 실시간으로 감시하고 이상 시 대응", "기억법": "CCTV(관제) vs 블랙박스(로깅) — CCTV는 실시간 감시, 블랙박스는 사후 기록"}, "related": ["DevOps", "서버", "루프 엔지니어링", "Observability"], "saved_date": "2026-10-09", "flow": ["① 서버·서비스 지표 수집", "② 실시간 대시보드 시각화", "③ 임계값 초과 → 알림", "④ 담당자 확인·분석", "⑤ 조치 후 정상화"], "kakao_chat": "A: 관제랑 모니터링이 같은 말 아니야?\nB: 나도 그렇게 생각했는데?\nA: 달라! 모니터링은 보기만 하는 거고\n   관제는 보기 + 판단 + 대응까지 포함하는 운영 체계야\nB: 구체적으로?\nA: CCTV로 비유하면\n   CCTV만 설치된 건 모니터링\n   보안 요원이 CCTV 보다가 이상하면 출동하는 게 관제야\nB: 아 로깅이랑도 다른 거야?\nA: 로깅 = 블랙박스 (사후 기록)\n   관제 = CCTV (실시간 감시+대응)\n   실시간으로 서비스 상태 보다가 임계값 넘으면 알림 받고 조치하는 게 관제야"}, {"id": "term_072", "term": "네트워크 (Network)", "english": "Network", "category": "Infra", "one_line": "컴퓨터·서버·기기들이 데이터를 주고받을 수 있도록 연결된 통신 체계", "description": "네트워크는 둘 이상의 기기가 데이터를 주고받을 수 있도록 연결된 구조다. 인터넷은 전 세계 네트워크가 연결된 거대한 네트워크다. 데이터는 패킷(packet) 단위로 쪼개져 전송되고 목적지에서 재조립된다.", "examples": ["집 WiFi = 로컬 네트워크 (LAN)", "인터넷 = 전 세계 네트워크의 네트워크 (WAN)", "VPS 서버가 인터넷에 연결되는 것 = 네트워크 설정", "핑(Ping)으로 네트워크 상태 확인 / 방화벽으로 네트워크 접근 제어"], "confusion": {"헷갈리는점": "네트워크=인터넷으로 오해", "차이": "인터넷은 네트워크의 일종 — 네트워크가 더 큰 개념 (LAN·WAN·인터넷 모두 네트워크)", "기억법": "네트워크 = 도로망 전체 / 인터넷 = 그 중 고속도로"}, "related": ["서버", "ISP", "IX", "프로토콜", "핑"], "saved_date": "2026-10-09", "flow": ["① 출발지 기기에서 데이터 패킷 생성", "② 라우터가 최적 경로 결정", "③ 여러 라우터를 거쳐 전달(홉)", "④ 목적지 기기에 패킷 도착", "⑤ 패킷 조립 → 데이터 복원"], "kakao_chat": "A: 네트워크가 인터넷이랑 같은 말이야?\nB: 응 그거 아니야?\nA: 인터넷은 네트워크의 일종이야. 네트워크가 더 큰 개념이야\n   LAN(사무실 내부), WAN(도시 간 연결), 인터넷 다 네트워크야\nB: 아 인터넷 말고 다른 네트워크도 있구나\nA: 맞아! 회사 내부 망(인트라넷)도 네트워크고\n   두 컴퓨터 케이블로 연결해도 네트워크야\nB: 그럼 네트워크 없이는 인터넷 불가능하네\nA: 맞아. 네트워크 = 도로망 전체 / 인터넷 = 그 중 고속도로야\n   데이터 패킷이 라우터를 거쳐 목적지까지 가는 게 네트워크 통신이야"}, {"id": "term_073", "term": "프로토콜 (Protocol)", "english": "Protocol", "category": "Infra", "one_line": "컴퓨터끼리 데이터를 주고받을 때 지켜야 하는 규칙과 약속", "description": "프로토콜은 서로 다른 기기·시스템이 데이터를 주고받을 때 '이 형식으로 보내고, 이 순서로 확인하자'고 약속한 규칙이다. 사람으로 치면 언어와 예절이다. 대표적으로 HTTP(웹), TCP/IP(인터넷 기본), HTTPS(보안 웹), FTP(파일 전송) 등이 있다.", "examples": ["HTTP — 브라우저와 서버가 웹 페이지를 주고받는 규칙", "HTTPS — HTTP + 암호화(TLS) = 보안 통신", "TCP/IP — 인터넷의 기본 전송 규칙 (패킷 분할·재조립·순서 보장)", "API 호출도 프로토콜 위에서 동작 — REST API = HTTP 프로토콜 기반"], "confusion": {"헷갈리는점": "HTTP와 HTTPS를 단순히 자물쇠 유무로만 이해", "차이": "HTTP = 평문 전송(누구나 볼 수 있음) / HTTPS = TLS 암호화 전송(중간에서 못 읽음)", "기억법": "프로토콜 = 외교 의전 규칙 — 나라(기기)마다 다르면 소통 불가, 공통 규칙 필요"}, "related": ["네트워크", "API", "암호화", "서버"], "saved_date": "2026-10-09", "flow": ["① 송신측이 프로토콜 규칙대로 데이터 포장", "② 네트워크로 전송", "③ 수신측이 같은 프로토콜로 해석", "④ 데이터 복원"], "kakao_chat": "A: 프로토콜이 뭔지 알아? HTTP가 프로토콜이잖아\nB: HTTP가 뭔가 규칙이라는 건 알아\nA: 프로토콜 = 컴퓨터끼리 통신하는 공통 규칙이야\n   외교 의전처럼, 서로 다른 기기가 소통하려면 같은 규칙을 따라야 해\nB: HTTP, HTTPS, FTP 다 프로토콜이야?\nA: 맞아! 각각 용도가 달라\n   HTTP = 웹 문서 전송 / HTTPS = HTTP + TLS 암호화 / FTP = 파일 전송\nB: HTTPS랑 HTTP 차이가 자물쇠 하나 아니야?\nA: 그 차이가 엄청 커! HTTP는 평문 전송이라 중간에서 볼 수 있어\n   HTTPS는 TLS로 암호화되어서 중간에서 못 읽어\n   프로토콜 = 언어 규약 — 같은 언어 써야 대화 가능한 것처럼"}, {"id": "term_074", "term": "DevOps 사이클 (8단계)", "english": "DevOps Lifecycle", "category": "Infra", "one_line": "Plan→Code→Build→Test→Release→Deploy→Operate→Monitor가 무한 반복되는 DevOps의 핵심 흐름", "description": "DevOps는 8단계가 끊임없이 반복되는 무한루프 구조다. 한 사이클이 끝나면 다시 계획(Plan)으로 돌아가 개선을 반복한다. 각 단계가 자동화될수록 배포 속도와 안정성이 높아진다.", "structure": {"1단계 Plan": "기능 계획·이슈 관리", "2단계 Code": "개발·코드 작성", "3단계 Build": "코드 → 실행 가능한 패키지 변환", "4단계 Test": "자동화 테스트", "5단계 Release": "배포 준비·승인", "6단계 Deploy": "서버에 자동 배포", "7단계 Operate": "서버 운영·스케일링", "8단계 Monitor": "실시간 관제·알림"}, "examples": ["코드 수정 → 자동 테스트 → 자동 빌드 → 자동 배포 → 모니터링 → 다시 개선", "Netflix는 이 사이클을 하루 수백 번 반복"], "related": ["DevOps", "CI/CD", "Docker", "Kubernetes", "관제"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps 사이클이 8단계라던데 다 기억해?\nB: Plan이랑 Code는 알겠는데 나머지는 모르겠어\nA: Plan→Code→Build→Test→Release→Deploy→Operate→Monitor야\n   왼쪽이 개발 파트, 오른쪽이 운영 파트야\nB: 순서가 중요해?\nA: 중요해! 계획 세우고 → 코드 짜고 → 빌드하고 → 테스트하고\n   → 릴리즈 준비 → 서버 배포 → 운영 → 모니터링 → 다시 계획\n   이게 무한 반복이야\nB: CI/CD가 이 중에 어디야?\nA: Build~Test~Deploy 구간을 자동화한 게 CI/CD야\n   이 사이클이 빠르게 돌수록 서비스가 빠르게 발전해"}, {"id": "term_075", "term": "Plan (계획 단계)", "english": "Plan", "category": "Infra", "one_line": "DevOps 1단계 — 기능 요구사항·이슈·우선순위를 정의하고 계획하는 단계", "description": "Plan은 무엇을 만들고 고칠지 결정하는 단계다. 사용자 요구사항 수집, 버그 이슈 등록, 스프린트 계획 등이 포함된다. Jira, Notion, GitHub Issues가 대표 도구다.", "examples": ["동아리 홈페이지 기능 목록 작성 → Plan 단계", "GitHub Issues에 '로그인 버그 수정' 등록", "Notion으로 이번 주 개발할 기능 우선순위 정리"], "related": ["DevOps 사이클", "Jira", "GitHub"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps에서 Plan 단계가 뭐야?\nB: 그냥 기획이잖아?\nA: 기능 계획하고 이슈 등록하는 단계야\n   Jira나 업데이트 (코드 수정 → 재빌드 → 재배포)"], "saved_date": "2026-10-09", "kakao_chat": "A: 빌드(Build)가 뭐야? 컴파일하는 거?\nB: 소스코드를 실행 파일로 만드는 거?\nA: 맞아! 소스코드를 실행 가능한 패키지로 변환하는 단계야\n   Java면 컴파일, JavaScript면 번들링, Docker면 이미지 생성이 빌드야\nB: 왜 따로 빌드를 해야 해?\nA: 개발 환경이랑 실제 서버 환경이 달라서\n   빌드를 거쳐야 어떤 환경에서도 실행 가능한 형태가 돼\nB: CI/CD에서 빌드가 자동화되는 거야?\nA: 맞아! git push 하면 자동으로 빌드 돌아가게 설정해\n   빌드 실패하면 배포 안 되도록 막는 거야", "confusion": {"헷갈리는점": "빌드 vs 배포", "차이": "빌드 = 실행할 수 있는 완성품(이미지)으로 포장 / 배포 = 그 완성품을 서버에 올려 실제로 켜기", "기억법": "빌드 = 밀키트 포장, 배포 = 손님 식탁에 올리기"}, "updated": "2026-10-26"}, {"id": "term_078", "term": "Test (테스트 단계)", "english": "Test", "category": "Infra", "one_line": "DevOps 4단계 — 코드가 의도한 대로 작동하는지 자동으로 검증하는 단계", "description": "Test는 코드 변경이 기존 기능을 망가뜨리지 않는지, 새 기능이 올바로 작동하는지 자동으로 확인하는 단계다. 단위 테스트(함수 하나), 통합 테스트(여러 기능 조합), E2E 테스트(실제 사용자 흐름)로 나뉜다. CI/CD가 자동으로 테스트를 실행하고 실패하면 배포를 막는다.", "examples": ["로그인 함수 수정 → 자동으로 로그인 테스트 100개 실행 → 통과해야 다음 단계", "Jest(JavaScript), pytest(Python) — 대표 테스트 도구", "테스트 없이 배포 = 폭탄 제거 확인 없이 해제하는 것"], "related": ["DevOps 사이클", "CI/CD", "Jest", "pytest"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps에서 Test 단계가 왜 중요해?\nB: 코드 짜면서 테스트 하는 거 아니야?\nA: 수동 테스트만 하면 매번 사람이 확인해야 해. 자동화가 핵심이야\n   git push 하면 자동으로 테스트 실행해서 실패하면 배포 막는 구조\nB: 어떤 테스트들이 있어?\nA: 단위 테스트(함수 하나씩), 통합 테스트(여러 모듈 연동), E2E 테스트(실제 사용자 시나리오)\n   보통 다 자동화해서 파이프라인에 넣어\nB: 아 테스트 자동화가 CI/CD의 핵심이구나\nA: 맞아! 테스트 없이 배포하면 운영 중에 버그 터져\n   배포 전 자동 테스트가 안전망이야"}, {"id": "term_079", "term": "Release (릴리즈 단계)", "english": "Release", "category": "Infra", "one_line": "DevOps 5단계 — 테스트 통과한 코드를 실제 배포 가능한 상태로 준비·승인하는 단계", "description": "Release는 테스트를 통과한 코드를 실제 서버에 올릴 준비를 마치는 단계다. 버전 번호 부여(v1.2.3), 변경 이력(Changelog) 작성, 배포 승인이 포함된다. 자동 릴리즈와 수동 승인을 조합해 안전성을 높인다.", "examples": ["v1.0.0 → v1.1.0 버전 태그 부여 → GitHub Release 생성", "핫픽스(긴급 버그 수정) = 승인 없이 즉시 릴리즈", "대형 서비스는 PM·QA 승인 후 릴리즈 → 안전성 강화"], "related": ["DevOps 사이클", "CI/CD", "GitHub", "Deploy"], "saved_date": "2026-10-09", "kakao_chat": "A: Release랑 Deploy가 다른 거야?\nB: 둘 다 내보내는 거 아니야?\nA: 달라! Release는 배포 준비 완료 상태 — 버전 태그 붙이고 배포 승인받는 단계\n   Deploy는 실제로 서버에 올리는 행위야\nB: 순서가 Release 먼저야?\nA: 맞아! Release(준비·승인) → Deploy(실행) 순서야\n   v1.2.3 이런 버전 번호 붙이는 게 Release\n   그 버전을 서버에 올리는 게 Deploy\nB: 그럼 핫픽스는 Release 없이 Deploy 해?\nA: 긴급 상황엔 빠르게 하기도 해. 근데 원칙적으로는 Review→Release→Deploy 순서야"}, {"id": "term_080", "term": "Deploy (배포 단계)", "english": "Deploy", "category": "Infra", "one_line": "DevOps 6단계 — 준비된 코드·이미지를 실제 서버에 올려 사용자가 접근할 수 있게 하는 단계", "description": "Deploy는 빌드·테스트·릴리즈를 마친 코드를 실제 운영 서버에 반영하는 단계다. CI/CD가 자동으로 처리하며, Blue-Green·Canary 배포 전략으로 무중단 배포가 가능하다.\n\n[2026-10-26 보강] 도커 앱에서 배포 = 새로 빌드한 이미지로 컨테이너를 켜는 일. 이미 돌아가는 컨테이너는 저절로 바뀌지 않으므로 옛 컨테이너를 끄고 새 이미지로 다시 켜야 한다(재배포). 같은 이미지로 끄고 켜는 '재시작'은 배포가 아니다 — 내용이 그대로다.", "examples": ["GitHub Actions가 main 브랜치 push 감지 → 자동으로 VPS 서버에 배포", "Blue-Green 배포 — 구 버전(Blue)·신 버전(Green) 동시 운영 후 트래픽 전환", "Canary 배포 — 전체 사용자의 5%에게만 먼저 새 버전 배포해 안전성 확인", "동아리 홈페이지 GitHub Pages 배포 = Deploy 단계", "[우리 서버 실제 사례] 명부 서명 사이트(axis-sign 컨테이너): 2026-10-25에 확인해 보니 공개 화면이 10/19 첫 버전 코드와 똑같았다. 그 뒤에 고친 보안 강화판(10/19 시도 횟수 제한, 10/23 보안 패치)은 코드(레시피)만 준비돼 있고, 새 이미지로 빌드·배포되지 않은 상태 → 재빌드·재배포가 필요."], "related": ["DevOps 사이클", "CI/CD", "Docker", "Kubernetes", "Release", "컨테이너 (Container)", "도커 이미지 (Docker Image)", "흐름: 도커 앱 업데이트 (코드 수정 → 재빌드 → 재배포)"], "saved_date": "2026-10-09", "kakao_chat": "A: Deploy(배포)가 그냥 서버에 올리는 거야?\nB: 파일 복사하면 되는 거 아니야?\nA: 단순히 파일 복사가 아니야. 기존 서비스 중단 없이 새 버전으로 교체하는 게 핵심이야\nB: 무중단 배포가 어떻게 가능해?\nA: 블루-그린 배포: 새 버전 서버(그린)를 완전히 세팅 후 트래픽 전환\n   롤링 배포: 서버를 순차적으로 교체해 일부는 항상 살아있게\nB: 배포 실패하면 어떡해?\nA: 롤백(Rollback)! 이전 버전으로 되돌리는 거야\n   그래서 버전 관리가 중요해 — 배포 실패해도 바로 롤백 가능하게\n   Deploy = 새 코드를 사용자에게 전달하는 마지막 단계야", "confusion": {"헷갈리는점": "재배포 vs 재시작", "차이": "재시작 = 같은 이미지로 다시 켜기(수정 반영 안 됨) / 재배포 = 새 이미지로 바꿔 켜기(수정 반영됨)", "기억법": "재시작 = 같은 요리 데우기, 재배포 = 새 요리로 교체"}, "updated": "2026-10-26"}, {"id": "term_081", "term": "Operate (운영 단계)", "english": "Operate", "category": "Infra", "one_line": "DevOps 7단계 — 배포된 서비스를 안정적으로 운영하고 스케일링하는 단계", "description": "Operate는 실제 서비스가 사용자에게 제공되는 동안 서버를 관리하는 단계다. 트래픽 급증 시 서버 자동 확장(Auto Scaling), 장애 발생 시 자동 복구, 컨테이너 관리 등이 포함된다. Kubernetes가 대표 운영 도구다.", "examples": ["수능 당일 교육부 사이트 폭주 → Auto Scaling으로 서버 자동 증설", "Kubernetes — 수백 개 컨테이너를 자동으로 배치·재시작·확장", "서버 한 대 죽으면 자동으로 다른 서버에서 재시작", "VPS 서버 운영 = Operate 단계의 기초"], "related": ["DevOps 사이클", "Kubernetes", "Docker", "Monitor"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps 사이클에서 Operate(운영) 단계가 뭐야?\nB: 그냥 서비스 유지하는 거 아니야?\nA: 서버 실제로 돌아가게 유지하는 단계야\n   nginx, Kubernetes 같은 걸로 서버 실행 환경 관리하고, Auto Scaling 같은 것도 여기서 해\nB: 배포 이후 단계네?\nA: 맞아. 배포 → 운영 → 모니터링 순서야\n   트래픽 급증하면 서버 자동으로 늘리고, 다운되면 자동 재시작하는 것도 운영이야\nB: 아 24시간 켜놓는 게 Operate 단계구나\nA: 맞아! 운영 자동화가 핵심이야\n   사람이 밤새 지켜볼 수 없으니 Kubernetes 같은 도구로 자동화해"}, {"id": "term_082", "term": "Monitor (모니터링 단계)", "english": "Monitor", "category": "Infra", "one_line": "DevOps 8단계 — 서비스 상태·성능·에러를 실시간으로 추적하고 이상 시 알림을 받는 단계", "description": "Monitor는 서비스가 잘 돌고 있는지 CPU·메모리·에러율·응답시간 등을 실시간으로 측정하고 시각화하는 단계다. 이상 징후 발생 시 알림을 보내 빠른 대응을 가능하게 한다. 여기서 수집된 데이터가 다시 Plan 단계로 피드백된다.", "examples": ["CPU 90% 초과 → Slack 알림 → 담당자 즉시 대응", "Grafana 대시보드 — 서버 상태를 그래프로 실시간 시각화", "Datadog — 에러 발생 위치·빈도·패턴 자동 분석", "라이프루프의 Observability = Monitor와 동일 개념"], "related": ["DevOps 사이클", "관제", "Grafana", "Operate"], "saved_date": "2026-10-09", "kakao_chat": "A: Monitor 단계가 관제랑 같은 거야?\nB: 그냥 서버 상태 보는 거 아니야?\nA: 맞아, DevOps 사이클에서 마지막 단계야\n   Grafana, Datadog 같은 도구로 CPU·메모리·에러율·응답시간 실시간 확인해\nB: 이걸 왜 DevOps 사이클에 포함해?\nA: Monitor에서 발견한 문제가 다시 Plan 단계로 연결돼서\n   끝없이 순환하는 게 DevOps 사이클의 핵심이야\nB: 아 모니터링이 다음 개선의 시작이구나\nA: 맞아! Monitor → 문제 발견 → Plan으로 돌아가 개선\n   Grafana로 대시보드 만들고, 임계값 넘으면 Slack 알림 오도록 설정해"}, {"id": "term_083", "term": "CI/CD", "english": "Continuous Integration / Continuous Deployment", "category": "Infra", "one_line": "코드 변경 시 자동으로 테스트·빌드·배포까지 실행하는 자동화 파이프라인", "description": "CI(지속적 통합)는 코드를 올릴 때마다 자동으로 테스트·빌드를 실행하는 것이고, CD(지속적 배포)는 테스트 통과 시 자동으로 서버에 배포하는 것이다. 사람이 수동으로 배포하던 작업을 자동화해 실수를 줄이고 배포 속도를 높인다.", "examples": ["git push → GitHub Actions 자동 실행 → 테스트 → 빌드 → 서버 배포", "테스트 실패 시 배포 자동 차단 → 버그 있는 코드가 서버에 올라가지 않음", "GitHub Actions, Jenkins, GitLab CI — 대표 CI/CD 도구", "동아리 홈페이지: 코드 수정 → 자동 배포로 즉시 반영"], "related": ["DevOps 사이클", "GitHub", "Docker", "Build", "Deploy"], "saved_date": "2026-10-09", "flow": ["① 개발자 git push", "② CI: 자동 테스트 실행", "③ CI: 자동 빌드", "④ 테스트 실패 시 → 알림·배포 중단", "⑤ CD: 자동 서버 배포", "⑥ 배포 완료 알림"], "confusion": {"헷갈리는점": "CI와 CD를 하나로 묶어 구분 못 함", "차이": "CI(Continuous Integration) = 코드 통합·테스트 자동화 / CD(Continuous Deployment) = 배포 자동화", "기억법": "CI = 품질 검사 자동화 / CD = 배송 자동화"}, "kakao_chat": "A: CI/CD가 뭔지 알아?\nB: 자동 배포 같은 거?\nA: 맞아! CI = Continuous Integration, CD = Continuous Deployment\n   CI는 코드 통합·테스트 자동화, CD는 배포 자동화야\nB: CI랑 CD 구분이 헷갈려\nA: CI = 품질 검사 자동화 / CD = 배송 자동화로 기억해\n   git push → 자동 테스트 → 자동 빌드 → 자동 배포 이 흐름이야\nB: 도구가 뭐야?\nA: GitHub Actions, Jenkins, GitLab CI 같은 거야\n   .github/workflows/ 폴더에 YAML 파일 설정하면 git push 할 때마다 자동 실행돼"}, {"id": "term_084", "term": "Docker", "english": "Docker", "category": "Infra", "one_line": "애플리케이션을 환경에 상관없이 동일하게 실행할 수 있도록 컨테이너로 패키징하는 도구", "description": "Docker는 '내 컴퓨터에서는 됐는데 서버에서 안 된다' 문제를 해결한다. 앱 실행에 필요한 코드·라이브러리·설정을 하나의 컨테이너 이미지로 묶어두면, 어떤 서버에서 실행해도 동일한 환경이 보장된다.\n\n[2026-10-26 보강] 도커의 3요소: Dockerfile(레시피) → 이미지(포장된 밀키트 상자, 빌드 결과물) → 컨테이너(상자를 뜯어 조리 중인 요리). '도커 이미지'는 사진 파일이 아니라 빌드한 순간의 프로그램 상태를 통째로 떠 둔 복사본이다(ISO = CD 이미지와 같은 뜻). 수정 사항을 반영하려면 재빌드 → 옛 컨테이너 끄기 → 새 이미지로 켜기 순서를 거친다.", "examples": ["개발 PC·테스트 서버·운영 서버 → 동일한 Docker 이미지 실행 → 환경 차이 없음", "Hermes(VPS)도 Docker 컨테이너로 실행 중", "docker run nginx → nginx 서버를 단 한 줄로 실행", "컨테이너 = 배 위의 화물 컨테이너 — 규격화되어 어떤 배(서버)에도 실을 수 있음"], "related": ["DevOps", "Kubernetes", "CI/CD", "서버", "도커 이미지 (Docker Image)", "컨테이너 (Container)", "Dockerfile (도커파일)", "흐름: 도커 앱 업데이트 (코드 수정 → 재빌드 → 재배포)"], "saved_date": "2026-10-09", "flow": ["① Dockerfile 작성(실행 환경 정의)", "② docker build → 이미지 생성", "③ docker push → 레지스트리 업로드", "④ 서버에서 docker pull → 이미지 다운", "⑤ docker run → 컨테이너 실행"], "confusion": {"헷갈리는점": "Docker 컨테이너와 가상머신(VM) 혼동", "차이": "VM = OS 전체 가상화(무거움) / Docker = OS 커널 공유, 앱만 격리(가벼움)", "기억법": "VM = 집 전체 복사 / Docker = 방 하나만 격리"}, "kakao_chat": "A: Docker가 뭔지 알아?\nB: 컨테이너 만드는 거?\nA: 맞아! 앱 실행에 필요한 환경(코드+런타임+설정)을 컨테이너로 패키징하는 거야\n   어떤 서버에서 실행해도 동일하게 동작해\nB: 가상머신이랑 다른 거야?\nA: VM은 OS 전체 가상화라서 무거워. Docker는 OS 커널 공유하고 앱만 격리해서 가벼워\n   VM = 집 전체 복사 / Docker = 방 하나만 격리\nB: 그럼 Dockerfile이 뭐야?\nA: 컨테이너 환경 설정서야. '이 버전 Python에, 이 라이브러리 설치하고, 이 포트 열어' 같이\n   Dockerfile 작성 → docker build → docker run 하면 어디서든 같은 환경 실행돼", "updated": "2026-10-26"}, {"id": "term_085", "term": "Kubernetes (쿠버네티스)", "english": "Kubernetes", "category": "Infra", "one_line": "수많은 Docker 컨테이너를 자동으로 배포·확장·관리하는 컨테이너 오케스트레이션 도구", "description": "Kubernetes(K8s)는 Docker 컨테이너가 수백~수천 개로 늘어날 때 이를 자동으로 관리하는 도구다. 컨테이너 죽으면 자동 재시작, 트래픽 많으면 자동 증설, 업데이트 시 무중단 배포를 처리한다.", "examples": ["컨테이너 1개 죽으면 → K8s가 자동으로 새 컨테이너 실행", "트래픽 10배 급증 → Auto Scaling으로 컨테이너 자동 10배 증설", "Google·Netflix·카카오 — 모두 Kubernetes로 서비스 운영", "Docker = 컨테이너 하나 / Kubernetes = 컨테이너 함대 관리"], "related": ["Docker", "DevOps", "Operate", "CI/CD"], "saved_date": "2026-10-09", "flow": ["① 컨테이너 이미지 준비", "② K8s에 배포 설정(YAML) 제출", "③ K8s가 최적 서버에 컨테이너 배치", "④ 컨테이너 죽으면 자동 재시작", "⑤ 트래픽 증가 시 Auto Scaling"], "confusion": {"헷갈리는점": "Kubernetes를 Docker와 같은 것으로 혼동", "차이": "Docker = 컨테이너 하나 실행 / Kubernetes = 수백 개 컨테이너 자동 관리·조율", "기억법": "Docker = 화물 컨테이너 / Kubernetes = 컨테이너 항구 자동화 시스템"}, "kakao_chat": "A: Kubernetes가 Docker랑 같은 거야?\nB: 컨테이너 관련된 거잖아?\nA: 달라! Docker는 컨테이너 하나 실행하는 거고\n   Kubernetes는 컨테이너 수백 개를 자동으로 관리·조율하는 거야\nB: 왜 Kubernetes가 필요해?\nA: 컨테이너가 죽으면 자동 재시작, 트래픽 많으면 자동으로 컨테이너 늘리기\n   여러 서버에 컨테이너 분산 배치 — 이런 걸 사람이 다 하면 못 따라가\nB: 아 컨테이너 항구 자동화 시스템이네\nA: 맞아! Docker = 화물 컨테이너 / Kubernetes = 항구 자동화 시스템\n   줄여서 K8s라고도 해"}, {"id": "term_086", "term": "Grafana", "english": "Grafana", "category": "Infra", "one_line": "서버·앱·DB의 지표를 실시간 그래프·대시보드로 시각화하는 모니터링 도구", "description": "Grafana는 Prometheus 등에서 수집한 지표(CPU·메모리·에러율·응답시간)를 보기 좋은 대시보드로 만들어주는 오픈소스 도구다. 실시간으로 서비스 상태를 한눈에 파악할 수 있다.", "examples": ["CPU·메모리·네트워크 사용률을 실시간 그래프로 시각화", "에러율 급증 → 대시보드에서 즉시 확인 → 알림 발송", "Prometheus(데이터 수집) + Grafana(시각화) 조합으로 주로 사용", "DevOps Monitor 단계의 핵심 도구"], "related": ["Monitor", "관제", "DevOps 사이클", "Prometheus"], "saved_date": "2026-10-09", "flow": ["① Prometheus 등이 서버 지표 수집", "② Grafana가 데이터소스 연결", "③ 대시보드 패널 설정(그래프·게이지 등)", "④ 실시간 지표 시각화", "⑤ 임계값 초과 시 알림 발송"], "confusion": {"헷갈리는점": "Grafana를 데이터 수집 도구로 오해", "차이": "Prometheus = 데이터 수집 / Grafana = 수집된 데이터 시각화. 둘은 별개 도구", "기억법": "Prometheus = 온도계(측정) / Grafana = 온도 그래프 화면(시각화)"}, "kakao_chat": "A: Grafana 써봤어?\nB: 그게 뭐야?\nA: 서버·앱 지표를 예쁜 그래프로 시각화하는 도구야\n   CPU, 메모리, 에러율 같은 걸 실시간 대시보드로 볼 수 있어\nB: 데이터 직접 수집하는 거야?\nA: 아니! 그게 Prometheus랑 헷갈리는 포인트야\n   Prometheus = 온도계(지표 수집) / Grafana = 온도 그래프 화면(시각화)\n   둘은 다른 도구야. 주로 같이 써\nB: 아 수집은 Prometheus, 보여주기는 Grafana구나\nA: 맞아! Grafana에서 임계값 설정하면 알림도 Slack으로 보내줘\n   관제 대시보드 만들 때 기본 조합이야"}, {"id": "term_087", "term": "Jira", "english": "Jira", "category": "Infra", "one_line": "이슈·버그·기능 요청을 관리하고 팀의 개발 진행 상황을 추적하는 프로젝트 관리 도구", "description": "Jira는 개발팀이 가장 많이 쓰는 프로젝트 관리 도구다. 이슈(Issue)를 등록하고, 담당자 지정, 우선순위 설정, 스프린트 계획을 한 곳에서 관리한다. GitHub Issues·Notion으로 대체하기도 한다.", "examples": ["'로그인 버그' 이슈 등록 → 담당자 지정 → 진행중 → 완료 상태 추적", "스프린트 계획 — 이번 주 할 이슈 5개 선택 → 팀원 배분", "Jira = 개발팀의 할 일 관리 앱 (Notion·GitHub Issues와 유사)", "DevOps Plan 단계의 핵심 도구"], "related": ["Plan", "DevOps 사이클", "GitHub"], "saved_date": "2026-10-09", "flow": ["① 이슈(버그·기능) 등록", "② 담당자·우선순위·마감일 설정", "③ 스프린트에 이슈 배정", "④ 개발 진행 중 상태 업데이트(할일→진행중→완료)", "⑤ 스프린트 완료 → 회고"], "confusion": {"헷갈리는점": "Jira를 GitHub Issues와 완전히 같다고 오해", "차이": "GitHub Issues = 코드 중심 이슈 관리(가벼움) / Jira = 스프린트·로드맵·보고서까지 포함(무거움)", "기억법": "GitHub Issues = 포스트잇 / Jira = 프로젝트 관리 소프트웨어"}, "kakao_chat": "A: Jira가 GitHub Issues랑 뭐가 달라?\nB: 둘 다 이슈 관리하는 거 아니야?\nA: 비슷한 역할이지만 깊이가 달라\n   GitHub Issues = 가볍게 코드 관련 이슈 관리 / Jira = 스프린트·로드맵·보고서까지 다 있어\nB: 개발팀이 Jira 더 많이 써?\nA: 규모 있는 팀은 Jira 많이 써. 스프린트 계획, 백로그 관리, 진행 상황 보고서 같은 게 편해\n   GitHub Issues = 포스트잇 / Jira = 프로젝트 관리 소프트웨어\nB: 어떻 dentials", "category": "Dev", "one_line": "시스템·서비스에 접근할 수 있는 인증 정보 — 아이디·비밀번호·토큰·키 등", "description": "Credentials는 '내가 이 서비스를 사용할 권한이 있다'는 것을 증명하는 모든 인증 정보를 말한다. 사람의 신분증과 같은 역할이며, 유출되면 보안 사고로 이어지기 때문에 절대 코드에 직접 넣지 않고 환경변수(.env)나 비밀 저장소(Secret Manager)에 보관한다.", "examples": ["Google OAuth Client ID + Client Secret = Credentials", "GitHub Personal Access Token = Credentials", "DB 접속 정보 (host, port, username, password) = Credentials", "API Key (OpenAI, Notion 등) = Credentials", "n8n에서 서비스 연결 시 입력하는 인증 정보 = Credentials"], "confusion": {"헷갈리는점": "Credentials를 단순히 '비밀번호'로만 이해하는 경우", "정확한의미": "비밀번호뿐 아니라 토큰·API 키·인증서·OAuth 정보 등 접근 권한을 증명하는 모든 것", "주의사항": "코드에 직접 쓰면 GitHub에 올릴 때 유출 위험 → .env 파일에 보관 + .gitignore 처리 필수", "기억법": "신분증(ID) + 열쇠(Key) 묶음 — 이게 있어야 문이 열린다"}, "flow": ["① 서비스 가입 → Credentials 발급 (API Key, Client ID/Secret)", "② .env 파일에 저장 (코드에 직접 X)", "③ .gitignore에 .env 추가 → GitHub 업로드 차단", "④ 서버에서 환경변수로 읽어 사용", "⑤ 유출 시 → 즉시 재발급·폐기"], "related": ["백엔드 인증", "Google OAuth", "API", "환경변수", "보안"], "saved_date": "2026-10-09", "kakao_chat": "A: Credentials(크리덴셜)이 그냥 비밀번호야?\nB: 영어로 자격증명 아니야?\nA: 더 넓은 개념이야. 비밀번호뿐 아니라 API Key, OAuth 토큰, 인증서까지\n   접근 권한을 증명하는 모든 것이 Credentials이야\nB: 왜 이걸 따로 관리해?\nA: 코드에 직접 쓰면 GitHub에 올렸을 때 유출될 수 있어\n   .env 파일에 보관하고 .gitignore에 추가해서 Git에 올라가지 않게 해야 해\nB: 유출되면 어떡해?\nA: 즉시 재발급·폐기해야 해! 누군가 내 API Key 갖고 있으면 대신 요청 할 수 있어\n   신분증+열쇠 묶음 — 이게 있으면 문 열린다고 기억해"}, {"id": "term_101", "term": "URI (Uniform Resource Identifier)", "english": "Uniform Resource Identifier", "category": "Dev", "one_line": "인터넷에서 자원(페이지·파일·API)을 식별하는 고유한 주소 형식", "description": "URI는 인터넷상의 모든 자원에 고유한 이름을 붙이는 체계다. URL이 URI의 일종이다. URI는 '이 자원이 무엇인가'를 식별하고, URL은 '이 자원이 어디 있는가'까지 포함한다. 실무에서는 URL과 URI를 거의 같은 의미로 사용한다.", "examples": ["https://axis-is.kr/slides — URI이자 URL", "http://168.231.118.60:3000/auth/google/callback — Google OAuth 리디렉션 URI", "mailto:kchmok@sungkyul.ac.kr — URI지만 URL은 아님 (위치가 아닌 식별자)", "API endpoint: /api/users/123 — URI로 특정 사용자 자원 식별"], "confusion": {"헷갈리는점": "URI와 URL을 다른 것으로 구분하려다 혼란", "차이": "URL ⊂ URI — URL은 URI의 하위 개념. 실무에서는 거의 같은 의미로 사용", "기억법": "URI = 이름표 / URL = 이름표 + 주소까지 포함"}, "related": ["URL", "리디렉션", "API", "프로토콜"], "saved_date": "2026-10-09", "flow": ["① 리소스 식별 필요", "② URI 구조 설계(scheme://host/path?query)", "③ 클라이언트가 URI로 요청", "④ 서버가 URI 파싱 → 해당 리소스 반환"], "kakao_chat": "A: URI랑 URL이 다른 거야?\nB: 그냥 같은 거 아니야?\nA: URL이 URI 안에 포함돼! URI = 리소스 식별자 전체 개념, URL = 주소 포함한 식별자\nB: 그럼 URL이 더 좁은 개념이야?\nA: 맞아. URL ⊂ URI야\n   'https://example.com/page' 이게 URL이고 URN(이름만 있는 것) 같은 것도 URI에 포함돼\nB: 실무에서 구분해서 써야 해?\nA: 실무에서는 거의 같은 의미로 써. 큰 차이 없어\n   URI = 이름표 / URL = 이름표 + 주소까지 포함이라고 기억해\n   scheme://host/path?query 이 구조가 URI/URL 기본 형태야"}, {"id": "term_102", "term": "리디렉션 (Redirection)", "english": "Redirection", "category": "Dev", "one_line": "사용자를 A 주소에서 B 주소로 자동으로 이동시키는 것", "description": "리디렉션은 특정 URL로 접속했을 때 서버나 브라우저가 자동으로 다른 URL로 보내는 동작이다. HTTP 상태코드로 구분되며 301(영구 이동), 302(임시 이동)이 대표적이다. 보안·인증·페이지 이동에 핵심적으로 사용된다.", "examples": ["로그인 안 한 상태로 발표자료 접속 → 로그인 페이지로 리디렉션", "http://axis-is.kr → https://axis-is.kr 자동 이동 (보안 리디렉션)", "Google OAuth: 로그인 완료 → /auth/google/callback으로 리디렉션", "구 도메인 → 신 도메인 자동 이동 (301 영구 리디렉션)"], "confusion": {"헷갈리는점": "리디렉션(Redirection)과 리다이렉트(Redirect)는 같은 말", "차이": "Redirect = 동사(행위) / Redirection = 명사(현상) — 실무에서 혼용", "301_vs_302": "301 = 영구 이동(SEO에 영향) / 302 = 임시 이동(SEO 영향 없음)", "기억법": "도로 공사 우회로 표지판 — 원래 길 막히면 자동으로 다른 길로 안내"}, "flow": ["① 사용자 → A URL 접속", "② 서버 → 301/302 응답 + Location: B URL 헤더 전송", "③ 브라우저 → B URL로 자동 재요청", "④ B URL 페이지 표시"], "related": ["URI", "리다이렉트", "백엔드 인증", "Google OAuth", "프로토콜"], "saved_date": "2026-10-09", "kakao_chat": "A: 리디렉션이 리다이렉트랑 달라?\nB: 같은 말 아니야?\nA: Redirect = 동사(행위), Redirection = 명사(현상)이야. 실무에선 혼용해\nB: 언제 써?\nA: 사이트 주소 바뀌었을 때 옛날 링크도 새 주소로 보내주거나\n   로그인 안 된 상태에서 마이페이지 들어오면 로그인 페이지로 보내는 거\nB: 301이랑 302 차이가 뭐야?\nA: 301 = 영구 이동. 검색엔진이 새 URL로 업데이트해서 SEO에 영향 줘\n   302 = 임시 이동. 검색엔진 그대로 유지야\nB: 그럼 도메인 이전할 때는 301이네\nA: 맞아! 도로 공사 우회로 표지판 — 원래 길 막히면 자동으로 다른 길로 안내"}, {"id": "term_103", "term": "리다이렉트 URI (Redirect URI)", "english": "Redirect URI", "category": "Dev", "one_line": "OAuth 인증 완료 후 인증 코드를 받아올 서버 주소 — 사전에 등록된 주소만 허용", "description": "Redirect URI는 OAuth 인증 흐름에서 구글·카카오 등 인증 서버가 인증 완료 후 사용자를 돌려보낼 주소다. 보안을 위해 반드시 사전에 등록된 주소만 허용하며, IP 주소는 허용하지 않고 도메인만 허용한다. 미등록 주소로 요청하면 에러가 발생한다.", "examples": ["http://axis-is.kr:3000/auth/google/callback — 등록된 Redirect URI", "Google OAuth 설정에서 '승인된 리디렉션 URI'에 반드시 사전 등록 필요", "IP(168.231.118.60)로 등록 시 에러 → 반드시 도메인으로 등록", "localhost:3000/auth/google/callback — 개발 환경용 Redirect URI"], "confusion": {"헷갈리는점": "Redirect URI에 IP 주소 입력해도 된다고 생각하는 경우", "정확한규칙": "Google OAuth는 공개 도메인만 허용. localhost는 개발용으로 예외 허용", "기억법": "초대장에 적힌 주소(사전 등록) = Redirect URI — 주소가 다르면 입장 불가"}, "flow": ["① Google 콘솔 → Redirect URI 사전 등록 (axis-is.kr/auth/google/callback)", "② 사용자 → 로그인 버튼 클릭", "③ 서버 → Google 인증 URL로 이동 (redirect_uri 파라미터 포함)", "④ Google → 인증 완료 → 등록된 Redirect URI로 코드 전달", "⑤ 서버 → 코드 수신 → 토큰 교환 → 로그인 완료"], "related": ["URI", "리디렉션", "Google OAuth", "Credentials", "백엔드 인증"], "saved_date": "2026-10-09", "kakao_chat": "A: Redirect URI가 뭔지 알아? OAuth에서 나오는 거\nB: 리디렉션 주소?\nA: 맞아! Google OAuth 인증 후 코드를 받을 서버 주소야\n   Google 콘솔에 사전 등록해둔 주소로만 콜백이 와\nB: 왜 미리 등록해야 해?\nA: 보안 때문이야. 악의적인 사이트가 우리 Client ID 훔쳐서\n   자기 주소를 Redirect URI로 쓰면 인증 코드를 탈취할 수 있어\n   등록된 주소로만 보내게 해서 막는 거야\nB: IP 주소로 등록하면 안 돼?\nA: Google OAuth는 공개 도메인만 허용해. localhost는 개발용으로 예외야\n   초대장에 적힌 주소 = Redirect URI — 주소 다르면 입장 불가"}, {"id": "term_104", "term": "프록시 (Proxy)", "english": "Proxy", "category": "Infra", "one_line": "클라이언트와 서버 사이에서 요청·응답을 대신 전달하는 중간 서버", "description": "프록시는 클라이언트(브라우저)와 실제 서버 사이에 위치해 요청을 대신 처리하는 중간자다. 보안·캐싱·로드밸런싱·SSL 처리 등을 담당한다. nginx가 대표적인 리버스 프록시로, 외부 요청을 받아 내부 AP 서버로 전달한다.", "examples": ["nginx → Node.js 서버로 요청 전달 = 리버스 프록시", "회사 방화벽 → 직원 인터넷 요청 대신 처리 = 포워드 프록시", "axis.axmaster.cloud:80 → 내부 3000포트로 전달 = 프록시 라우팅", "CDN = 전 세계에 분산된 프록시 서버 네트워크"], "confusion": {"헷갈리는점": "포워드 프록시 vs 리버스 프록시 혼동", "차이": "포워드 = 클라이언트 앞에서 외부 요청 대리 / 리버스 = 서버 앞에서 외부 요청 수신", "기억법": "리버스 프록시 = 서버 쪽 대문지기 — 밖에서 오는 손님(요청)을 안쪽 방(서버)으로 안내"}, "related": ["프록시 라우팅", "nginx", "서버 3단 구조", "캐싱"], "saved_date": "2026-10-09", "flow": ["① 클라이언트가 프록시에 요청 전송", "② 프록시가 실제 서버에 대신 요청", "③ 서버 응답 → 프록시 수신", "④ 프록시가 클라이언트에 응답 전달"], "kakao_chat": "A: 프록시가 뭔지 알아?\nB: VPN 같은 거?\nA: 비슷한 개념! 클라이언트와 서버 사이에서 중간 대리인 역할하는 거야\nB: 왜 직접 연결 안 해?\nA: 여러 이유가 있어. 보안(IP 숨기기), 캐싱(자주 쓰는 데이터 캐시), 접근 제어 같은 거야\nB: 포워드 프록시랑 리버스 프록시 차이가 뭐야?\nA: 포워드 = 클라이언트 앞에서 외부 요청 대리 (내 IP 숨기기)\n   리버스 = 서버 앞에 서서 외부 요청 수신 (서버 숨기기, nginx 같은 것)\nB: 아 nginx가 리버스 프록시구나\nA: 맞아! 리버스 프록시 = 서버 쪽 대문지기야"}, {"id": "term_105", "term": "프록시 라우팅 (Proxy Routing)", "english": "Proxy Routing", "category": "Infra", "one_line": "도메인·경로에 따라 요청을 알맞은 내부 서버로 전달하는 nginx 설정", "description": "프록시 라우팅은 하나의 도메인으로 들어오는 요청을 경로나 서브도메인에 따라 다른 내부 서버(포트)로 보내는 설정이다. axmaster.cloud(녹음기)와 axis.axmaster.cloud(동아리 홈페이지)를 같은 VPS에서 분리 운영할 수 있는 원리다.", "examples": ["axis.axmaster.cloud → 내부 localhost:3000 (동아리 홈페이지)", "axmaster.cloud → 내부 localhost:8000 (녹음기 서비스)", "axmaster.cloud/api → 내부 localhost:4000 (API 서버)", "nginx 설정: proxy_pass http://localhost:3000"], "flow": ["① 브라우저 → axis.axmaster.cloud 접속", "② DNS → VPS IP(168.231.118.60) 반환", "③ nginx(80/443포트) 수신", "④ server_name axis.axmaster.cloud 블록 매칭", "⑤ proxy_pass → localhost:3000으로 전달", "⑥ Node.js 서버 처리 → 응답 반환", "⑦ nginx → 브라우저에 응답 전달"], "related": ["프록시", "nginx", "라우팅", "서버 3단 구조", "도메인", "Traefik (트래픽)"], "saved_date": "2026-10-09", "confusion": {"헷갈리는점": "프록시 라우팅을 DNS와 혼동", "차이": "DNS = 도메인→IP 변환 / 프록시 라우팅 = IP에 도달한 후 어느 서버(포트)로 전달할지 결정", "기억법": "DNS = 주소 찾기 / 프록시 라우팅 = 주소 찾은 후 어느 방으로 안내할지"}, "kakao_chat": "A: 프록시 라우팅이 DNS랑 어떻게 달라?\nB: 둘 다 어디로 보낼지 결정하는 거 아니야?\nA: 달라! DNS는 도메인→IP 변환이야 — 주소 찾기\n   프록시 라우팅은 IP에 도달한 후 어느 서버(포트)로 보낼지 결정이야\nB: 예를 들어줘\nA: axis.axmaster.cloud 접속하면\n   DNS가 IP(168.231.118.60) 알려주고\n   그 IP에서 nginx가 어느 포트로 전달할지 결정해 — 이게 프록시 라우팅이야\nB: 아 주소 찾기는 DNS, 집 안에서 방 찾기는 프록시 라우팅이네\nA: 딱 맞아! DNS = 주소 찾기 / 프록시 라우팅 = 어느 방으로 안내할지야", "our_server_note": "[우리 서버 실제 사례] 우리 VPS의 프록시 라우팅은 nginx 설정 파일이 아니라 Traefik 라벨(traefik.http.routers.<앱>.rule=Host(`도메인`))로 한다.", "updated": "2026-10-22"}, {"id": "term_106", "term": "쿠키 (Cookie)", "english": "Cookie", "category": "Dev", "one_line": "서버가 브라우저에 저장시키는 작은 데이터 — 로그인 상태·설정 등을 기억하는 데 사용", "description": "쿠키는 서버가 브라우저에 '이것 기억해줘'라고 저장시키는 작은 텍스트 데이터다. 브라우저는 같은 서버에 요청할 때마다 쿠키를 자동으로 함께 보낸다. 로그인 세션 유지, 장바구니 기억, 사용자 설정 저장 등에 사용된다.", "examples": ["로그인 후 브라우저 닫았다 열어도 로그인 유지 = 쿠키에 세션 ID 저장", "쇼핑몰 장바구니 — 로그인 안 해도 담긴 것 기억 = 쿠키", "Google Analytics — 방문자 추적에 쿠키 사용", "AX:IS 홈페이지: 로그인 → 서버가 세션 ID를 쿠키로 발급 → 이후 요청마다 자동 전송"], "confusion": {"헷갈리는점": "쿠키(Cookie)와 세션(Session)을 같은 것으로 혼동", "차이": "쿠키 = 브라우저에 저장 (클라이언트) / 세션 = 서버에 저장. 쿠키에 세션ID를 담아 연결", "보안": "HttpOnly 쿠키 = JS로 접근 불가(XSS 방어) / Secure 쿠키 = HTTPS에서만 전송", "기억법": "쿠키 = 도서관 대출증 — 내가 들고 다니며 매번 제시 / 세션 = 도서관 대출 기록 — 서버가 보관"}, "related": ["세션", "백엔드 인증", "Google OAuth", "리다이렉트"], "saved_date": "2026-10-09", "flow": ["① 사용자 로그인 → 서버가 세션 생성", "② 서버가 Set-Cookie 헤더로 세션ID 전달", "③ 브라우저가 쿠키 저장", "④ 이후 요청마다 Cookie 헤더에 자동 포함", "⑤ 서버가 쿠키의 세션ID로 사용자 확인"], "kakao_chat": "A: 쿠키랑 세션이 헷갈려\nB: 그냥 로그인 유지하는 거 아니야?\nA: 둘 다 로그인 상태 유지에 쓰이지만 저장 위치가 달라\n   쿠키 = 브라우저에 저장 / 세션 = 서버에 저장\nB: 어떻게 연결돼?\nA: 로그인하면 서버가 세션 만들고, 세션ID를 쿠키에 담아서 브라우저에 보내\n   이후 요청마다 쿠키에 담긴 세션ID 자동으로 서버에 전달해서 신원 확인해\nB: 쿠키가 위험하지 않아?\nA: HttpOnly 쿠키는 JS로 접근 못 해서 XSS 공격 방어하고\n   Secure 쿠키는 HTTPS에서만 전송돼\n   쿠키 = 대출증 (내가 들고 다님) / 세션 = 대출 기록 (도서관이 보관)"}, {"id": "term_107", "term": "nginx", "english": "nginx (Engine-X)", "category": "Infra", "one_line": "고성능 웹서버이자 리버스 프록시 — 외부 요청을 받아 내부 서버로 전달하는 대문지기", "description": "nginx(엔진엑스)는 웹서버·리버스 프록시·로드밸런서 역할을 하는 오픈소스 소프트웨어다. Apache보다 가볍고 빠르며 동시 접속 처리 성능이 뛰어나다. 현재 전 세계 웹서버 점유율 1위. VPS에서 80/443 포트로 외부 요청을 받아 내부 Node.js·Python 서버로 전달하는 역할을 한다.", "examples": ["axis.axmaster.cloud:80 → nginx 수신 → localhost:3000(Node.js)으로 전달", "HTTPS 인증서(SSL) 처리 — nginx가 담당하고 내부 서버는 HTTP만 써도 됨", "여러 도메인을 하나의 VPS에서 운영 — nginx가 도메인별로 분리 처리", "정적 파일(이미지·CSS·JS) 직접 서빙 — AP서버 부하 감소"], "confusion": {"헷갈리는점": "nginx를 단순 웹서버로만 이해하는 경우", "정확한의미": "웹서버 + 리버스 프록시 + 로드밸런서 + SSL 처리까지 담당하는 만능 대문지기", "vs_apache": "Apache = 요청당 프로세스 생성(무거움) / nginx = 이벤트 기반(가볍고 빠름)", "기억법": "nginx = VPS의 대문지기 — 모든 외부 요청이 nginx를 먼저 통과"}, "config_example": {"설명": "axis.axmaster.cloud를 localhost:3000으로 프록시 라우팅하는 nginx 설정", "code": "\nserver {\n    listen 80;\n    server_name axis.axmaster.cloud;\n\n    location / {\n        proxy_pass http://localhost:3000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n    }\n}\n"}, "flow": ["① 브라우저 → axis.axmaster.cloud:80 요청", "② nginx → server_name 매칭", "③ proxy_pass → localhost:3000으로 전달", "④ Node.js 처리 → 응답 반환", "⑤ nginx → 브라우저에 응답 전달"], "related": ["프록시", "프록시 라우팅", "서버 3단 구조", "AP 서버", "DevOps", "Traefik (트래픽)"], "saved_date": "2026-10-09", "easy_description": {"한줄요약": "아파트 경비원 — 모든 방문객(요청)이 경비실(nginx)을 먼저 거치고, 경비원이 '몇 호(포트)로 가세요'라고 안내", "왜필요한가": "서버 포트는 숫자(3000, 8000 등)인데 사람들은 'axis.axmaster.cloud'같은 주소를 씀. nginx가 이 주소를 보고 알맞은 포트로 연결해줌", "없으면어떻게되나": "axis.axmaster.cloud:3000처럼 포트번호를 직접 입력해야 함 → 불편하고 비전문적", "비유_3가지": {"경비원": "아파트 경비실 — 방문객이 오면 '몇 호 가세요?' 안내", "전화교환원": "회사 대표번호로 전화하면 교환원이 담당 부서로 연결", "호텔프런트": "호텔 입구 프런트 — 손님 맞이 후 알맞은 객실(서버)로 안내"}}, "step_by_step": {"1_외부에서_보이는것": "axis.axmaster.cloud (포트 없음, 깔끔)", "2_실제_작동": "nginx가 80번 포트에서 대기 중 → 요청 수신", "3_nginx가_하는일": "이 주소는 동아리 홈페이지네 → 3000번 포트로 보내줌", "4_내부서버": "Node.js(3000번)가 실제 처리", "5_결과반환": "nginx가 받아서 브라우저에 전달"}, "real_world_examples": ["카카오톡 서버 — 수억 명 요청을 nginx가 먼저 받아 분산", "네이버 — 뉴스/쇼핑/블로그 등 서비스별로 다른 서버에 nginx가 라우팅", "우리 VPS — axmaster.cloud(녹음기)와 axis.axmaster.cloud(동아리)를 nginx가 분리"], "kakao_chat": "A: nginx가 뭐야? 웹서버?\nB: 아파치랑 비슷한 거?\nA: 맞아! 웹서버인데 리버스 프록시, 로드밸런서, SSL 처리까지 다 해\n   VPS의 대문지기야 — 모든 외부 요청이 nginx 먼저 통과해\nB: 아파치랑 뭐가 달라?\nA: Apache = 요청당 프로세스 생성해서 무거워\n   nginx = 이벤트 기반 처리라 가볍고 빠르고 동시 접속 잘 해\nB: nginx 설정은 어떻게 해?\nA: /etc/nginx/sites-available/ 에 설정 파일 만들어서\n   어떤 도메인이 오면 어느 포트로 전달할지 설정해\n   axis.axmaster.cloud 요청 → localhost:3000으로 전달 이런 식이야", "our_server_note": "[우리 서버 실제 사례 · 2026-10-22 확인] 우리 VPS의 80·443 정문은 nginx가 아니라 Traefik이다. nginx는 nightdesk-web 등 특정 앱 컨테이너 안에서 정적 파일을 내주는 역할. 위 예시의 'axis.axmaster.cloud → nginx'는 일반적인 구조 설명이고, 우리 서버에서는 Traefik 라벨로 연결한다.", "updated": "2026-10-22"}, {"id": "term_108", "term": "화면 목업 (Mockup)", "english": "Mockup / UI Mockup", "category": "Dev", "one_line": "실제 개발 전에 화면이 어떻게 보일지 시각적으로 미리 그려보는 설계 도구", "description": "목업은 실제 기능은 없지만 화면의 레이아웃·버튼·텍스트·색상 등을 실제처럼 표현한 시각적 설계물이다. 개발 전에 어떻게 만들지 합의하고, 수정 비용을 줄이기 위해 사용한다. 와이어프레임(뼈대) → 목업(디자인) → 프로토타입(인터랙션) 순서로 발전한다.", "examples": ["경매사이트 목업 — 상품 목록·입찰 버튼·가격 표시 위치를 HTML로 미리 그려봄", "피그마(Figma)로 로그인 화면 목업 제작 → 개발자에게 전달", "동아리 홈페이지 — 발표자료 카드 레이아웃을 목업으로 먼저 확인 후 개발", "종이에 손으로 그린 것도 목업 — 도구보다 '미리 그려보는 행위'가 핵심"], "confusion": {"헷갈리는점": "와이어프레임·목업·프로토타입을 혼동하는 경우", "차이": {"와이어프레임": "뼈대만 있는 스케치 — 레이아웃 위치만 표시, 색상/디자인 없음", "목업": "실제처럼 보이는 정적 화면 — 색상·폰트·이미지 포함, 클릭은 안 됨", "프로토타입": "클릭하면 반응하는 인터랙티브 목업 — 실제와 가장 유사"}, "기억법": "와이어프레임=집 설계도 / 목업=모델하우스 외관 / 프로토타입=실제 들어가볼 수 있는 모델하우스"}, "flow": ["① 기획 — 어떤 화면이 필요한지 목록 작성", "② 와이어프레임 — 레이아웃 위치만 스케치", "③ 목업 — 실제 디자인 적용한 정적 화면", "④ 프로토타입 — 클릭 가능한 인터랙티브 버전", "⑤ 개발 — 목업 기반으로 실제 구현", "⑥ QA — 목업과 실제 화면 비교 검수"], "tools": {"전문 도구": "Figma, Adobe XD, Sketch", "간단 도구": "PowerPoint, Canva, Notion", "코드 목업": "HTML/CSS로 직접 제작 (지금 하는 방식)"}, "related": ["프론트엔드", "UI/UX", "스펙", "기획"], "saved_date": "2026-10-10", "kakao_chat": "A: 화면 목업이 뭔지 알아?\nB: 디자인 시안 같은 거?\nA: 맞아! 실제처럼 보이는 정적 화면이야. 색상·폰트·이미지 다 있는데 클릭은 안 돼\nB: 와이어프레임이랑 다른 거야?\nA: 와이어프레임은 뼈대만 있어. 위치·구조만 박스와 선으로 표현하고 디자인 없어\n   목업은 실제처럼 보이는 정적 디자인이야\nB: 그럼 프로토타입은?\nA: 클릭하면 반응하는 인터랙티브 버전이야\n   와이어프레임=집 설계도 / 목업=모델하우스 외관 / 프로토타입=들어가볼 수 있는 모델하우스\nB: 순서가 있어?\nA: 와이어프레임 → 목업 → 프로토타입 → 개발 순서야"}, {"id": "term_109", "term": "와이어프레임 (Wireframe)", "english": "Wireframe", "category": "Dev", "one_line": "색상·디자인 없이 레이아웃과 구조만 표시한 화면 설계 뼈대", "description": "와이어프레임은 화면의 레이아웃·요소 위치·정보 구조만 표시한 스케치다. 색상·폰트·이미지 없이 박스와 선으로만 구성된다. 개발 전 가장 먼저 작성하며 '어디에 무엇을 배치할 것인가'를 결정한다.", "examples": ["경매사이트: 상단 검색바 위치, 상품 목록 그리드, 사이드바 필터 위치를 박스로 표시", "로그인 페이지: 이메일 입력칸·비번칸·버튼 위치만 선으로 스케치", "종이에 네모박스와 선으로 그린 것도 와이어프레임", "Figma 로우파이(Low-fi) 모드, Balsamiq — 대표 와이어프레임 도구"], "confusion": {"헷갈리는점": "와이어프레임을 목업과 혼동", "차이": "와이어프레임 = 뼈대(위치만) / 목업 = 실제처럼 보이는 디자인", "기억법": "집 설계도 — 방 위치만 있고 벽지·가구는 없음"}, "related": ["화면 목업", "프로토타입", "UI/UX", "스펙"], "saved_date": "2026-10-10", "flow": ["① 필요한 화면 목록 작성", "② 각 화면의 구성 요소 나열(헤더·버튼·목록 등)", "③ 위치와 크기만 박스·선으로 표현", "④ 팀과 공유·피드백", "⑤ 확정 후 목업으로 발전"], "kakao_chat": "A: 와이어프레임이 뭔지 알아?\nB: 와이어라서 선 그어놓은 거?\nA: 맞아! 뼈대만 있는 스케치야. 색상·디자인 없이 위치와 레이아웃만 표현해\nB: 언제 만들어?\nA: 개발 시작 전, 어떤 화면이 필요한지 구조만 잡을 때 만들어\n   빠르게 그릴 수 있어서 피드백도 빨리 받을 수 있어\nB: 목업이랑 뭐가 달라?\nA: 와이어프레임 = 집 설계도 (방 위치만, 벽지 없음)\n   목업 = 실제처럼 보이는 디자인 (색상·폰트 다 있음)\nB: 와이어프레임부터 시작하는 게 맞는 순서야?\nA: 맞아! 와이어프레임 → 목업 → 프로토타입 → 개발이야\n   처음부터 디자인하면 레이아웃 바꿀 때 다 다시 해야 해"}, {"id": "term_110", "term": "프로토타입 (Prototype)", "english": "Prototype", "category": "Dev", "one_line": "클릭하면 실제처럼 반응하는 인터랙티브 목업 — 개발 전 UX를 검증하는 단계", "description": "프로토타입은 실제 코드 없이 버튼 클릭·화면 전환·입력 등 사용자 흐름을 시뮬레이션할 수 있는 인터랙티브 설계물이다. 개발 전 UX 문제를 발견하고 수정하기 위해 사용한다. Figma의 링크 연결 기능이 대표적이다.", "examples": ["Figma에서 '로그인 버튼' 클릭 → '메인 화면'으로 이동하도록 연결 = 프로토타입", "경매사이트: 입찰 버튼 클릭 → 확인 팝업 → 완료 화면 흐름 시뮬레이션", "사용자 테스트 — 실제 사용자에게 프로토타입 써보게 하고 UX 문제 발견", "HTML/CSS로 만든 클릭 가능한 목업도 프로토타입"], "confusion": {"헷갈리는점": "프로토타입을 완성된 제품으로 오해", "차이": "프로토타입 = 검증용 모형 (기능 없음) / 실제 개발 = 진짜 작동하는 코드", "기억법": "들어가볼 수 있는 모델하우스 — 실제 살 수는 없지만 동선·공간 검증 가능"}, "related": ["화면 목업", "와이어프레임", "UI/UX", "프론트엔드"], "saved_date": "2026-10-10", "flow": ["① 목업 완성", "② Figma 등에서 화면 간 링크 연결", "③ 버튼 클릭 → 다음 화면 이동 설정", "④ 사용자 테스트(실제처럼 써보기)", "⑤ UX 문제 발견·수정 → 개발 시작"], "kakao_chat": "A: 프로토타입이 그냥 목업이랑 달라?\nB: 둘 다 화면 아니야?\nA: 목업은 정적이야. 예쁘게 보이지만 클릭해도 반응 없어\n   프로토타입은 클릭하면 다음 화면으로 이동하는 인터랙티브 버전이야\nB: 개발한 거야?\nA: 아니! 실제 코드 없어. Figma에서 화면 간 링크 연결해서 만드는 거야\n   실제처럼 동작하는 것처럼 보이지만 껍데기야\nB: 그럼 뭐가 좋아?\nA: 개발 전에 UX 검증할 수 있어. 사용자 테스트해서 불편한 점 미리 잡아내는 거야\n   들어가볼 수 있는 모델하우스 — 실제 살 수는 없지만 동선 MOps는 프롬프트가 핵심 자산이야. 프롬프트 바꾸면 결과가 완전 달라지거든\nB: 비용 모니터링도 해야 해?\nA: 토큰 단위로 과금되니까 비용 폭탄 맞을 수 있어!\n   환각·오답 탐지 로깅, A/B 테스트도 LLMOps 영역이야\n   공장 운영(MLOps) + 대화하는 직원 관리(LLMOps) 개념이야"}, {"id": "term_115", "term": "흐름: DevOps → MLOps → LLMOps 진화", "english": "Flow: Ops Evolution", "category": "Infra", "one_line": "소프트웨어 운영 → AI 모델 운영 → LLM 운영으로 진화한 Ops 계열 발전 흐름", "flow": ["① DevOps — 코드 배포·운영 자동화 (2010년대)", "② MLOps — AI 모델도 코드처럼 배포·관리 필요 (2018~)", "③ LLMOps — LLM 특화 운영 과제 등장 (2023~)", "④ AX — 위 기술들을 활용해 업무·조직 전체를 전환하는 전략 (현재)"], "difficulty_map": {"AX": "⭐⭐ — 전략·문화 레이어 (비즈니스)", "DevOps": "⭐⭐⭐ — 기술 기반", "MLOps": "⭐⭐⭐⭐ — 기술 중상단", "LLMOps": "⭐⭐⭐⭐⭐ — 기술 최상단"}, "key_insight": "AX는 Ops보다 쉬운 게 아니라 레이어가 다름. AX=전략·방향 / Ops=구현·운영. AX를 잘 하려면 Ops가 무엇인지는 알아야 하지만 직접 구현할 줄 알 필요는 없음.", "related": ["DevOps", "MLOps", "LLMOps", "AX", "CI/CD"], "saved_date": "2026-10-13", "kakao_chat": "A: DevOps→MLOps→LLMOps가 어떻게 진화했어?\nB: 순서대로 발전한 거야?\nA: 맞아! DevOps가 먼저고, AI 붐 타면서 MLOps, LLM 등장하면서 LLMOps야\nB: 각각 핵심이 뭐야?\nA: DevOps = 코드 배포·운영 자동화 (2010년대)\n   MLOps = AI 모델도 코드처럼 배포·관리 (2018년~)\n   LLMOps = 프롬프트·토큰비용·환각 같은 LLM 특화 문제 (2023년~)\nB: 다 따로 쓰는 거야?\nA: 아니, 위로 올라갈수록 아래 개념을 포함해\n   LLMOps하면 MLOps랑 DevOps 다 포함이야\nB: 그다음이 AX야?\nA: 맞아! 이 기술들로 업무·조직 전체를 전환하는 전략이 AX야"}, {"id": "term_116", "term": "온보딩", "term_en": "Onboarding", "category": "AX", "definition": "새로운 구성원이나 사용자가 조직·서비스·도구에 빠르게 적응하도록 안내하는 과정", "detail": "온보딩은 신규 직원이 업무에 적응하는 과정(HR 온보딩)에서 출발했지만, 현재는 앱·서비스의 첫 사용 경험 설계(UX 온보딩), AI 도구 도입 시 구성원 교육(AX 온보딩) 등 다양한 맥락에서 사용된다. AX 맥락에서는 AI 도구를 처음 접하는 사람이 실무에 빠르게 투입될 수 있도록 설계된 교육·가이드 프로세스를 뜻한다.\n\n[개발자 맥락] 개발자들은 주로 3가지 상황에서 온보딩을 사용한다: ① 신규 개발자 팀 합류 시 — 코드베이스·개발환경·컨벤션을 빠르게 익히는 과정 (README, CONTRIBUTING.md, 로컬 세팅 가이드 등이 온보딩 자료). ② API·SDK 제공 시 — 외부 개발자가 자사 API를 처음 연동할 때의 경험 설계 (Quick Start, 샘플 코드, Sandbox 환경 제공). ③ 서비스 사용자 첫 경험 — 앱 첫 실행 시 튜토리얼·가이드 화면 (UX 온보딩 플로우). 개발자 커뮤니티에서는 '온보딩이 잘 된 프로젝트'가 기여자를 더 많이 모은다는 인식이 강하다.", "related": ["AX", "DX", "교육", "적응"], "flow": "흐름: 도입 결정 → 온보딩 설계 → 실습 교육 → 현업 적용 → 피드백", "confusion": "헷갈리는 포인트: 온보딩은 단순 교육이 아니다 — 교육(1회성) vs 온보딩(지속적 적응 설계). 온보딩이 잘 되면 도구 도입 실패율이 크게 낮아진다. 개발자 관점 추가: API 온보딩(외부 개발자용) vs 팀 온보딩(내부 신규 개발자용) — 대상이 다르므로 자료 설계가 완전히 달라진다.", "added": "2026-10-16", "kakao_chat": "A: 야 우리 팀에 신입 들어왔는데 온보딩 자료 만들어야 해\nB: 온보딩이 뭔데?\nA: 새로 합류한 사람이 빨리 적응하게 도와주는 과정이야\n   개발팀이면 로컬 환경 세팅법, 코드 컨벤션, 배포 방법 같은 거 정리해두는 거\nB: 아 그거 README에 써두는 거 아니야?\nA: README는 프로젝트 소개고, 온보딩은 \"첫날 뭐부터 해야 하는지\" 플로우야\n   예를 들면: 1. 레포 클론 → 2. .env 설정 → 3. DB 마이그레이션 → 4. 로컬 서버 실행\nB: 아 그냥 체크리스트네\nA: 맞아! 근데 API 서비스라면 외부 개발자 온보딩도 따로 있어\n   Quick Start 문서, 샘플 코드, Sandbox 환경 이런 게 다 온보딩이야\nB: 그럼 AI 도구 도입할 때도 온보딩이 있겠네\nA: 당연하지. ChatGPT 도입하면 \"어떻게 써요?\"부터 막히잖아\n   그 과정 설계하는 게 AX 온보딩이야"}, {"id": "term_117", "term": "Config (설정 파일)", "term_en": "Configuration", "category": "Dev", "definition": "프로그램의 코드를 고치지 않고도 동작 방식을 바꿀 수 있게, 바꿀 값들을 따로 모아둔 것(설정).", "detail": "프로그램에는 '바뀌지 않는 로직(코드)'과 '상황마다 바뀌는 값(설정)'이 있다. 포트 번호, 도메인, 사용할 AI 모델, 알림 받을 채팅방 같은 값을 코드 안에 박아두면 바꿀 때마다 코드를 고쳐야 한다. 그래서 이런 값을 config 파일·환경변수로 빼둔다.\n\n설정을 담는 방법:\n• 설정 파일: config.yaml, config.json, settings.toml\n• 환경변수 파일: .env (비밀값은 주로 여기)\n• 명령어 옵션: --port 3010 처럼 실행할 때 지정\n\n[우리 서버 실제 사례]\n• Hermes: config.yaml 에 사용할 모델·도구 설정\n• OpenClaw(AutoPy): `openclaw config set commands.ownerAllowFrom ...` 으로 주인 등록\n• 서명 사이트: PORT, DATA_DIR, CREATE_KEY 를 환경변수로 주입(/root/axis-sign.env)", "related": ["YAML", "JSON", "환경변수", "배포"], "flow": ["① 바뀔 값을 코드에서 분리", "② config 파일/환경변수에 저장", "③ 프로그램 시작 시 읽어옴", "④ 값만 바꾸고 재시작 → 동작 변경"], "confusion": {"헷갈리는점": "config = 특정 파일 형식이라고 생각", "차이": "config는 '설정'이라는 개념 / YAML·JSON은 그 설정을 적는 '문법(형식)'", "기억법": "config = 가전제품 설정 메뉴, 코드 = 가전제품 내부 회로 — 설정만 바꿔도 동작이 바뀐다"}, "kakao_chat": "A: config 파일 고치라는데 그게 뭐야?\nB: 프로그램 설정 모음이야\nA: 코드랑 뭐가 달라?\nB: 코드는 기계 내부 회로, config는 설정 메뉴\n   포트 번호, 도메인, AI 모델 같은 걸 코드 안 고치고 바꿀 수 있어\nA: 아 그래서 서명 사이트 키도 파일로 넣은 거구나\nB: 맞아! 비밀값은 .env 같은 파일로 따로 빼두는 게 원칙이야", "added": "2026-10-19"}, {"id": "term_118", "term": "YAML", "term_en": "YAML Ain't Markup Language", "category": "Dev", "definition": "사람이 읽고 쓰기 쉽게 만든 설정 파일 문법. 들여쓰기와 '이름: 값' 형태로 정보를 적는다.", "detail": "YAML(야믈)은 주로 설정 파일(config)을 적을 때 쓰는 형식이다. 괄호·따옴표가 많은 JSON보다 눈으로 보기 편해서 Docker Compose, GitHub Actions, Kubernetes, Hermes 설정 등에 널리 쓰인다. 확장자는 .yaml 또는 .yml.\n\n예시 (같은 내용):\n• YAML\n  server:\n    port: 3010\n    domain: sign.axmaster.cloud\n• JSON\n  {\"server\": {\"port\": 3010, \"domain\": \"sign.axmaster.cloud\"}}\n\n규칙 3가지:\n① 들여쓰기(스페이스)로 계층 표현 — 탭 금지\n② '이름: 값' — 콜론 뒤에 한 칸 띄우기\n③ 목록은 '- 항목' 으로 적기\n\n[우리 서버 실제 사례] Hermes의 config.yaml, docker-compose.yml, GitHub hosts.yml(로그인 정보) 모두 YAML이다.", "related": ["Config", "JSON", "Docker Compose", "들여쓰기"], "flow": ["① 설정 내용 정하기", "② '이름: 값' + 들여쓰기로 작성", "③ .yaml/.yml 로 저장", "④ 프로그램이 읽어서 적용"], "confusion": {"헷갈리는점": "YAML과 JSON이 완전히 다른 것이라고 생각", "차이": "둘 다 같은 정보를 담는 '데이터 적는 문법' — YAML은 사람 눈에 편하고, JSON은 프로그램끼리 주고받기 편함", "기억법": "YAML = 손글씨 메모(들여쓰기로 정리), JSON = 서식 맞춘 공문(괄호로 정리)", "주의": "YAML은 들여쓰기 한 칸만 틀려도 에러 — 탭 대신 스페이스"}, "kakao_chat": "A: yaml 파일이 뭐야?\nB: 설정 적는 문법이야. 야믈이라고 읽어\nA: json이랑 뭐가 달라?\nB: 내용은 같은데 생김새가 달라\n   json은 { } 괄호 투성이, yaml은 들여쓰기로 정리해서 보기 편해\nA: 아 그래서 설정 파일은 yaml 많이 쓰는구나\nB: 응! docker-compose.yml, Hermes config.yaml 다 yaml이야\n   대신 들여쓰기 한 칸만 틀려도 에러 나니까 조심!", "added": "2026-10-19"}, {"id": "term_119", "term": "랄프 루프 (Ralph Loop)", "term_en": "Ralph Loop", "category": "Agent", "definition": "지시문 파일을 AI에게 계속 다시 먹이는 한 줄짜리 무한 반복 루프. 가장 단순한 루프 엔지니어링.", "detail": "[lecture_015 루프 엔지니어링 입문]\nGeoffrey Huntley가 2025년 7월 'Ralph'라고 부른 방식. 밤새 돌려 프로젝트를 완성했다.\n\n코드: while :; do cat PROMPT.md | claude ; done\n\n특징 3가지:\n• 매 바퀴 새 머리로 시작 — 지난 대화를 기억하지 않는다\n• 진행 상황은 파일에 적는다 — 다음 바퀴가 그걸 읽고 이어받는다\n• 테스트가 통과하면 저장(커밋), 아니면 다음 바퀴가 또 시도\n\n핵심 문장: 멍청할 만큼 단순해서 오히려 통한다.", "related": ["루프 엔지니어링", "진행 상황 파일 (Progress File)", "검증자 (Verifier)", "토큰"], "flow": ["① PROMPT.md(지시문 파일)를 읽는다", "② AI가 일한다", "③ 진행 상황을 파일에 적는다", "④ 테스트 통과 시 커밋", "⑤ 대화를 버리고 처음부터 다시(새 머리)", "⑥ 다음 바퀴가 진행 상황 파일을 읽고 이어받는다"], "confusion": {"헷갈리는점": "'기억을 안 넘기면 매번 처음부터 하는 것 아닌가?'", "차이": "대화 기억은 버리지만 진행 상황은 파일로 넘긴다. 일은 이어지고, 머리만 새로 시작한다", "기억법": "교대 근무자 — 사람은 바뀌어도 인수인계 노트는 남는다"}, "kakao_chat": "A: 랄프 루프라고 들어봤어?\nB: 아니, 그게 뭔데?\nA: 제일 단순한 루프야. 한 줄이면 돼\n   while :; do cat PROMPT.md | claude ; done\nB: 그냥 같은 지시를 계속 주는 거네?\nA: 맞아. 대신 매 바퀴 지난 대화는 기억 안 해. 새 머리로 시작해\nB: 그럼 했던 일을 또 하지 않아?\nA: 진행 상황을 파일에 적어 두거든. 다음 바퀴가 그 파일 읽고 이어서 해\n   테스트 통과하면 커밋하고, 실패하면 다음 바퀴가 또 시도하고\nB: 단순한데 그게 통한다고?\nA: 멍청할 만큼 단순해서 오히려 통한대. 교대 근무자 인수인계 노트 같은 거야", "added": "2026-10-21"}, {"id": "term_120", "term": "트리거 (Trigger)", "term_en": "Trigger", "category": "Agent", "definition": "루프를 언제 시작할지 정하는 조건. 시간(매일 8시) 또는 사건(PR이 열림, 알림 울림).", "detail": "[lecture_015 루프 엔지니어링 입문]\n루프 재료 6가지 중 첫 번째. 로봇청소기로 치면 '정해진 시간에 출발'.\n\n종류:\n• 시간 기반 — 매일 아침 8시, 5분마다 (/loop, 예약 작업)\n• 사건 기반 — PR이 열린다, 취약점 공지가 뜬다, 장애 알림이 울린다\n\n루프가 되려면 '시작 조건 + 검증 가능한 목표' 두 가지가 꼭 있어야 한다. 트리거가 그중 '시작 조건'.\n\n[우리 서버 실제 사례] Hermes 크론잡의 schedule(예: 0 8 * * *)이 시간 기반 트리거다.", "related": ["루프 엔지니어링", "크론 (Cron, 예약 작업)", "워크플로", "n8n"], "flow": ["① 시작 조건 정의 (시간 or 사건)", "② 조건 감시", "③ 조건 충족 → 루프 깨움", "④ 에이전트가 일 시작"], "confusion": {"헷갈리는점": "트리거만 있으면 루프라고 생각함", "차이": "트리거는 '언제 시작'일 뿐. 검사와 멈춤 조건이 없으면 루프가 아니라 그냥 예약 실행", "기억법": "알람시계 — 깨우는 것까지만 한다. 일어나서 뭘 할지는 따로 정해야 한다"}, "kakao_chat": "A: 루프에서 트리거가 뭔지 알아?\nB: 방아쇠? 시작 버튼 같은 거?\nA: 맞아. 루프를 언제 시작할지 정하는 조건이야\nB: 어떤 게 있어?\nA: 두 종류야. 시간 기반은 매일 아침 8시처럼 정해진 시각\n   사건 기반은 PR이 열리거나 장애 알림이 울릴 때\nB: 트리거만 있으면 루프 완성이야?\nA: 아니! 트리거는 알람시계일 뿐이야. 깨우는 것까지만 해\n   검사하고 멈추는 조건까지 있어야 루프가 돼", "added": "2026-10-21"}, {"id": "term_121", "term": "검증자 (Verifier)", "term_en": "Verifier", "category": "Agent", "definition": "AI가 만든 결과가 진짜 됐는지 확인하는 쪽. 만든 AI가 아닌 테스트·린터·다른 AI가 맡는다.", "detail": "[lecture_015 루프 엔지니어링 입문]\n핵심 문장: '끝났어요'는 주장이지 증명이 아니다. 루프의 '완료'는 AI의 말이 아니라 검사가 정한다.\n\n검증 수단:\n• 테스트, 타입 검사, 린터(코드 규칙 검사기)\n• 다른 AI의 리뷰(채점 AI) — 만드는 AI와 다른 컨텍스트로 분리\n\n카드뉴스 루프의 2층 검사:\n• 1층 기계 검사 — 글자 수·금칙어·해상도·숫자 출처 (확실히 판정 가능한 것)\n• 2층 채점 AI — 훅·한 장 한 메시지·행동 유도 (점수, 9점 이상)\n이걸 안 나누면 '생성 버튼 여러 번 누르기'가 된다.\n\n한계: 수치·날짜가 실제로 맞는지는 AI가 못 본다(출처 표기 여부까지만). 사실 확인은 사람 몫. AI가 테스트를 약하게 고쳐 '통과'하는 꼼수도 있으니 검사는 속일 수 없게 만들어야 한다.", "related": ["루프 엔지니어링", "Test (테스트 단계)", "흐름: 카드뉴스 루프 (2층 검사)", "하네스 (Harness)"], "flow": ["① 만드는 AI가 결과 제출 ('다 했어요')", "② 기계 검사 (테스트·린터·글자 수 등)", "③ 채점 AI 평가 (기준 점수)", "④ 미달 → '틀렸어, 다시' 돌려보냄", "⑤ 통과해야 '완료'", "⑥ 상한 도달 시 사람 호출"], "confusion": {"헷갈리는점": "AI에게 '스스로 검토해'라고 하면 검증이 된다고 생각함(자기 채점)", "차이": "자기 채점은 같은 머리가 자기 답을 맞다고 하는 것. 검증자는 만든 쪽과 떨어진 별도 검사", "기억법": "학생이 자기 시험지를 채점하지 않는다 — 채점은 선생님(검증자)이 한다"}, "kakao_chat": "A: AI가 '다 했어요' 하면 믿어도 돼?\nB: 다 했다는데 믿어야지?\nA: 그건 주장이지 증명이 아니야. 그래서 검증자가 필요해\nB: 검증자가 누군데?\nA: 만든 AI가 아닌 다른 쪽이야. 테스트, 린터, 아니면 다른 AI\nB: 그냥 같은 AI한테 '다시 검토해' 하면 안 돼?\nA: 그건 자기 채점이야. 학생이 자기 시험지 채점하는 거랑 같아\nB: 아 그래서 만드는 쪽이랑 검사하는 쪽을 떼어놓는구나\nA: 맞아. 근데 숫자나 날짜가 진짜 맞는지는 AI가 못 봐. 그건 사람 몫이야", "added": "2026-10-21"}, {"id": "term_122", "term": "진행 상황 파일 (Progress File)", "term_en": "Progress File", "category": "Agent", "definition": "루프가 어디까지 했는지 대화 밖 파일에 적어 두는 기록. 다음 바퀴가 이걸 읽고 이어받는다.", "detail": "[lecture_015 루프 엔지니어링 입문]\n대화가 길수록 AI는 흐려진다. 그래서 루프는 매 바퀴 새로 시작하고 진행 상황만 파일로 넘긴다.\n\n인용: \"에이전트는 잊는다. 저장소는 기억한다.\" — Addy Osmani\n\n루프 재료 6가지 중 하나: '어디까지 했는지. 대화 밖에 둔다.'\n해본 것은 진행 상황 파일에 남고, 바깥 개선 루프가 이 기록을 읽고 안쪽 루프를 고친다.\n\n예: 카드뉴스 루프의 cardnews/runs/log.md(전체 실행 기록).", "related": ["랄프 루프 (Ralph Loop)", "스킬 문서 (Skill Document)", "컨텍스트 엔지니어링", "루프 엔지니어링"], "flow": ["① 바퀴 시작 — 새 머리로 시작", "② 진행 상황 파일을 읽는다", "③ 이어서 일한다", "④ 한 일·남은 일을 파일에 적는다", "⑤ 바퀴 종료 — 대화는 버린다", "⑥ 다음 바퀴가 ②부터 반복"], "confusion": {"헷갈리는점": "진행 상황 파일과 스킬 문서를 같은 것으로 봄", "차이": "진행 상황 파일 = '이번 작업 어디까지 했나'(일지) / 스킬 문서 = '우리 프로젝트는 이렇게 한다'(규칙·지식)", "기억법": "진행 상황 파일 = 인수인계 노트, 스킬 문서 = 업무 매뉴얼"}, "kakao_chat": "A: 루프는 매 바퀴 기억을 안 넘긴다며. 그럼 일이 어떻게 이어져?\nB: 그러게, 매번 처음부터 하는 거 아냐?\nA: 진행 상황 파일이 있어. 어디까지 했는지 대화 밖 파일에 적어 둬\nB: 그냥 대화를 길게 이어가면 안 돼?\nA: 대화가 길수록 AI가 흐려져. 그래서 일부러 새로 시작해\n   '에이전트는 잊는다. 저장소는 기억한다' — Addy Osmani 말이야\nB: 스킬 문서랑은 뭐가 달라?\nA: 진행 상황 파일은 인수인계 노트, 스킬 문서는 업무 매뉴얼이야", "added": "2026-10-21"}, {"id": "term_123", "term": "스킬 문서 (Skill Document)", "term_en": "Skill Document", "category": "Agent", "definition": "우리 프로젝트의 지식과 규칙을 적어 둔 문서. 루프가 매 바퀴 읽어서 처음부터 다시 파악하지 않게 한다.", "detail": "[lecture_015 루프 엔지니어링 입문]\n루프 재료 6가지 중 하나: '우리 프로젝트의 지식과 규칙'.\n\n쓸수록 똑똑해지는 이유: 배운 것은 스킬 문서에 쌓인다. 스킬 문서가 없으면 매 바퀴 프로젝트를 처음부터 다시 파악해야 한다.\n바깥의 개선 루프가 기록을 읽고 안쪽 루프의 지시문과 도구를 고친다.\n\n[우리 서버 실제 사례] Hermes의 SKILL.md(예: lecture-knowledge-base, maro-ppt)가 스킬 문서다. 작업하면서 배운 절차·주의사항을 여기에 쌓는다.", "related": ["진행 상황 파일 (Progress File)", "루프 4종 (에이전트·검증·이벤트·개선 루프)", "컨텍스트 엔지니어링", "레시피 (Recipe)"], "flow": ["① 루프가 바퀴 시작 시 스킬 문서를 읽는다", "② 규칙대로 일한다", "③ 실패·발견한 것을 기록", "④ 개선 루프가 기록을 읽고 스킬 문서를 고친다", "⑤ 다음 바퀴부터 고쳐진 규칙 적용"], "confusion": {"헷갈리는점": "스킬 문서 = 프롬프트 한 번 잘 쓴 것", "차이": "프롬프트는 한 번의 지시. 스킬 문서는 계속 쌓이고 고쳐지는 프로젝트 지식", "기억법": "프롬프트 = 오늘 업무 지시, 스킬 문서 = 회사 업무 매뉴얼"}, "kakao_chat": "A: 루프가 쓸수록 똑똑해진다는 거 어떻게 가능해?\nB: AI가 스스로 학습하는 거야?\nA: 모델이 바뀌는 건 아니고, 스킬 문서에 배운 게 쌓여\nB: 스킬 문서가 뭔데?\nA: 우리 프로젝트의 지식과 규칙을 적어 둔 문서야\n   없으면 매 바퀴 프로젝트를 처음부터 다시 파악해야 해\nB: 프롬프트 잘 써두는 거랑 같은 거 아냐?\nA: 프롬프트는 오늘 업무 지시, 스킬 문서는 계속 고쳐지는 업무 매뉴얼이야\n   우리 Hermes의 SKILL.md가 딱 그거야", "added": "2026-10-21"}, {"id": "term_124", "term": "휴먼 인 더 루프 / 온 더 루프 (Human in/on the loop)", "term_en": "Human in the loop / Human on the loop", "category": "Agent", "definition": "in = 매 바퀴마다 사람이 끼어드는 방식. on = 사람은 루프를 설계하고 결과만 보는 방식.", "detail": "[lecture_015 루프 엔지니어링 입문]\n루프 엔지니어링의 장점 ②: 사람이 루프 '안'에서 루프 '위'로 올라간다.\n\n• Human in the loop — 매 바퀴(트리거 → 일·검사 → 다시) 사이사이에 사람이 끼어든다. 오늘날 대부분(턴 기반)\n• Human on the loop — 루프를 설계하고, 결과를 본다. 매 턴을 지켜보는 대신 루프가 잘 설계됐는지와 결과를 본다\n\n사람 개입 횟수 예: 기존 6번 → 루프로 2번(시작과 결과 확인). 레버리지 지점이 '한 번 잘 시키기'에서 '잘 시키는 시스템 만들기'로 옮겨갔다.\n\n주의: on the loop라도 사람이 사라지는 건 아니다. 보고서를 읽을 사람이 없는 루프는 살아남지 못하고, 돌릴 수 있는 루프 수는 사람의 리뷰 능력이 정한다.", "related": ["루프 엔지니어링", "위임 4단계 (턴·목표·시간·자율형)", "루프 안전장치 (예산 상한·사람 호출 지점)"], "flow": ["① (in) 사람 지시 → AI 실행 → 사람 확인 → 사람 재지시… 매 턴 반복", "② (on) 사람이 루프 설계 (트리거·검사·멈춤)", "③ 루프가 스스로 일·검사·재시도", "④ 사람은 결과·보고서만 확인", "⑤ 루프 설계를 고친다"], "confusion": {"헷갈리는점": "on the loop = 사람이 아예 빠진다", "차이": "사람이 빠지는 게 아니라 하는 일이 바뀐다. 매 턴 감시 → 설계와 최종 판단", "기억법": "in = 운전석에서 직접 운전 / on = 관제탑에서 항로 설계하고 지켜봄"}, "kakao_chat": "A: Human in the loop랑 on the loop 차이 알아?\nB: 전치사 하나 차이인데 뭐가 달라?\nA: in은 매 바퀴마다 사람이 끼어드는 거야. 해줘 → 했어요 → 테스트는? 이런 식\nB: 지금 우리가 AI 쓰는 방식이네\nA: 맞아. on은 사람이 루프를 설계하고 결과만 봐\n   사람 개입이 6번에서 2번으로 줄어\nB: 그럼 사람은 이제 필요 없는 거야?\nA: 아니! 하는 일이 바뀌는 거야. 매 턴 감시 대신 설계랑 최종 판단\n   보고서 읽을 사람이 없으면 루프는 살아남지 못해", "added": "2026-10-21"}, {"id": "term_125", "term": "위임 4단계 (턴·목표·시간·자율형)", "term_en": "Loop Delegation Levels", "category": "Agent", "definition": "AI에게 얼마나 넘길지에 따른 4단계: 턴 기반 → 목표 기반(/goal) → 시간 기반(/loop) → 자율형.", "detail": "[lecture_015 루프 엔지니어링 입문]\nAddy Osmani의 분류(2026.7).\n\n1. 턴 기반 — 매 턴 사람이 확인한다. 오늘 대부분이 여기\n2. 목표 기반 — '끝' 조건을 넘긴다. 테스트 다 통과할 때까지 (/goal)\n3. 시간 기반 — '언제'를 넘긴다. 매일 아침 8시, 5분마다 (/loop, 예약)\n4. 자율형 — '무엇을 할지'까지 넘긴다. 일을 스스로 찾는다\n\n아래로 갈수록 더 많이 넘긴다.\n원칙: 한 칸씩. 바로 꼭대기로 가지 않는다. 루프를 키우는 건 신뢰가 쌓인 다음.\n\n/goal, /loop는 2026년 3~5월 Claude Code·Codex 제품 안에 들어온 명령.", "related": ["휴먼 인 더 루프 / 온 더 루프 (Human in/on the loop)", "트리거 (Trigger)", "루프 엔지니어링", "흐름: 루프 도입 첫 주"], "flow": ["① 턴 기반: 매 턴 사람 확인", "② 목표 기반: 끝 조건 위임 (/goal)", "③ 시간 기반: 시작 시점 위임 (/loop, 예약)", "④ 자율형: 할 일 선택까지 위임", "※ 신뢰가 쌓일 때마다 한 칸씩 올라간다"], "confusion": {"헷갈리는점": "시간 기반(3단계)이 목표 기반(2단계)보다 더 어렵다는 게 직관과 다름", "차이": "목표 기반은 사람이 시작은 눌러줌. 시간 기반은 '언제 시작할지'까지 넘겨서 사람이 없어도 돈다", "기억법": "넘기는 것: 끝(언제 멈출지) → 언제(언제 시작할지) → 무엇(뭘 할지)"}, "kakao_chat": "A: AI한테 일을 얼마나 맡길지 4단계가 있대\nB: 4단계? 어떻게 나뉘어?\nA: 1단계 턴 기반은 매 턴 사람이 확인. 지금 대부분이 여기야\n   2단계 목표 기반은 '끝' 조건을 넘겨. 테스트 다 통과할 때까지 같은 거. /goal\nB: 3단계는?\nA: 시간 기반. '언제'를 넘겨. 매일 아침 8시처럼. /loop나 예약\n   4단계 자율형은 '무엇을 할지'까지 넘겨. 일을 스스로 찾아\nB: 바로 4단계로 가면 제일 좋겠네\nA: 그게 함정이야. 한 칸씩 올라가야 해. 신뢰가 쌓인 다음에", "added": "2026-10-21"}, {"id": "term_126", "term": "루프 4종 (에이전트·검증·이벤트·개선 루프)", "term_en": "Four Loops of Loop Engineering", "category": "Agent", "definition": "루프는 4겹으로 쌓인다: 일하는 에이전트 루프, 채점하는 검증 루프, 깨우는 이벤트 루프, 루프 자체를 고치는 개선 루프.", "detail": "[lecture_015 루프 엔지니어링 입문]\n출처 표기: LangChain, The Art of Loop Engineering (2026.6).\n\n안쪽 → 바깥:\n• 에이전트 루프 — 도구를 쓰며 일한다\n• 검증 루프 — 채점하고 돌려보낸다\n• 이벤트 루프 — 일이 생기면 깨어난다\n• 개선 루프 — 기록을 보고 루프 자체를 고친다\n\n쓸수록 똑똑해지는 원리: 배운 것은 스킬 문서에, 해본 것은 진행 상황 파일에 남고, 바깥 루프가 기록을 읽고 안쪽 루프의 지시문과 도구를 고친다.", "related": ["스킬 문서 (Skill Document)", "진행 상황 파일 (Progress File)", "검증자 (Verifier)", "트리거 (Trigger)"], "flow": ["① 이벤트 루프: 일이 생기면 깨어난다", "② 에이전트 루프: 일한다", "③ 검증 루프: 채점 → 미달이면 ②로 돌려보냄", "④ 결과·실패 기록이 파일에 쌓인다", "⑤ 개선 루프: 기록을 읽고 지시문·도구를 고친다"], "confusion": {"헷갈리는점": "'이벤트 루프'를 JavaScript의 이벤트 루프(비동기 처리 구조)와 혼동", "차이": "JS 이벤트 루프 = 프로그램 내부 실행 순서 관리 / 루프 엔지니어링의 이벤트 루프 = 사건이 생기면 AI 루프를 깨우는 바깥층", "기억법": "양파 4겹 — 안쪽에서 일하고, 그 바깥에서 채점하고, 그 바깥에서 깨우고, 맨 바깥에서 고친다"}, "kakao_chat": "A: 루프가 4겹으로 쌓인다는 거 알아?\nB: 루프가 하나가 아니야?\nA: 안쪽부터 에이전트 루프, 검증 루프, 이벤트 루프, 개선 루프야\nB: 하나씩 설명해줘\nA: 에이전트 루프는 일하고, 검증 루프는 채점해서 돌려보내\n   이벤트 루프는 일이 생기면 깨우고\n   개선 루프는 기록 보고 루프 자체를 고쳐\nB: 개선 루프가 있어서 쓸수록 똑똑해지는 거구나\nA: 맞아. 기록을 읽고 안쪽 루프의 지시문이랑 도구를 고치거든\n   JS 이벤트 루프랑은 다른 거니까 헷갈리지 마", "added": "2026-10-21"}, {"id": "term_127", "term": "루프 안전장치 (예산 상한·사람 호출 지점)", "term_en": "Loop Guardrails: Budget Cap & Human Escalation", "category": "Agent", "definition": "루프가 폭주하지 않게 하는 두 가지 장치: 반복·비용 상한, 그리고 막히면 사람을 부르는 지점.", "detail": "[lecture_015 루프 엔지니어링 입문]\n모든 자료가 공통으로 강조하는 안전장치 둘.\n\n• 예산 상한 — 반복 횟수 상한 + 하루 예산. 로봇청소기의 '배터리 부족하면 멈춤'\n• 사람 호출 지점 — 막히면 사람을 부른다. 로봇청소기의 '막히면 사람을 부름'\n\n토큰 소각로: 시작 조건과 검증 가능한 목표 중 하나라도 없으면 루프는 '자신만만한 토큰 소각로'가 된다(Louis Bouchard). CI를 고치려던 루프가 48시간에 800만 토큰을 태운 사례가 보고됐다.\n\n실제 예: 카드뉴스 루프는 최대 5바퀴 → 기준 9.0에 못 미치자(8.8) 루프가 멈추고 사람을 호출 → 사람이 브리프와 대조해 승인.\n\n추가: 건드리면 안 되는 곳(인증, 결제, 비밀키)은 금지 목록에 적는다.", "related": ["검증자 (Verifier)", "휴먼 인 더 루프 / 온 더 루프 (Human in/on the loop)", "토큰", "관제 (Monitoring & Control)"], "flow": ["① 반복 상한·하루 예산 설정", "② 금지 목록 작성 (인증·결제·비밀키)", "③ 루프 실행", "④ 상한 도달 or 막힘 감지", "⑤ 루프 멈춤 → 사람 호출", "⑥ 사람이 판단 (승인·수정·폐기)"], "confusion": {"헷갈리는점": "검증만 있으면 상한은 없어도 된다고 생각함", "차이": "검증은 '맞았나'를 본다. 상한은 '영원히 못 맞추면 언제 그만두나'를 정한다. 기준을 못 넘으면 검증만으로는 무한 반복", "기억법": "로봇청소기 — 센서(검증)가 있어도 배터리 한계(상한)와 '도와주세요' 알림(사람 호출)이 있어야 안 망가진다"}, "kakao_chat": "A: 루프에 꼭 넣어야 할 안전장치 두 개가 있어\nB: 뭔데?\nA: 예산 상한이랑 사람 호출 지점\nB: 검사만 잘하면 되는 거 아냐?\nA: 검사 기준을 영원히 못 넘으면? 계속 돌아. 그게 토큰 소각로야\n   CI 고치려던 루프가 48시간에 800만 토큰 태운 사례도 있어\nB: 헐… 그래서 상한이 필요하구나\nA: 응. 카드뉴스 루프도 최대 5바퀴로 정해놨는데\n   8.8점에서 멈추고 사람을 불렀어. 마지막 판단은 사람이 했고", "added": "2026-10-21"}, {"id": "term_128", "term": "크론 (Cron, 예약 작업)", "term_en": "Cron / Scheduled Job", "category": "Infra", "definition": "정해진 시간에 정해진 스크립트를 그대로 실행하는 서버의 예약 작업 기능.", "detail": "[lecture_015 루프 엔지니어링 입문]\n크론은 리눅스 서버의 예약 실행 기능. '0 8 * * *' 같은 표기로 매일 아침 8시를 뜻한다(분 시 일 월 요일).\n\n크론 vs 루프 (강의 핵심 대비):\n• 예약 작업(cron) — 정해진 시간에 정해진 스크립트를 그대로 실행. 상황이 달라져도 늘 같은 일만 하고 결과를 보지 않는다\n• 루프 — 정해진 시간에 지금 상태를 보고 다음 행동을 고르는 AI를 실행. 결과를 검사하고, 안 되면 다시 하고, 되면 멈춘다\n\n크론은 루프의 '시간 기반 트리거'로 쓰일 수 있다.\n\n[우리 서버 실제 사례] Hermes 크론잡 = 크론(트리거) + AI 에이전트 실행. 검사·멈춤 조건까지 넣으면 루프가 된다.", "related": ["트리거 (Trigger)", "루프 엔지니어링", "서버", "관제 (Monitoring & Control)"], "flow": ["① 시간 표기 작성 (예: 0 8 * * * = 매일 8시)", "② 실행할 작업 등록", "③ 지정 시각 도달", "④ 작업을 그대로 실행", "⑤ (결과를 보지 않고) 다음 예약까지 대기"], "confusion": {"헷갈리는점": "크론으로 AI를 매일 돌리면 루프 엔지니어링이다", "차이": "크론은 '언제'만 해결. 결과 검사·재시도·멈춤이 없으면 그냥 예약 실행. 루프는 결과를 보고 다음 행동을 고른다", "기억법": "크론 = 매일 같은 시간 울리는 알람 / 루프 = 알람에 일어나서 상황 보고 할 일 정하는 사람"}, "kakao_chat": "A: 크론이 뭔지 알아?\nB: 서버 용어 같은데 잘 몰라\nA: 정해진 시간에 정해진 작업을 그대로 실행하는 예약 기능이야\n   '0 8 * * *' 이렇게 쓰면 매일 아침 8시야\nB: 그럼 크론으로 AI 매일 돌리면 루프야?\nA: 아니, 그게 제일 헷갈리는 부분이야\n   크론은 결과를 안 봐. 상황이 바뀌어도 늘 같은 일만 해\nB: 루프는?\nA: 지금 상태 보고 다음 행동을 골라. 검사하고, 안 되면 다시, 되면 멈춰\n   크론은 루프를 깨우는 알람 역할로 쓰는 거야", "added": "2026-10-21"}, {"id": "term_129", "term": "흐름: 루프 기본 사이클", "term_en": "Flow: Basic Loop Cycle", "category": "Agent", "definition": "트리거 → 에이전트가 일한다 → 검증 → (통과) 완료·보고 / (실패) 다시. 상한 도달 시 사람 호출.", "one_line": "트리거 → 일 → 검증 → 완료(사람 확인) / 실패 시 다시", "detail": "[lecture_015 루프 엔지니어링 입문]\n공식: 루프 = 시작 조건 + 일 + 검사 + 멈춤 + 사람이 보는 지점\n로봇청소기 비유: 정해진 시간에 출발(트리거) → 청소(일) → 센서로 확인(검증) → 도킹(완료). 배터리 부족 = 상한선, 막히면 사람 부름 = 사람 호출 지점.", "related": ["루프 엔지니어링", "트리거 (Trigger)", "검증자 (Verifier)", "루프 안전장치 (예산 상한·사람 호출 지점)"], "flow": ["① 트리거 — 시간 또는 사건으로 시작", "② 에이전트 — 도구를 쓰며 일한다", "③ 검증 — 테스트·검사로 기계가 확인", "④ 실패 → ②로 돌아가 다시", "⑤ 통과 → 완료, 멈추고 사람에게 보고", "⑥ 상한 도달 → 멈추고 사람 호출", "⑦ 사람이 확인"], "confusion": {"헷갈리는점": "'완료'를 AI가 '다 했어요'라고 말한 시점으로 봄", "차이": "완료는 검증 통과 시점. AI의 말이 아니라 검사가 정한다", "기억법": "로봇청소기 — 센서가 '깨끗함'이라고 해야 도킹한다"}, "kakao_chat": "A: 루프가 어떻게 도는지 한 줄로 말해볼까?\nB: 좋아\nA: 트리거 → 일 → 검증 → 통과하면 완료, 실패하면 다시\nB: 로봇청소기 같네?\nA: 딱 그거야! 시간 되면 출발, 청소, 센서로 확인, 다 됐으면 도킹\n   배터리 없으면 멈추고, 막히면 사람 불러\nB: 완료는 AI가 다 했다고 할 때야?\nA: 아니, 검사를 통과했을 때야. 루프 = 시작 조건 + 일 + 검사 + 멈춤 + 사람이 보는 지점", "added": "2026-10-21"}, {"id": "term_130", "term": "흐름: 카드뉴스 루프 (2층 검사)", "term_en": "Flow: Card-news Loop with Two-layer Check", "category": "Agent", "definition": "월요일 아침 트리거 → 카드 7장 초안 → 기계 검사 → 채점 AI(9점 이상) → 실패 시 재시도(최대 5바퀴) → 사람이 사실 확인 후 게시.", "one_line": "초안 → 기계 검사 → 채점 AI → (최대 5바퀴) → 사람 승인", "detail": "[lecture_015 루프 엔지니어링 입문]\n실제 실행 결과(글만 채점): 기계 검사 5바퀴 모두 통과, 채점 7.8 → 8.0 → 8.6 → 8.8 → 8.8(기준 9.0 미달) → 5바퀴 상한에서 멈추고 사람 호출 → 사람이 브리프와 대조해 승인.\n채점 코멘트 예: '카드1 제목만 보면 누가 한 말인지 몰라 의외성이 죽음', '카드4 앤드류 응의 실험은 브리프에 없는 표현'.\n\n그림까지 채점(만드는 쪽에 손, 채점 쪽에 눈): 8.5 → 8.7 → 8.6 → 8.9 → 9.1로 5바퀴 통과. 하지만 카드2는 3바퀴 그림이 더 분명했고 시각 점수는 1.4 → 1.6으로 거의 그대로, 합계를 올린 건 글 항목.\n\n교훈: 루프는 점수를 올린다. 좋아진다는 보장은 없다. ①검사하는 것만 좋아진다 ②만드는 쪽이 고칠 수 있는 것만 고쳐진다 ③채점 기준이 일관되지 않으면 결과도 일관되지 않다.", "related": ["검증자 (Verifier)", "루프 안전장치 (예산 상한·사람 호출 지점)", "흐름: 루프 기본 사이클"], "flow": ["① 트리거: 월요일 아침", "② 주제 백로그에서 하나 선택, 브리프의 사실만 사용해 카드 7장 초안", "③ 기계 검사: 글자 수·금칙어·해상도·숫자 출처", "④ 채점 AI(다른 컨텍스트): 훅·한 장 한 메시지·행동 유도·출처 → 9점 이상?", "⑤ 미달 → ②로 재시도 (최대 5바퀴)", "⑥ 상한 도달 or 통과 → 검토 폴더", "⑦ 사람이 사실 확인 후 게시"], "confusion": {"헷갈리는점": "채점 점수가 올랐으니 결과물이 좋아졌다", "차이": "점수는 채점 기준이 보는 것만 반영. 실제 그림 품질은 그대로거나 나빠질 수도 있다", "기억법": "시험 점수 ≠ 실력 — 채점표에 없는 건 안 좋아진다"}, "kakao_chat": "A: 루프로 카드뉴스 만든 실험 알아?\nB: 어떻게 했는데?\nA: 초안 7장 → 기계 검사 → 채점 AI가 9점 이상인지 봐. 최대 5바퀴\nB: 결과는?\nA: 7.8에서 8.8까지 올랐는데 9.0을 못 넘었어. 5바퀴에서 멈추고 사람 불렀지\nB: 그림까지 보게 하면 더 좋아지지 않아?\nA: 점수는 9.1로 통과했어. 근데 어떤 카드는 3바퀴 그림이 더 나았어\n   시각 점수는 거의 그대로고 글 점수가 합계를 올린 거야\nB: 점수가 오른다고 좋아지는 건 아니구나\nA: 맞아. 검사하는 것만 좋아져. 이게 이 실험의 교훈이야", "added": "2026-10-21"}, {"id": "term_131", "term": "흐름: 루프 도입 첫 주", "term_en": "Flow: First Week of Loop Adoption", "category": "AX", "definition": "루프 하나 고르기 → 보고만 하기 → 상한·예산 정하기 → 금지 목록 → 읽을 사람 정하기. 키우는 건 신뢰가 쌓인 다음.", "one_line": "하나만 고른다 → 보고만 → 상한·예산 → 금지 목록 → 읽을 사람", "detail": "[lecture_015 루프 엔지니어링 입문]\n'보고'가 결과물인 루프(예: 아침 정리 루프 — 매일 8시 어제의 실패 테스트·새 이슈·커밋을 읽고 한 장 보고서)부터 시작한다.\n\n안 맞는 일: 한 번 하고 말 일, 하면서 요구사항이 정해지는 일 → 그냥 직접 시키는 게 빠르다. 루프는 목표를 지키는 데 강하고 목표를 정하는 데 약하다.", "related": ["위임 4단계 (턴·목표·시간·자율형)", "루프 안전장치 (예산 상한·사람 호출 지점)", "휴먼 인 더 루프 / 온 더 루프 (Human in/on the loop)"], "flow": ["① 루프 하나만 고른다 — '보고'가 결과물인 것부터 (아침 정리 루프)", "② 첫 주는 보고만 한다. 고치지 않는다", "③ 반복 상한과 하루 예산을 정한다", "④ 건드리면 안 되는 곳을 금지 목록에 — 인증, 결제, 비밀키", "⑤ 보고서를 읽을 사람을 정한다", "⑥ 신뢰가 쌓이면 한 칸씩 키운다 (보고 → 작은 수정 → PR 초안)"], "confusion": {"헷갈리는점": "처음부터 AI가 직접 고치게 해야 효과가 있다", "차이": "첫 주는 보고만. 고치는 권한은 신뢰가 쌓인 다음", "기억법": "신입 첫 주 — 보고서부터 쓰게 하고, 결재 권한은 나중에"}, "kakao_chat": "A: 루프 처음 도입할 때 첫 주에 뭐 하는지 알아?\nB: 일단 다 자동으로 고치게 하는 거 아냐?\nA: 반대야. 첫 주는 보고만 해. 고치지 않아\nB: 왜?\nA: 신입 첫 주에 결재 권한 안 주잖아. 보고서부터 쓰게 하지\nB: 그 다음은?\nA: 반복 상한이랑 하루 예산 정하고, 인증·결제·비밀키는 금지 목록에 넣어\n   그리고 보고서 읽을 사람을 꼭 정해\nB: 읽을 사람까지?\nA: 읽는 사람 없는 루프는 살아남지 못한대. 키우는 건 신뢰가 쌓인 다음이야", "added": "2026-10-21"}, {"id": "term_132", "term": "SSL/TLS", "term_en": "Secure Sockets Layer / Transport Layer Security", "category": "Infra", "definition": "인터넷 통신을 암호화하고, 접속한 서버가 진짜인지 확인해 주는 보안 규약. SSL은 옛 이름, 지금 실제로 쓰는 건 TLS.", "detail": "TLS가 해 주는 일 3가지:\n• 암호화 — 중간에서 훔쳐봐도 내용을 못 읽는다\n• 서버 신원 확인 — 인증서로 '이 서버가 진짜 sign.axmaster.cloud 맞다'를 증명\n• 변조 방지 — 오가는 내용이 중간에 바뀌면 알아챈다\n\n역사: SSL 2.0·3.0(구식, 취약점으로 폐기) → TLS 1.0·1.1(폐기) → TLS 1.2(현역) → TLS 1.3(최신, 2018). 습관적으로 'SSL 인증서'라고 부르지만 실제 통신은 TLS다.\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] sign.axmaster.cloud, meeting.axmaster.cloud 모두 TLS 1.3 + 암호 방식 TLS_AES_128_GCM_SHA256으로 통신 중. 브라우저 검증 결과 'Verify return code: 0 (ok)'.", "related": ["HTTPS", "인증서 (SSL/TLS Certificate)", "흐름: TLS 핸드셰이크", "프로토콜 (Protocol)"], "flow": ["① 브라우저가 https:// 주소로 접속", "② 서버가 인증서를 보여준다", "③ 브라우저가 인증서를 검증한다", "④ 둘이 비밀 열쇠(세션 키)를 만든다", "⑤ 이후 모든 내용이 암호화돼 오간다"], "confusion": {"헷갈리는점": "SSL과 TLS를 다른 기술로 생각함", "차이": "TLS는 SSL의 후속 버전. 지금 쓰는 건 전부 TLS이고 'SSL'은 관습적 이름일 뿐", "기억법": "SSL = 옛날 상표명, TLS = 지금 제품명. '스카치테이프'처럼 이름만 남았다"}, "kakao_chat": "A: SSL이랑 TLS 차이 알아?\nB: 둘 다 보안 인증 아니야? 다른 거야?\nA: 같은 계열이야. SSL이 옛날 버전이고 TLS가 후속 버전\n   SSL은 취약점 때문에 다 폐기됐어\nB: 근데 왜 다들 SSL 인증서라고 해?\nA: 습관이야. 이름만 남은 거지. 실제 통신은 다 TLS야\n   우리 VPS도 확인해 보니 TLS 1.3으로 통신하고 있어\nB: TLS가 정확히 뭘 해주는데?\nA: 세 가지야. 내용 암호화, 서버가 진짜인지 확인, 중간에 바뀌면 알아채기", "added": "2026-10-22"}, {"id": "term_133", "term": "HTTPS", "term_en": "HTTP Secure", "category": "Infra", "definition": "HTTP 통신을 TLS로 감싸서 암호화한 것. 주소창의 🔒 표시가 HTTPS라는 뜻.", "detail": "HTTP + TLS = HTTPS.\n• HTTP — 80번 포트, 평문(누구나 내용을 읽을 수 있음)\n• HTTPS — 443번 포트, 암호화\n\n'HTTP가 인증을 받으면 HTTPS가 된다'의 정확한 뜻: 서버가 인증기관에서 인증서를 받아 설치하면, 그 서버와의 HTTP 통신이 TLS로 감싸져 HTTPS가 된다. 인증서 자체가 암호화를 하는 게 아니라, 인증서로 신원을 증명하고 그 뒤에 만든 세션 키로 암호화한다.\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] http://sign.axmaster.cloud로 접속하면 Traefik이 308 Permanent Redirect로 https://로 자동으로 보낸다. 사용자가 http로 쳐도 결국 HTTPS로 통신한다.", "related": ["SSL/TLS", "인증서 (SSL/TLS Certificate)", "Traefik (트래픽)", "포트 (Port)"], "flow": ["① 사용자가 http://주소 입력", "② 서버(Traefik)가 https://로 리다이렉트(308)", "③ 443번 포트로 TLS 연결 시작", "④ 인증서 검증 + 세션 키 생성", "⑤ 암호화된 HTTP 통신 = HTTPS"], "confusion": {"헷갈리는점": "🔒 표시가 있으면 '안전한 사이트'라고 생각함", "차이": "🔒는 '통신이 암호화됐고 주소의 주인이 맞다'는 뜻일 뿐, 그 사이트가 착한 사이트라는 보증이 아니다. 피싱 사이트도 무료 인증서로 🔒를 달 수 있다", "기억법": "🔒 = 봉투가 밀봉됐다는 뜻. 편지 내용이 진실이라는 뜻이 아니다"}, "kakao_chat": "A: HTTP랑 HTTPS 차이가 뭔지 알아?\nB: S가 붙으면 보안이 된다는 거?\nA: 맞아. HTTP를 TLS로 감싼 게 HTTPS야\n   HTTP는 엽서, HTTPS는 밀봉된 편지라고 생각하면 돼\nB: 그럼 자물쇠 있으면 안전한 사이트지?\nA: 그게 함정이야! 자물쇠는 '봉투가 밀봉됐다'는 뜻일 뿐이야\n   피싱 사이트도 무료 인증서로 자물쇠 달 수 있어\nB: 헐 그렇구나\nA: 우리 서버는 http로 들어와도 Traefik이 https로 자동으로 돌려보내", "added": "2026-10-22"}, {"id": "term_134", "term": "인증서 (SSL/TLS Certificate)", "term_en": "SSL/TLS Certificate", "category": "Infra", "definition": "'이 서버는 이 주소의 진짜 주인이다'를 인증기관이 보증해 주는 디지털 신분증. 공개키와 유효기간이 들어 있다.", "detail": "인증서에 들어 있는 것:\n• 주소(Subject/SAN) — 어느 도메인용인지\n• 발급자(Issuer) — 누가 보증했는지\n• 유효기간 — 언제부터 언제까지\n• 공개키 — 암호 연결에 쓰는 열쇠\n• 발급자의 서명 — 위조 방지\n\n확인 수준 3단계:\n• DV(도메인 인증) — 주소의 주인인지만 확인. 자동·무료 (Let's Encrypt)\n• OV(기관 인증) — 회사 실체까지 확인\n• EV(확장 인증) — 가장 엄격한 법인 확인\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인]\n• sign.axmaster.cloud — Let's Encrypt(YR1) 발급, 2026-10-19 ~ 2027-01-17 (90일), RSA 4096bit\n• meeting.axmaster.cloud — Let's Encrypt(YR2) 발급, 2026-09-15 ~ 2026-12-14 (90일)\n• axmaster.cloud(녹음기) — Let's Encrypt(YE2), 단 VPS가 아니라 호스팅어 CDN이 관리\n• IP로 직접 접속(https://168.231.118.60) — 'TRAEFIK DEFAULT CERT'(자체 서명 가짜 인증서)가 나와 브라우저 경고. IP 주소에는 정식 인증서를 받지 않는다", "related": ["인증 기관 (CA)", "Let's Encrypt", "인증서 체인 (Chain of Trust)", "SSL/TLS"], "flow": ["① 서버가 인증기관에 인증서 요청", "② 인증기관이 도메인 주인인지 확인", "③ 인증서 발급 (공개키 + 서명 + 유효기간)", "④ 서버(Traefik)에 설치", "⑤ 접속할 때마다 브라우저에 제시", "⑥ 만료 전에 갱신"], "confusion": {"헷갈리는점": "인증서가 암호화를 직접 한다고 생각함", "차이": "인증서는 신원 증명용 신분증. 실제 암호화는 연결할 때 새로 만드는 세션 키가 한다", "기억법": "인증서 = 신분증, 세션 키 = 그날 쓰는 일회용 열쇠"}, "kakao_chat": "A: 인증서가 정확히 뭐야?\nB: 보안 프로그램 같은 거 아니야?\nA: 디지털 신분증이야. '이 서버가 진짜 sign.axmaster.cloud 주인이다'를 보증해 줘\nB: 누가 보증해?\nA: 인증기관. 우리 서버는 Let's Encrypt가 보증했어\n   sign은 10월 19일에 받아서 내년 1월 17일까지야\nB: 그럼 인증서가 암호화도 해?\nA: 아니, 신분 확인까지만. 암호화는 그때그때 만드는 세션 키가 해\nB: IP로 들어가면 경고 뜨던데?\nA: IP 주소엔 정식 인증서를 안 줘서 Traefik 임시 인증서가 나와서 그래", "added": "2026-10-22"}, {"id": "term_135", "term": "인증 기관 (CA)", "term_en": "Certificate Authority", "category": "Infra", "definition": "인증서를 발급하고 '이 서버는 진짜다'라고 보증해 주는 신뢰 기관. 브라우저가 미리 믿는 목록에 들어 있다.", "detail": "브라우저·운영체제는 믿을 수 있는 최상위 인증기관(루트 CA) 목록을 처음부터 갖고 있다. 이 목록에 있는 기관이 보증한 인증서만 🔒로 통과시킨다.\n\n대표 인증기관: Let's Encrypt(ISRG, 무료), DigiCert, Sectigo, GlobalSign, Google Trust Services.\n\n인증기관이 아무 데서나 발급하지 않도록 엄격한 감사를 받고, 잘못 발급하면 브라우저 신뢰 목록에서 퇴출된다.\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] 우리 VPS 인증서의 보증 기관은 Let's Encrypt, 그 위 최상위는 ISRG Root X1.", "related": ["인증서 (SSL/TLS Certificate)", "인증서 체인 (Chain of Trust)", "Let's Encrypt"], "flow": ["① 브라우저에 루트 CA 목록이 미리 들어 있음", "② 서버가 인증서 제시", "③ 브라우저가 발급자를 따라 올라감", "④ 목록에 있는 루트 CA에 닿으면 신뢰", "⑤ 닿지 않으면 '안전하지 않음' 경고"], "confusion": {"헷갈리는점": "인증기관이 사이트 내용까지 심사한다고 생각함", "차이": "DV 인증서 기준으로는 '주소의 주인인가'만 확인. 사이트가 정직한지는 보지 않는다", "기억법": "인증기관 = 주민센터. 신분증은 떼 주지만 그 사람이 착한지는 보증 안 한다"}, "kakao_chat": "A: 인증기관(CA)이 뭔지 알아?\nB: 인증서 주는 곳?\nA: 맞아. '이 서버 진짜다'라고 보증해 주는 기관이야\nB: 아무나 인증기관 할 수 있어?\nA: 아니. 브라우저가 미리 믿는 목록이 있어서 거기 있어야 해\n   잘못 발급하면 목록에서 퇴출돼\nB: 우리 서버는 어디서 받았어?\nA: Let's Encrypt. 그 위 최상위가 ISRG Root X1이야\n   주민센터가 신분증 떼 주는 거랑 비슷해", "added": "2026-10-22"}, {"id": "term_136", "term": "Let's Encrypt", "term_en": "Let's Encrypt", "category": "Infra", "definition": "무료로, 자동으로 인증서를 발급해 주는 비영리 인증기관. 인증서 유효기간은 90일.", "detail": "운영: ISRG(Internet Security Research Group, 비영리). 2015년 시작, 'HTTPS를 모두에게'가 목표.\n\n특징:\n• 무료\n• 사람 손 없이 자동 발급·갱신 (ACME 규약)\n• 유효기간 90일 — 짧게 해서 유출 피해를 줄이고 자동 갱신을 강제\n• DV(도메인 인증)만 발급\n• IP 주소가 아니라 도메인 이름에만 발급(일반적인 사용 기준)\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] VPS의 Traefik이 Let's Encrypt에서 sign·meeting 인증서를 자동으로 받아 왔다. 사람이 신청하거나 돈을 낸 적이 없다. 만료 약 30일 전에 Traefik이 알아서 갱신한다.", "related": ["ACME (자동 인증서 발급 규약)", "Traefik (트래픽)", "인증서 (SSL/TLS Certificate)", "흐름: HTTPS 인증서 자동 발급"], "flow": ["① Traefik이 ACME로 인증서 요청", "② Let's Encrypt가 도메인 확인 숙제 출제", "③ Traefik이 숙제 제출", "④ Let's Encrypt가 직접 접속해 확인", "⑤ 90일 인증서 발급", "⑥ 약 60일째 자동 갱신"], "confusion": {"헷갈리는점": "무료니까 유료 인증서보다 보안이 약하다고 생각함", "차이": "암호화 강도는 유료와 같다. 차이는 확인 범위(DV만)와 보증·지원 서비스", "기억법": "무료 자물쇠도 자물쇠 품질은 같다. 열쇠공 보증서가 없을 뿐"}, "kakao_chat": "A: Let's Encrypt 들어봤어?\nB: 아니, 뭔데?\nA: 인증서를 무료로, 자동으로 주는 기관이야\nB: 무료면 보안이 약한 거 아니야?\nA: 암호화 강도는 유료랑 똑같아\n   차이는 회사 신원까지 확인 안 하고 주소 주인만 확인한다는 거야\nB: 유효기간은?\nA: 90일. 짧은 대신 자동으로 갱신돼\n   우리 VPS도 Traefik이 알아서 받아 오고 갱신해. 우리가 신청한 적 없어", "added": "2026-10-22"}, {"id": "term_137", "term": "ACME (자동 인증서 발급 규약)", "term_en": "ACME (Automatic Certificate Management Environment)", "category": "Infra", "definition": "서버 프로그램이 사람 없이 인증기관과 대화해서 인증서를 받고 갱신하는 표준 규약. 대표 확인 방식이 HTTP-01.", "detail": "Let's Encrypt가 만든 규약으로, 지금은 국제 표준(RFC 8555)이다.\n\n도메인 주인 확인 방식(챌린지):\n• HTTP-01 — 'http://주소/.well-known/acme-challenge/암호'에 파일을 올려 증명. 80번 포트가 열려 있어야 함\n• DNS-01 — DNS에 특정 TXT 기록을 올려 증명. 와일드카드(*.도메인) 인증서 가능\n• TLS-ALPN-01 — 443번 포트에서 특수 TLS 응답으로 증명\n\nACME를 쓰는 프로그램: Traefik(내장), Caddy(내장), certbot(nginx·apache용).\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] 우리 Traefik은 HTTP-01 방식으로 설정돼 있다(인증 담당 이름 letsencrypt). 그래서 DNS A 레코드가 VPS를 가리키고 80번 포트가 열려 있어야 인증서가 나온다.", "related": ["Let's Encrypt", "Traefik (트래픽)", "DNS", "흐름: HTTPS 인증서 자동 발급"], "flow": ["① 계정 등록 (서버 ↔ 인증기관)", "② 도메인 인증서 주문", "③ 인증기관이 챌린지(숙제) 출제", "④ 서버가 숙제 수행 (HTTP-01: 파일 올리기)", "⑤ 인증기관이 확인", "⑥ 인증서 발급 → 서버 저장"], "confusion": {"헷갈리는점": "ACME를 인증기관 이름이나 프로그램 이름으로 생각함", "차이": "ACME는 '대화 규칙(규약)'. Let's Encrypt는 기관, Traefik·certbot은 그 규칙을 쓰는 프로그램", "기억법": "ACME = 주문서 양식, Let's Encrypt = 가게, Traefik = 주문서를 대신 내는 비서"}, "kakao_chat": "A: ACME가 뭔지 알아?\nB: 만화에 나오는 회사 이름 같은데?\nA: ㅋㅋ 여기선 인증서 자동 발급 규칙이야\n   서버 프로그램이 사람 없이 인증기관이랑 대화하는 방법\nB: 어떻게 주인인지 확인해?\nA: 숙제를 내. HTTP-01 방식이면 그 주소에 암호 파일을 올려 보라고 해\n   인증기관이 직접 들어가서 파일 있으면 통과\nB: 우리 서버도 그거야?\nA: 응, HTTP-01이야. 그래서 DNS가 VPS를 가리켜야 인증서가 나와", "added": "2026-10-22"}, {"id": "term_138", "term": "인증서 체인 (Chain of Trust)", "term_en": "Certificate Chain / Chain of Trust", "category": "Infra", "definition": "우리 인증서 → 중간 인증기관 → 최상위(루트) 인증기관으로 이어지는 보증의 사슬. 브라우저는 이 사슬을 따라 올라가 루트에 닿으면 믿는다.", "detail": "왜 사슬인가: 최상위(루트) 열쇠는 너무 중요해서 금고에 보관(오프라인)하고, 평소 발급은 중간 인증기관이 한다. 중간이 털려도 루트는 안전하게 남는다.\n\n3층 구조:\n• 서버 인증서(Leaf) — 우리 도메인용\n• 중간 인증서(Intermediate) — 실제 발급 담당\n• 루트 인증서(Root) — 브라우저에 미리 내장\n\n[우리 서버 실제 사례 · 2026-10-22 직접 확인] sign.axmaster.cloud 체인:\nCN=sign.axmaster.cloud → Let's Encrypt YR1(중간) → ISRG Root YR → ISRG Root X1(루트)\naxmaster.cloud
