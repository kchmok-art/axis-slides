<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 용어집</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#16181d;--sub:#5b6170;--line:#e4e7ee;--accent:#4f46e5;
  --LLM:#7c3aed;--ML:#0891b2;--Agent:#db2777;--AX:#ea580c;--Dev:#2563eb;--Infra:#059669;--FLOW:#ca8a04;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
body{overflow-wrap:anywhere;word-break:keep-all;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#1e1b4b,#4338ca);color:#fff;padding:36px 24px 28px}
header .in{max-width:1200px;margin:0 auto}
header h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
header p{opacity:.8;font-size:14px;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-size:13px}
.stat b{font-size:16px;margin-right:4px}
.bar{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:220px;padding:11px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;outline:none;background:#fff}
#q:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--sub);white-space:nowrap}
.chip.on{color:#fff;border-color:transparent}
main{max-width:1200px;margin:0 auto;padding:20px 24px 60px}
.count{font-size:13px;color:var(--sub);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;border-top:4px solid var(--c)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,20,60,.08)}
.card .cat{font-size:11px;font-weight:700;color:var(--c);letter-spacing:.5px}
.card h3{font-size:17px;margin:4px 0 2px;letter-spacing:-.3px}
.card .en{font-size:12px;color:var(--sub)}
.card .def{font-size:13.5px;color:#333;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--sub);padding:60px 0}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,30,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.ov.show{display:flex}
.md{min-width:0;background:#fff;border-radius:18px;max-width:760px;width:100%;padding:28px;position:relative;border-top:6px solid var(--c)}
.x{position:absolute;top:14px;right:16px;border:0;background:#f1f2f6;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.md .cat{font-size:12px;font-weight:700;color:var(--c)}
.md h2{font-size:26px;letter-spacing:-.5px;margin:2px 0}
.md .en{color:var(--sub);font-size:14px}
.oneline{background:#f5f5ff;border-left:4px solid var(--c);padding:12px 14px;border-radius:8px;margin:16px 0;font-weight:600}
.sec{margin-top:18px}
.sec h4{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.sec .txt{white-space:pre-wrap;font-size:14.5px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:#f3f4f8;border-radius:8px;padding:6px 10px;font-size:13px}
.flow i{color:var(--c);font-style:normal;font-weight:700}
.conf{background:#fff8eb;border:1px solid #fde4b0;border-radius:10px;padding:12px 14px;font-size:14px}
.conf div+div{margin-top:4px}
.conf b{color:#b45309}
ul.li{padding-left:18px;font-size:14.5px}
.kv{font-size:14px}
.kv div{padding:4px 0;border-bottom:1px dashed var(--line)}
.kv b{color:var(--c)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{background:#eef0ff;color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;text-decoration:none}
.rel a.off{background:#f1f2f6;color:var(--sub);cursor:default}
.chat{background:#b2c7da;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13.5px;white-space:pre-wrap}
.bub.A{background:#fee500;align-self:flex-end;border-top-right-radius:4px}
.bub.B{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.who{font-size:11px;color:#3b4a5a;margin-bottom:-2px}
.who.A{align-self:flex-end}
.foot{font-size:12px;color:var(--sub);margin-top:20px}
/* mobile mode */
body.m header{padding:24px 16px 18px}
body.m header h1{font-size:24px}
body.m .bar .in{padding:10px 12px;gap:8px}
body.m #q{min-width:0;width:100%;font-size:16px}
body.m .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
body.m main{padding:14px 12px 50px}
body.m .grid{grid-template-columns:1fr;gap:10px}
body.m .ov{padding:0;align-items:flex-end}
body.m .md{border-radius:18px 18px 0 0;padding:22px 18px 30px;min-height:70vh}
body.m .md h2{font-size:22px}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .md{padding:22px 18px}
}
</style>
</head>
<body class="m">
<header><div class="in">
  <h1>📚 AI 용어집</h1>
  <p>AI · AX · 개발 · 인프라 핵심 용어 모음 · 업데이트 2026-10-19</p>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="in">
  <input id="q" type="search" placeholder="용어·영문·설명 검색 (예: 도커, RAG, 라우터)">
  <div class="chips" id="chips"></div>
</div></div>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>
const DATA = {"meta": {"title": "AI 용어집", "description": "AI·AX·개발 관련 핵심 용어 정의 모음", "version": 1, "last_updated": "2026-10-19", "total": 118, "flow_rule": "연결흐름이 나오면 '흐름: {이름}' 형태로 별도 용어로 저장. flow 배열에 단계별 정리."}, "terms": [{"id": "term_001", "term": "라우터", "term_en": "Router", "category": "Dev", "definition": "네트워크에서 데이터 패킷을 목적지까지 경로를 정해 전달하는 장치 또는 소프트웨어 컴포넌트.", "detail": "두 가지 맥락에서 쓰인다.\n① 네트워크 라우터: 인터넷에서 데이터 패킷이 출발지에서 목적지까지 가는 '경로(route)'를 결정하는 하드웨어 장치. 집에 있는 공유기가 대표적 예시.\n② 웹 프레임워크 라우터: 프론트엔드(React, Vue 등)나 백엔드(Express, FastAPI 등)에서 특정 URL 경로(path)에 어떤 화면이나 함수를 연결할지 결정하는 소프트웨어 컴포넌트. 예: '/login' URL → 로그인 화면, '/api/users' → 유저 목록 함수.", "related": ["라우팅", "URL", "API", "프론트엔드", "백엔드"], "added": "2026-10-05", "flow": ["① 패킷 수신", "② 목적지 IP 확인", "③ 라우팅 테이블 조회", "④ 최적 경로 선택", "⑤ 다음 라우터로 전달"], "confusion": {"헷갈리는점": "라우터(장치)와 라우팅(행위) 혼동", "차이": "라우터 = 경로를 정하는 장치 / 라우팅 = 경로를 정하는 행위", "기억법": "라우터 = 네비게이션 기기 / 라우팅 = 네비게이션이 하는 길 안내"}, "kakao_chat": "A: 야 React 프로젝트 하는데 라우터 설정하다가 막혔어\nB: 라우터? 그거 집에 있는 와이파이 공유기 아니야?\nA: ㅋㅋ 그것도 라우터긴 한데, 웹 개발에서는 URL 경로에 맞는 화면 연결해주는 걸 말해\n   예를 들어 '/login' 들어오면 로그인 화면, '/home' 들어오면 홈 화면 이런 식으로\nB: 아 그럼 URL마다 다른 화면 보여주는 규칙이네?\nA: 맞아! 그리고 네트워크 라우터도 원리는 비슷해\n   데이터 패킷 받으면 목적지 보고 어디로 보낼지 경로 정해주는 거야\nB: 그럼 라우터랑 라우팅은 다른 거야?\nA: 라우터는 경로 정하는 장치나 컴포넌트고, 라우팅은 경로 정하는 행위야\n   네비게이션 기기(라우터)가 길 안내(라우팅) 하는 것처럼"}, {"id": "term_002", "term": "라우팅", "term_en": "Routing", "category": "Dev", "definition": "요청이 들어왔을 때 URL 경로에 따라 알맞은 화면이나 기능으로 연결하는 과정.", "detail": "두 가지 맥락에서 쓰인다.\n① 네트워크 라우팅: 데이터 패킷이 인터넷을 통해 목적지까지 가장 효율적인 경로를 찾아가는 과정. 라우터들이 서로 정보를 교환하며 최적 경로를 결정한다.\n② 웹 라우팅: 사용자가 특정 URL로 이동했을 때 그에 맞는 페이지나 API 함수를 실행하는 것. 프론트엔드에서는 페이지 이동 없이 URL만 바꾸는 클라이언트 사이드 라우팅(SPA)이 대표적. 예: '/home' → 홈 화면, '/profile' → 프로필 화면.", "related": ["라우터", "URL", "SPA", "React Router", "프론트엔드", "백엔드", "API"], "added": "2026-10-05", "flow": ["① URL 입력 또는 요청 발생", "② 라우터가 경로 확인", "③ 매칭되는 규칙 탐색", "④ 해당 화면·함수로 연결", "⑤ 결과 반환"], "confusion": {"헷갈리는점": "네트워크 라우팅과 웹 라우팅 혼동", "차이": "네트워크 라우팅 = 패킷 경로 결정 / 웹 라우팅 = URL→화면 연결", "기억법": "URL 주소창이 바뀌면 라우팅이 일어난 것"}, "kakao_chat": "A: 왜 주소창에 URL 입력하면 화면이 바뀌는 거야?\nB: 그냥 화면 새로 불러오는 거 아니야?\nA: 그게 바로 라우팅이야. URL 경로 보고 맞는 화면이나 기능으로 연결해주는 과정\nB: 아 URL마다 담당 화면이 있는 거구나\nA: 맞아. 웹에서는 프론트/백엔드 두 곳에서 다 일어나\n   프론트는 페이지 이동 없이 URL만 바꾸는 클라이언트 라우팅\n   백엔드는 '/api/users' 요청 오면 유저 목록 함수 실행하는 거\nB: 근데 네트워크 라우팅이랑은 다른 거야?\nA: 원리는 비슷한데 맥락이 달라. 네트워크 라우팅은 데이터 패킷이 인터넷에서 목적지까지 경로 찾는 거고\n   웹 라우팅은 URL→화면 연결이야. 주소창 바뀌면 라우팅 일어난 거라고 기억해"}, {"id": "term_003", "term": "토큰", "term_en": "Token", "category": "LLM", "definition": "LLM이 텍스트를 읽고 처리하는 가장 작은 단위. 글자 수와 다르다.", "detail": "LLM은 텍스트를 글자 단위가 아니라 '토큰' 단위로 읽는다.\n영어는 단어 하나가 보통 토큰 1개. 한국어는 글자 1~2개가 토큰 1개인 경우가 많아 같은 내용을 영어보다 더 많은 토큰이 필요하다.\n예: '안녕하세요' → 약 5~7토큰 / 'Hello' → 1토큰.\n토큰 수가 중요한 이유: API 비용이 토큰 수로 계산되고, 모델이 한 번에 처리할 수 있는 최대 토큰 수(컨텍스트 윈도우)가 정해져 있기 때문.", "related": ["컨텍스트", "컨텍스트 윈도우", "LLM", "프롬프트", "API"], "added": "2026-10-05", "flow": ["① 텍스트 입력", "② 토크나이저가 텍스트를 토큰으로 분리", "③ 각 토큰을 숫자 ID로 변환", "④ 모델이 토큰 단위로 처리", "⑤ 출력 토큰 생성 → 텍스트로 변환"], "confusion": {"헷갈리는점": "토큰=단어로 오해", "차이": "토큰 ≠ 단어. '안녕하세요'는 한국어로 3~4토큰, 영어 'hello'는 1토큰", "기억법": "영어는 1단어≈1토큰, 한국어는 1글자≈1~2토큰 (비싸다)"}, "kakao_chat": "A: GPT API 쓰는데 왜 비용이 이렇게 많이 나와?\nB: 요청 많이 한 거 아니야?\nA: 한국어로 했더니 토큰이 너무 많이 나온대. 토큰이 뭔지 알아?\nB: 단어 아니야?\nA: 아니! LLM이 텍스트 처리하는 최소 단위인데 단어랑 달라\n   영어는 단어 하나가 보통 토큰 1개인데, 한국어는 글자 1~2개가 토큰 1개야\nB: 그럼 한국어가 더 비싼 거야?\nA: 맞아. '안녕하세요'가 5~7토큰인데 영어 'Hello'는 1토큰이야\n   API 비용이 토큰 수로 계산되니까 한국어가 더 많이 나오지\nB: 아 그래서 컨텍스트 윈도우도 토큰 단위구나\nA: 응! 모델이 한 번에 처리할 수 있는 최대 토큰 수가 있어서 거기 넘으면 못 봐"}, {"id": "term_004", "term": "컨텍스트", "term_en": "Context", "category": "LLM", "definition": "LLM이 응답을 생성할 때 참고하는 대화 전체 내용 또는 배경 정보.", "detail": "LLM은 현재 질문만 보는 게 아니라, 그 앞의 대화 내용·시스템 지시·첨부 자료 등을 함께 보고 답한다. 이 '함께 보는 전체 정보'가 컨텍스트다.\n컨텍스트 윈도우(Context Window): 모델이 한 번에 처리할 수 있는 최대 토큰 수. Claude 3.7은 200K 토큰, GPT-4o는 128K 토큰 등.\n컨텍스트가 길수록 더 많은 대화·자료를 기억하며 답할 수 있지만, 비용도 늘어나고 처리 속도도 느려진다.\n컨텍스트 엔지니어링: 모델에게 어떤 정보를, 얼마나, 어떤 순서로 넣을지 설계하는 것.", "related": ["토큰", "컨텍스트 윈도우", "프롬프트", "RAG", "컨텍스트 엔지니어링"], "added": "2026-10-05", "flow": ["① 사용자 질문 입력", "② 이전 대화 이력 포함", "③ 시스템 프롬프트 추가", "④ 전체를 컨텍스트 윈도우에 넣음", "⑤ LLM이 컨텍스트 전체를 보고 답변 생성"], "confusion": {"헷갈리는점": "컨텍스트와 프롬프트를 같은 것으로 혼동", "차이": "프롬프트 = 지금 입력한 질문 / 컨텍스트 = 프롬프트 + 이전 대화 + 시스템 설정 전체", "기억법": "프롬프트 ⊂ 컨텍스트 — 컨텍스트가 더 큰 개념"}, "kakao_chat": "A: 챗봇한테 질문하면 이전 대화 내용 알고 대답하던데 어떻게 그래?\nB: 메모리 같은 거 쓰는 거 아니야?\nA: 그게 컨텍스트야. LLM이 응답 만들 때 지금 질문만 보는 게 아니라\n   이전 대화 이력, 시스템 설정 같은 걸 다 같이 봐\nB: 컨텍스트가 프롬프트랑 같은 거야?\nA: 달라! 프롬프트는 지금 네가 입력한 질문이고\n   컨텍스트는 그 질문 + 이전 대화 + 시스템 설정 전체야\n   프롬프트가 컨텍스트 안에 포함되는 거지\nB: 아 그럼 대화 길어질수록 컨텍스트도 커지겠네\nA: 맞아. 근데 모델마다 처리할 수 있는 최대 토큰 수(컨텍스트 윈도우)가 있어서\n   너무 길면 오래된 내용을 못 보게 돼"}, {"id": "term_005", "term": "RAG", "term_en": "Retrieval-Augmented Generation", "category": "LLM", "definition": "LLM이 답하기 전에 외부 문서를 검색해서 그 내용을 바탕으로 답을 생성하는 방식.", "detail": "RAG = 검색(Retrieval) + 보강(Augmented) + 생성(Generation) 3단계 구조.\n① 검색: 질문과 관련된 문서·데이터를 벡터DB 등에서 찾아온다.\n② 보강: 찾아온 문서를 컨텍스트에 함께 넣는다.\n③ 생성: LLM이 그 문서를 참고해서 답을 만든다.\n\nRAG가 필요한 이유 3가지:\n1. 할루시네이션 방지: 모델이 모르는 것을 지어내는 대신 실제 문서를 근거로 답한다.\n2. 지식 단절 해결: 학습 데이터 이후의 최신 정보도 반영 가능.\n3. 컨텍스트 절약: 방대한 문서 전체를 넣지 않고 필요한 부분만 가져온다.\n\nNotebookLM이 RAG 원리를 제품화한 대표 사례.", "related": ["컨텍스트", "LLM", "벡터DB", "할루시네이션", "NotebookLM", "프롬프트"], "added": "2026-10-05", "flow": ["① 사용자 질문", "② 질문을 벡터로 변환(임베딩)", "③ 벡터DB에서 유사 문서 검색", "④ 관련 문서 상위 k개 추출", "⑤ 질문+문서를 LLM에 전달", "⑥ LLM이 문서 기반으로 답변 생성"], "confusion": {"헷갈리는점": "RAG를 파인튜닝과 혼동", "차이": "RAG = 외부 문서를 검색해서 답변(모델 변경 없음) / 파인튜닝 = 모델 자체를 추가 학습", "기억법": "RAG = 오픈북 시험 / 파인튜닝 = 공부해서 머릿속에 넣기"}, "kakao_chat": "A: LLM이 잘못된 정보 말하는 거 어떻게 막아?\nB: 그냥 더 좋은 모델 쓰면 되는 거 아니야?\nA: 그것도 방법이긴 한데 RAG 쓰는 게 더 확실해\n   답하기 전에 관련 문서 검색해서 그걸 보고 답하게 하는 거야\nB: 아 찾아보고 말하는 거구나. 근데 파인튜닝이랑 다른 게 뭐야?\nA: RAG는 모델 그대로 두고 외부 문서 검색해서 컨텍스트에 넣는 거고\n   파인튜닝은 모델 자체를 추가 학습시키는 거야\nB: 그럼 어떨 때 RAG 써야 해?\nA: 최신 정보가 필요하거나, 회사 내부 문서 기반으로 답해야 할 때\n   RAG는 오픈북 시험, 파인튜닝은 공부해서 머릿속에 넣는 거로 생각해"}, {"id": "term_006", "term": "인코딩", "term_en": "Encoding", "category": "Dev", "definition": "데이터를 특정 규칙에 따라 다른 형식으로 변환하는 것. 암호화와 다르다.", "detail": "인코딩은 보안이 목적이 아니라 '형식 변환'이 목적이다.\n누구나 디코딩 방법을 알면 원래 값으로 되돌릴 수 있다.\n\n대표 예시:\n• Base64: 이미지·파일을 텍스트로 변환할 때 사용 (이메일 첨부, HTML 인라인 이미지 등)\n• URL 인코딩: 공백→%20, 한글→%EC%95%88 등 URL에 쓸 수 없는 문자를 변환\n• UTF-8: 한글·한자 등 문자를 컴퓨터가 읽는 바이트로 변환하는 문자 인코딩\n\nLLM 맥락: 토크나이저가 텍스트를 토큰 ID(숫자)로 변환하는 것도 인코딩의 일종.", "related": ["디코딩", "암호화", "Base64", "UTF-8", "토큰"], "added": "2026-10-05", "flow": ["① 원본 데이터(텍스트·이미지 등)", "② 인코딩 규칙 적용 (UTF-8, Base64 등)", "③ 변환된 형식으로 저장·전송", "④ 수신 측에서 디코딩으로 복원"], "confusion": {"헷갈리는점": "인코딩과 암호화를 같은 것으로 혼동", "차이": "인코딩 = 형식 변환(키 없이 누구나 복원 가능) / 암호화 = 보안 변환(키 있어야 복원)", "기억법": "인코딩 = 번역 / 암호화 = 금고에 넣기"}, "kakao_chat": "A: Base64 인코딩이라는 거 봤는데 이거 암호화야?\nB: 겉보기엔 알아볼 수 없으니까 암호화 아니야?\nA: 아니! 인코딩이랑 암호화는 달라\n   인코딩은 보안이 목적이 아니라 형식 변환이 목적이야\n   규칙만 알면 누구나 원래대로 되돌릴 수 있어\nB: 아 그럼 Base64는 어떤 상황에서 써?\nA: 이미지나 파일을 텍스트로 전송할 때 써. 이메일 첨부파일이나 HTML 인라인 이미지 같은 거\n   URL 인코딩은 공백이나 한글 같이 URL에 못 쓰는 문자를 변환할 때 쓰고\nB: 그럼 암호화는 뭐가 달라?\nA: 암호화는 키(Key)가 있어야 원본 복원이 가능해. 보안이 목적이지\n   인코딩은 번역이고, 암호화는 금고에 넣는 거로 기억해"}, {"id": "term_007", "term": "디코딩", "term_en": "Decoding", "category": "Dev", "definition": "인코딩된 데이터를 원래 형식으로 되돌리는 것.", "detail": "인코딩의 반대 과정. 변환된 형식을 다시 원본으로 복원한다.\n\n대표 예시:\n• Base64 디코딩: 텍스트로 표현된 데이터를 원래 파일·이미지로 복원\n• URL 디코딩: %20 → 공백, %EC%95%88 → '안' 으로 복원\n• UTF-8 디코딩: 바이트 데이터를 사람이 읽는 문자로 복원\n\nLLM 맥락: 모델이 토큰 ID(숫자)를 다시 텍스트로 변환해서 답을 출력하는 과정.", "related": ["인코딩", "복호화", "Base64", "UTF-8", "토큰"], "added": "2026-10-05", "flow": ["① 인코딩된 데이터 수신", "② 인코딩 방식 확인 (UTF-8, Base64 등)", "③ 디코딩 규칙 적용", "④ 원본 데이터 복원"], "confusion": {"헷갈리는점": "디코딩과 복호화를 같은 것으로 혼동", "차이": "디코딩 = 인코딩 역변환(키 불필요) / 복호화 = 암호화 역변환(키 필요)", "기억법": "디코딩 = 번역 되돌리기 / 복호화 = 금고 열기"}, "kakao_chat": "A: 디코딩이랑 복호화가 뭐가 달라? 둘 다 원래대로 되돌리는 거 아니야?\nB: 나도 같은 말인 줄 알았어\nA: 달라! 디코딩은 인코딩된 걸 되돌리는 거고, 복호화는 암호화된 걸 되돌리는 거야\nB: 어떤 차이가 있는데?\nA: 디코딩은 규칙만 알면 누구나 할 수 있어. 키 같은 거 필요 없어\n   복호화는 암호화에 쓴 키가 있어야만 원본을 볼 수 있지\nB: 아 디코딩은 번역 되돌리기, 복호화는 금고 열기네\nA: 딱 그거야! LLM 얘기하면 모델이 토큰 ID(숫자)를 다시 텍스트로 바꾸는 것도 디코딩이라고 해"}, {"id": "term_008", "term": "암호화", "term_en": "Encryption", "category": "Dev", "definition": "데이터를 열쇠(키)가 있어야만 읽을 수 있도록 변환하는 것. 보안이 목적이다.", "detail": "인코딩과 결정적 차이: 암호화는 '키(Key)'가 없으면 원본을 복원할 수 없다.\n\n종류:\n• 대칭키 암호화: 암호화·복호화에 같은 키 사용 (AES 등). 빠르지만 키 공유가 문제.\n• 비대칭키 암호화: 공개키로 암호화, 개인키로 복호화 (RSA 등). HTTPS가 이 방식.\n• 해시: 단방향 변환 — 복호화 불가. 비밀번호 저장에 사용 (SHA-256, bcrypt 등).\n\n실생활 예시:\n• HTTPS = 브라우저와 서버 사이 통신을 암호화\n• 카카오톡 암호화 = 메시지를 서버에서도 읽지 못하게 보호\n• 비밀번호 해시 = DB에 비밀번호를 그대로 저장하지 않고 해시값으로 저장", "related": ["복호화", "인코딩", "HTTPS", "해시", "공개키", "개인키"], "added": "2026-10-05", "flow": ["① 원본 데이터(평문)", "② 암호화 키 준비", "③ 암호화 알고리즘 적용(AES, RSA 등)", "④ 암호문 생성", "⑤ 전송·저장", "⑥ 수신 측에서 키로 복호화"], "confusion": {"헷갈리는점": "대칭키와 비대칭키 혼동", "차이": "대칭키(AES) = 같은 키로 암호화·복호화 / 비대칭키(RSA) = 공개키로 암호화, 개인키로 복호화", "기억법": "HTTPS = 비대칭키로 세션키 교환 → 이후 대칭키로 통신"}, "kakao_chat": "A: HTTPS 쓰면 데이터가 안전하다는 게 무슨 뜻이야?\nB: 그냥 잠금 표시 있으면 안전한 거 아니야?\nA: 맞긴 한데 원리가 암호화야. 데이터를 키 없이는 못 읽게 변환하는 거\nB: 인코딩이랑 다른 거야?\nA: 완전히 달라. 인코딩은 키 없이 누구나 되돌릴 수 있는데\n   암호화는 키 있는 사람만 원본 볼 수 있어\nB: 암호화도 종류가 있어?\nA: 응. 대칭키는 같은 키로 암호화·복호화 다 하고(빠름)\n   비대칭키는 공개키로 암호화하고 개인키로 복호화해 — HTTPS가 이 방식\n   해시는 단방향이라 복호화 아예 불가능해. 비밀번호 저장에 써"}, {"id": "term_009", "term": "복호화", "term_en": "Decryption", "category": "Dev", "definition": "암호화된 데이터를 키를 사용해 원래 내용으로 되돌리는 것.", "detail": "암호화의 반대 과정. 올바른 키가 있어야만 원본을 복원할 수 있다.\n\n• 대칭키: 암호화에 쓴 같은 키로 복호화\n• 비대칭키: 공개키로 암호화 → 개인키로 복호화\n• 해시는 단방향이라 복호화 불가 — 입력값을 다시 해시해서 비교하는 방식 사용\n\n헷갈리는 짝 정리:\n인코딩 ↔ 디코딩: 형식 변환 (보안 아님, 키 불필요)\n암호화 ↔ 복호화: 보안 변환 (키 필요)", "related": ["암호화", "디코딩", "대칭키", "비대칭키", "해시", "HTTPS"], "added": "2026-10-05", "flow": ["① 암호문 수신", "② 복호화 키 준비", "③ 알고리즘으로 복호화", "④ 원본 평문 복원"], "confusion": {"헷갈리는점": "복호화와 디코딩 혼동", "차이": "복호화 = 키가 있어야 가능(보안) / 디코딩 = 규칙만 알면 누구나 가능", "기억법": "복호화 = 열쇠(키) 있어야 금고 열림"}, "kakao_chat": "A: 웹사이트 로그인할 때 비밀번호가 서버에 어떻게 저장돼?\nB: 그냥 저장되는 거 아니야? 암호화해서?\nA: 암호화가 아니라 해시야. 그래서 복호화도 안 돼\nB: 복호화가 뭔데?\nA: 암호화된 걸 키로 원본 되돌리는 거야. 근데 해시는 단방향이라 복호화 불가능해\n   그래서 로그인할 때 입력한 비밀번호를 같이 해시해서 저장된 값이랑 비교하는 거야\nB: 아 그래서 비밀번호 찾기가 아니라 재설정이구나\nA: 맞아! 복호화는 열쇠(키) 있어야 금고 열린다고 기억해"}, {"id": "term_010", "term": "SaaS", "term_en": "Software as a Service", "category": "Infra", "definition": "소프트웨어를 설치 없이 인터넷으로 바로 쓰는 서비스 방식.", "detail": "서버·운영체제·소프트웨어 모두 제공자가 관리. 사용자는 그냥 접속해서 쓰기만 한다.\n\n대표 예시:\n• Gmail, Google Docs — 설치 없이 브라우저로 사용\n• Notion, Slack, Figma — 구독하면 바로 사용\n• ChatGPT, Claude — AI 모델을 서비스로 제공\n\n장점: 설치·업데이트·서버 관리 불필요. 어디서든 접속 가능.\n단점: 데이터가 제공자 서버에 있음. 인터넷 없으면 사용 불가.", "related": ["PaaS", "BaaS", "클라우드", "구독"], "added": "2026-10-05", "flow": ["① 브라우저로 URL 접속", "② 로그인(구독 확인)", "③ 완성된 소프트웨어 바로 사용", "④ 데이터는 제공사 서버에 저장"], "confusion": {"헷갈리는점": "SaaS·PaaS·BaaS 구분 혼동", "차이": "SaaS=다 된 밥 / PaaS=주방 빌리기 / BaaS=재료 배달", "기억법": "SaaS=쓰기만 함 / PaaS=개발환경 빌림 / BaaS=백엔드 기능만 빌림"}, "kakao_chat": "A: 요즘 회사에서 Notion이나 Slack 쓰잖아. 이게 SaaS야?\nB: SaaS? 그게 뭐야\nA: Software as a Service. 소프트웨어를 설치 없이 인터넷으로 바로 쓰는 거야\n   Gmail, Google Docs, ChatGPT 같은 것들도 다 SaaS야\nB: 아 그냥 구독하면 쓸 수 있는 거구나\nA: 맞아. 서버·운영체제·소프트웨어 관리를 다 제공자가 해주고\n   우리는 그냥 접속해서 쓰기만 하면 돼\nB: PaaS나 BaaS랑은 다른 거야?\nA: SaaS는 다 된 밥, PaaS는 주방 빌리기(개발 환경만), BaaS는 재료 배달(백엔드 기능만)\n   SaaS는 쓰기만 하면 된다는 게 핵심이야"}, {"id": "term_011", "term": "PaaS", "term_en": "Platform as a Service", "category": "Infra", "definition": "개발자가 앱을 만들고 배포할 수 있는 플랫폼 환경을 서비스로 제공하는 것.", "detail": "서버·운영체제·런타임(실행 환경)을 제공자가 관리. 개발자는 코드와 데이터만 신경 쓰면 된다.\n\n대표 예시:\n• Heroku — 코드를 올리면 자동으로 서버에 배포\n• Vercel, Netlify — 프론트엔드 앱 배포 플랫폼\n• Google App Engine, AWS Elastic Beanstalk\n\n장점: 서버 설정·운영체제 관리 불필요. 배포가 쉽고 빠름.\n단점: 플랫폼 종속성 발생. 세밀한 서버 설정이 어려울 수 있음.\n\nSaaS vs PaaS: SaaS는 완성된 소프트웨어를 쓰는 것, PaaS는 내 앱을 만들어 올리는 플랫폼을 빌리는 것.", "related": ["SaaS", "BaaS", "IaaS", "클라우드", "배포", "서버"], "added": "2026-10-05", "flow": ["① 코드 작성", "② PaaS 플랫폼에 배포(git push 등)", "③ 플랫폼이 자동으로 서버·OS·런타임 관리", "④ 서비스 운영"], "confusion": {"헷갈리는점": "PaaS와 IaaS 혼동", "차이": "IaaS = 서버(VM)만 제공 / PaaS = 서버+OS+런타임+배포까지 제공", "기억법": "PaaS = 주방 빌리기(주방 도구 포함) / IaaS = 빈 공간만 빌리기"}, "kakao_chat": "A: Heroku에 코드 올리면 자동으로 서버에 올라간다던데 그게 어떻게 가능한 거야?\nB: 그냥 자동으로 배포해주는 거 아니야?\nA: 그게 PaaS야. Platform as a Service — 개발 환경 전체를 서비스로 제공해주는 거\nB: SaaS랑 뭐가 달라?\nA: SaaS는 완성된 앱 쓰는 거고, PaaS는 내가 만든 앱을 배포할 플랫폼을 빌리는 거야\n   서버·운영체제·런타임을 제공자가 관리하고, 나는 코드만 올리면 돼\nB: 아 그럼 서버 설정 같은 거 안 해도 되는 거야?\nA: 맞아! git push 하면 자동으로 서버에 올려주는 거야\n   IaaS는 빈 서버만 빌리는 거고, PaaS는 주방 도구까지 다 갖춰진 주방 빌리는 거야"}, {"id": "term_012", "term": "BaaS", "term_en": "Backend as a Service", "category": "Infra", "definition": "로그인·DB·파일 저장 등 백엔드 기능을 직접 만들지 않고 서비스로 가져다 쓰는 것.", "detail": "백엔드 서버를 직접 구축하지 않고, 자주 필요한 백엔드 기능(인증·DB·스토리지·알림 등)을 API로 제공받아 쓴다.\n\n대표 예시:\n• Firebase (Google) — 인증·실시간 DB·파일 저장·푸시 알림 제공\n• Supabase — PostgreSQL 기반 오픈소스 BaaS\n• Appwrite — 셀프호스팅 가능한 BaaS\n\n장점: 백엔드 개발 없이 프론트엔드만으로 앱 완성 가능. 1인 개발자나 MVP 제작에 특히 유용.\n단점: 복잡한 비즈니스 로직 구현이 어려움. 제공자 정책 변경에 취약.\n\nAX 맥락: AI 에이전트와 BaaS를 조합하면 백엔드 없이 풀스택 자동화 앱 제작 가능.", "related": ["SaaS", "PaaS", "Firebase", "Supabase", "백엔드", "API", "프론트엔드"], "added": "2026-10-05", "flow": ["① 프론트엔드 코드 작성", "② BaaS SDK 연결(Firebase 등)", "③ 로그인·DB·스토리지를 API로 호출", "④ BaaS가 백엔드 처리 대신 수행"], "confusion": {"헷갈리는점": "BaaS를 SaaS로 혼동", "차이": "SaaS = 완성된 앱 사용 / BaaS = 내 앱에 백엔드 기능을 API로 연결", "기억법": "BaaS = 재료 배달(내가 요리, 재료만 받음)"}, "kakao_chat": "A: Firebase 쓰면 백엔드 직접 안 만들어도 된다던데 진짜야?\nB: 백엔드 없이 어떻게 앱이 작동해?\nA: BaaS를 쓰면 돼. Backend as a Service — 로그인·DB·파일 저장 같은 기능을\n   API로 제공받아서 쓰는 거야\nB: 아 직접 서버 안 만들고 가져다 쓰는 거구나\nA: 맞아. 프론트엔드 코드에서 Firebase SDK 연결하면\n   구글 로그인, 실시간 DB, 파일 업로드 같은 거 다 쓸 수 있어\nB: SaaS랑 다른 게 뭐야?\nA: SaaS는 완성된 앱을 쓰는 거고, BaaS는 내 앱에 백엔드 기능을 API로 연결하는 거야\n   재료만 배달받아서 내가 요리하는 셈이지"}, {"id": "term_013", "term": "API", "term_en": "Application Programming Interface", "category": "Dev", "definition": "두 소프트웨어가 서로 대화하는 방법을 정의한 약속.", "detail": "프로그램끼리 데이터를 주고받는 '창구' 역할.\n요청(Request)과 응답(Response) 형식을 미리 정해두면 서로 내부 구조를 몰라도 연결할 수 있다.\n\n비유: 식당에서 손님(프론트엔드)이 메뉴를 주문하면 웨이터(API)가 주방(백엔드)에 전달하고 음식을 가져오는 구조.\n\n대표 유형:\n• REST API: URL + HTTP 메서드(GET/POST/PUT/DELETE)로 요청\n• GraphQL: 필요한 데이터만 골라서 요청\n• WebSocket: 실시간 양방향 통신\n\nAI 맥락: ChatGPT·Claude API = 모델에게 프롬프트를 보내고 답을 받는 창구.", "related": ["프론트엔드", "백엔드", "REST", "라우팅", "SaaS"], "added": "2026-10-05", "flow": ["① 클라이언트가 API 요청 전송(HTTP)", "② API 서버 수신", "③ 인증 확인(API Key 등)", "④ 요청 처리(DB 조회·로직 실행)", "⑤ JSON 응답 반환", "⑥ 클라이언트가 응답 처리"], "confusion": {"헷갈리는점": "API를 URL과 혼동하거나 API=서버로 오해", "차이": "API = 두 시스템이 대화하는 약속(규칙) / URL = 그 약속에 접근하는 주소", "기억법": "API = 식당 메뉴판(주문 규칙) / URL = 식당 주소"}, "kakao_chat": "A: 앱 개발할 때 API 연동한다는 말 자주 듣는데 API가 정확히 뭐야?\nB: URL 같은 거 아니야?\nA: 달라! API는 두 소프트웨어가 서로 대화하는 약속이야\n   URL은 그 약속에 접근하는 주소고\nB: 예시 들어줘봐\nA: 식당으로 비유하면, 손님이 메뉴 주문하면 웨이터가 주방에 전달하고 음식 가져오잖아\n   손님이 프론트엔드, 웨이터가 API, 주방이 백엔드야\nB: 아 중간 연결해주는 역할이구나\nA: 맞아. 요청(Request)과 응답(Response) 형식을 미리 정해두면\n   서로 내부 구조를 몰라도 연결할 수 있어\n   API = 메뉴판(주문 규칙) / URL = 식당 주소라고 기억해"}, {"id": "term_014", "term": "AX", "term_en": "AI Transformation", "category": "AX", "definition": "AI를 단순 도구로 쓰는 것을 넘어 업무·조직·삶의 방식 자체를 AI 중심으로 바꾸는 변화.", "detail": "DX(Digital Transformation)의 다음 단계.\nDX가 '디지털화'라면, AX는 'AI가 중심이 되는 재설계'다.\n\nDX vs AX:\n• DX: 종이 → 디지털, 오프라인 → 온라인 (도구 교체)\n• AX: 사람이 하던 판단·반복 업무를 AI가 대신하도록 구조 자체를 바꿈\n\nAX의 핵심:\n① 업무 패턴 파악 → ② 반복·병목 구간 발견 → ③ AI로 대체·자동화 설계\n\nAX:IS 동아리 맥락: AI Transformation 시대를 함께 준비하고, 구성원 간 경험을 공유하며 성장하는 AI 자기계발 동아리.", "related": ["DX", "루프 엔지니어링", "AI 에이전트", "라이프루프", "자동화"], "added": "2026-10-05", "flow": ["① DX(디지털 전환) — 아날로그→디지털", "② AI 도입 시작 — 단순 자동화", "③ AX 전환점 — AI가 판단·설계까지", "④ 업무·조직 구조 자체가 AI 중심으로 재편", "⑤ 소비자와 생산자로 계층 분화"], "confusion": {"헷갈리는점": "AX와 DX를 같은 것으로 혼동", "차이": "DX = 디지털 도구 도입 / AX = AI가 업무 방식 자체를 바꿈. DX→AX 순서로 발전", "기억법": "DX = 종이→컴퓨터 / AX = 컴퓨터→AI가 판단"}, "kakao_chat": "A: 요즘 AX 전환이 중요하다는 말 많이 나오던데 DX랑 뭐가 달라?\nB: DX가 디지털 전환이잖아. AX는 AI 버전?\nA: 맞아! DX가 종이→디지털이었다면 AX는 AI가 업무 방식 자체를 바꾸는 거야\n   도구 교체가 아니라 구조 재설계야\nB: 그럼 AI 도구 도입하면 AX야?\nA: 아니, 그건 그냥 AI 도입이야. AX는 사람이 하던 판단·반복 업무를 AI가 대신하도록\n   구조 자체를 바꾸는 거야. 업무 흐름이 AI 중심으로 재편되는 거지\nB: DX→AX 순서로 가는 거야?\nA: 맞아. DX가 됐어야 AX도 가능해. DX=컴퓨터로 바꾸기, AX=AI가 판단까지 하기\n   지금 우리가 AX 전환점에 와 있는 거야"}, {"id": "term_015", "term": "관제", "term_en": "Monitoring & Control / Observatory", "category": "Infra", "definition": "시스템·서비스 상태를 실시간으로 감시하고 이상 발생 시 대응하는 활동.", "detail": "운영 중인 서버·앱·AI 에이전트의 상태를 지속적으로 모니터링하는 것.\n\n관제에서 보는 것:\n• 서버 CPU·메모리·디스크 사용량\n• 응답 시간, 에러율, 트래픽\n• AI 에이전트 실행 결과, 실패 여부\n• 보안 이상 징후\n\n대표 도구:\n• Grafana, Prometheus: 서버 지표 시각화\n• Sentry: 코드 에러 실시간 추적\n• Datadog: 통합 모니터링 플랫폼\n\nAI 에이전트 맥락: 루프 엔지니어링에서 '관찰가능성(Observability)'이 관제의 핵심 개념 — AI가 목표 달성 여부를 스스로 측정할 수 있어야 함.", "related": ["서버", "Observability", "루프 엔지니어링", "운영", "모니터링"], "added": "2026-10-05", "flow": ["① 서버·서비스 지표 수집(CPU·메모리·응답시간)", "② 대시보드에서 실시간 시각화", "③ 임계값 초과 시 알림 발송", "④ 담당자 확인 → 원인 분석", "⑤ 조치 후 정상화 확인"], "confusion": {"헷갈리는점": "관제를 단순 모니터링(보기)으로만 이해", "차이": "모니터링 = 보기 / 관제 = 보기+판단+대응까지 포함한 운영 체계", "기억법": "CCTV = 모니터링 / 보안요원이 CCTV 보고 출동 = 관제", "추가": "안쪽 관제(서버 내부 상태: 포트·컨테이너·디스크) vs 바깥 관제(사용자 입장에서 실제 접속되는지) — 둘 다 있어야 빈틈이 없다"}, "kakao_chat": "A: 서버 운영하면 관제 해야 한다던데 그게 뭐야?\nB: 그냥 서버 상태 보는 거 아니야?\nA: 그건 모니터링이고, 관제는 한 단계 위야\n   보기+판단+대응까지 포함하는 운영 체계야\nB: 어떻게 다른 거야?\nA: CCTV 비유 좋아. CCTV로 보기만 하면 모니터링\n   보안 요원이 CCTV 보고 이상 발생하면 출동하는 게 관제야\nB: 아 뭔가 이상하면 바로 대응하는 거구나\nA: 응! CPU·메모리·에러율 같은 지표 실시간으로 보다가\n   임계값 넘으면 알림 보내고 담당자가 조치하는 거야\n   Grafana, Prometheus 같은 도구 써서 해", "examples": ["[우리 서버 실제 사례] 데브옵스 앱 = 서버 '안쪽' 관제 — 4시간마다 새로 열린 포트(0.0.0.0) 감시, 이상 시 🔴 경고", "[우리 서버 실제 사례] 강의비서 = 서버 '바깥' 관제 — 매일 오전 9시 sign.axmaster.cloud 접속·생성 키 보호·인증서 만료 확인, 정상이면 무음 / 이상이면 텔레그램 알림", "비유: 공항 관제탑(비행기 계속 지켜보다 위험하면 지시), CCTV 관제센터(화면 보다 이상하면 출동)"], "updated": "2026-10-19"}, {"id": "term_016", "term": "서버", "term_en": "Server", "category": "Infra", "definition": "다른 컴퓨터(클라이언트)의 요청을 받아 처리하고 응답을 돌려주는 컴퓨터 또는 프로그램.", "detail": "인터넷에서 '서비스를 제공하는 쪽'이 서버, '요청하는 쪽'이 클라이언트.\n브라우저(클라이언트)가 naver.com을 요청하면 네이버 서버가 HTML을 돌려주는 구조.\n\n서버의 종류:\n• 웹 서버: HTML·이미지 등 정적 파일 제공 (Nginx, Apache)\n• 애플리케이션 서버: 비즈니스 로직 처리 (Node.js, Python, Java)\n• DB 서버: 데이터 저장·조회 (MySQL, PostgreSQL)\n• AI 추론 서버: LLM 모델 실행 및 응 랑은 다른 거야?\nA: 달라! 루프 엔지니어링은 얼마나 반복할지 설계하는 거고\n   하네스 엔지니어링은 어디까지 실행 허용할지 설계하는 거야\nB: 예를 들면?\nA: AI가 쓸 수 있는 도구 목록 정하고, 접근 권한 제한하고, 샌드박스 환경 만드는 거야\n   이상 동작 감지하면 중단하는 메커니즘도 포함이고"}, {"id": "term_018", "term": "컨텍스트 엔지니어링", "term_en": "Context Engineering", "category": "Agent", "definition": "LLM에게 어떤 정보를, 얼마나, 어떤 순서로 넣을지 설계하는 기술.", "detail": "프롬프트 엔지니어링(2024)의 진화 버전.\n단순히 '질문을 잘 쓰는 것'을 넘어, 모델에게 전달하는 전체 정보 구조를 설계한다.\n\n컨텍스트 엔지니어링이 다루는 것:\n• 시스템 프롬프트 설계: 모델의 역할·제약·말투 정의\n• RAG 연동: 필요한 문서만 골라 컨텍스트에 삽입\n• 대화 히스토리 관리: 어디까지 기억시킬지\n• 토큰 효율화: 같은 정보를 더 적은 토큰으로 전달\n• 멀티모달 입력: 텍스트·이미지·파일을 어떻게 조합할지\n\n진화 순서: 프롬프트 엔지니어링(2024) → 컨텍스트 엔지니어링(2025) → 루프 엔지니어링(2026)", "related": ["루프 엔지니어링", "프롬프트", "RAG", "컨텍스트", "토큰", "LLM"], "added": "2026-10-05", "flow": ["① LLM에 넣을 정보 목록 파악", "② 시스템 프롬프트 설계", "③ 관련 문서·예시 선별", "④ 토큰 예산 내에서 우선순위 결정", "⑤ 컨텍스트 윈도우 구성", "⑥ 결과 평가 → 컨텍스트 개선"], "confusion": {"헷갈리는점": "컨텍스트 엔지니어링을 프롬프트 엔지니어링과 동일시", "차이": "프롬프트 엔지니어링 = 질문을 잘 쓰는 것 / 컨텍스트 엔지니어링 = 어떤 정보를 얼마나 어떤 순서로 넣을지 설계", "기억법": "프롬프트 = 질문 / 컨텍스트 = 질문+배경+자료+예시 전체 설계"}, "kakao_chat": "A: 컨텍스트 엔지니어링이 프롬프트 엔지니어링이랑 뭐가 달라?\nB: 그냥 프롬프트 잘 쓰는 것 아니야?\nA: 프롬프트 엔지니어링의 진화 버전이야\n   단순히 질문 잘 쓰는 걸 넘어서, 모델에게 전달하는 전체 정보 구조를 설계해\nB: 어떤 걸 설계하는 거야?\nA: 시스템 프롬프트, RAG로 넣을 문서 선별, 대화 히스토리 얼마나 유지할지\n   토큰 효율화까지 다 포함이야\nB: 아 프롬프트는 질문 하나고, 컨텍스트 엔지니어링은 그 주변 환경 전체 설계구나\nA: 맞아! 프롬프트 = 질문\n   컨텍스트 = 질문+배경+자료+예시 전체 설계라고 기억해"}, {"id": "term_019", "term": "루프 엔지니어링", "term_en": "Loop Engineering", "category": "Agent", "definition": "AI가 목표 조건을 향해 스스로 반복 실행하는 구조(루프)를 설계하는 것.", "detail": "프롬프트 엔지니어링 → 컨텍스트 엔지니어링 → 루프 엔지니어링 순으로 진화.\n\n핵심 개념: loop = goal(목표조건) + cadence(반복주기)\nAI에게 '이 조건이 충족되면 완료'를 알려주면, 조건이 충족될 때까지 스스로 반복 실행한다.\n\n기본 구조 (개발자 관점):\nwhile not goal_met: result = run_ai() → evaluate() → repeat\n\n설계 5요소:\n① Goal(목표조건): 무엇이 달성되면 성공인가\n② Cadence(반복주기): 언제마다 실행할 것인가\n③ Tools(도구연결): 어떤 앱·데이터에 접근할 것인가\n④ Exit(종료조건): 언제 사람에게 돌려줄 것인가\n⑤ Observability(관찰가능성): AI가 성공 여부를 측정할 수 있는가\n\n60점 → 90점 원리: 처음 세팅은 60점이지만 루프가 돌수록 실패 케이스가 쌓이고 자동 개선되어 90 (대화 중만), 로컬 파일, 벡터 DB 같은 것들도 다 스토리지 개념이야"}, {"id": "term_021", "term": "워크플로", "term_en": "Workflow", "category": "AX", "definition": "어떤 목표를 달성하기 위해 정해진 순서대로 실행되는 작업들의 흐름.", "detail": "일이 처리되는 순서와 흐름을 구조화한 것.\n사람이 하던 단계별 작업을 명확히 정의해야 자동화할 수 있다.\n\n예시:\n• 콘텐츠 제작 워크플로: 아이디어 → 초안 작성 → 검토 → 편집 → 발행\n• 야간질문봇 워크플로: 질문 수신 → 분류 → 처리(검색/요약/설계) → 결과 전송\n• 채용 워크플로: 지원서 접수 → 서류 검토 → 면접 → 합격 통보\n\nAI 자동화 맥락:\n워크플로를 먼저 명확히 그려야 AI로 어느 단계를 대체할 수 있는지 보인다. AX의 핵심은 '업무 패턴화 → 워크플로 정의 → AI 자동화 설계' 순서.\n\n도구: n8n, Make(Integromat), Zapier 등이 워크플로 자동화 플랫폼.", "related": ["루프 엔지니어링", "자동화", "AX", "에이전트", "워크트리"], "added": "2026-10-05", "flow": ["① 목표·결과물 정의", "② 필요한 작업 목록 나열", "③ 순서·의존관계 설정", "④ 각 단계 실행(사람·AI·자동화)", "⑤ 결과 확인 및 다음 단계 트리거"], "confusion": {"헷갈리는점": "워크플로와 프로세스 혼동", "차이": "프로세스 = 작업의 흐름(개념) / 워크플로 = 실제 실행 가능한 구체적 단계 정의", "기억법": "워크플로 = 요리 레시피 (재료·순서·시간 구체적으로 명시)"}, "kakao_chat": "A: 업무 자동화한다는 게 구체적으로 어떻게 하는 거야?\nB: 그냥 매크로 같은 거 쓰는 거 아니야?\nA: 워크플로 만드는 거야. 반복 업무를 단계별로 정의해서\n   특정 조건에서 자동으로 실행되게 연결하는 거지\nB: 단계별로 연결한다는 게 어떤 거야?\nA: 예를 들어 '구글폼 응답 수신 → AI로 요약 → 슬랙 알림 발송' 이런 흐름\n   각 단계가 이어지는 걸 워크플로라고 해\nB: 아 일의 흐름을 설계하는 거네\nA: 맞아. n8n 같은 도구로 시각적으로 블록 연결해서 만들 수 있어\n   워크플로 = 자동화된 업무 흐름 설계라고 기억해"}, {"id": "term_022", "term": "워크트리", "term_en": "Worktree", "category": "Dev", "definition": "하나의 Git 저장소에서 여러 브랜치를 동시에 다른 폴더에 체크아웃해서 작업하는 기능.", "detail": "Git의 고급 기능 중 하나.\n보통은 한 번에 한 브랜치에서만 작업하지만, 워크트리를 쓰면 같은 저장소의 여러 브랜치를 동시에 다른 폴더에서 열 수 있다.\n\n언제 쓰나:\n• main 브랜치 코드를 보면서 feature 브랜치에서 개발할 때\n• 긴급 버그 수정을 위해 현재 작업을 stash 없이 다른 폴더에서 바로 시작할 때\n• AI 에이전트가 여러 작업을 병렬로 실행할 때 각각 독립된 작업 공간 필요 시\n\n사용법: git worktree add ../폴더명 브랜치명\n\nAI 에이전트 맥락: Claude Code·Codex 같은 코딩 에이전트가 멀티 에이전트 병렬 작업 시 각 에이전트에게 독립적인 워크트리를 할당해 서로 충돌 없이 동시에 코드를 수정하는 용도로 활용.", "related": ["Git", "브랜치", "에이전트", "멀티에이전트", "워크플로"], "added": "2026-10-05", "flow": ["① Git 레포에서 git worktree add ../branch-folder branch명", "② 새 폴더에 해당 브랜치 체크아웃", "③ 메인 폴더와 새 폴더 동시에 작업 가능", "④ 작업 완료 후 git worktree remove로 제거"], "confusion": {"헷갈리는점": "워크트리를 브랜치와 동일시", "차이": "브랜치 = 코드 분기 / 워크트리 = 브랜치를 별도 폴더에 동시에 체크아웃해서 작업하는 방법", "기억법": "브랜치 = 나뭇가지 / 워크트리 = 가지별로 작업실을 따로 만든 것"}, "kakao_chat": "A: 워크트리가 Git에서 뭔데?\nB: 워크트리? 브랜치 아니야?\nA: 달라! 브랜치는 코드의 분기점(논리적 개념)이고\n   워크트리는 브랜치를 물리적으로 다른 폴더에 펼쳐놓은 거야\nB: 그럼 같은 저장소에서 두 개 작업 동시에 할 수 있어?\nA: 그게 바로 워크트리의 핵심이야. git worktree add 명령으로\n   브랜치를 별도 폴더에 체크아웃해서 동시에 작업할 수 있어\nB: 왜 그냥 브랜치 두 개 만들면 안 돼?\nA: 브랜치 전환할 때마다 파일이 바뀌잖아. 워크트리는 폴더가 따로 있어서 동시에 열어놓을 수 있어\n   브랜치=나무의 가지, 워크트리=가지마다 별도 작업 책상 놓은 것"}, {"id": "term_023", "term": "큐 (Queue)", "english": "Queue", "category": "Dev", "one_line": "먼저 들어온 것이 먼저 나가는 줄 세우기 자료구조 (FIFO)", "description": "Queue는 First In, First Out(FIFO) 구조로, 먼저 들어온 데이터가 먼저 처리된다. 줄 서기와 동일한 원리. 작업 대기열, 메시지 큐, API 요청 순서 처리 등에 활용된다.", "examples": ["🍔 맥도날드 주문 — 손님이 주문(큐에 넣기) → 주방이 순서대로 만들기(큐에서 꺼내기)", "🖨️ 프린터 — 문서 3개를 동시에 보내도 먼저 보낸 것부터 출력", "📱 카카오톡 알림 — 메시지 10개가 한꺼번에 와도 순서대로 표시", "🤖 AI 이미지 생성 — 요청 100개가 몰려도 먼저 요청한 사람부터 처리", "💬 개발자 말투: '큐 날린다' = 작업을 대기열에 집어넣는다"], "related": ["스택(Stack)", "워크플로", "비동기 처리"], "saved_date": "2026-10-08", "analogy": "편의점 계산대 줄 — 나중에 온 사람이 새치기하면 안 되듯, 큐도 순서를 반드시 지킨다", "flow": ["① 작업 생성 → 큐에 추가(enqueue)", "② 큐가 순서대로 작업 보관(FIFO)", "③ 워커가 큐에서 작업 꺼냄(dequeue)", "④ 작업 처리", "⑤ 완료 후 다음 작업 꺼냄"], "confusion": {"헷갈리는점": "큐(Queue)와 스택(Stack) 혼동", "차이": "큐 = FIFO(먼저 들어온 게 먼저 나감) / 스택 = LIFO(나중에 들어온 게 먼저 나감)", "기억법": "큐 = 줄 서기(편의점) / 스택 = 접시 쌓기(위에서부터 꺼냄)"}, "kakao_chat": "A: 큐(Queue)가 뭔지 알아?\nB: 줄 서는 거 아니야?\nA: 맞아! 데이터 구조에서도 줄 서는 것처럼 먼저 들어온 게 먼저 나가는 거야\n   FIFO(First In First Out) 구조\nB: 실제로 어디서 쓰는 거야?\nA: 이메일 발송, 동영상 변환, 알림 전송 같은 시간이 걸리는 작업을\n   바로 처리하지 않고 큐에 쌓아두고 순서대로 처리해\nB: 아 비동기 처리 같은 거네?\nA: 맞아! 큐 없으면 요청 100개 동시에 들어오면 서버 터지잖아\n   큐에 넣고 워커가 하나씩 꺼내서 처리하는 거야. 큐=대기줄로 기억해"}, {"id": "term_024", "term": "워커 (Worker)", "english": "Worker", "category": "Dev", "one_line": "큐에 쌓인 작업을 꺼내서 실제로 처리하는 일꾼 프로세스", "description": "Worker는 Queue에서 작업을 하나씩 꺼내 처리하는 프로세스(프로그램)다. 큐가 '대기줄'이라면 워커는 '직원'이다. 워커를 여러 개 띄우면 작업을 병렬로 빠르게 처리할 수 있다.", "examples": ["🍔 맥도날드 비유 — 주문서(큐)를 받아서 실제로 버거를 만드는 직원(워커)", "🖨️ 프린터 비유 — 인쇄 대기열(큐)에서 문서를 꺼내 출력하는 프린터 엔진(워커)", "🤖 AI 이미지 생성 — 요청 큐에서 작업을 꺼내 GPU로 이미지를 만드는 서버 프로세스", "워커 3개 = 직원 3명 — 같은 큐를 3명이 동시에 처리하면 3배 빨라짐"], "related": ["큐(Queue)", "프로세스", "병렬처리", "비동기"], "saved_date": "2026-10-08", "flow": ["① 워커 프로세스 실행 시작", "② 큐에서 작업 꺼냄(dequeue)", "③ 작업 처리", "④ 완료 후 다시 큐에서 다음 작업 꺼냄", "⑤ 큐가 빌 때까지 반복"], "confusion": {"헷갈리는점": "워커와 서버를 같은 것으로 혼동", "차이": "서버 = 요청 수신·응답 / 워커 = 큐에서 작업 꺼내 처리(응답 없이 실행만)", "기억법": "서버 = 카운터 직원 / 워커 = 주방 직원"}, "kakao_chat": "A: 워커(Worker)가 뭔데? 일꾼이야?\nB: 뭔가 처리하는 프로세스?\nA: 맞아! 큐에 쌓인 작업을 하나씩 꺼내서 처리하는 프로세스야\n   이메일 발송, 파일 변환 같은 백그라운드 작업 담당해\nB: 큐랑 같이 쓰는 거야?\nA: 항상 세트야. 큐에 작업 쌓고 → 워커가 꺼내서 처리하는 구조\n   워커 여러 개 띄우면 동시에 처리할 수 있어\nB: 아 그럼 워커 많을수록 빨리 처리되는 거네\nA: 맞아. 근데 워커가 많으면 서버 자원도 많이 써. 균형이 중요해\n   큐=대기줄, 워커=카운터 직원으로 생각해"}, {"id": "term_025", "term": "모달 (Modal)", "english": "Modal", "category": "Dev", "one_line": "현재 페이지 위에 레이어로 떠오르는 팝업 창", "description": "Modal은 기존 페이지를 유지한 채로 그 위에 뜨는 창이다. 페이지 이동 없이 콘텐츠를 보여줄 수 있고, 배경을 클릭하거나 X 버튼으로 닫는다.", "examples": ["인스타그램 사진 클릭 → 사진이 화면 위에 크게 뜸 (페이지 이동 없음)", "쇼핑몰 '장바구니 담기' → '담겼습니다' 팝업", "발표자료 버튼 클릭 → 슬라이드가 모달로 전체화면에 뜸", "경고창, 확인창, 약관 동의창 모두 모달"], "related": ["iframe", "팝업", "오버레이"], "saved_date": "2026-10-09", "flow": ["① 사용자가 버튼 클릭", "② 모달 레이어 생성(z-index 높게)", "③ 배경 딤처리(overlay)", "④ 모달 콘텐츠 표시", "⑤ 확인·취소·X 클릭 → 모달 닫힘"], "confusion": {"헷갈리는점": "모달과 팝업창(새 탭/창) 혼동", "차이": "모달 = 같은 페이지 위에 레이어로 뜸(페이지 이동 없음) / 팝업 = 새 탭·창으로 열림", "기억법": "모달 = 투명 유리판을 위에 올리는 것 / 팝업 = 새 창 열기"}, "kakao_chat": "A: 모달이 뭔지 알아? UI 얘기야\nB: 팝업 같은 거?\nA: 비슷한데 좀 달라. 모달은 현재 페이지 위에 레이어로 뜨는 창이야\n   모달이 열려있는 동안은 뒤 화면 클릭이 안 돼. 반드시 모달을 닫아야 해\nB: 팝업이랑 다른 게 뭔데?\nA: 팝업은 별도 창이 새로 뜨는 거야. 모달은 같은 화면 안에 오버레이로 뜨는 거고\n   모달이 더 요즘 스타일이야. 팝업은 브라우저가 차단하는 경우도 있어서\nB: 언제 써?\nA: 삭제 확인 다이얼로그, 로그인 폼, 이미지 미리보기 같은 거\n   사용자 집중이 필요한 짧은 인터랙션에 써"}, {"id": "term_026", "term": "iframe", "english": "Inline Frame", "category": "Dev", "one_line": "웹페이지 안에 다른 웹페이지를 액자처럼 끼워 넣는 HTML 요소", "description": "iframe은 페이지 안에 또 다른 페이지를 삽입하는 HTML 장·수정·삭제", "④ 결과 반환 → AP 서버"], "confusion": {"헷갈리는점": "DB와 스토리지 혼동", "차이": "스토리지 = 파일 단위 저장 / DB = 구조화된 데이터 저장+빠른 검색+관계 관리", "기억법": "스토리지 = 파일 캐비넷 / DB = 색인 달린 정리된 서랍장"}, "kakao_chat": "A: DB 서버가 그냥 데이터베이스 아니야?\nB: 그냥 데이터 저장하는 거잖아?\nA: DB 서버는 데이터베이스 관리 시스템(DBMS)을 실행하는 서버야\n   클라이언트(AP 서버)에서 SQL 쿼리 보내면 처리해서 결과 돌려주는 거지\nB: 그럼 AP 서버랑 DB 서버가 다른 컴퓨터야?\nA: 보통 달라. 서버 3단 구조에서 각자 역할이 있어\n   AP 서버가 DB 서버에 '이 사용자 정보 줘' 하고 요청하는 거야\nB: 아 직접 DB에 연결하는 게 아니라 서버가 중간에 있구나\nA: 맞아. 보안상으로도 DB를 외부에 직접 노출하면 안 되니까\n   AP 서버가 인증하고 DB 서버에 안전하게 요청하는 구조야"}, {"id": "term_033", "term": "웹앱 (Web Application)", "english": "Web Application", "category": "Dev", "one_line": "브라우저에서 실행되는 애플리케이션 — 설치 없이 URL로 접속해서 쓰는 서비스", "description": "웹앱은 브라우저만 있으면 설치 없이 바로 쓸 수 있는 애플리케이션이다. 단순히 내용을 보여주는 웹사이트와 달리, 사용자와 상호작용(로그인·데이터 저장·실시간 업데이트 등)이 가능하다.", "examples": ["Gmail, Google Docs — 브라우저에서 설치 없이 쓰는 앱", "Notion, Figma — URL로 접속해서 작업하는 앱", "동아리 홈페이지 — 로그인·발표자료 열람 = 웹앱", "웹사이트(정보 제공) vs 웹앱(상호작용 가능) — 경계는 점점 흐려지는 중"], "related": ["프론트엔드", "백엔드", "API", "SaaS"], "saved_date": "2026-10-09", "flow": ["① 브라우저에서 URL 접속", "② 서버에서 HTML·JS·CSS 다운로드", "③ 브라우저에서 JS 실행 → 인터랙션 가능", "④ 사용자 행동 → API 요청 → 서버 처리 → 화면 업데이트"], "confusion": {"헷갈리는점": "웹사이트와 웹앱을 구분 못 함", "차이": "웹사이트 = 정보 제공(읽기 중심) / 웹앱 = 사용자 상호작용(쓰기·처리 포함)", "기억법": "웹사이트 = 신문(읽기만) / 웹앱 = 카카오톡 웹버전(주고받기)"}, "kakao_chat": "A: 웹앱이 그냥 웹사이트 아니야?\nB: 응? 같은 거 아니야?\nA: 비슷한데 다른 개념이야. 웹사이트는 정보 전달이 주목적이고\n   웹앱은 사용자가 직접 상호작용하는 기능 중심이야\nB: 예시 들어봐\nA: 웹사이트 = 회사 소개 페이지, 블로그 같은 것\n   웹앱 = Google Docs, Figma, Gmail처럼 앱처럼 쓸 수 있는 것\nB: 아 브라우저에서 앱처럼 동작하는 게 웹앱이구나\nA: 맞아! 설치 없이 브라우저로 쓸 수 있는 게 장점이야\n   프론트엔드+백엔드+DB 합쳐서 완성되는 서비스야"}, {"id": "term_034", "term": "서버 3단 구조 (3-Tier Architecture)", "english": "3-Tier Architecture", "category": "Infra", "one_line": "웹서버 → AP서버 → DB서버로 역할을 나눈 웹 서비스의 기본 구조", "description": "서버 3단 구조는 웹 서비스를 프레젠테이션(웹서버)·비즈니스 로직(AP서버)·데이터(DB서버) 3개 계층으로 나눈 아키텍처다. 각 계층이 역할이 분리되어 있어 유지보수·확장이 쉽다.", "examples": ["브라우저 → 웹서버(nginx, 요청 접수) → AP서버(Node.js, 로직 처리) → DB서버(MySQL, 념 — 반복할수록 개선됨"], "related": ["지도학습", "딥러닝", "과적합", "Early Stopping"], "saved_date": "2026-10-09", "flow": ["① 전체 학습 데이터 준비", "② 배치 단위로 나눔", "③ 모든 배치 학습 완료 = 1 에포크", "④ 다음 에포크 시작(데이터 섞기)", "⑤ N 에포크 완료 → 학습 종료"], "confusion": {"헷갈리는점": "에포크와 배치(batch) 혼동", "차이": "배치 = 한 번에 학습하는 데이터 묶음 / 에포크 = 전체 데이터를 한 번 다 본 것", "기억법": "에포크 = 책 한 권 다 읽기 / 배치 = 책 한 챕터 읽기"}, "kakao_chat": "A: 에포크가 뭔지 알아? 딥러닝 학습할 때 나오는 거\nB: 처음 들어봐\nA: 전체 학습 데이터를 한 번 다 돌리는 게 1 에포크야\n   학습 데이터가 1000개면 1000개 다 학습하면 1 에포크 완료\nB: 여러 번 반복하는 거야?\nA: 응! 보통 10~100 에포크씩 학습해. 반복할수록 모델이 점점 정확해져\n   근데 너무 많이 하면 학습 데이터에만 맞는 과적합이 생겨\nB: 아 적당히 해야 하는 거구나\nA: 맞아! 에포크 = 학습 데이터를 몇 바퀴 돌렸는지\n   1에포크=전체 데이터 1회 학습, 10에포크=10회 반복이야"}, {"id": "term_047", "term": "딥러닝 (Deep Learning)", "english": "Deep Learning", "category": "ML", "one_line": "여러 층의 인공신경망을 쌓아 복잡한 패턴을 학습하는 머신러닝 방식", "description": "딥러닝은 인공신경망을 여러 층(deep)으로 쌓아 이미지·음성·텍스트 등 복잡한 데이터에서 패턴을 스스로 찾아내는 방법이다. LLM(GPT, Claude 등)의 핵심 기술이 딥러닝이다.", "examples": ["이미지 인식 — 수백만 장 사진으로 고양이·개 구분 학습", "음성 인식 — 수억 개 음성 데이터로 말을 텍스트로 변환", "ChatGPT — 수조 개 텍스트로 딥러닝 학습한 결과", "머신러닝 ⊃ 딥러닝 ⊃ Transformer ⊃ LLM (포함 관계)"], "related": ["인공신경망", "은닉층", "지도학습", "LLM", "Transformer"], "saved_date": "2026-10-09", "flow": ["① 대용량 데이터 준비", "② 깊은 신경망(은닉층 多) 설계", "③ 순전파 → 예측", "④ 손실 계산 → 역전파", "⑤ 에포크 반복 → 수렴"], "confusion": {"헷갈리는점": "딥러닝과 머신러닝을 별개로 오해", "차이": "딥러닝 ⊂ 머신러닝 — 딥러닝은 신경망을 깊게 쌓은 머신러닝의 일종", "기억법": "머신러닝 = 큰 원 / 딥러닝 = 그 안의 작은 원"}, "kakao_chat": "A: 딥러닝이 머신러닝이랑 다른 거야?\nB: 그냥 더 발전한 거 아니야?\nA: 딥러닝이 머신러닝의 하위 개념이야. 머신러닝 안에 딥러닝이 있어\n   딥러닝은 인공신경망을 깊게 쌓아서 학습하는 방식이야\nB: 그냥 머신러닝 쓰면 안 돼?\nA: 이미지·텍스트·음성 같은 복잡한 데이터는 딥러닝이 훨씬 잘 해\n   전통 머신러닝은 사람이 특징(feature) 직접 설계해야 했는데\n   딥러닝은 특징 추출까지 스스로 학습해\nB: 아 그래서 요즘 AI가 이미지 인식도 잘 하는 거구나\nA: 맞아! 딥러닝 = 머신러닝 + 깊은 신경망\n   AI > 머신러닝 > 딥러닝 순서로 포함 관계야"}, {"id": "term_048", "term": "인공신경망 (Artificial Neural Network)", "english": "Artificial Neural Network", "category": "ML", "one_line": "인간 뇌의 뉴런 구조를 모방해 만든 AI 학습 구조", "description": "인공신경망은 입력층·은닉층·출력층으로 구성된 노드(뉴런)들의 연결망이다. 각 연결에는 가중치(weight)가 있고, 학습을 통해 이 가중치가 조정되면서 모델이 정확해진다. 딥러닝은 이 신경망을 깊게(여러 층으로) 쌓은 것이다.", "examples": ["입력층(사진 픽셀) → 은닉층(패턴 추출) → 출력층(고양이/개) 구조", "뇌의 뉴런이 연결되어 신호를 전달하듯, 노드가 연결되어 숫자를 전달", "가중치 = 연결의 중요도 — 학습으로 자동 조정됨", "GPT의 수천억 개 파라미터 = 인공신경망의 가중치 수"], "related": ["딥러닝", "은닉층", "가중치", "Transformer"], "saved_date": "2026-10-09", "flow": ["① 입력 데이터 → 입력층 노드", "② 가중치 곱 + 편향 → 은닉층 전달", "③ 활성화 함수 적용", "④ 다음 은닉층으로 전달 (반복)", "⑤ 출력층 → 최종 예측값"], "confusion": {"헷갈리는점": "뇌와 똑같이 작동한다고 오해", "차이": "인공신경망 = 뇌에서 영감받은 수학적 구조일 뿐, 실제 뇌와는 다름", "기억법": "비행기가 새를 보고 만들었지만 새처럼 날개짓 안 하듯 — 영감만 받은 것"}, "kakao_chat": "A: 인공신경망이 진짜 뇌 따라 만든 거야?\nB: 뉴런 같은 거 있잖아?\nA: 뇌의 뉴런 구조에서 영감받은 거야. 완전히 똑같지는 않지만\n   입력 받아서 가중치 곱해 계산하고 다음 노드로 전달하는 구조가 비슷해\nB: 어떻게 학습하는 거야?\nA: 정답이랑 예측값 차이(손실)를 계산해서 역방향으로 가중치 조정해\n   이걸 수만 번 반복하면서 점점 더 좋은 예측을 하게 돼\nB: 아 그래서 학습 데이터가 많을수록 좋은 거구나\nA: 맞아! 입력층 → 은닉층(여러 개) → 출력층 구조가 인공신경망의 기본이야\n   이 은닉층을 깊게 쌓은 게 딥러닝이야"}, {"id": "term_049", "term": "은닉층 (Hidden Layer)", "english": "Hidden Layer", "category": "ML", "one_line": "입력층과 출력층 사이에서 특징을 추출·변환하는 중간 레이어", "description": "은닉층은 인공신경망에서 입력(X)과 출력(Y) 사이에 있는 중간 계층이다. 눈에 보이지 않아서 '은닉(hidden)'이라 불린다. 은닉층이 많을수록 복잡한 패턴을 학습할 수 있으며, 딥러닝은 이 은닉층이 깊게 쌓인 것이다.", "examples": ["입력층(픽셀) → 은닉층1(선·모서리) → 은닉층2(눈·코·귀) → 출력층(얼굴 인식)", "은닉층 1개 = 얕은 신경망 / 은닉층 100개 = 딥러닝", "GPT 같은 대형 모델은 수백 개의 은닉층(Transformer 블록)을 가짐", "은닉층이 많을수록 더 추상적이고 복잡한 특징을 학습"], "related": ["인공신경망", "딥러닝", "Transformer"], "saved_date": "2026-10-09", "flow": ["① 입력층에서 데이터 수신", "② 은닉층1: 단순 패턴(선·색) 추출", "③ 은닉층2: 복합 패턴(눈·코·귀) 추출", "④ 은닉층N: 추상적 특징(얼굴·표정) 추출", "⑤ 출력층으로 전달"], "confusion": {"헷갈리는점": "은닉층이 많을수록 무조건 좋다고 오해", "차이": "은닉층이 많으면 복잡한 패턴 학습 가능하지만 과적합·학습 난이도 증가", "기억법": "층이 많을수록 = 더 깊은 요리사 실력, 하지만 배우기도 더 어려움"}, "kakao_chat": "A: 은닉층이 딥러닝에서 뭔지 알아?\nB: 숨겨져 있는 층?\nA: 맞아! 인공신경망에서 입력층과 출력층 사이에 있는 층들이야\n   눈에 직접 보이지 않는다고 '은닉'이라고 해\nB: 왜 필요한 거야?\nA: 은닉층이 없으면 단순한 선형 계산만 할 수 있어\n   은닉층이 여러 개 있으면 복잡한 패턴도 학습할 수 있어\nB: 그럼 많을수록 좋아?\nA: 무조건은 아니야. 너무 많으면 학습이 불안정해지고 느려져\n   딥러닝이 깊은(Deep) 건 이 은닉층이 여러 층 쌓인 거야\n   은닉층 = 뇌의 중간 처리 단계라고 생각해"}, {"id": "term_050", "term": "SVM (Support Vector Machine)", "english": "Support Vector Machine", "category": "ML", "one_line": "데이터를 가장 잘 나누는 경계선(결정 경계)을 찾아 분류하는 머신러닝 알고리즘", "description": "SVM은 두 클래스의 데이터를 가장 넓은 여백(margin)으로 구분하는 경계선을 찾는 알고리즘이다. 딥러닝 이전에 분류 문제에서 강력한 성능을 보였다. 데이터가 적을 때도 잘 작동하는 장점이 있다.", "examples": ["고양이 vs 개 사진 → SVM이 두 그룹을 가장 잘 나누는 선을 찾음", "스팸 메일 분류 — 딥러닝 이전 시대의 대표 분류 알고리즘", "마진(margin) = 두 클래스 사이의 여백 — 이걸 최대화하는 게 SVM의 목표", "서포트 벡터 = 경계선에 가장 가까운 데이터 포인트들"], "related": ["분류", "지도학습", "딥러닝", "로지스틱 회귀"], "saved_date": "2026-10-09", "flow": ["① 데이터 포인트를 고차원 공간에 매핑", "② 두 클래스를 가장 넓은 마진으로 나누는 경계선 탐색", "③ 서포트 벡터(경계에 가장 가까운 점) 확인", "④ 분류 경계선 확정 → 예측"], "confusion": {"헷갈리는점": "SVM을 딥러닝과 비교해 구식이라고 오해", "차이": "SVM = 데이터 적을 때·해석 필요할 때 여전히 강력 / 딥러닝 = 데이터 많을 때 강력", "기억법": "SVM = 정밀 수술 도구(소규모·정확) / 딥러닝 = 대형 병원(대규모·강력)"}, "kakao_chat": "A: SVM이 뭔지 알아?\nB: 뭔가 머신러닝 알고리즘?\nA: 맞아! Support Vector Machine. 데이터를 두 그룹으로 나누는 경계선 찾는 알고리즘이야\n   두 그룹 사이의 간격(마진)이 가장 큰 경계선을 찾는 게 핵심이야\nB: 딥러닝이랑은 다른 거야?\nA: 딥러닝 나오기 전에 많이 쓰던 전통 머신러닝 알고리즘이야\n   딥러닝보다 적은 데이터로도 잘 작동하고 결과 해석도 쉬워\nB: 그럼 지금도 써?\nA: 데이터가 작거나, 이진 분류, 의료 데이터 같이 해석이 중요한 경우엔 여전히 써\n   모든 문제에 딥러닝이 최선은 아니야"}, {"id": "term_051", "term": "Transformer", "english": "Transformer", "category": "ML", "one_line": "어텐션 메커니즘 기반으로 문장 전체를 한번에 처리하는 딥러닝 아키텍처", "description": "Transformer는 2017년 구글이 발표한 'Attention is All You Need' 논문에서 등장한 신경망 구조다. 기존 RNN처럼 순서대로 처리하지 않고 문장 전체를 동시에 보며 단어 간 관계를 파악한다. GPT, Claude, Gemini 등 모든 현대 LLM의 기반 구조다.", "examples": ["'나는 사과를 먹었다' → Transformer가 '먹었다'와 '사과' 관계를 동시에 파악", "GPT, Claude, Gemini, Llama — 모두 Transformer 기반", "번역·요약·코드 생성·이미지 인식까지 확장 적용", "딥러닝 → 인공신경망 → Transformer → LLM 순서로 발전"], "related": ["어텐션", "딥러닝", "LLM", "은닉층"], "saved_date": "2026-10-09", "flow": ["① 텍스트 → 토큰 변환", "② 토큰 임베딩(벡터화)", "③ 어텐션 계산(Q·K·V 행렬)", "④ 멀티헤드 어텐션(여러 관점)", "⑤ FFN(Feed Forward Network) 통과", "⑥ N번 반복(N=레이어 수)", "⑦ 출력 토큰 생성"], "confusion": {"헷갈리는점": "Transformer를 LLM과 동일시", "차이": "Transformer = 아키텍처(구조) / LLM = Transformer로 만든 대규모 언어 모델", "기억법": "Transformer = 엔진 설계도 / LLM = 그 엔진으로 만든 자동차"}, "kakao_chat": "A: Transformer가 뭔지 알아? GPT의 기반이라던데\nB: 변환기 같은 거?\nA: AI 쪽에서 Transformer는 어텐션 메커니즘 기반의 딥러닝 구조야\n   2017년 구글이 발표한 논문 'Attention is All You Need'에서 나온 거야\nB: 기존 RNN이랑 뭐가 달라?\nA: RNN은 순서대로 처리해서 느리고 긴 문장 처리가 약했어\n   Transformer는 전체 문장을 병렬로 처리하고, 어텐션으로 중요한 단어에 집중해\nB: 그래서 ChatGPT, Claude 다 Transformer 기반이구나\nA: 맞아! 지금 LLM 전부가 Transformer 기반이야\n   Transformer 없었으면 ChatGPT도 없었어"}, {"id": "term_052", "term": "어텐션 (Attention)", "english": "Attention Mechanism", "category": "ML", "one_line": "문장에서 지금 이 단어와 관련 있는 다른 단어에 집중(가중치 부여)하는 메커니즘", "description": "어텐션은 문장 안의 각 단어가 다른 단어들과 얼마나 관련 있는지 점수를 매기는 방식이다. 예를 들어 '그것'이라는 단어가 앞 문장의 어떤 명사를 가리키는지 파악할 때 어텐션이 작동한다. Transformer의 핵심 원리이며, Query·Key·Value(Q·K·V) 구조로 계산된다.", "examples": ["'은행에 갔다' — '은행'이 금융기관인지 강가인지: 앞뒤 단어에 어텐션 부여해 판단", "'그는 컵을 떨어뜨렸고 그것이 깨졌다' — '그것'=컵 : 어텐션이 컵에 높은 점수", "Q(질문) · K(키) · V(값) — 검색엔진 비유: 쿼리로 검색해 관련 내용 가져오기", "Multi-Head Attention = 여러 관점에서 동시에 어텐션 계산"], "related": ["Transformer", "LLM", "컨텍스트"], "saved_date": "2026-10-09", "flow": ["① 각 토큰을 Q(쿼리)·K(키)·V(값)으로 변환", "② Q와 K의 내적으로 어텐션 점수 계산", "③ Softmax로 확률 변환", "④ V와 가중합 → 맥락 반영된 벡터", "⑤ 다음 레이어로 전달"], "confusion": {"헷갈리는점": "어텐션을 단순 '집중'으로만 이해", "차이": "어텐션 = 수학적으로 각 단어가 다른 단어와의 관련도를 점수로 계산하는 메커니즘", "기억법": "검색엔진 비유: Q=검색어 / K=페이지 제목 / V=페이지 내용"}, "kakao_chat": "A: 어텐션이 Transformer에서 뭔 역할이야?\nB: 주의를 기울인다는 거?\nA: 맞아! 입력 문장에서 어떤 단어가 다른 단어와 얼마나 관련 있는지 가중치로 계산하는 메커니즘이야\nB: 예시 들어줘\nA: '나는 배가 고프다'에서 '고프다'를 이해할 때 '배'가 중요하잖아\n   어텐션이 '고프다' ↔ '배' 관계에 높은 가중치 줘서 더 집중해서 보는 거야\nB: 아 문맥을 이해하는 방식이구나\nA: 맞아! 어텐션 덕분에 긴 문장에서도 멀리 있는 단어들 사이 관계를 잡을 수 있어\n   Transformer의 핵심이야"}, {"id": "term_053", "term": "Temperature (온도)", "english": "Temperature", "category": "LLM", "one_line": "LLM 응답의 무작위성(창의성)을 조절하는 파라미터 — 높을수록 창의적, 낮을수록 일관적", "description": "Temperature는 모델이 다음 토큰을 선택할 때 확률 분포를 얼마나 평평하게 만들지 결정하는 값이다. 0에 가까울수록 항상 가장 확률 높은 단어만 선택(일관·정확), 1 이상이면 낮은 확률의 단어도 선택 가능(창의 "④ 다음 토큰 입력 + 이전 은닉 상태", "⑤ 반복 → 마지막 토큰까지"], "confusion": {"헷갈리는점": "RNN이 Transformer보다 항상 나쁘다고 오해", "차이": "RNN = 순서 데이터·경량 모델에 여전히 유용 / Transformer = 긴 문장·대규모에 강력", "기억법": "RNN = 1인 기억력 좋은 직원 / Transformer = 팀 전체가 동시에 보는 구조"}, "kakao_chat": "A: RNN이 텍스트 처리할 때 쓰인다던데 지금도 써?\nB: 지금은 Transformer 쓰는 거 아니야?\nA: 맞아. RNN은 Transformer 나오기 전에 많이 썼어\n   순서가 있는 데이터(텍스트, 시계열)를 순서대로 처리하는 구조야\nB: 어떻게 순서 처리해?\nA: 앞 단어 처리한 결과를 다음 단어 처리할 때 같이 써\n   '오늘 날씨가 맑다'를 순서대로 '오늘' → '날씨가' → '맑다' 처리하는 거야\nB: 그럼 뭐가 문제였어?\nA: 순서대로 처리해서 병렬화가 안 돼. 느려\n   그리고 긴 문장에서 앞 내용을 점점 잊어버리는 문제도 있어\n   그걸 보완한 게 LSTM이고, 결국 Transformer로 대체됐어"}, {"id": "term_057", "term": "LSTM (Long Short-Term Memory)", "english": "Long Short-Term Memory", "category": "ML", "one_line": "RNN의 장기 기억 문제를 해결한 개선된 순환 신경망 — 중요한 정보를 오래 기억", "description": "LSTM은 RNN이 긴 문장에서 앞부분을 잊는 문제를 해결하기 위해 '게이트(gate)' 구조를 추가한 신경망이다. 기억할 것(input gate)·잊을 것(forget gate)·출력할 것(output gate)을 스스로 학습한다. Transformer 등장 전까지 번역·음성 인식의 핵심 기술이었다.", "examples": ["'나는 한국에서 태어나 미국에서 살았고 지금은 일본에 있다. 나는 (  )어를 쓴다'", "→ LSTM은 '일본'을 기억해 '일본어'를 예측 (RNN은 잊어버림)", "구글 번역 초기 버전 — LSTM 기반", "음성 인식 — 긴 문장에서 앞 음절 맥락 유지에 활용", "지금은 대부분 Transformer로 대체됐지만 시계열·임베디드에서 여전히 사용"], "related": ["RNN", "Transformer", "딥러닝", "어텐션"], "saved_date": "2026-10-09", "flow": ["① 입력 + 이전 셀 상태(장기 기억) + 이전 은닉 상태", "② Forget Gate: 버릴 정보 결정", "③ Input Gate: 저장할 정보 결정", "④ 셀 상태 업데이트", "⑤ Output Gate: 출력 결정"], "confusion": {"헷갈리는점": "LSTM을 RNN과 완전히 다른 것으로 오해", "차이": "LSTM ⊂ RNN — LSTM은 게이트 구조를 추가한 개선된 RNN", "기억법": "RNN = 단기 기억만 있는 사람 / LSTM = 장기·단기 기억 모두 있는 사람"}, "kakao_chat": "A: LSTM이 뭔데?\nB: RNN 개선판?\nA: 맞아! Long Short-Term Memory. RNN의 장기 의존성 문제 해결한 버전이야\n   긴 텍스트에서 앞 내용을 오래 기억할 수 있는 구조\nB: RNN이 기억 못 하는 문제가 뭐야?\nA: 예를 들어 '오늘 아침에 일어나서 밥 먹고 학교 가서 공부하다가 집에 왔는데 피곤하다'\n   RNN은 앞의 '아침'을 기억 못 할 수 있어\n   LSTM은 셀 상태(Cell State)라는 기억 통로로 중요한 정보를 오래 유지해\nB: 근데 지금은 Transformer가 더 좋은 거야?\nA: 응! Transformer가 LSTM보다 병렬 처리 되고 성능도 좋아서\n   현재 NLP의 표준은 Transformer야"}, {"id": "term_058", "term": "GAN (Generative Adversarial Network)", "english": "Generative Adversarial Network", "category": "ML", "one_line": "생성자와 판별자가 서로 경쟁하며 진짜 같은 가짜 데이터를 만들어내는 딥러닝 구조", "description": "GAN은 두 신경망이 대결하는 구조다. 생성자(Generator)는 가짜 이미지를 만들고, 판별자(Discriminator)는 진짜/가짜를 구분한다. 생성자는 판별자를 속이려 하고, 판별자는 더 잘 구분하려 하면서 서로 발전한다. 딥페이크·이미지 생성의 핵심 기술이었다.", "examples": ["딥페이크 — GAN이 실존하지 않는 사람 얼굴을 생성", "ThisPersonDoesNotExist.com — GAN이 만든 가짜 인물 사진", "생성자=위조지폐범 / 판별자=경찰 — 서로 실력이 올라가며 완벽한 위조 달성", "지금은 Diffusion Model(Stable Diffusion, DALL-E)이 이미지 생성 주류로 대체"], "related": ["딥러닝", "강화학습", "Diffusion", "생성형 AI"], "saved_date": "2026-10-09", "flow": ["① 생성자: 랜덤 노이즈 → 가짜 데이터 생성", "② 판별자: 진짜vs가짜 분류", "③ 판별자 학습(진짜=1, 가짜=0)", "④ 생성자 학습(판별자를 속이도록)", "⑤ 반복 → 생성자가 점점 정교해짐"], "confusion": {"헷갈리는점": "GAN이 현재도 이미지 생성 주류라고 오해", "차이": "GAN은 2020년대 초까지 주류였지만 현재는 Diffusion Model(DALL-E, Stable Diffusion)이 대세", "기억법": "GAN = 위조지폐범 vs 경찰 대결 / Diffusion = 노이즈에서 점차 선명하게"}, "kakao_chat": "A: GAN이 가짜 이미지 만드는 거 맞아?\nB: 딥페이크 그거야?\nA: GAN 기반 기술이 맞아. Generative Adversarial Network\n   생성자(Generator)와 판별자(Discriminator) 두 모델이 서로 경쟁하며 학습해\nB: 경쟁한다는 게 어떻게?\nA: 생성자는 진짜같은 가짜를 만들려고 하고\n   판별자는 진짜와 가짜를 구별하려고 해\n   이 대결이 반복되면서 생성자가 점점 정교해지는 거야\nB: 아 위조지폐범 vs 경찰 대결 같은 거네\nA: 딱 그 비유야! 근데 지금은 Diffusion 모델(DALL-E, Stable Diffusion)이 더 쓰여\n   GAN의 학습이 불안정한 단점을 개선한 거야"}, {"id": "term_059", "term": "Decision Tree (결정 트리)", "english": "Decision Tree", "category": "ML", "one_line": "스무고개처럼 예/아니오 질문을 반복해 결론을 내리는 트리 구조 분류 알고리즘", "description": "Decision Tree는 데이터를 분기 조건(예/아니오)으로 나눠가며 최종 결론에 도달하는 알고리즘이다. 구조가 직관적이라 사람이 이해하기 쉽고, 결과를 시각화할 수 있다. 단점은 데이터에 과적합되기 쉽다는 것 — 이를 해결하기 위해 Random Forest가 등장했다.", "examples": ["대출 승인 여부: 소득 > 300만원? → 신용점수 > 700? → 승인/거절", "스팸 분류: '무료'단어 포함? → 발신자 모름? → 스팸/정상", "스무고개와 동일한 원리 — 질문을 좁혀가며 정답 도달", "장점: 결과 해석 가능 / 단점: 과적합 쉬움 → Bagging·Random Forest로 해결"], "related": ["Random Forest", "Bagging", "분류", "지도학습"], "saved_date": "2026-10-09", "flow": ["① 루트 노드: 가장 중요한 특징으로 분기", "② 각 분기: 예/아니오 조건", "③ 반복 분기 → 잎 노드(최종 결론) 도달", "④ 예측: 새 데이터가 어느 잎에 속하는지 확인"], "confusion": {"헷갈리는점": "Decision Tree를 Random Forest와 혼동", "차이": "Decision Tree = 나무 1그루(과적합 쉬움) / Random Forest = 나무 수백 그루 다수결(안정적)", "기억법": "Decision Tree = 스무고개 1명이 하기 / Random Forest = 스무고개 100명이 동시에"}, "kakao_chat": "A: Decision Tree가 뭔지 알아?\nB: 결정 나무? 트리 구조야?\nA: 맞아! 스무고개처럼 예/아니오 질문 반복해서 결론 내리는 모델이야\n   '나이 > 30?' → '예' → '수입 > 5000?' → 이런 식으로 분기해서 결론에 도달해\nB: 딥러닝이랑 뭐가 달라?\nA: 딥러닝처럼 복잡한 연산이 없어서 결과를 사람이 이해하기 쉬워\n   어떤 조건으로 판단했는지 직접 볼 수 있는 게 장점이야\nB: 근데 Random Forest랑은 다른 거야?\nA: Decision Tree는 나무 1그루야. 과적합이 쉽게 일어나는 단점이 있어\n   Random Forest는 나무 수백 그루 만들어서 다수결 내리는 거야\n   Decision Tree = 스무고개 1명이 하기야"}, {"id": "term_060", "term": "Bagging", "english": "Bootstrap Aggregating", "category": "ML", "one_line": "여러 모델을 각각 다른 데이터 샘플로 학습시킨 뒤 결과를 투표로 합치는 앙상블 방법", "description": "Bagging은 전체 데이터에서 무작위로 샘플을 뽑아 여러 개의 모델을 독립적으로 학습시키고, 최종 예측은 다수결(분류) 또는 평균(회귀)으로 결정하는 방식이다. 한 모델이 틀려도 전체 결과에 큰 영향이 없어 과적합을 줄이고 안정성을 높인다. Random Forest가 Bagging의 대표 사례다.", "examples": ["100명의 의사에게 같은 X-ray를 보여주고 다수결로 진단 → Bagging과 동일", "데이터 1000개 → 800개씩 랜덤 추출 → 모델 10개 학습 → 다수결", "한 모델이 과적합돼도 나머지 9개가 바로잡음", "Bootstrap(무작위 샘플링) + Aggregating(결과 합산) = Bagging"], "related": ["Random Forest", "Decision Tree", "앙상블", "지도학습"], "saved_date": "2026-10-09", "flow": ["① 전체 데이터에서 무작위 복원 샘플링(Bootstrap)", "② 각 샘플로 독립적인 모델 학습", "③ N개 모델 완성", "④ 예측: N개 모델 각각 예측 → 다수결(분류) 또는 평균(회귀)"], "confusion": {"헷갈리는점": "Bagging과 Boosting 혼동", "차이": "Bagging = 독립적 병렬 학습(과적합 방지) / Boosting = 순차 학습(이전 모델 오류에 집중)", "기억법": "Bagging = 각자 따로 공부 후 다수결 / Boosting = 틀린 문제 집중 복습"}, "kakao_chat": "A: Bagging이 뭔지 알아?\nB: 가방 드는 거?\nA: ㅋㅋ 머신러닝에서 Bagging은 여러 모델을 독립적으로 병렬 학습해서 다수결 내리는 기법이야\n   Bootstrap Aggregating 줄임말이야\nB: 왜 하나만 안 쓰는 거야?\nA: 모델 하나는 틀릴 수 있어. 여러 모델이 각자 독립적으로 예측하면\n   한 모델이 틀려도 다수가 맞으면 결과가 맞아\nB: 아 위원회 투표 같은 거네\nA: 맞아! Boosting이랑 헷갈릴 수 있는데\n   Bagging = 각자 따로 공부 후 다수결 / Boosting = 틀린 문제 집중 복습 순차 학습이야\n   Random Forest가 Bagging 대표 사례야"}, {"id": "term_061", "term": "Random Forest", "english": "Random Forest", "category": "ML", "one_line": "수많은 Decision Tree를 Bagging으로 학습시켜 다수결로 예측하는 강력한 앙상블 알고리즘", "description": "Random Forest는 Decision Tree를 수백~수천 개 만들되, 각 트리가 무작위로 선택된 데이터와 특징(feature)으로 학습하게 해 서로 다른 트리들이 협력해 예측한다. 단일 Decision Tree보다 훨씬 정확하고 과적합에 강하다. 표 형태 데이터에서 지금도 강력한 성능을 보인다.", "examples": ["나무 1개(Decision Tree) = 한 명의 의사 / 숲(Forest) = 수백 명 의사의 다수결", "신용 평가·의료 진단·부동산 가격 예측에서 여전히 널리 사용", "각 트리는 서로 다른 특징·데이터 조합으로 학습 → 다양한 시각 확보", "딥러닝보다 데이터 적을 때, 해석이 필요할 때 Random Forest 선호"], "related": ["Decision Tree", "Bagging", "Gradient Boosting", "지도학습"], "saved_date": "2026-10-09", "flow": ["① 데이터 Bootstrap 샘플링", "② 각 트리: 무작위 특징 서브셋으로 학습", "③ N개 Decision Tree 완성", "④ 예측: 전체 트리 다수결"], "confusion": {"헷갈리는점": "Random Forest가 딥러닝보다 항상 나쁘다고 오해", "차이": "Random Forest = 표 형태 데이터·소규모·해석 필요할 때 강력 / 딥러닝 = 이미지·텍스트·대규모에 강력", "기억법": "Random Forest = 숲(나무 많을수록 안정) / 딥러닝 = 거대한 공장(대규모 처리)"}, "kakao_chat": "A: Random Forest가 왜 이름이 숲이야?\nB: 나무가 많아서?\nA: 맞아! Decision Tree(나무)를 수백 개 만들어서 다수결로 예측하는 거야\n   각 나무가 무작위 특징 서브셋으로 학습해서 다양성 확보\nB: 그냥 Decision Tree 하나 쓰면 안 돼?\nA: Decision Tree 하나는 과적합이 쉽게 일어나서 새 데이터에 약해\n   Random Forest는 여러 나무가 투표하니까 훨씬 안정적이야\nB: 딥러닝보다 나쁜 거야?\nA: 무조건 그런 건 아니야. 표 형태 데이터나 소규모 데이터에선 Random Forest가 강해\n   이미지·텍스트·대규모 데이터에는 딥러닝이 강하고\n   Random Forest = 숲(나무 많을수록 안정)으로 기억해"}, {"id": "term_062", "term": "Cut-off (컷오프)", "english": "Cut-off", "category": "ML", "one_line": "학습 데이터의 시간적 기준점 — 이 날짜 이후 정보는 모델이 모른다", "description": "Cut-off는 AI 모델의 학습 데이터가 어디까지 포함됐는지의 시간 기준이다. Cut-off 이후에 일어난 사건은 모델이 학습하지 않았으므로 알 수 없다. LLM에서 '지식 마감일(Knowledge Cutoff)'이라고도 한다.", "examples": ["ChatGPT-4의 Cut-off = 2023년 4월 → 그 이후 뉴스·사건은 모름", "'최근 AI 근황 알려줘' → Cut-off 이후면 모르거나 틀린 정보 줄 수 있음", "RAG로 최신 문서를 넣어주면 Cut-off 한계를 보완 가능", "모델 학습 비용이 크기 때문에 자주 업데이트하기 어려워 Cut-off 존재"], "related": ["RAG", "LLM", "컨텍스트", "Threshold"], "saved_date": "2026-10-09", "confusion": {"헷갈리는점": "Cut-off를 Threshold(임계값)와 혼동하기 쉬움", "차이": "Cut-off는 시간 기준(언제까지 아는가), Threshold는 확률 기준(얼마 이상이면 참인가)", "기억법": "Cut-off = 지식의 만료일 / Threshold = 판단의 기준선"}, "flow": ["① 데이터 수집 기간 설정", "② Cut-off 날짜 이후 데이터는 포함 안 함", "③ Cut-off 이전 데이터만으로 모델 학습", "④ 배포 후 시간이 지나면 새 데이터 반영 안 됨"], "kakao_chat": "A: Cut-off가 뭔지 알아?\nB: 뭔가 자르는 거?\nA: LLM 맥락에서 Cut-off는 모델이 학습한 데이터의 마지막 날짜야\n   그 날짜 이후 일은 모르는 거지\nB: 아 그래서 GPT한테 최신 뉴스 물어보면 모른다는 거구나\nA: 맞아! 예를 들어 학습 Cut-off가 2024년 9월이면\n   그 이후에 일어난 일은 모델이 몰라\nB: Threshold(임계값)랑 헷갈리는 사람 있을 것 같아\nA: 달라! Cut-off = 시간 기준 (언제까지 아는가)\n   Threshold = 확률 기준 (얼마 이상이면 참인가)\n   Cut-off = 지식의 만료일이야"}, {"id": "term_063", "term": "Threshold (임계값)", "english": "Threshold", "category": "ML", "one_line": "모델의 예측 확률을 어떤 기준으로 결론(참/거짓)으로 바꿀지 결정하는 경계값", "description": "Threshold는 모델이 출력한 확률값을 '예/아니오'로 변환하는 기준선이다. 예를 들어 스팸 확률이 0.7이 넘으면 스팸으로 분류하는 것처럼, 어디서 선을 그을지 정하는 값이다. 높이면 정밀도 상승·재현율 하락, 낮추면 그 반대가 된다.", "examples": ["스팸 필터: 확률 > 0.5 → 스팸 (threshold=0.5)", "암 진단: 확률 > 0.3 → 정밀 검사 권고 (놓치면 안 되니 낮게 설정)", "보안 시스템: 확률 > 0.9 → 차단 (오탐 줄이려고 높게 설정)", "threshold 0.5 → 0.7로 올리면: 스팸 판단 더 엄격 → 정상메일 스팸 오분류 줄어듦"], "related": ["분류", "Cut-off", "Decision Tree", "SVM"], "saved_date": "2026-10-09", "confusion": {"헷갈리는점": "Threshold를 Cut-off와 혼동하기 쉬움. 또한 높이면 무조건 좋다고 오해하기 쉬움", "차이": "Cut-off는 시간 기준, Threshold는 확률 기준", "tradeoff": {"낮게(0.3)": "놓치는 스팸 줄어듦 → 정상메일 오분류 늘어남 (재현율↑ 정밀도↓)", "높게(0.9)": "정상메일 오분류 줄어듦 → 스팸 놓칠 수 있음 (정밀도↑ 재현율↓)"}, "사용예": "암 진단=낮게(놓치면 안 됨) / 보안 차단=높게(오탐 줄여야 함)", "기억법": "Threshold = 어디서 선 그을 것인가"}, "flow": ["① 모델이 각 클래스 확률 출력(0~1)", "② Threshold 값 설정(보통 0.5)", "③ 확률 ≥ Threshold → 양성 분류", "④ 확률 < Threshold → 음성 분류", "⑤ Threshold 조정으로 정밀도·재현율 트레이드오프"], "kakao_chat": "A: Threshold가 뭐야? 임계값?\nB: 기준선 같은 거?\nA: 맞아! 분류 모델이 예측한 확률이 얼마 이상이면 '양성'으로 볼지 결정하는 기준이야\n   보통 0.5 쓰는데, 상황에 따라 바꿔\nB: 왜 바꿔?\nA: 암 진단 모델이면 놓치면 큰일이니까 기준을 낮춰 → 재현율 높임\n   스팸 필터는 정상 메일 오분류가 더 나쁘니까 기준 높여 → 정밀도 높임\nB: 아 높이고 낮추면 트레이드오프가 있구나\nA: 맞아! 낮추면 더 많이 양성으로 분류, 높이면 더 엄격하게 양성 분류\n   Threshold = 어디서 선 그을 것인가야"}, {"id": "term_064", "term": "하네스 (Harness)", "english": "Harness", "category": "Agent", "one_line": "AI 에이전트가 도구·환경·외부 시스템을 안전하게 사용하도록 묶어주는 실행 구조", "description": "하네스는 원래 말(馬)에 채우는 마구(馬具)에서 온 단어다. AI 맥락에서는 에이전트가 도구(API·브라우저·코드 실행 등)를 사용할 때 범위·권한·순서를 제어하는 틀을 말한다. 하네스가 없으면 AI가 의도치 않은 행동을 하거나 시스템을 망가뜨릴 수 있다.", "examples": ["AI 에이전트가 파일을 읽고 수정할 때 — 어느 폴더까지만 접근 가능한지 제한하는 것", "말에 마구(하네스)를 채워 방향을 제어하듯 — AI에게 실행 범위를 채워 제어", "LangChain·AutoGPT의 Tool 실행 구조 = 하네스의 일종", "하네스 엔지니어링 = AI가 도구를 안전하게 쓰도록 실행 환경 자체를 설계하는 것"], "confusion": {"헷갈리는점": "하네스를 단순히 '코드 테스트용 도구(Test Harness)'로만 아는 경우가 많음", "차이": "Test Harness = 코드 테스트 자동화 도구 / AI Harness = 에이전트 실행 제어 구조", "기억법": "말 마구(馬具) — 말이 뛰어나도 마구 없으면 방향을 못 잡음. AI도 마찬가지"}, "related": ["하네스 엔지니어링", "루프 엔지니어링", "AI Agent", "워크플로"], "saved_date": "2026-10-09", "flow": ["① AI 에이전트 목표 정의", "② 사용 가능 도구 목록 설정", "③ 실행 범위·권한 제한", "④ 에이전트 실행", "⑤ 결과 수집·검증", "⑥ 이상 감지 시 중단"], "kakao_chat": "A: 하네스(Harness)가 AI에서 무슨 의미야?\nB: 테스트 도구 같은 거 아니야?\nA: 그건 Test Harness야. AI 하네스는 다른 맥락이야\n   AI 에이전트의 실행 환경, 도구, 권한을 통제하는 구조 전체를 말해\nB: 테스트랑 어떻게 달라?\nA: Test Harness = 코드 자동화 테스트 도구\n   AI Harness = 에이전트가 뭘 할 수 있는지 범위 정하고 통제하는 구조야\nB: 예를 들어?\nA: 에이전트에게 '웹 검색은 되는데 파일 삭제는 안 됨' 이런 권한 설정하는 게 하네스야\n   말 마구(馬具) — 말이 뛰어나도 마구 없으면 방향 못 잡듯이\n   AI도 하네스 없으면 통제 불능이야"}, {"id": "term_065", "term": "핑 (Ping)", "english": "Ping", "category": "Infra", "one_line": "특정 서버가 살아있는지, 응답 시간이 얼마나 걸리는지 확인하는 네트워크 명령어", "description": "Ping은 내 컴퓨터에서 특정 서버에 작은 신호를 보내고 돌아오는 시간을 측정한다. 서버가 응답하면 살아있는 것이고, 응답이 없으면 서버가 죽었거나 네트워크 문제가 있는 것이다. 단위는 ms(밀리초)이며 낮을수록 빠른 연결이다.", "examples": ["ping google.com → 응답시간 12ms = 구글 서버까지 12ms", "게임에서 '핑 높다' = 서버와의 응답시간이 느려 지연 발생", "ping 168.231.118.60 → VPS 서버 살아있는지 확인", "Request timeout = 서버가 응답 없음 (죽었거나 방화벽 차단)"], "confusion": {"헷갈리는점": "핑(Ping)을 단순 속도로만 이해하는 경우", "정확한의미": "Ping = 왕복 응답 시간(RTT, Round Trip Time) — 보내고 받기까지의 시간", "기억법": "잠수함 소나(음파 탐지) — 소리 보내고 메아리 돌아오는 시간 측정과 동일"}, "related": ["서버", "ISP", "IX", "네트워크"], "saved_date": "2026-10-09", "flow": ["① ping 명령 실행(ping google.com)", "② ICMP Echo Request 패킷 전송", "③ 대상 서버가 ICMP Echo Reply 반환", "④ 왕복 시간(RTT) 측정·출력", "⑤ 패킷 손실률 계산"], "kakao_chat": "A: 핑(Ping)이 뭔지 알아?\nB: 서버 응답 확인하는 거?\nA: 맞아! 특정 서버에 신호 보내고 돌아오는 시간 측정하는 거야\n   ping google.com 이런 식으로 써\nB: 그럼 ping이 낮을수록 좋은 거야?\nA: 응! ping이 낮다 = 응답이 빠르다 = 레이턴시 낮다는 뜻이야\n   게임에서 ping 낮아야 딜레이 없이 플레이 가능하잖아\nB: 정확히 뭘 측정하는 거야?\nA: RTT(Round Trip Time) = 패킷 보내고 받기까지 왕복 시간이야\n   잠수함 소나 비유 좋아 — 음파 보내고 메아리 돌아오는 시간 측정하는 것처럼"}, {"id": "term_066", "term": "캐싱 (Caching)", "english": "Caching", "category": "Infra", "one_line": "자주 쓰는 데이터를 빠른 저장소에 미리 저장해 두고 빠르게 꺼내 쓰는 기법", "description": "캐싱은 매번 DB나 서버에서 데이터를 가져오는 대신, 자주 쓰는 데이터를 메모리(RAM) 같은 빠른 저장소에 임시 저장해 두는 방식이다. 응답 속도를 크게 높이고 서버 부하를 줄인다. Redis가 대표적인 캐시 서버다.", "examples": ["네이버 메인 뉴스 — 매번 DB 조회하지 않고 1분마다 캐시 갱신", "브라우저 캐시 — 같은 이미지를 매번 다운받지 않고 로컬에 저장", "CDN — 전 세계 서버에 콘텐츠를 캐싱해 가까운 서버에서 빠르게 전달", "LLM 응답 캐싱 — 같은 질문이 반복되면 저장된 답변을 즉시 반환"], "confusion": {"헷갈리는점": "캐싱(Caching)과 스토리지(Storage)를 혼동하기 쉬움", "차이": "스토리지=영구 저장 / 캐시=임시 저장(빠른 접근용, 만료 시 삭제)", "기억법": "캐시 = 책상 위 메모지(빠르게 꺼냄, 임시) / 스토리지 = 서류 캐비넷(영구 보관)"}, "related": ["스토리지", "DB 서버", "CDN", "서버 3단 구조"], "saved_date": "2026-10-09", "flow": ["① 첫 요청: DB·서버에서 데이터 조회(느림)", "② 조회 결과를 캐시에 저장", "③ 두 번째 요청: 캐시에서 바로 반환(빠름)", "④ 캐시 만료 시 다시 원본에서 조회 후 캐시 갱신"], "kakao_chat": "A: 캐싱이 왜 중요해?\nB: 그냥 저장하는 거 아니야?\nA: 캐싱은 자주 쓰는 데이터를 빠른 곳에 미리 저장해두는 거야\n   DB까지 매번 갔다오면 느린데, 캐시에 있으면 바로 돌려줄 수 있어\nB: 영구 저장이랑 다른 거야?\nA: 달라! 캐시는 임시 저장이야. 만료되면 삭제돼\n   스토리지 = 서류 캐비넷(영구 보관) / 캐시 = 책상 위 메모지(빠르게 꺼냄, 임시)\nB: 그럼 언제 지워지는 거야?\nA: TTL(Time To Live) 설정해서 일정 시간 지나면 삭제해\n   그리고 데이터가 바뀌면 캐시도 지워야 해 — 이게 캐시 무효화 문제야\n   캐싱 전략 잘못하면 오래된 데이터 계속 보여주는 버그 생겨"}, {"id": "term_067", "term": "Git", "english": "Git", "category": "Dev", "one_line": "코드의 변경 이력을 추적하고 여러 사람이 협업할 수 있게 해주는 버전 관리 시스템", "description": "Git은 파일의 변경 이력을 저장하고, 이전 버전으로 돌아가거나 여러 사람이 동시에 작업할 수 있게 해주는 도구다. 내 컴퓨터(로컬)에서 작동한다. 코드뿐 아니라 모든 텍스트 파일의 버전 관리에 사용된다.", "examples": ["어제 작동하던 코드로 되돌리기 → git checkout", "기능 A와 기능 B를 동시에 개발 → 브랜치(branch) 분리", "'저장'이 아닌 '기록' — 언제 누가 무엇을 바꿨는지 모두 남음", "구글 Docs의 '수정 이력 보기'와 비슷한 개념"], "confusion": {"헷갈리는점": "Git과 GitHub을 같은 것으로 혼동하는 경우가 많음", "차이": "Git = 내 컴퓨터에서 돌아가는 버전 관리 도구 / GitHub = Git 저장소를 온라인에 올리는 서비스", "비유": "Git = 내 일기장 / GitHub = 일기장을 올려두는 클라우드"}, "related": ["GitHub", "워크트리", "브랜치", "버전 관리"], "saved_date": "2026-10-09", "flow": ["① git init — 레포지토리 생성", "② git add — 변경 파일 스테이징", "③ git commit — 스냅샷 저장", "④ git push — 원격 저장소 업로드", "⑤ git pull — 원격 변경사항 다운로드"], "kakao_chat": "A: Git이 뭔지 설명해봐\nB: GitHub 아니야?\nA: 달라! Git은 내 컴퓨터에서 돌아가는 버전 관리 도구야\n   GitHub는 Git 저장소를 온라인에 올리는 서비스고\nB: 버전 관리가 왜 필요해?\nA: 코드 수정하다가 잘못되면 이전 버전으로 돌아갈 수 있어\n   그리고 여러 명이 협업할 때 충돌 관리도 해줘\nB: 어떻게 쓰는 거야?\nA: git init으로 시작 → git add로 스테이징 → git commit으로 저장\n   git push하면 GitHub에 올리고, git pull로 받아와\n   Git = 내 일기장 / GitHub = 일기장 올리는 클라우드로 기억해"}, {"id": "term_068", "term": "GitHub", "english": "GitHub", "category": "Dev", "one_line": "Git 저장소를 온라인에 올려 협업·공유·배포할 수 있게 해주는 플랫폼", "description": "GitHub는 Git으로 관리하는 코드를 인터넷에 올려두고 여러 사람이 함께 작업할 수 있는 서비스다. 코드 공유·오픈소스·CI/CD 배포·GitHub Pages까지 지원한다. Microsoft가 2018년에 인수했다.", "examples": ["동아리 발표자료 올리기 → github.com/kchmok-art/axis-slides", "오픈소스 프로젝트 — React, Python, Linux 모두 GitHub에서 관리", "GitHub Pages — 코드를 올리면 자동으로 웹사이트로 서빙", "Pull Request — 내가 고친 코드를 메인 코드에 합쳐달라는 요청"], "confusion": {"헷갈리는점": "GitHub = Git이라고 오해 / GitLab·Bitbucket과 동일하게 봄", "차이": "Git(도구) ≠ GitHub(서비스) / GitHub·GitLab·Bitbucket은 모두 Git 기반 플랫폼이지만 별개 서비스", "기억법": "Git = 엔진 / GitHub = 엔진을 얹은 자동차(서비스)"}, "related": ["Git", "워크트리", "GitHub Pages", "CI/CD"], "saved_date": "2026-10-09", "flow": ["① 로컬에서 git push", "② GitHub 원격 레포에 코드 업로드", "③ PR(Pull Request) 생성", "④ 코드 리뷰·승인", "⑤ main 브랜치에 merge"], "kakao_chat": "A: GitHub이 Git이랑 어떻게 달라?\nB: 그냥 같은 거 아니야?\nA: 완전 달라! Git = 버전 관리 도구(내 컴퓨터에 설치) / GitHub = Git 저장소 호스팅 서비스(온라인)\n   Git이 엔진이면 GitHub는 엔진을 얹은 자동차야\nB: GitHub 없이 Git만 써도 돼?\nA: 응! 혼자 할 때는 로컬에서 git만 써도 충분해\n   GitHub는 여러 명 협업, 코드 공개, PR 리뷰 같은 게 편해서 쓰는 거야\nB: GitLab이나 Bitbucket도 같은 거야?\nA: Git 기반 플랫폼이라는 점은 같은데, 별개 서비스야\n   GitHub = 개인 개발자·오픈소스 강세 / GitLab = 기업 내부 CI/CD 강세야"}, {"id": "term_069", "term": "워크트리 (Worktree)", "english": "Git Worktree", "category": "Dev", "one_line": "하나의 Git 저장소에서 여러 브랜치를 동시에 다른 폴더에서 작업하는 Git 기능", "description": "Git Worktree는 하나의 저장소(.git)를 공유하면서 여러 브랜치를 각각 다른 폴더에 체크아웃해 동시에 작업할 수 있는 기능이다. 브랜치를 왔다갔다 전환할 필요 없이 여러 작업을 병렬로 진행할 수 있다. 멀티 AI 에이전트가 각자 독립된 작업 공간에서 동시에 개발할 때 활용된다.", "examples": ["기능 A 개발 중에 긴급 버그 수정 필요 → 워크트리로 별도 폴더에서 동시 작업", "AI 에이전트 3개가 각자 다른 기능을 병렬 개발 → 워크트리로 충돌 없이 분리", "git worktree add ../feature-b feature-b → feature-b 브랜치를 별도 폴더에 체크아웃", "멀티 에이전트 코딩의 핵심 인프라 — 에이전트마다 독립 작업 공간 제공"], "confusion": {"헷갈리는점": "브랜치(Branch)와 워크트리(Worktree)를 같은 개념으로 혼동", "차이": "브랜치 = 코드의 분기점(논리적 개념) / 워크트리 = 브랜치를 물리적으로 다른 폴더에 펼쳐놓은 것", "기억법": "브랜치 = 나무의 가지 / 워크트리 = 가지마다 별도 작업 책상을 놓은 것"}, "related": ["Git", "GitHub", "브랜치", "멀티 에이전트"], "saved_date": "2026-10-09", "flow": ["① git worktree add ../branch-folder branch명", "② 새 폴더에 브랜치 체크아웃", "③ 두 폴더 동시 작업", "④ git worktree remove로 제거"], "kakao_chat": "A: 워크트리 명령어 써봤어? git worktree\nB: 그게 뭐야? 처음 봐\nA: Git 저장소 하나에서 여러 브랜치를 동시에 다른 폴더에 펼쳐두는 거야\n   AI 에이전트로 병렬 작업할 때 특히 유용해\nB: 브랜치 여러 개 만들면 되는 거 아니야?\nA: 브랜치는 논리적 분기점이고, 워크트리는 그걸 물리적 폴더로 분리하는 거야\n   브랜치 전환 없이 두 폴더 동시에 열어서 작업할 수 있어\nB: 어떻게 써?\nA: git worktree add ../other-branch branch명 하면\n   ../other-branch 폴더에 그 브랜치 체크아웃 돼\n   브랜치=나무의 가지, 워크트리=가지마다 별도 책상 놓은 것"}, {"id": "term_070", "term": "DevOps", "english": "Development + Operations", "category": "Infra", "one_line": "개발(Dev)과 운영(Ops)을 합쳐 빠르게 배포하고 안정적으로 운영하는 문화·방법론", "description": "DevOps는 Dev(개발)+Ops(운영)의 합성어지만, 단순한 합성어를 넘어 훨씬 광범위한 개념이다.\n\nDevOps는 다음 5가지를 모두 포괄하는 방법론이자 기술이다:\n1. 문화 — 개발팀과 운영팀이 협력하는 조직 문화\n2. 자동화 — 반복 작업을 자동화해 속도와 품질을 높임\n3. 셰어링 — 잘된 점과 잘못된 점을 팀 전체가 공유\n4. 축적 — 공유된 경험과 지식을 쌓아 자산으로 만듦\n5. 측정 — 문제와 성과를 데이터로 측정해 판단의 근거로 삼음\n\n즉, 어떤 문제나 요구사항이 발생했을 때 — 문제를 잘 분석하고, 측정하고, 자동화하고, 잘못된 점과 잘된 점을 셰어링해서 축적하고 발전시키는 것이 DevOps의 본질이다.", "examples": ["코드 push → 자동 테스트 → 자동 빌드 → 자동 배포 (CI/CD 파이프라인)", "Docker — '내 컴퓨터에서는 됐는데' 문제 해결 → 어디서나 동일한 환경", "Netflix — DevOps로 하루 수백 번 배포, 수억 명 사용자 서비스 안정 유지", "쿠팡 배송 추적 — 실시간 업데이트를 무중단으로 배포하는 것도 DevOps", "GitHub Actions — 코드 올리면 자동으로 테스트·배포 실행", "Kubernetes — 수백 개 서버 컨테이너를 자동으로 관리·확장"], "confusion": {"헷갈리는점": "DevOps를 직군(역할)으로만 이해하는 경우", "정확한의미": "DevOps는 직군이기도 하지만 본질은 개발+운영을 통합하는 문화·철학", "기억법": "Dev(개발) + Ops(Operations=운영) = 경계를 없애는 것"}, "related": ["서버", "CI/CD", "Docker", "관제"], "saved_date": "2026-10-09", "phases": {"Plan": "기능 계획·이슈 관리 (Jira, Notion)", "Code": "개발 (Git, GitHub)", "Build": "코드 → 실행 가능한 패키지로 변환", "Test": "자동화 테스트 (Jest, pytest)", "Release": "배포 준비·승인", "Deploy": "서버에 자동 배포 (CI/CD)", "Operate": "서버 운영·스케일링 (Kubernetes, Docker)", "Monitor": "실시간 관제·알림 (Grafana, Datadog)"}, "tools": {"CI/CD": "GitHub Actions, Jenkins, GitLab CI", "컨테이너": "Docker, Kubernetes", "클라우드": "AWS, GCP, Azure, Hostinger VPS", "관제": "Grafana, Prometheus, Datadog", "코드관리": "Git, GitHub, GitLab"}, "why_important": "AI 서비스는 모델 업데이트·데이터 변경이 잦아 DevOps 없이는 운영 불가. AI 에이전트 배포·관제도 DevOps의 영역", "flow": ["① Plan — 기능 기획·이슈 등록(Jira)", "② Code — 개발·PR(GitHub)", "③ Build — 빌드 자동화(Webpack)", "④ Test — 자동 테스트(Jest·pytest)", "⑤ Release — 릴리즈 준비", "⑥ Deploy — 자동 배포(Docker·K8s)", "⑦ Operate — 운영(nginx·서버)", "⑧ Monitor — 관제(Grafana·Datadog)"], "five_pillars": {"1_문화": "개발팀과 운영팀이 사일로(벽) 없이 협력하는 조직 문화. '내 일 네 일' 구분 없이 함께 책임짐", "2_자동화": "빌드·테스트·배포·모니터링 등 반복 작업을 자동화. CI/CD, Docker, GitHub Actions 등 활용", "3_셰어링": "잘된 것·잘못된 것·배운 것을 팀 전체와 공유. 회고(Retrospective), 문서화, 지식 공유", "4_축적": "셰어링된 경험이 조직의 자산으로 쌓임. 위키, 런북(Runbook), 지식베이스 형태로 저장", "5_측정": "감이 아닌 데이터로 판단. 배포 빈도, 장애 복구 시간, 오류율 등을 수치로 측정"}, "last_updated": "2026-10-13", "kakao_chat": "A: DevOps가 개발팀이야 운영팀이야?\nB: Dev랑 Ops 합쳤으니 둘 다?\nA: 직군이기도 하지만 본질은 개발+운영을 통합하는 문화·철학이야\n   개발자와 운영자 사이 벽을 허물고 협업하는 방식이지\nB: 왜 분리되어 있었어?\nA: 개발자는 빠르게 새 기능 만들고 싶고, 운영자는 안정성 원하잖아\n   이 충돌을 해결하려고 DevOps가 나온 거야 — 자동화로 빠르게 + 안정적으로\nB: CI/CD가 DevOps 도구야?\nA: 맞아! Plan→Code→Build→Test→Release→Deploy→Operate→Monitor 8단계 사이클이야\n   자동화로 이 사이클을 빠르게 돌리는 게 DevOps 목표야"}, {"id": "term_071", "term": "관제 (Monitoring & Control)", "english": "Monitoring & Control", "category": "Infra", "one_line": "시스템·서버·네트워크 상태를 실시간으로 감시하고 이상 발생 시 대응하는 활동", "description": "관제는 서버·네트워크·애플리케이션이 정상 작동하는지 24시간 모니터링하고, 장애·이상 징후 발생 시 알림을 받아 대응하는 활동이다. CPU·메모리·트래픽·에러율 등을 지표로 추적한다. AI 에이전트의 Observability(관측 가능성)와 동일한 개념이다.", "examples": ["서버 CPU 90% 초과 → 알림 발송 → 담당자 조치", "VPS 서버가 다운됐을 때 자동 감지 → 재시작", "라이프루프의 Observability = 관제와 동일 — AI가 잘 돌고 있는지 감시", "Grafana·Prometheus·Datadog — 대표적인 관제 도구"], "confusion": {"헷갈리는점": "관제(Monitoring)와 로깅(Logging)을 혼동", "차이": "로깅 = 일어난 일을 기록 / 관제 = 실시간으로 감시하고 이상 시 대응", "기억법": "CCTV(관제) vs 블랙박스(로깅) — CCTV는 실시간 감시, 블랙박스는 사후 기록"}, "related": ["DevOps", "서버", "루프 엔지니어링", "Observability"], "saved_date": "2026-10-09", "flow": ["① 서버·서비스 지표 수집", "② 실시간 대시보드 시각화", "③ 임계값 초과 → 알림", "④ 담당자 확인·분석", "⑤ 조치 후 정상화"], "kakao_chat": "A: 관제랑 모니터링이 같은 말 아니야?\nB: 나도 그렇게 생각했는데?\nA: 달라! 모니터링은 보기만 하는 거고\n   관제는 보기 + 판단 + 대응까지 포함하는 운영 체계야\nB: 구체적으로?\nA: CCTV로 비유하면\n   CCTV만 설치된 건 모니터링\n   보안 요원이 CCTV 보다가 이상하면 출동하는 게 관제야\nB: 아 로깅이랑도 다른 거야?\nA: 로깅 = 블랙박스 (사후 기록)\n   관제 = CCTV (실시간 감시+대응)\n   실시간으로 서비스 상태 보다가 임계값 넘으면 알림 받고 조치하는 게 관제야"}, {"id": "term_072", "term": "네트워크 (Network)", "english": "Network", "category": "Infra", "one_line": "컴퓨터·서버·기기들이 데이터를 주고받을 수 있도록 연결된 통신 체계", "description": "네트워크는 둘 이상의 기기가 데이터를 주고받을 수 있도록 연결된 구조다. 인터넷은 전 세계 네트워크가 연결된 거대한 네트워크다. 데이터는 패킷(packet) 단위로 쪼개져 전송되고 목적지에서 재조립된다.", "examples": ["집 WiFi = 로컬 네트워크 (LAN)", "인터넷 = 전 세계 네트워크의 네트워크 (WAN)", "VPS 서버가 인터넷에 연결되는 것 = 네트워크 설정", "핑(Ping)으로 네트워크 상태 확인 / 방화벽으로 네트워크 접근 제어"], "confusion": {"헷갈리는점": "네트워크=인터넷으로 오해", "차이": "인터넷은 네트워크의 일종 — 네트워크가 더 큰 개념 (LAN·WAN·인터넷 모두 네트워크)", "기억법": "네트워크 = 도로망 전체 / 인터넷 = 그 중 고속도로"}, "related": ["서버", "ISP", "IX", "프로토콜", "핑"], "saved_date": "2026-10-09", "flow": ["① 출발지 기기에서 데이터 패킷 생성", "② 라우터가 최적 경로 결정", "③ 여러 라우터를 거쳐 전달(홉)", "④ 목적지 기기에 패킷 도착", "⑤ 패킷 조립 → 데이터 복원"], "kakao_chat": "A: 네트워크가 인터넷이랑 같은 말이야?\nB: 응 그거 아니야?\nA: 인터넷은 네트워크의 일종이야. 네트워크가 더 큰 개념이야\n   LAN(사무실 내부), WAN(도시 간 연결), 인터넷 다 네트워크야\nB: 아 인터넷 말고 다른 네트워크도 있구나\nA: 맞아! 회사 내부 망(인트라넷)도 네트워크고\n   두 컴퓨터 케이블로 연결해도 네트워크야\nB: 그럼 네트워크 없이는 인터넷 불가능하네\nA: 맞아. 네트워크 = 도로망 전체 / 인터넷 = 그 중 고속도로야\n   데이터 패킷이 라우터를 거쳐 목적지까지 가는 게 네트워크 통신이야"}, {"id": "term_073", "term": "프로토콜 (Protocol)", "english": "Protocol", "category": "Infra", "one_line": "컴퓨터끼리 데이터를 주고받을 때 지켜야 하는 규칙과 약속", "description": "프로토콜은 서로 다른 기기·시스템이 데이터를 주고받을 때 '이 형식으로 보내고, 이 순서로 확인하자'고 약속한 규칙이다. 사람으로 치면 언어와 예절이다. 대표적으로 HTTP(웹), TCP/IP(인터넷 기본), HTTPS(보안 웹), FTP(파일 전송) 등이 있다.", "examples": ["HTTP — 브라우저와 서버가 웹 페이지를 주고받는 규칙", "HTTPS — HTTP + 암호화(TLS) = 보안 통신", "TCP/IP — 인터넷의 기본 전송 규칙 (패킷 분할·재조립·순서 보장)", "API 호출도 프로토콜 위에서 동작 — REST API = HTTP 프로토콜 기반"], "confusion": {"헷갈리는점": "HTTP와 HTTPS를 단순히 자물쇠 유무로만 이해", "차이": "HTTP = 평문 전송(누구나 볼 수 있음) / HTTPS = TLS 암호화 전송(중간에서 못 읽음)", "기억법": "프로토콜 = 외교 의전 규칙 — 나라(기기)마다 다르면 소통 불가, 공통 규칙 필요"}, "related": ["네트워크", "API", "암호화", "서버"], "saved_date": "2026-10-09", "flow": ["① 송신측이 프로토콜 규칙대로 데이터 포장", "② 네트워크로 전송", "③ 수신측이 같은 프로토콜로 해석", "④ 데이터 복원"], "kakao_chat": "A: 프로토콜이 뭔지 알아? HTTP가 프로토콜이잖아\nB: HTTP가 뭔가 규칙이라는 건 알아\nA: 프로토콜 = 컴퓨터끼리 통신하는 공통 규칙이야\n   외교 의전처럼, 서로 다른 기기가 소통하려면 같은 규칙을 따라야 해\nB: HTTP, HTTPS, FTP 다 프로토콜이야?\nA: 맞아! 각각 용도가 달라\n   HTTP = 웹 문서 전송 / HTTPS = HTTP + TLS 암호화 / FTP = 파일 전송\nB: HTTPS랑 HTTP 차이가 자물쇠 하나 아니야?\nA: 그 차이가 엄청 커! HTTP는 평문 전송이라 중간에서 볼 수 있어\n   HTTPS는 TLS로 암호화되어서 중간에서 못 읽어\n   프로토콜 = 언어 규약 — 같은 언어 써야 대화 가능한 것처럼"}, {"id": "term_074", "term": "DevOps 사이클 (8단계)", "english": "DevOps Lifecycle", "category": "Infra", "one_line": "Plan→Code→Build→Test→Release→Deploy→Operate→Monitor가 무한 반복되는 DevOps의 핵심 흐름", "description": "DevOps는 8단계가 끊임없이 반복되는 무한루프 구조다. 한 사이클이 끝나면 다시 계획(Plan)으로 돌아가 개선을 반복한다. 각 단계가 자동화될수록 배포 속도와 안정성이 높아진다.", "structure": {"1단계 Plan": "기능 계획·이슈 관리", "2단계 Code": "개발·코드 작성", "3단계 Build": "코드 → 실행 가능한 패키지 변환", "4단계 Test": "자동화 테스트", "5단계 Release": "배포 준비·승인", "6단계 Deploy": "서버에 자동 배포", "7단계 Operate": "서버 운영·스케일링", "8단계 Monitor": "실시간 관제·알림"}, "examples": ["코드 수정 → 자동 테스트 → 자동 빌드 → 자동 배포 → 모니터링 → 다시 개선", "Netflix는 이 사이클을 하루 수백 번 반복"], "related": ["DevOps", "CI/CD", "Docker", "Kubernetes", "관제"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps 사이클이 8단계라던데 다 기억해?\nB: Plan이랑 Code는 알겠는데 나머지는 모르겠어\nA: Plan→Code→Build→Test→Release→Deploy→Operate→Monitor야\n   왼쪽이 개발 파트, 오른쪽이 운영 파트야\nB: 순서가 중요해?\nA: 중요해! 계획 세우고 → 코드 짜고 → 빌드하고 → 테스트하고\n   → 릴리즈 준비 → 서버 배포 → 운영 → 모니터링 → 다시 계획\n   이게 무한 반복이야\nB: CI/CD가 이 중에 어디야?\nA: Build~Test~Deploy 구간을 자동화한 게 CI/CD야\n   이 사이클이 빠르게 돌수록 서비스가 빠르게 발전해"}, {"id": "term_075", "term": "Plan (계획 단계)", "english": "Plan", "category": "Infra", "one_line": "DevOps 1단계 — 기능 요구사항·이슈·우선순위를 정의하고 계획하는 단계", "description": "Plan은 무엇을 만들고 고칠지 결정하는 단계다. 사용자 요구사항 수집, 버그 이슈 등록, 스프린트 계획 등이 포함된다. Jira, Notion, GitHub Issues가 대표 도구다.", "examples": ["동아리 홈페이지 기능 목록 작성 → Plan 단계", "GitHub Issues에 '로그인 버그 수정' 등록", "Notion으로 이번 주 개발할 기능 우선순위 정리"], "related": ["DevOps 사이클", "Jira", "GitHub"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps에서 Plan 단계가 뭐야?\nB: 그냥 기획이잖아?\nA: 기능 계획하고 이슈 등록하는 단계야\n   Jira나 GitHub Issues에 할 일 티켓 만드는 거지\nB: 왜 이걸 DevOps 단계에 포함해?\nA: 계획 없이 개발하면 나중에 방향이 엉켜\n   Plan 단계에서 우선순위, 담당자, 마감일 정해야 이후 단계가 원활해\nB: 아 개발 시작 전 설계도 같은 거네\nA: 맞아! 어떤 기능을 왜 만드는지, 어떻게 구현할지 정하는 게 Plan\n   좋은 Plan이 좋은 코드의 시작이야"}, {"id": "term_076", "term": "Code (코드 단계)", "english": "Code", "category": "Infra", "one_line": "DevOps 2단계 — 실제 기능을 코드로 작성하고 Git으로 버전 관리하는 단계", "description": "Code는 개발자가 실제로 코드를 작성하는 단계다. Git으로 변경 이력을 관리하고 GitHub에 올린다. 브랜치 전략(feature/main/release)을 사용해 여러 기능을 병렬 개발한다.", "examples": ["로그인 기능 코드 작성 → git commit → git push", "워크트리로 기능A·기능B 동시에 개발", "VS Code, Cursor, Claude Code — 코드 작성 도구"], "related": ["DevOps 사이클", "Git", "GitHub", "워크트리"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps에서 Code 단계는 그냥 코딩이야?\nB: 당연한 거 아니야?\nA: 맞긴 한데, DevOps 관점에서는 코딩 + Git 관리가 핵심이야\n   브랜치 전략(main/develop/feature)으로 팀 협업하고, PR로 코드 리뷰하는 거야\nB: 혼자 할 때도 이렇게 해야 해?\nA: 혼자라도 버전 관리는 해야 해! 나중에 뭔가 잘못됐을 때 되돌릴 수 있으니까\n   git commit은 작게 자주 해야 해 — 나중에 문제 생기면 찾기 쉬워\nB: 아 코드 자체보다 협업 방식이 포인트구나\nA: 맞아. 코드 단계 = 개발 + Git 협업 관리"}, {"id": "term_077", "term": "Build (빌드 단계)", "english": "Build", "category": "Infra", "one_line": "DevOps 3단계 — 소스코드를 실행 가능한 패키지·이미지로 변환하는 단계", "description": "Build는 사람이 읽는 소스코드를 컴퓨터가 실행할 수 있는 형태로 변환하는 과정이다. 웹은 번들링(Webpack, Vite), 서버는 컴파일·Docker 이미지 생성이 대표적이다. CI/CD가 코드 push 시 자동으로 빌드를 실행한다.", "examples": ["React 코드 → npm run build → 브라우저가 읽을 수 있는 HTML/JS/CSS 파일 생성", "Node.js 앱 → Docker 이미지 빌드 → 어디서나 동일하게 실행 가능", "빌드 실패 = 코드에 문법 오류·의존성 문제 있음"], "related": ["DevOps 사이클", "Docker", "CI/CD", "Webpack"], "saved_date": "2026-10-09", "kakao_chat": "A: 빌드(Build)가 뭐야? 컴파일하는 거?\nB: 소스코드를 실행 파일로 만드는 거?\nA: 맞아! 소스코드를 실행 가능한 패키지로 변환하는 단계야\n   Java면 컴파일, JavaScript면 번들링, Docker면 이미지 생성이 빌드야\nB: 왜 따로 빌드를 해야 해?\nA: 개발 환경이랑 실제 서버 환경이 달라서\n   빌드를 거쳐야 어떤 환경에서도 실행 가능한 형태가 돼\nB: CI/CD에서 빌드가 자동화되는 거야?\nA: 맞아! git push 하면 자동으로 빌드 돌아가게 설정해\n   빌드 실패하면 배포 안 되도록 막는 거야"}, {"id": "term_078", "term": "Test (테스트 단계)", "english": "Test", "category": "Infra", "one_line": "DevOps 4단계 — 코드가 의도한 대로 작동하는지 자동으로 검증하는 단계", "description": "Test는 코드 변경이 기존 기능을 망가뜨리지 않는지, 새 기능이 올바로 작동하는지 자동으로 확인하는 단계다. 단위 테스트(함수 하나), 통합 테스트(여러 기능 조합), E2E 테스트(실제 사용자 흐름)로 나뉜다. CI/CD가 자동으로 테스트를 실행하고 실패하면 배포를 막는다.", "examples": ["로그인 함수 수정 → 자동으로 로그인 테스트 100개 실행 → 통과해야 다음 단계", "Jest(JavaScript), pytest(Python) — 대표 테스트 도구", "테스트 없이 배포 = 폭탄 제거 확인 없이 해제하는 것"], "related": ["DevOps 사이클", "CI/CD", "Jest", "pytest"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps에서 Test 단계가 왜 중요해?\nB: 코드 짜면서 테스트 하는 거 아니야?\nA: 수동 테스트만 하면 매번 사람이 확인해야 해. 자동화가 핵심이야\n   git push 하면 자동으로 테스트 실행해서 실패하면 배포 막는 구조\nB: 어떤 테스트들이 있어?\nA: 단위 테스트(함수 하나씩), 통합 테스트(여러 모듈 연동), E2E 테스트(실제 사용자 시나리오)\n   보통 다 자동화해서 파이프라인에 넣어\nB: 아 테스트 자동화가 CI/CD의 핵심이구나\nA: 맞아! 테스트 없이 배포하면 운영 중에 버그 터져\n   배포 전 자동 테스트가 안전망이야"}, {"id": "term_079", "term": "Release (릴리즈 단계)", "english": "Release", "category": "Infra", "one_line": "DevOps 5단계 — 테스트 통과한 코드를 실제 배포 가능한 상태로 준비·승인하는 단계", "description": "Release는 테스트를 통과한 코드를 실제 서버에 올릴 준비를 마치는 단계다. 버전 번호 부여(v1.2.3), 변경 이력(Changelog) 작성, 배포 승인이 포함된다. 자동 릴리즈와 수동 승인을 조합해 안전성을 높인다.", "examples": ["v1.0.0 → v1.1.0 버전 태그 부여 → GitHub Release 생성", "핫픽스(긴급 버그 수정) = 승인 없이 즉시 릴리즈", "대형 서비스는 PM·QA 승인 후 릴리즈 → 안전성 강화"], "related": ["DevOps 사이클", "CI/CD", "GitHub", "Deploy"], "saved_date": "2026-10-09", "kakao_chat": "A: Release랑 Deploy가 다른 거야?\nB: 둘 다 내보내는 거 아니야?\nA: 달라! Release는 배포 준비 완료 상태 — 버전 태그 붙이고 배포 승인받는 단계\n   Deploy는 실제로 서버에 올리는 행위야\nB: 순서가 Release 먼저야?\nA: 맞아! Release(준비·승인) → Deploy(실행) 순서야\n   v1.2.3 이런 버전 번호 붙이는 게 Release\n   그 버전을 서버에 올리는 게 Deploy\nB: 그럼 핫픽스는 Release 없이 Deploy 해?\nA: 긴급 상황엔 빠르게 하기도 해. 근데 원칙적으로는 Review→Release→Deploy 순서야"}, {"id": "term_080", "term": "Deploy (배포 단계)", "english": "Deploy", "category": "Infra", "one_line": "DevOps 6단계 — 준비된 코드·이미지를 실제 서버에 올려 사용자가 접근할 수 있게 하는 단계", "description": "Deploy는 빌드·테스트·릴리즈를 마친 코드를 실제 운영 서버에 반영하는 단계다. CI/CD가 자동으로 처리하며, Blue-Green·Canary 배포 전략으로 무중단 배포가 가능하다.", "examples": ["GitHub Actions가 main 브랜치 push 감지 → 자동으로 VPS 서버에 배포", "Blue-Green 배포 — 구 버전(Blue)·신 버전(Green) 동시 운영 후 트래픽 전환", "Canary 배포 — 전체 사용자의 5%에게만 먼저 새 버전 배포해 안전성 확인", "동아리 홈페이지 GitHub Pages 배포 = Deploy 단계"], "related": ["DevOps 사이클", "CI/CD", "Docker", "Kubernetes", "Release"], "saved_date": "2026-10-09", "kakao_chat": "A: Deploy(배포)가 그냥 서버에 올리는 거야?\nB: 파일 복사하면 되는 거 아니야?\nA: 단순히 파일 복사가 아니야. 기존 서비스 중단 없이 새 버전으로 교체하는 게 핵심이야\nB: 무중단 배포가 어떻게 가능해?\nA: 블루-그린 배포: 새 버전 서버(그린)를 완전히 세팅 후 트래픽 전환\n   롤링 배포: 서버를 순차적으로 교체해 일부는 항상 살아있게\nB: 배포 실패하면 어떡해?\nA: 롤백(Rollback)! 이전 버전으로 되돌리는 거야\n   그래서 버전 관리가 중요해 — 배포 실패해도 바로 롤백 가능하게\n   Deploy = 새 코드를 사용자에게 전달하는 마지막 단계야"}, {"id": "term_081", "term": "Operate (운영 단계)", "english": "Operate", "category": "Infra", "one_line": "DevOps 7단계 — 배포된 서비스를 안정적으로 운영하고 스케일링하는 단계", "description": "Operate는 실제 서비스가 사용자에게 제공되는 동안 서버를 관리하는 단계다. 트래픽 급증 시 서버 자동 확장(Auto Scaling), 장애 발생 시 자동 복구, 컨테이너 관리 등이 포함된다. Kubernetes가 대표 운영 도구다.", "examples": ["수능 당일 교육부 사이트 폭주 → Auto Scaling으로 서버 자동 증설", "Kubernetes — 수백 개 컨테이너를 자동으로 배치·재시작·확장", "서버 한 대 죽으면 자동으로 다른 서버에서 재시작", "VPS 서버 운영 = Operate 단계의 기초"], "related": ["DevOps 사이클", "Kubernetes", "Docker", "Monitor"], "saved_date": "2026-10-09", "kakao_chat": "A: DevOps 사이클에서 Operate(운영) 단계가 뭐야?\nB: 그냥 서비스 유지하는 거 아니야?\nA: 서버 실제로 돌아가게 유지하는 단계야\n   nginx, Kubernetes 같은 걸로 서버 실행 환경 관리하고, Auto Scaling 같은 것도 여기서 해\nB: 배포 이후 단계네?\nA: 맞아. 배포 → 운영 → 모니터링 순서야\n   트래픽 급증하면 서버 자동으로 늘리고, 다운되면 자동 재시작하는 것도 운영이야\nB: 아 24시간 켜놓는 게 Operate 단계구나\nA: 맞아! 운영 자동화가 핵심이야\n   사람이 밤새 지켜볼 수 없으니 Kubernetes 같은 도구로 자동화해"}, {"id": "term_082", "term": "Monitor (모니터링 단계)", "english": "Monitor", "category": "Infra", "one_line": "DevOps 8단계 — 서비스 상태·성능·에러를 실시간으로 추적하고 이상 시 알림을 받는 단계", "description": "Monitor는 서비스가 잘 돌고 있는지 CPU·메모리·에러율·응답시간 등을 실시간으로 측정하고 시각화하는 단계다. 이상 징후 발생 시 알림을 보내 빠른 대응을 가능하게 한다. 여기서 수집된 데이터가 다시 Plan 단계로 피드백된다.", "examples": ["CPU 90% 초과 → Slack 알림 → 담당자 즉시 대응", "Grafana 대시보드 — 서버 상태를 그래프로 실시간 시각화", "Datadog — 에러 발생 위치·빈도·패턴 자동 분석", "라이프루프의 Observability = Monitor와 동일 개념"], "related": ["DevOps 사이클", "관제", "Grafana", "Operate"], "saved_date": "2026-10-09", "kakao_chat": "A: Monitor 단계가 관제랑 같은 거야?\nB: 그냥 서버 상태 보는 거 아니야?\nA: 맞아, DevOps 사이클에서 마지막 단계야\n   Grafana, Datadog 같은 도구로 CPU·메모리·에러율·응답시간 실시간 확인해\nB: 이걸 왜 DevOps 사이클에 포함해?\nA: Monitor에서 발견한 문제가 다시 Plan 단계로 연결돼서\n   끝없이 순환하는 게 DevOps 사이클의 핵심이야\nB: 아 모니터링이 다음 개선의 시작이구나\nA: 맞아! Monitor → 문제 발견 → Plan으로 돌아가 개선\n   Grafana로 대시보드 만들고, 임계값 넘으면 Slack 알림 오도록 설정해"}, {"id": "term_083", "term": "CI/CD", "english": "Continuous Integration / Continuous Deployment", "category": "Infra", "one_line": "코드 변경 시 자동으로 테스트·빌드·배포까지 실행하는 자동화 파이프라인", "description": "CI(지속적 통합)는 코드를 올릴 때마다 자동으로 테스트·빌드를 실행하는 것이고, CD(지속적 배포)는 테스트 통과 시 자동으로 서버에 배포하는 것이다. 사람이 수동으로 배포하던 작업을 자동화해 실수를 줄이고 배포 속도를 높인다.", "examples": ["git push → GitHub Actions 자동 실행 → 테스트 → 빌드 → 서버 배포", "테스트 실패 시 배포 자동 차단 → 버그 있는 코드가 서버에 올라가지 않음", "GitHub Actions, Jenkins, GitLab CI — 대표 CI/CD 도구", "동아리 홈페이지: 코드 수정 → 자동 배포로 즉시 반영"], "related": ["DevOps 사이클", "GitHub", "Docker", "Build", "Deploy"], "saved_date": "2026-10-09", "flow": ["① 개발자 git push", "② CI: 자동 테스트 실행", "③ CI: 자동 빌드", "④ 테스트 실패 시 → 알림·배포 중단", "⑤ CD: 자동 서버 배포", "⑥ 배포 완료 알림"], "confusion": {"헷갈리는점": "CI와 CD를 하나로 묶어 구분 못 함", "차이": "CI(Continuous Integration) = 코드 통합·테스트 자동화 / CD(Continuous Deployment) = 배포 자동화", "기억법": "CI = 품질 검사 자동화 / CD = 배송 자동화"}, "kakao_chat": "A: CI/CD가 뭔지 알아?\nB: 자동 배포 같은 거?\nA: 맞아! CI = Continuous Integration, CD = Continuous Deployment\n   CI는 코드 통합·테스트 자동화, CD는 배포 자동화야\nB: CI랑 CD 구분이 헷갈려\nA: CI = 품질 검사 자동화 / CD = 배송 자동화로 기억해\n   git push → 자동 테스트 → 자동 빌드 → 자동 배포 이 흐름이야\nB: 도구가 뭐야?\nA: GitHub Actions, Jenkins, GitLab CI 같은 거야\n   .github/workflows/ 폴더에 YAML 파일 설정하면 git push 할 때마다 자동 실행돼"}, {"id": "term_084", "term": "Docker", "english": "Docker", "category": "Infra", "one_line": "애플리케이션을 환경에 상관없이 동일하게 실행할 수 있도록 컨테이너로 패키징하는 도구", "description": "Docker는 '내 컴퓨터에서는 됐는데 서버에서 안 된다' 문제를 해결한다. 앱 실행에 필요한 코드·라이브러리·설정을 하나의 컨테이너 이미지로 묶어두면, 어떤 서버에서 실행해도 동일한 환경이 보장된다.", "examples": ["개발 PC·테스트 서버·운영 서버 → 동일한 Docker 이미지 실행 → 환경 차이 없음", "Hermes(VPS)도 Docker 컨테이너로 실행 중", "docker run nginx → nginx 서버를 단 한 줄로 실행", "컨테이너 = 배 위의 화물 컨테이너 — 규격화되어 어떤 배(서버)에도 실을 수 있음"], "related": ["DevOps", "Kubernetes", "CI/CD", "서버"], "saved_date": "2026-10-09", "flow": ["① Dockerfile 작성(실행 환경 정의)", "② docker build → 이미지 생성", "③ docker push → 레지스트리 업로드", "④ 서버에서 docker pull → 이미지 다운", "⑤ docker run → 컨테이너 실행"], "confusion": {"헷갈리는점": "Docker 컨테이너와 가상머신(VM) 혼동", "차이": "VM = OS 전체 가상화(무거움) / Docker = OS 커널 공유, 앱만 격리(가벼움)", "기억법": "VM = 집 전체 복사 / Docker = 방 하나만 격리"}, "kakao_chat": "A: Docker가 뭔지 알아?\nB: 컨테이너 만드는 거?\nA: 맞아! 앱 실행에 필요한 환경(코드+런타임+설정)을 컨테이너로 패키징하는 거야\n   어떤 서버에서 실행해도 동일하게 동작해\nB: 가상머신이랑 다른 거야?\nA: VM은 OS 전체 가상화라서 무거워. Docker는 OS 커널 공유하고 앱만 격리해서 가벼워\n   VM = 집 전체 복사 / Docker = 방 하나만 격리\nB: 그럼 Dockerfile이 뭐야?\nA: 컨테이너 환경 설정서야. '이 버전 Python에, 이 라이브러리 설치하고, 이 포트 열어' 같이\n   Dockerfile 작성 → docker build → docker run 하면 어디서든 같은 환경 실행돼"}, {"id": "term_085", "term": "Kubernetes (쿠버네티스)", "english": "Kubernetes", "category": "Infra", "one_line": "수많은 Docker 컨테이너를 자동으로 배포·확장·관리하는 컨테이너 오케스트레이션 도구", "description": "Kubernetes(K8s)는 Docker 컨테이너가 수백~수천 개로 늘어날 때 이를 자동으로 관리하는 도구다. 컨테이너 죽으면 자동 재시작, 트래픽 많으면 자동 증설, 업데이트 시 무중단 배포를 처리한다.", "examples": ["컨테이너 1개 죽으면 → K8s가 자동으로 새 컨테이너 실행", "트래픽 10배 급증 → Auto Scaling으로 컨테이너 자동 10배 증설", "Google·Netflix·카카오 — 모두 Kubernetes로 서비스 운영", "Docker = 컨테이너 하나 / Kubernetes = 컨테이너 함대 관리"], "related": ["Docker", "DevOps", "Operate", "CI/CD"], "saved_date": "2026-10-09", "flow": ["① 컨테이너 이미지 준비", "② K8s에 배포 설정(YAML) 제출", "③ K8s가 최적 서버에 컨테이너 배치", "④ 컨테이너 죽으면 자동 재시작", "⑤ 트래픽 증가 시 Auto Scaling"], "confusion": {"헷갈리는점": "Kubernetes를 Docker와 같은 것으로 혼동", "차이": "Docker = 컨테이너 하나 실행 / Kubernetes = 수백 개 컨테이너 자동 관리·조율", "기억법": "Docker = 화물 컨테이너 / Kubernetes = 컨테이너 항구 자동화 시스템"}, "kakao_chat": "A: Kubernetes가 Docker랑 같은 거야?\nB: 컨테이너 관련된 거잖아?\nA: 달라! Docker는 컨테이너 하나 실행하는 거고\n   Kubernetes는 컨테이너 수백 개를 자동으로 관리·조율하는 거야\nB: 왜 Kubernetes가 필요해?\nA: 컨테이너가 죽으면 자동 재시작, 트래픽 많으면 자동으로 컨테이너 늘리기\n   여러 서버에 컨테이너 분산 배치 — 이런 걸 사람이 다 하면 못 따라가\nB: 아 컨테이너 항구 자동화 시스템이네\nA: 맞아! Docker = 화물 컨테이너 / Kubernetes = 항구 자동화 시스템\n   줄여서 K8s라고도 해"}, {"id": "term_086", "term": "Grafana", "english": "Grafana", "category": "Infra", "one_line": "서버·앱·DB의 지표를 실시간 그래프·대시보드로 시각화하는 모니터링 도구", "description": "Grafana는 Prometheus 등에서 수집한 지표(CPU·메모리·에러율·응답시간)를 보기 좋은 대시보드로 만들어주는 오픈소스 도구다. 실시간으로 서비스 상태를 한눈에 파악할 수 있다.", "examples": ["CPU·메모리·네트워크 사용률을 실시간 그래프로 시각화", "에러율 급증 → 대시보드에서 즉시 확인 → 알림 발송", "Prometheus(데이터 수집) + Grafana(시각화) 조합으로 주로 사용", "DevOps Monitor 단계의 핵심 도구"], "related": ["Monitor", "관제", "DevOps 사이클", "Prometheus"], "saved_date": "2026-10-09", "flow": ["① Prometheus 등이 서버 지표 수집", "② Grafana가 데이터소스 연결", "③ 대시보드 패널 설정(그래프·게이지 등)", "④ 실시간 지표 시각화", "⑤ 임계값 초과 시 알림 발송"], "confusion": {"헷갈리는점": "Grafana를 데이터 수집 도구로 오해", "차이": "Prometheus = 데이터 수집 / Grafana = 수집된 데이터 시각화. 둘은 별개 도구", "기억법": "Prometheus = 온도계(측정) / Grafana = 온도 그래프 화면(시각화)"}, "kakao_chat": "A: Grafana 써봤어?\nB: 그게 뭐야?\nA: 서버·앱 지표를 예쁜 그래프로 시각화하는 도구야\n   CPU, 메모리, 에러율 같은 걸 실
